偏快转为过热，防止 价格由结构上涨演变为明显通货膨胀作为宏观调控的首要任务，所以该题很好地体现了政治理 论课试题的特点。为了保持物价总水平的稳定，国家实施宏观调控可以采取的货币政策手段（也称为货币政策的三大法宝）有：调整法定存款准备金率、调整再贴现率和公开市场业务。 在经济衰退时期，实行扩张性货币政策，即降低法定存款准备金率，降低再贴现率，在公开市 场上买进政府债券，从而增加货币供应量；在经济高涨或过热时期，实行紧缩性货币政策，即提高法定存款准备率，提高再贴现率，在公开市场上出售政府债券，从而减少货币供应量。通 过实施这些货币政策手段，从而影响和调整存贷款基准利率，因此，正确答案是ABD。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-24":{"ex":"本题考查《马克思主义政治经济学原理》第5章生产要素按贡献参与分配的原 则。这一知识点的内容，是政治经济学的常考点。所谓按生产要素分配，是指社会根据各种生产要素在商品和劳务生产的服务过程中的投入比例和贡献大小给予的报酬，是生产要素所有权 在经济上的实现。党的十六大报告明确指出：确立劳动、资本、技术和管理等生产要素按贡献 参与分配的原则，完善按劳分配为主体、多种分配方式并存的分配制度。这是社会主义的基本 原则和市场经济的基本要求在分配制度上的体现。因此，正确答案是BC。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-25":{"ex":"本题考《毛泽东思想概论》中第1章关于毛泽东思想的科学含义问题，在中国共 产党的历史上对毛泽东思想有两次概括：第一次是1945年中共七大的决议和刘少奇作的《关于修改党的章程》的报告，第二次是1987年十一届六中全会通过的《关于建国以来党的若干历史 问题的决议》。两者既有一脉相承的继承关系，又有在新时期根据新情况做出的新认识，新判断。至于A、C是干扰项。A项是1945年中共六届七中全会通过的决议，总结了党自1921年产 生以来领导中国革命的经验，尤其是1931年党的六届四中全会以来的路线是非，肯定了毛泽东同志是马克思列宁主义的普遍真理和中国革命的具体实践相结合的代表，为中共七大奠定了思 想基础和组织基础。1956年召开的中共八大，邓小平在八大所作的《关于修改党的章程的报 告》中，未提“毛泽东思想”这个概念，故AC应排除。本题历史性较强，考生需了解有关历史背景知识。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-26":{"ex":"本题考《毛泽东思想概论》第2章新民主主义革命动力内容中的富农问题。富农 问题是一个专业性较强的问题，涉及对富农的认识及政策。毛泽东在《中国革命与中国共产 党》一文中分析说：“富农……，被称为农村的资产阶级，中国的富农大多有一部分土地出 租，又放高利贷，对于雇农的剥削也很残酷，带有半封建性。但富农一般都自己参加劳动，在 这点上它又是农民的一部分。”因此，不能把富农看成与地主没有分别的阶级，对富农应该采 取使它中立或保护富农经济的政策。故选ABD。至于C项指的是地主阶级，与富农有区别，故不选。本题提示考生，要关注毛泽东一些重要著作的有关内容，而这些内容在一般考研辅导教 材（包括示范教材中）大多未完全涵括，有一定难度。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-27":{"ex":"本题考《毛泽东思想概论》第6章有关独立自主的和平外交政策内容。从新中国成立到50年代中期，我国确立并开始长期奉行独立自主的和平外交方针，实行“另起炉灶”、“打扫干净屋子再请客”、“一边倒”三项对外政策，巩固了国家独立，为社会主义建设争取 到一个较为有利的周边和国际环境。至于反对霸权主义问题是在20世纪50年代后期才提出的。 故选ACD，B项排除。本题的历史性较强，考生需把握有关历史背景知识。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-28":{"ex":"本题考查《邓小平理论和“三个代表”重要思想概论》第6章科学发展观和社会 主义建设的发展战略中坚持科学发展观的内容，出自党的十七大报告。选项A、B、C、D都符合要求。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-29":{"ex":"本题属于《邓小平理论和“三个代表”重要思想概论》的综合性试题,出自党的 十七大报告,属于新观点试题,考查记忆。报告指出:“我们党坚持马克思主义的思想路线，不断探索和回答什么是社会主义、怎样建设社会主义，建设什么样的党、怎样建设党，实现什么样 的发展、怎样发展的重大理论和实际问题。”因此，正确选项是A、C、D。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-3":{"ex":"（1）本题考查《马克思主义哲学原理》第4章认识的本质和过程（认识论） 中关于实践是检验真理的唯一标准观点的理解和应用。（2）本题通过一个成功企业家“做到”比“知道”更重要的观点来表明，实践高于理论认识的原因在于实践具有直接现实性的特点和优点。（3）马克思在《哥达纲领批判》中指出：“一步实际运动比一打纲领更重 要。”列宁进一步指出：“实践高于（理论的）认识因为它不但有普遍性的品格，并且还有直 接现实性的品格。”因此，只有选项D是符合试题要求的正确观点。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-30":{"ex":"（1）本题考查《邓小平理论和“三个代表”重要思想概论》第8章中国特色社会 主义政治中关于我国人民代表大会制度是我国的根本政治制度的理由的理解与记忆。（2）人 民代表大会制度是我国的政体，体现了我国的人民民主专政的国体（国家性质），从根本上保 证人民当家作主的权力，全国人民代表大会是最高的国家权力机关，它和常务委员会行使国家 立法权，决定其他各种制度的制定，故A、B、C是正确选项。人民代表大会制度是代表广大人民行使民主权力的制度，并不能使广大人民直接行使民主权力，故D选择是不正确的。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-31":{"ex":"本题属于形势与政策的试题，属国内时政，考查记忆，也可以说是考查邓小平理 论和“三个代表”重要思想概论第10章“一国两制”和实现祖国完全统一中胡锦涛主席关于新形势下处理两岸关系的政策的记忆。四个“决不”都是正确选项。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-32":{"ex":"本题属于形势与政策的国内时政试题，出自党的十七大报告，考查高举中国特色 社会主义伟大旗帜内容的记忆。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-33":{"ex":"本题属于形势与政策的国际时政试题，考查记忆，内容出自2007年2月3日人民 日报。 三、分析题：34～38。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-4":{"ex":"（1）本题考查《马克思主义哲学原理》第5章人类社会的本质和基本结构中关于 文化的本质和功能的理解。（2）本题通过一段引语来说明由人创造的具有软实力的精神文化 或观念形态的文化对人自身的反作用。（3）在四个选项中体现“化”自身功能的只能是A选 项，B选项是错误观点，因为人的本质是在社会实践中处理人与人的一切社会关系中构成的。 C、D是不符合试题要求的不准确观点。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-5":{"ex":"本题考查《马克思主义政治经济学原理》第3章资本主义生产过程及其特征这一知识点的内容，是政治经济学的常考点，相对比较简单。资本主义生产是以雇佣劳动为基础， 以获取剩余价值为目的生产，因此，资本主义生产过程是劳动过程和价值增殖过程的统一。价 值增殖过程是超过一定点而延长了的价值形成过程，这一定点，就是工人用于再生产自己劳动 力价值的时间。这样，在价值增殖过程中，工人的劳动时间分为必要劳动时间和剩余劳动时间 两部分。必要劳动时间是工人再生产自己劳动力价值的时间，剩余劳动时间是工人为资本家生 产剩余价值的时间。因此，正确答案是D。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-6":{"ex":". 本题考查《马克思主义政治经济学原理》第3章土地价格这一知识点的内容。属 于基本概念考查，是政治经济学的常考点。土地价格这一知识点是近年来我国经济发展和社会 主义现代化建设中的热点问题。土地不是劳动产品，没有价值。因此，土地价格不是土地价值的货币表现，实质上是地租收入的资本化。土地价格的高低主要取决于两个因素：一是地租量的大小，二是银行存款利息率的高低。土地价格同地租量成正比，同银行存款利息率成反比，土地价格用公式表示为：土地价格=地租量/银行存款利息率。本题作为计算题，其计算过程分两步，一是根据所给材料计算利息率，即：利息率=地租/土地价格=200万/4000万=5%；二是 根据所给材料计算地租增加以后的土地价格，即：土地价格=300万/5%=6000万元，因此，正确答案是B。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-7":{"ex":". 本题考查《马克思主义政治经济学原理》第6章建立和健全社会保障体系的必要 性这一知识点的内容，是政治经济学的常考点，相对比较简单，但却是近年来我国经济发展和 社会主义现代化建设中的热点问题。社会保障是指国家和社会通过立法对国民收入进行分配和 再分配，对社会成员特别是生活有特殊困难的人们的基本生活权利给予保障的社会安全制度。 这表明，社会保障的基本目标是满足人们最基本的生活需要，保证劳动力的再生产和社会再生 产的顺利进行。因此，正确答案是A。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-8":{"ex":". 本题考《毛泽东思想概论》第2章关于孙中山三民主义思想内容的理解。1905年 孙中山把同盟会的十六字政纲“驱除鞑虏，恢复中华，建立民国，平均地权”首次概括为三 民主义：民族、民权、民生三大主义。“驱除鞑虏”，即是民族主义；“恢复中华，建立民 国”，即为民权主义；“平均地权”，即为民生主义。后来，孙中山在国民党“一大”上重新 解释三民主义，使旧三民主义发展为新三民主义，其中民生主义包涵“平均地权”、“节制资 本”两方面的内容。故选C。本题与中共十七大报告中提出的“加强以改善民生为重点的社会 建设”有一定的间接联系。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2008-9":{"ex":". 本题考《毛泽东思想概论》第5章关于武装斗争中的人民军队建设问题。毛泽东 关于人民军队建设思想提出，人民军队建设的基本原则包括全心全意为人民服务的宗旨，党指 挥枪的原则及思想政治工作是人民军队的生命线等，其中确立“党对军队的绝对领导”是人民 军队建设的根本原则。对比，毛泽东多次强调，我们的原则是党指挥枪，而决不允许枪指挥 党。“三湾改编”时把党支部确立在连上，开始确立了党指挥枪的原则。后来毛泽东在1929 年古田会议的决议《关于纠正党内的错误思想》再次强调了这个原则。故选A。本题与2008年《形势与政策》中关于人民军队建军80周年问题有关。","kp":"","src":"中国教育在线·2008 试题答案及解析"},"2009-1":{"ex":"本题考查哲学的基本问题。哲学基本问题的第一个方面的内容是，意识和物质、思维和存在谁是世界的本原，即物质和意识何者是第一性、何者是第二性的问题。在这个问题的回答上，物质与意识的对立是绝对的、无条件的。但超出这个范围，二者的对立就是相对的。B选项是区分可知论和不可知论的标准；CD选项表述错误，物质和意识没有重要性及与社会生活的关系密切程度之分。因此，选项A正确。","kp":"哲学的基本问题","src":"中国教育在线·2009 试题答案及解析"},"2009-10":{"ex":"在中共七届二中全会后，党制定和实行了“公私兼顾、劳资两利、城乡互助、内外交流”的新民主主义经济建设的方针政策，简称“四面八方”政策。既反保守又反冒进，在综合平衡中稳步前进的方针是1956年5月中央提出的我国经济建设的指导方针。“调整、巩固、充实、提高”是1961年1月中共八届九中全会提出的对国民经济实行的方针。实现速度、结构、质量的统一是党的十六大提出的经济工作的指导思想。因此，本题正确答案是B选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-11":{"ex":"科学发展观，第一要义是发展，核心是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。因此，本题正确答案是C选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-12":{"ex":"中央提出的建设社会主义新农村的总要求是：生产发展、生活宽裕、乡风文明、村容整洁、管理民主。生产发展，是新农村建设的中心环节，是实现其他目标的物质基础。生活宽裕，是新农村建设的目的，也是衡量我们工作的基本尺度。乡风文明，是农村素质的反映，体现农村精神文明建设的要求。村容整洁，是展现农村面貌的窗口，是实现人与环境和谐发展的必然要求。管理民主，是新农村建设的政治保证，显示了对农民群众政治权利的尊重和维护。因此，本题正确答案是A选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-13":{"ex":"马克思主义中国化理论成果包括毛泽东思想、邓小平理论、“三个代表”重要思想和科学发展观。 实事求是是马克思列宁主义、毛泽东思想的精髓，也是中国特色社会主义理论体系即邓小平理论、“三个代表”重要思想和科学发展观的精髓，是我们党的思想路线。党的这一思想在实践中不断得到丰富和发展。邓小平把实事求是发展为解放思想、实事求是；江泽民又把解放思想、实事求是发展为解放思想、实事求是、与时俱进。因此，毛泽东思想的精髓只是实事求是，不包括解放思想和与时俱进，故只有实事求是是马克思主义中国化理论成果中所有理论的精髓，不能选A、B、D选项。因此，本题正确答案是C选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-14":{"ex":"胡锦涛在这次会谈中提出国共两党和两岸双方应当共同努力，建立互信、搁置争议、求同存异、共创双赢。因此，本题正确答案为A。2005年3月30日中国国民党副主席江丙坤率领的大陆参访团率团来京，开启了两党之间党与党对话的先声，排除B。2005年4月29日，中共中央总书记胡锦涛与时任中国国民党主席连战在人民大会堂举行60年来两党领导人的首次会谈，达成并共同发布“两岸和平发展共同愿景”，揭开了两岸关系和平发展新局的大幕，排除C。2008年6月13日大陆海协会会长陈云林与台湾海基会董事长江丙坤共同签署《海峡两岸关于大陆居民赴台湾旅游协议》及《海峡两岸包机会谈纪要》，排除D。","kp":"","src":"中公考研·2009 真题答案解析"},"2009-15":{"ex":"神舟七号航天飞船所实现的是我国首次宇航员出舱活动。这是我国当年重要的科技成就之一。A、C两项是神舟五号进行的承担绕月探测的是“嫦娥工程”。因此本题答案为D。","kp":"","src":"中公考研·2009 真题答案解析"},"2009-16":{"ex":"2008年4月23 日的人民日报指出：据尼泊尔选举委员会22日最新消息，尼泊尔制宪会议选举直接选举计票工作已结束。根据计票结果，尼泊尔共产党(毛主义)获得直接选举产生的240个议席中的120席，尼泊尔大会党获得37席，尼泊尔共产党(联合马列)获得33席。其余席位由“马迪西人民权利论 坛”等政党和两名独立候选人瓜分。故B是正确选项。 二、多项选择题。","kp":"","src":"中公考研·2009 真题答案解析"},"2009-17":{"ex":"本题考查马克思主义哲学的辩证唯物论知识，物质决定意识，意识对于物质具有能动的反作用，本题强调意识的能动作用。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-18":{"ex":"本题题干说明我们在实现思想理论创新过程中，必须要坚持以解放思想为先导，农村家庭联产承包责任制的确立就是解放思想，实事求是的产物，解放思想，不是打破一切理论的约束，而是打破一切僵化的，教条的理论的约束，是对于理论的批判继承的过程，在实践的过程中还需要科学理论的指导，并且要求我们要关注民生，关注基层群众需求，就是关注基层群众生活实践的需要，尊重人民群众的诉求。因此，本题正确答案是ACD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-19":{"ex":"本题考查科学技术的作用，先进的生产工具是人们先进的科学技术的物化，它运用于生产过程就会加快生产发展的速度，提高生产的效率。科技革命推动生产方式的变革，进而推动社会制度的变革。在本题中，手推磨、蒸汽磨是先进的生产工具，是科学技术的物化，由于它们的广泛应用，推动了生产方式的变革，分别产生了封建主义的社会和工业资本家的社会，所以，AC正确，B选项明显错误，科学技术不是历史变革中的唯一决定性力量。科学技术是间接的生产力，不是自主性力量，自主性力量只能是运用科技的劳动者，D选项错误。因此，本题正确答案为AC选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-2":{"ex":"实践是检验真理的唯一标准，这是由真理的本性和实践的特点决定的，真理的本性是主观和客观的一致，符合。实践的特点是直接现实性，即实践是直接改造客观世界的活生生的物质活动，是主观见之于客观的物质活动，它能给人们直接提供看得见、摸得着的现实成果。这是实践的特点，也是实践的优点。只有实践才能把主观认识和客观实在联系起来加以对照，从而判明主观和客观是否一致，判明认识是否具有真理性。所以，本题正确答案是D选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-20":{"ex":"华罗庚这句话的意思是：个人的发展是社会发展历史长河中的一个环节和链条，个人只有融入社会才能实现个人价值，同时，个人社会价值的实现又推动了社会的发展。所以，可以推出正确答案是AB选项“个人价值的实现与社会价值的实现是统一的”和B选项“个人价值的实现是一个历史过程”。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-21":{"ex":"信用制度加速了生产力的物质上的发展和世界市场的形成，由此推动了商品经济的发展并且为社会主义生产方式的建立奠定了物质基础，同时信用制度加速了经济危机的爆发，加强了旧生产方式解体的各种因素，但信用制度不是资本主义经济危机爆发的深层原因。因此，本题正确答案是BCD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-22":{"ex":"劳动力价值包括三个部分：一是维持劳动者自身生存所必需的生活资料的价值，用于生产其劳动力；二是劳动者繁育后代所必需的生活资料的价值，用于延续劳动力的供给；三是劳动者为掌握一定的文化知识和生产技术而接受教育和训练所支出的费用，用于提供适合资本主义生产所需要的劳动力。B选项是劳动力商品的价值是在什么时间创造出来的，不是其价值构成。因此，本题正确答案是ACD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-23":{"ex":"由材料可以看出允许农民以转包、出租、互换、转让、股份合作等形式流转土地承包经营权，完善了土地承包经营权权能的同时完善了土地市场，促进了土地资源的优化配置，但土地的所有制结构并没有改变，因此，本题正确答案是BCD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-24":{"ex":"在构建社会主义和谐社会过程中要改革现有的收入分配制度，规范收入分配秩序，合理调节国民收入分配格局，加大收入分配调节力度，把效率和公平相互之间的矛盾协调统一起来，充分发挥市场机制对收入分配的调节作用，因此，本题正确答案是ACD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-25":{"ex":"中国共产党的成立，是近代中国革命历史上划时代的里程碑。自从有了中国共产党，灾难深重的中国人民有了可以信赖的组织者和领导者，中国革命有了坚强的领导力量。中国共产党的成立，使中国革命有了科学的指导思想。中国共产党在成立之时虽然在中国政治舞台上比较弱小，但拥有马克思主义这个最先进的思想武器。党所提出的纲领和奋斗目标，代表着中国社会发展的正确方向，代表着中国无产阶级和其他广大劳动人民的根本利益。因此，中国共产党从诞生时起，就充满着生机和活力，预示着中国的光明和希望，中国革命的面目从此焕然一新。但中国共产党的成立，并不意味着中国革命找到了一条正确的革命道路。在领导中国革命的过程中，以毛泽东为代表的中国共产党人，经过艰辛探索，把马克思主义的普遍原理与中国革命的具体实践相结合，找到了一条适合中国国情的以农村包围城市，武装夺取政权的革命道路。因此，本题正确答案是BCD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-26":{"ex":"新民主主义的文化，就是无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文化。所谓民族的文化，就是反对帝国主义的奴化思想，主张中华民族的尊严与独立。这种文化带有中华民族的特性，在形式和内容上有“中国作风和中国气派”，同本民族的历史、环境、语言、心理、风俗、习惯相适应。它同一切别的民族的社会主义文化相联合，建立互相吸引和互相发展的关系，共同形成世界的新文化，但决不能和任何别的民族的帝国主义反动文化相联合。这种文化决不排斥外国的进步文化，而是注意吸收外国的进步文化作为自己文化食粮的原料，但必须去其糟粕、取其精华，决不能生吞活剥地、毫无批判地吸收，更不能搞所谓的“全盘西化”。因此，本题正确答案是BC选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-27":{"ex":"中国共产党领导的中国革命，包括新民主主义革命和社会主义革命。毛泽东指出，中国革命必须分“两步走”，“第一步，改变这个殖民地、半殖民地、半封建的社会形态，使之变成一个独立的民主主义社会。第二步，使革命向前发展，建立一个社会主义社会。”只有认清新民主主义革命和社会主义革命的区别，又认清两者的联系，才能正确地领导中国革命。新民主主义革命和社会主义革命是性质不同的两个阶段，只有完成前一个阶段的革命任务，才能进行下一阶段的革命，不能“毕其功于一役”，搞所谓“无间断”的革命，混淆两个革命的界限，就会犯“左”倾错误；割裂两个革命之间的衔接，中间横插一个资本主义社会，即所谓“二次革命论”，就会犯右倾错误。新民主主义革命和社会主义革命又是紧密衔接的两个阶段，中国革命将经过新民主主义走向社会主义，而不经过资本主义阶段。民主主义革命是社会主义革命的必要准备，社会主义革命是民主主义革命的必然趋势。因此，本题的正确答案是ABC选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-28":{"ex":"20世纪50年代中国进行的生产资料所有制的社会主义改造取得了伟大的历史性胜利，中国社会的经济结构发生了根本的变化，社会主义全民所有制和集体所有制经济在国民经济中占了绝对优势，成为中国的经济基础。社会主义改造的胜利，解放了被束缚的社会生产力，促进了社会生产力的发展，伴随着社会经济结构的变化，中国社会的阶级关系也发生了根本变化，广大劳动人民从此摆脱了受剥削的境遇，成为掌握国家生产资料的主人，实现了真正的当家作主。因此，社会主义改造的基本完成，标志着我国完成了新民主主义向社会主于的过渡，标志着社会主义制度在中国的确立，标志着我国已经进入了社会主义初级阶段。因此，本题的正确答案是ABD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-29":{"ex":"2005年2月19日，胡锦涛指出我们所要建设的社会主义和谐社会，应该是民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处的社会。民主法治，就是社会主义民主得到充分发扬，依法治国基本方略得到切实落实，各方面积极因素得到广泛调动。公平正义，就是社会各方面的利益关系得到妥善协调，人民内部矛盾和其他社会矛盾得到正确处理，社会公平和正义得到切实维护和实现。诚信友爱，就是全社会互帮互助、诚实守信，全体人民平等友爱、融洽相处。充满活力，就是能够使一切有利于社会进步的创造愿望得到尊重，创造活动得到支持，创造才能得到发挥，创造成果得到肯定。安定有序，就是社会组织机制健全，社会管理完善，社会秩序良好，人民群众安居乐业，社会保持安定团结。人与自然和谐相处，就是生产发展，生活富裕，生态良好。因此，本题正确答案是BD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-3":{"ex":"社会经济结构是指同生产力发展的一定阶段相适应的生产关系的总和。经济结构所反映的内容是生产关系,表现为一定的社会经济制度。社会经济结构是社会有机体的骨骼系统,是全部社会关系的基础。所以正确答案是B选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-30":{"ex":"党的十七大首次把坚持基层群众自治制度纳入中国特色社会主义民主政治制度的基本范畴,明确指出：“人民依法直接行使民主权利，管理基层公共事务和公共事业，实行自我管理、自我服务、自我教育、自我监督，对干部实行民主监督，是人民当家作主最有效、最广泛的途径，必须作为发展社会主义民主政治的基础性工程重点推进。”目前，中国已经建立了以农村村民委员会、城市居民委员会和企业职工代表大会为主要内容的基层民主自治体系。因此，本题正确答案是ABC选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-31":{"ex":"2008年发生了汶川大地震，中国政府做了各种努力，取得了抗震救灾斗争的重大胜利。2008年10月8日，全国抗震救灾总结表彰大会召开。胡锦涛指出，抗震救灾斗争重大胜利，展现了全心全意为人民服务的中国共产党和中国社会主义国家政权的伟大力量。伟大抗震救灾精神，集中体现和进一步发展了爱国主义、集体主义、社会主义精神，集中体现和进一步发展了我们党和军队的光荣传统和优良作用，集中体现和进一步发展了中华民族的伟大民族精神和当代中国人民的时代精神，是党和人民极为宝贵的精神财富。这说明我国社会主义核心价值体系建设取得显著成效。同时，胡锦涛说，在同特大地震灾害的艰苦搏斗中，我们的党、我们的军队、我们的人民坚持以人为本、尊重科学，充分展现了中华民族关爱生命、崇尚理性的民族品格。人的生命高于一切、先于一切、重于一切。在抗震救灾的全过程中，我们和时间赛跑、同死神抗争，充分体现了我国社会主义制度珍爱生命、保护人民的本质。因此，本题正确答案是ABCD选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-32":{"ex":"网络只是提供了公民政治参与的一种手段和途径，不涉及我国民主政治体制的“制度”、“体制”(形式)等内容，因此C项错误，正确答案是ABD。","kp":"","src":"中公考研·2009 真题答案解析"},"2009-33":{"ex":"记忆题。第29届奥林匹克运动会中国提出了“绿色、人文、科技”的奥运理念，故答案选BCD。 三、分析题。","kp":"","src":"中公考研·2009 真题答案解析"},"2009-4":{"ex":"马克思主义哲学唯物史观认为，人的本质在于人的社会性质，从人与动物相区别的层次上，人的本质在于社会劳动；从人与人相区别的层次上，人的本质在于社会关系。马克思指出：人的本质不是单个人所固有的抽象物，在其现实性上，它是一切社会关系的总和。因此，本题正确答案是C选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-5":{"ex":"本题考查的是第二章货币流通规律的公式。一定时期内流通中所需要的货币量=待实现的商品价格总额/货币流通速度。题干中给出商品价格总额24万亿，货币量为3亿元，所以可求出当年货币流通速度为8次/年。根据题干，今年的商品价格总额为24+24×10%=26.4，在其他条件不变的情况下，今年流通中的货币量为26.4/8=3.3次。所以，正确答案是C选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-6":{"ex":"本题考查的是马克思主义政治经济学第四章中的垄断阶段的资本运行中国家对经济活动的调节和干预这一知识点。在垄断资本主义条件下，垄断资产阶级利用国家机器干预经济生活，主要是为了暂时缓和资本主义基本矛盾引发的各种问题。其根本目的是为了维护垄断资产阶级的长远利益和整体利益。所以，正确答案是A选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-7":{"ex":"本题考查的知识点是马克思主义政治经济学第三章中的资本构成。资本的构成可以从物质形式和价值形式两个方面考察。从物质形式上看，由生产技术水平决定的生产资料和劳动力之间的量的比例，叫做资本的技术构成。另一方面，从价值形式上看，不变资本和可变资本之间的比例，叫做资本的价值构成。马克思把由资本技术构成决定并且反映资本技术构成变化的资本的价值构成，叫做资本的有机构成，通常用c:v表示。题干中只涉及到预付资本的价值总量由于价格的涨落发生了变化，并未涉及到资本的技术构成发生变化，所以也不会影响到有机构成。因此，本题正确答案是B选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-8":{"ex":"1925年，毛泽东在《中国社会各阶级的分析》中指出：“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。中国过去一切革命斗争成效甚少，其基本原因就是因为不能团结真正的朋友，以攻击真正的敌人。”ABC选项不符合题意，应予排除。因此，本题正确答案是D选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2009-9":{"ex":"《矛盾论》和《实践论》是毛泽东哲学思想的两篇代表性著作，是毛泽东哲学思想形成的主要标志，都是为了克服党内严重的教条主义而作，给党的思想路线奠定正确的哲学基础。《实践论》阐述了以实践为基础的马克思主义的认识论，揭露教条主义轻视实践的错误。《矛盾论》阐述了以对立统一规律为核心的马克思主义的唯物辩证法，揭露教条主义不懂唯物辩证法的错误。 教条主义者片面夸大书本知识的作用，轻视感性经验，轻视实践，只看到矛盾的普遍性而忽视矛盾的特殊性，把马克思主义当作一般性结论，当作僵死的教条到处生搬硬套。 经验主义者片面夸大感性经验的作用，轻视科学理论的一般指导作用，把局部经验当作普遍真理，处理一切问题都超不出自己狭隘经验的眼光。 冒险主义是“左”倾机会主义的一种表现，特点是不顾客观条件，不顾群众觉悟程度和实际可能性,盲目地采取冒险行动,硬干硬拼，急于求成。 机会主义是指工人运动或无产阶级政党内部出现的违背马克思主义根本原则的思潮、路线。它是资产阶级或小资产阶级思想的反映。机会主义有两种表现形式：一是右倾机会主义，表现为思想落后于实际，不能随着变化了的情况前进，企图开倒车；另一种是“左”倾机会主义，表现为思想超越客观过程的一定阶段，离开了当时大多数人的实践，离开了当时的现实性，堕入空想和盲动。 因此，本题正确答案是D选项。","kp":"","src":"中国教育在线·2009 试题答案及解析"},"2010-1":{"ex":"本题是从马克思主义的价值取向，也就是马克思的社会理想提出问题。马克思所追求的价值目标是什么?恩格斯从《共产党宣言》中摘出的一段话，极其鲜明地表达了未来新的共产主义社会的根本特征和马克思所追求的根本价值目标，这就是实现人的自由而的发展。马克思在《资本论》中所论证的“以每个人的而自由发展为基本原则的社会形式”。因此实现自由而的发展，既是共产主义社会的根本特征，也是马克思的根本价值目标，故选A。","kp":"","src":"新东方在线·2010 真题及答案详解"},"2010-10":{"ex":"本题考查的知识点是“中国共产党人开始探索中国自己的社会主义建设道路的标志”。从1956年初开始，以毛泽东为主要代表的中国共产党人，对中国的社会主义建设道路进行了艰苦的探索，并取得了积极的成果。《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志。在新的历史条件下从经济方面和政治方面提出了新的指导方针，为中共八大的召开作了理论准备。故选项B正确。 类似的例题详见跨考教育(模拟一单选第6题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-11":{"ex":"爱因斯坦所说的“品格”指道德，爱因斯坦这句话的意思是道德比才能更重要，题干讲的是“才”与“德”的关系，只有选项B谈二者的关系，“才者，德之资也;德者，才之帅也”意思是才是德的辅助;德是才的统帅。所以本题答案为选项B。 类似的例题详见跨考教育(模拟二单选15题、模拟四单选16题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-12":{"ex":"中华民族精神包括以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息。其中作为中华民族精神的重要内涵的自强不息，具体体现为“富贵不能淫、贫贱不能移、威武不能屈”的坚贞刚毅品质，体现为“夸父追日”、“精卫填海”、“大禹治水”、“愚公移山”等不屈不挠的精神，体现为“因时而变”、“随时而制\"、“与时偕行”、“与日俱新”等与时俱进的精神。所以本题答案为选项C。 类似的例题详见跨考教育(模拟一单选13题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-13":{"ex":"本题考查的知识点是“社会主义思想道德体系的重点”。《公民道德建设实施纲要》不仅在公民基本道德规范中提出“诚信”，而且在职业道德要求中，再次强调“诚实守信”的重要性。公民道德建设以诚实守信为重点，既是对中华民族传统美德的弘扬，又是对当代中国道德建设实践的正确反映。加强公民道德建设，要以诚信为本、守信光荣、失信可耻为基本要求，增强全社会的诚实守信意识。因此，选项B是正确答案。 类似的例题详见跨考教育(模拟四单选13题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-14":{"ex":"本题考查依法治国的相关知识点，选项A是依法治国的根本要求，为本题的正确答案;选项B是我国政治体制改革的主要任务。我国民主体制改革的主要任务是：健全民主制度，丰富民主形式，拓宽民主渠道，依法实行民主选举、民主决策、民主管理、民主监督，保障人民的知情权、参与权、表达权、监督权，实现社会主义民主政治制度化、规范化、程序化，巩固人民当家作主的政治地位，但与题意不符;选项C是社会主义法治观念中公平正义观念的基本内容，即立法公开、执法公开、实体公开和程序公开，与题意不符;选项D涉及的知识点是依法治国的基本含义中的相关内容，但与题意不符。综上，本题正确答案为选项A。本题为综合性试题，学科跨越性较大，考查了邓论与法基中与“依法治国”基本方略相关的考点，考生应予以注意。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-15":{"ex":"2009年3月28日，来自西藏各族各界的13280名代表身着节日盛装，在布达拉宫广场上隆重纪念首个西藏百万农奴解放纪念日。上午10时，西藏百万农奴解放纪念日庆祝大会举行，西藏自治区主席向巴平措主持会议，来自各界的代表先后登台发言。所以，本题的正确答案为D选项。 类似的例题详见跨考教育(模拟三单选14题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-16":{"ex":"2009年9月25日，国家主席胡锦涛在美国匹兹堡举行的二十国集团领导人第三次金融峰会上发表题为《全力促进增长 推动平衡发展》的重要讲话。其中指出：“当前国际社会十分关注全球经济失衡问题。失衡既表现为部分国家储蓄消费失衡,贸易收支失衡更表现为世界财富分配失衡,资源拥有和消耗失衡,国际货币体系失衡。导致失衡的原因是复杂的,多方面的既有经济全球化深入发展,国际产业分工转移,国际资本流动的因素也同现行国际经济体系,主要经济体宏观经济政策,各国消费文化和生活方式密切相关。从根本上看失衡根源是南北发展严重不平衡。”所以，本题的正确答案为D选项。 类似的例题详见跨考教育(时政第十页第4题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-17":{"ex":"本题考查的是唯物论部分的知识，在本题中，人的意识是对于物质世界的能动反映，新华字典中内容的变迁，说明人的意识随着社会生活的变化而变化，但是，需要借助人类语言这一物质外壳来表达，所以，正确答案是选项ACD。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-18":{"ex":"本题的考点是科技革命的重要性。在题干中，我们可以看到，科技革命在社会形态更替中发挥重要作用，但是，不是根本标志，当然，也不是摆脱社会危机的根本处理，社会危机的解决必须从社会基本矛盾入手，社会实践的需要是科技发展的强大动力，科技创新能够推动社会经济跨越式发展，所以，本题的正确答案是选项CD。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-19":{"ex":"资本主义政治制度本质上是资产阶级进行政治统治和社会管理的手段和方式，是为资产阶级专政服务的，因此不可避免地有其历史的和阶级的局限性。法律名义上的平等掩盖着事实上的不平等，由于资本主义社会是建立在私有制和资本特权的基础上的，资本家和劳动者之间、富人与穷人之间存在着事实上严重的不平等，资本主义法律的实质是将这种不平等合法化。因此，本题的正确答案是ACD选项。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-2":{"ex":"量变是事物数量的增减和次序的变动，是保持事物的质的相对稳定的不显著的变化，体现了事物渐进过程的连续性。质变是事物性质的根本变化，是事物由一种质态向另一种质态的飞跃，体现了事物渐进过程和连续性的中断。量变和质变的辩证关系是：量变是质变的必要准备，质变是量变的必然结果，量变和质变是相互渗透的。题干中“不是因为力量，而是因为坚持”，由此把问题聚焦在“坚持就是胜利”这一点上，也就是“贵在坚持”。“坚持”意味着事物是作为过程而存在、作为过程而发展的，而发展过程又是经由量变和质变两种状态，由量变到质变、又由质变到新的量变，交替循环，形成事物质量互变规律。在溪水与岩石的斗争中，正是由于“坚持”实现了由量变到质变的过程。因此，本题正确答案是C。","kp":"","src":"新东方在线·2010 真题及答案详解"},"2010-20":{"ex":"“历史终结论”的破产说明，人类历史的发展的曲折性不会改变历史发展的前进性，一些国家社会发展的特殊形式不能否定历史发展的普遍规律，人们对社会发展某个阶段的认识不能代替社会发展的整个过程。但是，社会规律和自然规律是有相异之处的，社会规律是人有意识的能动活动，自然规律是盲目的无意识的力量起作用，所以，正确答案是选项BCD。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-21":{"ex":"马克思之所以能够中国化的原因，首先在于马克思主义中国化是马克思主义理论的内在要求。恩格斯指出：\"马克思的整个世界观不是教义,而是方法。它提供的不是现成的教条，而是进一步研究的出发点和供这种研究使用的方法。\"各国的马克思主义者的任务就是结合各个国家不同时期的具体实际，将马克思主义进-步加以具体化。因此A选项正确。 马克思主义与中华民族优秀文化具有相融性。马克思主义中国化就是把马克思主义植根于中华民族优秀的思想文化之中，实现马克思主义和民族的特点相结合,并经过一定的民族形式表现出来。因此B选项正确。 马克思之所以能够中国化的原因，还在于马克思主义中国化是解决中国问题的需要。马克思主义中国化就是运用马克思主义解决中国革命、建设和改革的实际问题。在中国这样一个半殖民地半封建的东方大国里进行革命，不能机械套用马克思主义一般原理和照搬外国经验。同样，在中国进行社会主义建设和改革，也不能把马克思主义当做教条，必须紧密结合中国国情和时代条件，使马克思主义在中国具体化。因此C选项正确。马克思主义具有普遍指导意义，但并不能为中国革命建设和改革提供现成发展模式，因此D选项错误。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-22":{"ex":"从1949年10月中华人民共和国成立，到1956年底社会主义改造基本完成,是我国从新民主主义到社会主义过渡的时期。中国新民主主义革命的全部结果是，一方面有资本主义因素的发展，另一方面又有社会主义因素的发展。新中国成立初期，在同资本主义经济反抗国家限制的不法行为作斗争的过程中，在合理调整工商业的过程中，国家创造了加工订货、经销代销、统购包销、公私合营等一系列从低级到高级的国家资本主义形式。这些本来主要是为了帮助私营工商业克服生产困难而采取的措施，不但对资本主义工商业进行了有效的利用和限制，也很自然地加深了它们同社会主义国营经济之间的联系,引起它们在生产关系上发生程度不同的变化。毛泽东从总结经验中肯定各种形式的国家资本主义的继续扩大和提高，就是对资本主义工商业逐步进行社会主义改造的具体途径，从而改变了将来某一天宣布国有化、一举消灭资本主义私有制的原有想法。这也成为党提出向社会主义逐步过渡的总路线的又一个基本因素。因此A选项正确。 过渡吋期的总路线，包括两方面的内容:一是逐步实现社会主义工业化，这是总路线的主体;一是逐步实现对农业、手工业和资本主义工商业的社会主义改造，这是总路线的两翼。工业化是社会主义改造的基础和目的;社会主义改造是工业化不可缺少的条件和手段，两者互相联系，互相促进，充分体现了社会主义工业化和社会主义改造的紧密结合，体现了解放生产力与发展生产力、变革生产关系与发展生产力的有机统一，毛泽东指出：\"我们现在不但正在进行关于社会制度方面的由私有制到公有制的革命。而且正在进行技术方面的由手工业生产到大规模现代化机器生产的革命，而这两种革命是结合在一起的。\"因此B选项正确。 近代中国资本主义及现代化工业有了一定程度的发展，这是中国向社会主义过渡的不可缺少的物质基础。但我国工业化建设是从1953年开始，其后开始的第一个五年计划期间，工业化建设取得了重大成就。因此C选项错误。 到1952年，经过三年的实践，我国国民经济得到恢复，民主革命遗留下来的任务已经完成，政治、经济及社会面貌发生了巨大变化。由于新的经验的积累，以及对社会主义改造步骤的新认识，党中央和毛泽东原来关于转变的设想发生了部分变化。毛泽东认为，制定党在过渡时期的总路线，明确地向全党和全国人民提出向社会主义逐步过渡的任务，现在是适时的和必要的了。因此D选项正确。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-23":{"ex":"人民代表大会制度是中国人民当家作主的根本政治制度，这一是制度我党把马克思主义基本原理同中国具体实际相结合的伟大创造，是近代以来中国社会发展的必然选择，是中国共产党带领全国各族人民长期奋斗的重要成果，反映了全国各族人民的共同利益和共同愿望，在实践中显示出强大的牛-命力和巨大的优越性。所以选项ABCD为正确答案。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-24":{"ex":"社会主义时期处理民族问题的基本原则是:维护祖国统一，反对民族分裂，坚持民族平等、民族团结、各民族共同繁荣。实行民族区域自治是我们党解决民族问题的基本政策。所以选项BCD为正确答案。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-25":{"ex":"走和平发展道路，是中国政府和人民根据时代发展潮流和自身根本利益作出的战略抉择。坚持走和平发展道路，是基于中国特色社会主义的必然选择。中国人民最需要、最珍爱和平的国际环境。走和平发展道路，是中国实现国家富强、人-幸福的必由之路,符合中国人民和世界人民的根本利益。坚持走和平发展道路，是基于中国历史文化传统的必然选择。中华民族是热爱和平的民族，中华文化是一种和平的文化。渴望和平始终是中国人民的精神特征。中国人民在对外交往中始终强调亲仁善邻、和而不同。所以选项ACD为正确答案。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-26":{"ex":"洋务运动的指导思想是“中学为体，西学为用”，即在封建主义思想的指导下发展近代企业，故A正确;洋务派官僚主张对外“和戎”，兴办企业一切依赖外国，故B正确;洋务运动的失败不是由于资金人才的匮乏，而是上层地主阶级的垄断和对人才的压制，C错误;洋务派所创办的一些新式企业虽然具有一定的资本主义性质，但其管理基本上仍是封建衙门式的，大小官员既不懂生产技术，又不懂经营管理，无法维持企业的正常运行，也是导致洋务运动失败的一个原因，D正确。所以本题正确答案为ABD。","kp":"","src":"新东方在线·2010 真题及答案详解"},"2010-27":{"ex":"中国必须走农村包围城市、武装夺取政权的道路。近代中国是一个半殖民地半封建社会，内无民主制度而受封建主义的压迫;外无民族独立而受帝国主义的压迫。中国的无产阶级根本不可能像在资本主义国家那样，在城市经过长期的、公幵的合法斗争，然后再组织武装起义.夺取政权。中国革命的主要斗争形式是武装斗争。因此A选项正确。 近代中国农民占全国人口的绝大多数,是无产阶级可靠的同盟军和革命的主力军。无产阶级要想夺取革命的胜利，就必须将工作重点放到农村，派遣自己的先锋队深入农村，从解决农民的土地问题入手，组织、发动、和武装农民，不断积蓄和发展革命力量，使革命战争获得广大农民的支持和参加，为最后夺取全国胜利奠定基础。因此B选项正确。 中国革命的敌人虽然建立了庞大的反革命军队，并长期占据着中心城市，而农村则是其统治的溥弱环节。无产阶级及其政党必须将工作重心放到敌人统治力暈薄弱的农村去，在农村长期积蓄和锻炼自己的力量，以农村包围城市.逐歩夺取城市，取得革命的最后胜利。因此C选项正确。 中国是一个半殖民地半封建的大国，经济政治发展不平衡。由于经济发展不平衡，没有统一的资本主义经济，自给自足的地方性农业经济广泛存在,这就为在农村建立革命根据地提供了必要的物质条件;政治发展的不平衡性，造成了广大农村是反动统治的薄弱环节，又使红色政权获得了深厚的阶级基础;由于几个帝国主义国家的间接统治及其相互间的矛盾和斗争，造成了军阀割据的局面和连绵不断的军阀混战，使红色政权获得存在和发展的缝隙;由于中国是一个大国，革命力量大有回旋余地。这是农村革命根据地能够存在和发展的根本原因。因此D选项正确。类似的例题详见跨考教育(模拟二多选23题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-28":{"ex":"本题考查中国共产党巩固抗日民族统一战线的方针和原则。抗日战争时期，中国共产党处理民族矛盾和阶级矛盾的原则是：阶级矛盾服从于民族矛盾。因此，皖南事变后，中国共产党为了巩固统一战线，争取更多的人参加抗日，采取的方针和原则有：又联合又斗争，发展进步势力，争取中间势力，孤立顽固势力的策略总方针，以及同顽固派的斗争，坚持有理、有利、有节的策略原则。因此，选项ABD正确。选项C属于当时国内处理阶级斗争的对策。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-29":{"ex":"本题考查第二条战线形成的原因。由于国民党政府独裁专制和官员的腐败，使之成为了第二天战线反抗的对象，故A正确;第二条战线是为了争取和平、实现民主而开展的反抗运动，与国民党反动政府军事上的胜利与失败无关，主要在于国民党失去了民心，故B错误;国民党内战政策违背了人民的和平意愿，故第二条战线的反抗斗争是必然的，选项C正确;国统区生产萎缩，失业人数增加，经济危机严重，故选项D正确。答案为ACD.。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-3":{"ex":"本题考查人与自然的关系，气候变暖给人类发出的警示是人在对于自然的作用过程中，生态环境已日益成为人类反思自身活动的重要前提，保护自然，协调人和自然的关系是大势所趋，所以，正确答案是选项D。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-30":{"ex":"科学属于全人类的财富,科学知识是无国界的，但科学知识的运用却不可能离开具体的国家，选项A正确;个人的理想如果离开国家和民族就会成为无源之水，无本之木，所以个人的理想要与国家的命运、民族命运相结合，选项B正确;社会主义制度的建立，为祖国的繁荣发展提供了可靠的保障，社会主义在中国不是一句空洞的口号,而是集中代表着、体现着、实现着国家，民族和人民的根本利益，所以爱国主义与爱社会主义具有深刻的内在一致性，选项C正确;爱国主义不仅是一种情感，一种思想，更是一种行动，所以选项D也正确，故本题答案为ABCD。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-31":{"ex":"本题考查我国公民基本权利中的政治权利和自由的基本内容。政治权利和自由具体包括两个方面：一是选举权和被选举权。二是政治自由，我国《宪法》规定：“中华人民共和国公民有言论、出版、集会、结社、游行、示威的自由。”因此选项BD为正确答案。选项A人身自由权与选项C宗教信仰自由也都是公民的基本权利，但与题意不符。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-32":{"ex":"2009年9月18日，中国共产党第十七届中央委员会第四次全体会议胜利闭幕，全会审议通过了《中共中央关于加强和改进新形势下党的建设若干重大问题的决议》，对当前和今后一个时期加强和改进党的建设做出了部署，其中除了强调要建设马克思主义学习型政党，坚持和健全民主集中制外，还要弘扬党的优良作风，深化干部人事制度改革，做好抓基层，打基础工作，加快推进惩治和预防腐败体系建设。 类似的例题详见跨考教育(时政第4页、时政5页)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-33":{"ex":"第八次中国-东盟经贸部长会议于2009年8月15日在泰国首都曼谷召开，双方共同签署了中国-东盟自贸区《投资协议》，标志着中国与东盟历时7年之久的自贸区主要谈判任务已经完成，该协议的重要意义在于第一，确保中国对外建立的第一个自贸区于2010年全面建成。第二，将中国-东盟战略伙伴关系提升到更高水平。第三，为地区和全球经济复苏与发展作出积极贡献。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-4":{"ex":"劳动力商品的最主要特点，表现在它的使用价值上。对资本家来说，劳动力商品的使用价值不是由它提供的劳动的某种有用性质即具体劳动来决定的，也不是由具体劳动所创造的某种产品的特殊有用性质决定的，而是由它提供的劳动的抽象性质即抽象劳动决定的，这个抽象劳动所创造的价值量比劳动力价值的量更大。与一般商品不同的是，劳动力商品的消费过程也就是劳动过程。在劳动过程中，能创造出新价值，而且这个新的价值比劳动力自身的价值更大。这里劳动力的买卖并不同价值规律相矛盾，一切都按商品交换的原则办事。在工人将剩余价值生产出来的同时，货币也随之转化为资本了。因此，本题的正确答案是C选项。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-5":{"ex":"社会主义初级阶段的主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。这个主要矛盾，深刻反映了我国社会主义初级阶段的特殊本质。从社会需要方面来看，随着社会主义制度的建立，人民群众在旧社会被压抑的社会需求被广泛铎放出来，人民对于崭新的社会制度能够满足他们的物质文化需要，寄予了很大的期望。从社会生产方面看,经过几十年来的社会主义建设，我国的社会生产力和经济实力有了巨大的增长，教育科学文化事业也有了相当发展,但是生产力落后、经济文化发展很不平衡的状况还没有得到根本改变。所以在我国社会主要矛盾中,生产力落后将长期是矛盾的主要方面。所以选项A为正确答案。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-6":{"ex":"关于发展的重要性，邓小平说“发展才是硬道理”、江泽民说“发展是党执政兴国的第一要务”。这体现了中国解决所有问题的关键是要靠自己的发展，发展是为了创造出比资本主义更发达的生产力，增强我国的综合国力，使人民群众享受更多的实际利益，使社会主义更好地显示出自己的优越性。但是发展的根本目的是使人民共享发展成果，实现共同富裕。所以选项D为正确答案。 类似的例题详见跨考教育(模拟五第38题)","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-7":{"ex":"资源节约型社会，是指以能源资源高效率利用的方式进行生产、以节约的方式进行消费为根本特征的社会。它不仅体现了经济增长方式的转变，更是一种全新的社会发展模式，它要求在生产、流通、消费的各个领域，在经济社会发展的各个方面，以节约使用能源资源和提高能源资源利用效率为核心，以节能、节水、节材、节地、资源综合利用为重点，以尽可能小的资源消耗，获得尽可能大的经济和社会效益，从而保障经济社会的可持续发展。所以选项A为正确答案。","kp":"","src":"中国教育在线·2010 真题及解析"},"2010-8":{"ex":"本题考查建设社会主义文化强国的措施。发展公益性文化事业是保障人民文化权益的主要途径，是政府主导的公共文化服务体系，其根本任务是为人民群众提供基本的公共文化服务。A选项，繁荣社会主义文化，提高文化软实力是建设社会主义文化强国的内容和任务之一，故排除；B选项，协调发展公益性文化事业和经营性文化产业的说法太笼统。发展公益性文化事业是保障人民文化权益的主要途径，发展经营性文化产业是社会主义市场经济条件下满足人民多样化精神文化需求的重要途径，故排除；D选项，调动社会力量在市场竞争中壮大文化事业是发展公益性文化事业的措施之一，并非保障人民基本文化权益的主要途径，故排除。因此，选项C正确。","kp":"建设社会主义文化强国的措施","src":"中国教育在线·2010 真题及解析"},"2010-9":{"ex":"本题考查在中国最早讴歌十月革命、比较系统介绍马克思主义的人物。十月革命以后，在中国大地上率先举起马克思主义旗帜的是李大钊。李大钊先后发表《法俄革命之比较观》、《庶民的胜利》、《Bolshevism的胜利》、《我的马克思主义观》等文章，比较系统的介绍马克思主义。因此，正确答案是选项B。","kp":"","src":"中国教育在线·2010 真题及解析"},"2011-1":{"ex":"此题主要考察唯物辩证法，华罗庚的优选原则说明要寻找粉笔长度的最适合值，防止过犹不及，也同样防止未达目标，所以本题充分表明了优选原则是坚持适度原则的体现，正确答案是选项C。","kp":"","src":"中国考研网·2011 答案解析"},"2011-10":{"ex":"1950年10月中国人民志愿军赴朝作战，抗美援朝开始。1953年7月，中美双方签订《朝鲜停战协定》，从此抗美援朝胜利结束。抗美援朝的胜利打破了美国军队不可战胜的神话。因此正确答案是B。抗美援朝并未结束西方列强霸权主义的历史，A项错误；抗美援朝胜利实现了朝鲜人民的民族独立和人民解放，因此C项错误；赢得了近代以来中华民族反抗对敌入侵的第一次完全胜利是抗日战争，因此D项错误。","kp":"","src":"中国考研网·2011 答案解析"},"2011-11":{"ex":"法律权威是就国家和社会管理过程中法律的地位和作用而言的，是指法的不可违抗性。法律权威的树立主要依靠法律的外在强制力和内在说服力。法律的外在强制力 是法律权威的外在条件，主要表现为国家对违法行为的制裁。尽管法律权威不可能完全建立在外在强制力的基础之上，但必要的外在强制力，是树立法律权威不可缺少的条件。法律的内在说服力是法律权威的内在基础。如果仅仅依赖外在强制力，法律不可能形成真正的权威。法律的内在说服力既来源于法律本身的内在合理性，如法律合乎情理、维护正义、促进效率、通俗易懂，也来源于法律实施过程的合理性，如执法公平、司法公正。正是由于法律本身及法律实施具有这些内在合理性，法律才受人尊重，被人信赖，为人遵守。因此选项ACD与题意不符，本题正确答案为选项B。","kp":"","src":"中国考研网·2011 答案解析"},"2011-12":{"ex":"本题考查的知识点是法律的指引作用。 法律的指引作用主要是通过授权性规范、禁止性规范和义务性规范三种规范形式实现的。与之相应的指引形式分别为授权性指引、禁止性指引和义务性指引。授权性指引是指运用授权性法律规范，告诉人们可以做什么或者有权做什么；禁止性指引是指运用禁止性法律规范，告诉人们不得做什么；义务性指引是指运用义务性法律规范，告诉人们应当或者必须做什么。所以，本题答案为选项C。","kp":"","src":"中国考研网·2011 答案解析"},"2011-13":{"ex":"本题考查的知识点是道德的功能。在道德的功能系统中，主要的功能是认识功能和调节功能，道德的调节功能是指道德通过评价等方式，指导和纠正人们的行为和实践活动，协调人们之间关系的功效与能力，这是道德最突出也是最重要的社会功能。此外，道德还具有其他方面的功能，如导向功能、激励功能、辩护功能、沟通功能等，这些功能都是道德的认识功能和调节功能在某些方面的具体体现，都建立在这两种功能的基础之上，故本题答案为选项C。","kp":"","src":"中国考研网·2011 答案解析"},"2011-14":{"ex":"本题考查的知识点是理想的种类。理想是多方面和多类型的。从理想的性质和层次划分，有科学理想和非科学理想、崇高理想和一般理想；从理想的对象划分，有个人理想和社会理想；从理想的内容划分，有社会政治理想、道德理想、职业理想和生活理想。选项A是从理想的对象划分的，选项BC是从理想的内容划分的，所以本题答案为选项D。","kp":"","src":"中国考研网·2011 答案解析"},"2011-15":{"ex":"选项A深空探测“零的突破”是2007年10月24日嫦娥一号的意义。未来“嫦娥三号”月球探测器将怎样实现月面软着陆、成功“落月”进行着陆探测和巡视勘察，首次月球样品自动取样并安全返回地球，在地球上对取样进行分析研究，计划在2017年前后发射。选项BC错误。中国探月工程的二期先导星，嫦娥二号与嫦娥一号相比，嫦娥二号卫星的发射将采用地月转移轨道技术，火箭直接把卫星送入奔月轨道，可以大大节省卫星的燃料。所以本题答案为选项D。","kp":"","src":"中国考研网·2011 答案解析"},"2011-16":{"ex":"美国从2003年到2010年侵占伊拉克的8年时间里，死伤美国士兵4000余人，支出战争经费7000余亿美元。美国政府的对伊战争一些目的达到了，一些目的并未达到，却于2010年8月19日，撤离美军最后一批在伊拉克的作战部队。其主要原因是美国的军事战略发生了调整。美国认为伊拉克不再是美国的威胁，而经济、军事力量不断壮大的中国和军事实力不可小视的俄罗斯给美国的全球霸权带来威胁，美国从伊拉克撤军旨在加强中亚地区和亚太地区的兵力部署，从战略上围剿中国和俄罗斯。美国并未改变先发制人战略，没有放弃单边主义，从题干也不能看出美国转向本土反恐为主，所以本题答案为选项A。 二、多项选择题：17～33题，每小题2分，共34分。下列每题给出的四个选项中，至少有两个选项是符合题目要求的。多选或少选均不得分。","kp":"","src":"中国考研网·2011 答案解析"},"2011-17":{"ex":"此题的出题角度是认识和实践的辩证关系。在本题的材料中，根据材料描述体现认识和实践活动中取得的成果是要从实践中获得和摄取的，实践是认识的来源和前提，实践活动在主体与客体的关系中必须尊重群众的实际需求，即一切从实际出发的体现，本题的C选项是典型的形而上学观点，孤立的看问题，本题的D选项并不是直观反映，直观反映是机械唯物主义反映论的基本特点，所以本题的正确答案是选项AB。","kp":"","src":"中国考研网·2011 答案解析"},"2011-18":{"ex":"金融寡头是指操纵国民经济命脉，并在实际上控制国家政权的少数垄断资本家或垄断资本家集团。其在经济上的统治主要是通过“参与制”以小资本控制大量的社会资本，在政治上的统治主要是通过“个人联合”实现对国家机器的控制。金融寡头还通过建立政策咨询机构来左右和影响内政外交与社会生活。因此本题正确答案是选项ABC。金融寡头通过新闻媒体、教科文体等组织对社会生活各方面进行广泛的思想渗透，力图从精神上控制全体国民。但是由于资本主义是建立在阶级对立基础上的社会，它不可能实现全体国民思想意识的一元化。所以选项D不正确。","kp":"","src":"中公考研·2011 答案解析"},"2011-19":{"ex":"生产相对过剩是资本主义经济危机的本质特征，及相对于劳动人民有支付能力的需求来说是过剩的；资本主义经济危机爆发的根本原因是资本主义的基本矛盾，其制度原因是生产资料的资本主义私有制，只要存在资本主义制度，经济危机就不可避免，政府的干预只能在一定条件下缓和经济危机。因此本题正确答案是选项AB。","kp":"","src":"中国考研网·2011 答案解析"},"2011-2":{"ex":"参考大纲解析的29页。此题的出题角度是唯物史观中的社会存在考点，即社会存在是社会生活的物质方面，包括生产方式，地理环境和人口因素三个组成部分，其中，生产方式是决定因素，最能集中体现人类社会的物质性，所以正确答案是选项D。","kp":"","src":"中国考研网·2011 答案解析"},"2011-20":{"ex":"马克思创立的唯物史观和剩余价值学说，揭示了人类历史发展的规律和资本主义剥削的秘密，论证了无产阶级的历史使命，从而超越了空想社会主义，创立了科学社会主义。社会主义从理论到实践是通过无产阶级革命实现的。因此本题的正确答案是选项CD。","kp":"","src":"中国考研网·2011 答案解析"},"2011-21":{"ex":"毛泽东思想和中国特色社会主义理论体系都是在马克思主义中国化的过程中产生的两大理论成果，其共同点与马克思主义理论的基本特性及其面对的基本任务有关，二者具有共同的理论基础和理论精髓，但是二者面对的根本任务不同，前者是取得民主革命的胜利，后者是取得我国社会主义建设的伟大成就，所以选AC，排除B。但是由于我国的实际状况不同，两大理论所处的时代背景不同，毛泽东思想形成的时代背景是战争与革命，中国特色社会主义理论体系形成的时代背景是和平与发展，故也排除D。","kp":"","src":"中公考研·2011 答案解析"},"2011-22":{"ex":"社会主义市场经济体制是社会主义基本制度与市场经济的结合。由这一结合而形成的市场经济体制，一方面具有市场经济的一般特征，另一方面，它又必然体现社会主义的制度特征。主要表现在以下几个方面：第一，在所有制结构上，以公有制为主体、多种所有制经济共同发展，一切符合“三个有利于”标准的所有制形式都可以而且应该用来为社会主义服务。第二，在分配制度上，以按劳分配为主体、多种分配方式并存。第三，在宏观调控上，以实现最广大劳动人民利益为出发点和归宿，把人民的当前利益与长远利益、局部利益与整体利益结合起来，使市场在社会主义国家宏观调控下对资源配置起基础性作用，更好地发挥计划和市场两种手段的长处。故ABC选项为本题正确答案。选项D是社会主义市场经济体制与资本主义市场经济体制的共同点，应排除。","kp":"","src":"中国考研网·2011 答案解析"},"2011-23":{"ex":"根据材料中的毛泽东的一句话中的核心词的落脚点“……这是我们的事业必定要胜利的基本保证”可知，他的民族团结理论在当前条件下的现实意义体现在多个方面，其意义不但体现在政治稳定、社会和谐等方面，也对维护国家统一和边疆巩固有积极的意义，它也是实现中华民族伟大复兴的必然要求，因此，维护民族的团结和统一是我们党在建设中国特色社会主义的过程中必须认真解决的一个重大问题，所以ABCD正确。","kp":"","src":"中公考研·2011 答案解析"},"2011-24":{"ex":"中国目前正处于全面建设小康社会的历史阶段，这是发展的关键时期，也是改革的攻坚阶段。在这一时期处理改革、发展、稳定关系的任务极其艰巨。因此，要以科学发展观为指导，遵循改革开放以来党在处理改革、发展、稳定关系方面积累起来的经验和主要原则。第一，保持改革、发展、稳定在动态中的相互协调和相互促进。第二，把改革的力度、发展的速度和社会可以承受的程度统一起来。第三，把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点。故ACD选项为本题正确答案。","kp":"","src":"中国考研网·2011 答案解析"},"2011-25":{"ex":"收入分配是经济社会发展的重大问题，关系人民群众切身利益，关系改革发展稳定的全局。解决好分配不公问题，让全体人民共享改革发展的成果，是维护社会公平正义、促进社会和谐稳定的重要任务，是发展中国特色社会主义的必然要求。分配公平是社会公平的重要内容，也是实现社会公平的重要体现。分配不公造成收入差距过大，是与实现共同富裕的目标相违背的。更加注重分配公平，是社会主义制度的本质要求，也是实现共同富裕的内在要求，是坚持发展为了人民、发展依靠人民、发展成果由人民共享的根本体现，同时也是解决当前收入分配领域突出问题的需要。故ABCD选项为本题正确答案。","kp":"","src":"中国考研网·2011 答案解析"},"2011-26":{"ex":"辛亥革命是我国近现代史上一次比较完全意义上的资产阶级民主革命，是因为它是由资产阶级政党同盟会领导的，有三民主主义为重要指导，从历史功绩来看，结束了君主专制主义制度，建立了资产阶级民主共和国。选项A不符合题意，故选BCD。","kp":"","src":"中国考研网·2011 答案解析"},"2011-27":{"ex":"二战期间，涉及到台湾问题的国际条约有1943年的《开罗宣言》和1945年的《波茨坦公告》，它们都明确规定将澎湖列岛归还给中国。选项AC不符合题意，故不选。所以正确答案为BD。","kp":"","src":"中国考研网·2011 答案解析"},"2011-28":{"ex":"主观主义的实质是理论脱离实际，它颠倒了认识和实践的关系，是实际工作中的唯心主义。在当时，它的主要表现形式是教条主义和经验主义，尤其教条主义是整风运动的重点。选项BD不符合本题的要求，故正确答案为AC。","kp":"","src":"中国考研网·2011 答案解析"},"2011-29":{"ex":"以毛泽东为主要代表的中国共产党人根据马克思列宁主义关于农业社会主义改造的基本原理，从我国农村实际出发，制定并实行了一整套适合中国特点的对农业进行社会主义改造的方针、政策、和办法，开辟了一条适合我国情况的农业社会主义改造道路。其经验有：第一，积极引导农民组织起来，走互助合作道路。第二，遵循自愿互利、典型示范和国家帮助的原则，以互助合作的优越性吸引农民走互助合作道路。第三，正确分析农村的阶级和阶层状况，制定正确的阶级政策。第四，坚持积极领导、稳步前进的方针，采取循序渐进的步骤。农业社会主义改造大体上经历了互助组、初级社和高级社三个发展阶段。选项A是干扰项，不是其历史经验的内容，应排除。故BCD选项为本题正确答案。","kp":"","src":"中国考研网·2011 答案解析"},"2011-3":{"ex":"在以货币为媒介交换的过程中，商品--货币--商品，商品生产者只有顺利实现商品到货币的跳跃，把商品换成可以和其他一切商品相交换的货币，商品生产者才能生存下去。即通过商品交换，使用价值才能转化为价值，具体劳动才能转化为抽象劳动，私人劳动才能转化为社会劳动。因此正确答案是选项D。","kp":"","src":"中国考研网·2011 答案解析"},"2011-30":{"ex":"刑法的基本原则，是指刑法特有的在刑法的立法、解释和适用过程中所必须普遍遵循的具有全局性、根本性的准则。刑法明文规定了三个基本原则 ：一是罪刑法定原则。即法无明文规定不为罪，法无明文规定不处罚。什么行为构成犯罪、构成什么罪及处何种刑罚，均须由法律明文规定。二是罪刑相当原则。是指犯罪社会危害性程度及应负刑事责任的大小，是决定刑罚轻重的主要依据，重罪重罚、轻罪轻罚、无罪不罚、罪刑相当、罚当其罪。三是适用刑法一律平等原则。是指对任何人犯罪，不论其社会地位、民族、种族、性别、职业、宗教信仰、财产状况如何，在适用刑法上一律平等，任何人都不得有任何超越法律的特权。所以选项ACD是正确的，选项B疑罪从无原则，是一种司法原则，但并不是刑法明文规定的基本原则之一。因此，本题的正确答案是选项ACD。","kp":"","src":"中国考研网·2011 答案解析"},"2011-31":{"ex":"法律权威是就国家和社会管理过程中法律的地位和作用而言的，是指法的不可违抗性。法律权威的树立主要依靠法律的外在强制力和内在说服力。法律的外在强制力 是法律权威的外在条件，主要表现为国家对违法行为的制裁。尽管法律权威不可能完全建立在外在强制力的基础之上，但必要的外在强制力，是树立法律权威不可缺少的条件。法律的内在说服力是法律权威的内在基础。如果仅仅依赖外在强制力，法律不可能形成真正的权威。法律的内在说服力既来源于法律本身的内在合理性，如法律合乎情理、维护正义、促进效率、通俗易懂，也来源于法律实施过程的合理性，如执法公平、司法公正。正是由于法律本身及法律实施具有这些内在合理性，法律才受人尊重，被人信赖，为人遵守。所以选项AB是正确的，选项C的说法不正确，法律信仰是指社会公众对法律秩序所内含的伦理价值的信仰，即社会公众对法律忠诚的信仰。一个人只有从内心深处真正认同、信任和信仰法律，才会自觉维护法律的权威。而宗教信仰，是指信奉某种特定宗教的人们对所信仰的神圣对象，由此而产生的坚定不移的思想信念，因此两者有着本质的区别。选项D的说法不正确，法律信仰是人们对法律的一种认同，但并不能成为法律制定和执行的根本依据。因此本题的正确答案是选项AB。","kp":"","src":"中国考研网·2011 答案解析"},"2011-32":{"ex":"党的十七届五中全会强调，在当代中国，坚持发展是硬道理的本质要求，就是坚持科学发展，更加注重以人为本，更加注重全面协调可持续发展，更加注重统筹兼顾，更加注重保障和改善民生，促进社会公平正义。贯彻落实全会精神，要求我们必须落实好坚持科学发展的基本要求，把握好“四个更加注重”。因此本题的正确答案是选项ABCD。","kp":"","src":"中国考研网·2011 答案解析"},"2011-33":{"ex":"2010年4月13日，国家主席胡锦涛在美国首都华盛顿举行的核安全峰会上发表了题为《携手应对核安全挑战，共同促进和平与发展》的重要讲话。强调指出：第一，全面加强核安全能力。第二，严格履行核安全国际义务。 第三，重视并积极参与国际核安全合作。 第四，积极向发展中国家提供核安全援助。因此，本题答案为选项ABCD 三、分析题：34-38。","kp":"","src":"中国考研网·2011 答案解析"},"2011-4":{"ex":"参考大纲解析的59页。列宁新经济政策表明列宁的社会主义建设思想发生了重大转变，对在俄国这样一个小农占优势的国家走向社会主义的道路又有了新的认识，标志着列宁找到了一条符合俄国情况的建设社会主义的道路。因此本题正确答案是选项B。","kp":"","src":"中国考研网·2011 答案解析"},"2011-5":{"ex":"农村根据地在中国长期存在和发展具有多方面的原因和条件，表现在：第一，近代中国是一个政治、经济、文化发展极不平衡的半殖民地半封建的大国。这是农村革命根据地能够在中国存在和发展的根本原因。因此A选项符合题意。第二，红色政权首先发生和能够长期存在的地方，往往是在那些受过大革命影响、曾经有过高涨的革命群众运动的地方，为农村革命根据地的建立奠定了较好的群众基础。第三，全国革命形势的继续向前发展，是中国红色政权能够存在和发展的又一重要客观条件。因此 B选项不符合题意。第四，相当力量正式红军的存在，党的领导及其正确的政策，是红色政权能够存在和发展的关键性的主观条件。因此CD选项不符合题意。本题的正确答案是A选项。","kp":"","src":"中国考研网·2011 答案解析"},"2011-6":{"ex":"以公有制为主体、多种所有制经济共同发展，是我国社会主义初级阶段的基本经济制度。确定社会主义初级阶段的基本经济制度的客观依据之一，就是一切符合“三个有利于”的所有制形式都可以而且应该用来为社会主义服务。之所以将非公有制经济纳入社会主义初级阶段的基本经济制度中，是因为非公有制经济是为社会主义服务的经济成分。其作用主要表现在：第一，非公有制经济的发展在发展社会生产力中具有不可替代的地位和作用。对于充分调动社会各方面的积极性,促进经济增长、扩大就业、活跃市场和满足人们多样化的需要等方面具有重要作用。第二，非公有制经济的发展是我国社会主义市场经济的重要组成部分，在加强社会主义市场经济体制建设方面有着不可替代的作用。 非公有制经济不是社会主义性质的经济成分，是社会主义市场经济的重要组成部分，故A、B的观点是错误的。非公有制经济在社会主义初级阶段不占主体地位不是将非公有制经济纳入社会主义初级阶段基本经济制度的理由。所以D不符合题意。故本题的正确答案是C。","kp":"","src":"中公考研·2011 答案解析"},"2011-7":{"ex":"党的十六大以来，以胡锦涛为总书记的党中央作出“社会和谐是中国特色社会主义的本质属性”的重大判断，深化了对社会主义本质的认识。它使我们学社会主义的认识提到一个新的高度，帮助我们自觉地把这一本质属性的要求贯穿于中国特色社会主义经济、政治、文化、社会整体布局和奋斗目标的各个方面，更加清醒、更加努力地为推进社会主义和谐社会建设不懈奋斗。因此A选项符合题意。BCD选项都是从某一个角度说明和谐的重要性，都不全面。","kp":"","src":"中国考研网·2011 答案解析"},"2011-8":{"ex":"深化文化体制改革，要坚持一手抓公益性文化事业，一手抓经营性文化产业。经营性文化产业的根本任务是繁荣文化市场，满足人民群众多方面、多层次、多样性的精神文化需求。发展经营性文化产业，要充分发挥市场配置资源的基础性作用，要大力发展文化产业，实施重大文化产业项目带动战略，加快文化产业基地和区域性特色文化产业群建设，培育文化产业骨干企业和战略投资者，繁荣文化市场，增强国际竞争力。运用高新技术创新文化生产方式，培育新的文化业态，加快构建传输快捷、覆盖广泛的文化传播体系。坚持以市场为导向，在改革中贯彻“创新主体、转换机制、面向市场、壮大实力”的方针，调动社会力量，在市场竞争中发展壮大文化产业。因此A选项符合题意。","kp":"","src":"中国考研网·2011 答案解析"},"2011-9":{"ex":"从1840年至1919年的80年间，中国人民对外来侵略进行了英勇顽强的反抗。但历史的反侵略战争，都是以中国失败、中国政府被迫签订丧权辱国的条约而告结束的。从中国内部因素来分析，其根本原因是社会制度的腐败。因此B项正确。经济技术落后是另一重要原因，因此C项排除。军事战略错误、思想观念保守都不是反侵略失败的根本原因，因此不选。","kp":"","src":"中国考研网·2011 答案解析"},"2012-1":{"ex":"人与动物的区别之一，从马哲角度上讲，人有思维，有意识，能对客观世界反映，发挥主观能动性，所以，本题正确答案是选项A。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-10":{"ex":"中国革命如何发展是由中国半殖民地半封建社会的性质和主要特征决定的。 毛泽东把新民主主义革命和社会主义革命比喻为上篇和下篇的关系。坚持地领导民主革命，是争取社会主义胜利的条件。“民主革命是社会主义革命的必要准备，社会主义革命是民主革命的必然趋势”。只有认清民主革命和社会主义革命的区别，同时又认清两者的联系，才能正确地领导中国革命。这两个革命阶段能够有机连接的原因是民主革命中包含了社会主义因素。 不选ABD的理由是：选项A, 资产阶级领导的旧的民主革命是要建立资产阶级共和国，但是，实践证明资本主义道路在中国走不同。选项B，俄国十月革命为中国送来了马克思主义，为中国革命提供了科学的指导思想。选项D，正确的提法是，中国的国情决定中国共产党领导的中国革命必须分两步走。中国的国情和社会的主要矛盾，也决定了中国革命一定是进行反帝、反封建的资产阶级性质的革命。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-11":{"ex":"本题考查加强道德修养的方法。“不积跬步，无以至千里;不积小流，无以成江海。”出自荀子的《劝学》，意在奉劝世人积少成多，聚沙为塔。道德的养成也是如此，要注重在实践中积累和贯彻，从一点一滴中不断养成，体现了积善成德的方法。因此本题的正确答案是选项B。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-12":{"ex":"中国特色社会主义法律体系由宪法相关法、民法商法、行政法、经济法、社会法、刑法、诉讼与非诉讼程序法七个法律部门构成。民法商法是其中一个独立法律部门，故 D 正确。A 知识产权法、B 商法、C 公司法都属于民法商法这一部门内部的单行法律或分支，层次低于法律部门，不能与七大部门并列。区分标准是：法律部门按调整的社会关系类型划分，单行法只是部门内的构成单位。","kp":"中国特色社会主义法律体系的部门划分","src":"精编（七大法律部门划分）"},"2012-13":{"ex":"本题人生观中的人生目的。人生观主要是通过人生目的、人生态度和人生价值三个方面体现出来的。人生目的，回答人为什么活着;人生态度，表明人应当怎样对待生活;人生价值，判别什么样的人生才有意义。这三个方面相辅相成，其中人生目的是人生观的核心，有什么样的人生目的就会有什么样的人生态度，就会追求什么样的人生价值。所以本题的正确答案是选项A。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-14":{"ex":"本题考查社会主义道德建设的核心。道德建设的核心，即道德建设的灵魂，它决定并体现着社会道德建设的根本性质和发展方向，规定并制约着道德领域中的种种道德现象。道德建设核心的问题，实质上是“为什么人服务”的问题。所以，本题的正确答案是选项C。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-15":{"ex":"天宫一号和神州八号对接任务圆满成功，为我国今后建造载人空间站奠定基础，正确选项是第四个选项。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-16":{"ex":"国际货币基金组织中，欧美的主导权仍未改变，发展中国家和新兴国家的话语权有待提升。正确答案是选项C。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-17":{"ex":"此题的原因是新生事物具有新的结构和功能，能适应已经变化了的环境和条件、新生事物是对旧事物的扬弃，并添加了旧事物所不能容纳的新内容、在社会历史领域内，新生事物符合广大人民群众的根本利益和要求。新事物并不是新出现的事物。因此，答案是BCD。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-18":{"ex":"此题中题干所指歪曲表现在把社会历史发展多重因素的综合作用歪曲为单一因素决定论、把上层建筑与经济基础的相互作用歪曲为机械的单向作用、把经济作为社会的“基础”所具有的归根到底的决定作用歪曲为唯一决定作用，意识形态的作用并没有涉及，因此，正确答案是ABC。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-19":{"ex":"此题考查价值问题。 商品是用来交换的能满足人们某种需要的劳动产品，具有使用价值和价值两个因素，是使用价值和价值的矛盾统一体。使用价值是指商品能满足人们某种需要的属性，即商品的有用性，反映人与自然之间的物质关系，是商品的自然属性，是一切劳动产品共有的届性。使用价值构成社会财富的物质内容。使用价值是交换价值的物质承担者。交换价值首先表现为一种使用价值同另一种使用价值交换的量的关系或比例。决定商品交换比例的，不是商品的使用价值，而是价值。价值是凝结在商品中的无差别的一般人类劳动，即人类脑力和体力的耗费。价值是商品特有的社会属性。使用价值不同的商品之所以能按一定比例相交换，就是因为它们都有价值。商品价值在质的规定性上是相同的，因而彼此可以比较。商品的价值实体是凝结在商品中的无差别的人类劳动，它本质上体现生产者之间的一定社会关系。价值是交换价值的基础，交换价值是价值的表现形式。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-2":{"ex":"本题考查的知识点是量变质变规律，量变积累到一定程度必然发生质变，度是事物保持其质的量的界限，所以，本题正确答案是选项B。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-20":{"ex":"此题考查对马克思，恩格斯资本主义的剖析。首先，资本主义基本矛盾“包含着现代的一切冲突的萌芽”。资本主义基本矛盾表现在阶级关系上是无产阶级和资产阶级的对立;表现在生产上是个别企业中生产的有组织性和整个社会生产的无政府状态之间的对立。其次，资本积累推动资本主义基本矛盾不断激化并最终否定资本主义自身。资本的不断积累为否定资本主义制度自身准备了物质条件。再次，国家垄断资本主义是资本社会化的更高形式，将成为社会主义的前奏。国家垄断资本主义阶段的生产社会化、资本社会化和管理社会化都达到很高的程度，从而为全社会共同占有生产资料和共同组织社会化生产准备了充分的物质条件和经济条件。最后，资本主义社会存在着资产阶级和无产阶级两大阶级。随着资本主义经济的巨大发展，资产阶级由生产力的解放者变成阻碍者。无产阶级是现代大工业的产物，是真正革命的阶级，随着生产社会他水平的不断提高和无产阶级队伍的不断壮大，无产阶级必将彻底推翻资本主义和资产阶级的统治，逐步建立消灭一切阶级、确保人人得以自由发展的联合体。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-21":{"ex":"此题考查新民主主义革命的动力，中国共产党带领中国人民取得了反帝反封的任务，依靠阶级是工人阶级，农民阶级;民族资产阶级;城市小资产阶级。四个都入选。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-22":{"ex":"此题考查加快转变经济发展模式主要的途径和手段是如下四个，四个选项都应入选。 当前和今后一个时期，要按照“两个坚持”和“三个转变”的要求转变经济发展方式。“两个坚持”就是要坚持走中国特色新型工业化道路，坚持扩大国内需求特别是消费需求的方针。“三个转变”就是促进经济增长由主要依靠投资、出口拉动向依靠消费、投资、出口协调拉动转变，由主要依靠第二产业带动向依靠第一、第二、第三产业协同带动转变，由主要依靠增加物质资源消耗向主要依靠科技进步、劳动者素质提高、管理创新转变。此外还十二五计划包括一条主线五个要求。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-23":{"ex":"基层民主是群众在城乡基层政权机关、企事业单位和基层自治组织中依法直接行使民主权利。A 正确，基层民主实践能提高全民民主素养，为进一步发展民主创造条件；B 正确，基层民主是发展社会主义民主的基础性工程；D 正确，它为群众管理基层公共事务和公益事业创造了条件。C 错误，基层民主的着力点是管理基层公共事务和公益事业，而不是“直接参与国家事务的管理”，国家事务主要通过人民代表大会制度间接行使，这一表述混淆了基层民主与国家层面民主的界限。故答案为 ABD。","kp":"发展基层民主的意义","src":"精编（基层民主的性质与边界）"},"2012-24":{"ex":"本题考查文化的作用。在当代中国，发展社会主义先进文化，建设和谐文化，就是建设中国特色社会主义文化。中国特色社会主义文化，就其主要内容来说，同改革开放以来我们一贯倡导的社会主义精神文明是一致的。要实现我国社会主义现代化建设和中华民族伟大复兴的宏伟目标，必须牢牢把握社会主义先进文化的前进方向，努力建设中国特色社会主义文化。第一，中国特色社会主义文化是现代化建设的重要内容。第二，文化已经成为国家核心竞争力的重要因素。谁占据了文化发展的制高点，谁就能够更好地在激烈的国际竞争中掌握主动权。第三，中国特色社会主义文化为现代化建设提供智力支持、精神动力和思想保证。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-25":{"ex":"此题考查和谐社会部分社会管理。社会稳定是人民群众的共同心愿，是改革发展的重要前提。必须把完善社会管理作为改善民生和促进社会和谐的重要任务。第一，推进社会管理体制改革创新。要健全党委领导、政府负责、社会协同、公众参与的社会管理格局，健全基层社会管理体制。第二，妥善处理人民内部矛盾。要完善信访制度，健全党和政府主导的维护群众权益机制，统筹协调各方面利益关系，有效预防和化解各类社会矛盾。第三，重视社会组织建设和管理。社会组织具有提供服务、反映诉求、规范行为的积极作用，把它们的作用利用好、保护好、发挥好，有利于降低政府社会管理成本，有利于增强公民的社会认同感。要支持各类社会组织承担社会事务、参与社会管理和服务。第四，要完善突发事件应急管理机制，提高保障公共安全和处置突发事件的能力;全面加强综合减灾能力建设，提高防范和应对自然灾害能力。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-26":{"ex":"本题中，法和美相继逼迫清政府签订的不平等条约有《望厦条约》、《黄埔条约》。因此，正确答案是BC。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-27":{"ex":"本题考查洋务派举办的洋务事业主要有：兴办近代工业、训练新军，需要懂得西方先进技术的专业人才。为此，洋务派创办了新式学堂。从19世纪60年代到90年代的30多年间，创办新式学堂30多所。主要有三种：一为翻译学堂，如京师同文馆，主要培养翻译人才;一为工艺学堂，培养电报、铁路、矿务、西医等专门人才;一为军事学堂，如船政学堂等，培养新式海军人才。在创办新式学堂的同时，还先后派遣赴美幼童及官费赴欧留学生200多人。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-28":{"ex":"一般说来，游击战争是个战术问题。但是，在抗日战争中，游击战争具有战略地位，是因为它，主要是在外线单独作战，而不是在内线配合正规军作战，是大规模的防御战。因此，本题正确答案是 选项AC。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-29":{"ex":"此题考查社会主义基本矛盾。我国社会主义改造完成以后，毛泽东以中国的实践经验为基础，运用马克思主义基本原理，全面阐述了社会主义社会的矛盾问题，并形成了比较系统的理论。第一，指出社会主义社会仍然存在着矛盾，正是这些矛盾推动着社会主义社会向前发展。社会主义社会的基本矛盾仍然是生产关系和生产力之间的矛盾、上层建筑和经济基础之间的矛盾，是推动社会主义社会不断前进的根本动力。第二，阐明了社会主义社会基本矛盾的性质和特点。不是对抗性而是非对抗性的矛盾。第三，提出了通过社会主义制度本身解决社会基本矛盾的思想。它可以依靠社会主义自身的力量，通过对生产关系和生产力、上层建筑和经济基础不相适应的方面进行调整得到解决。第四，我国存在着两种不同性质的矛盾，即敌我矛盾和人民内部矛盾，正确处理人民内部矛盾是国家政治生活的主题。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-3":{"ex":"这是一道识记性考点，资本主义社会工人的工资就是劳动力的价格，劳动力已经成为一种特殊的商品，其使用价值是劳动，价值是工资。所以，本题的正确选项是选项B。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-30":{"ex":"社会主义法治理念反映和指引着社会主义法治的性质、功能、目标方向、价值取向和实现途径，是社会主义法治的精髓和灵魂。其基本内涵包括依法治国、执法为民和公平正义、服务大局以及党的领导。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-31":{"ex":"爱国主义体现了：道德要求、继承了优良传统、体现了爱国主义与爱社会主义、体现了爱国主义与拥护祖国统一。本题答案全选。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-32":{"ex":"胡锦涛总书记《在庆祝中国共产党成立90周年大会上的讲话》中指出，经过90年的奋斗、创造、积累，党和人民必须倍加珍惜、长期坚持、不断发展的成就是开辟了中国特色社会主义道理、形成了中国特色社会主义理论体系、确立了中国特色社会主义制度。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-33":{"ex":"2011年11月28日—12月1日，《联合国气候变化框架公约》缔约方会议在南非德班举行。尽管对部分焦点议题分歧严重，但在各方共同努力下，大会取得了一些重要成果，包括成立“德班增强行动平台特设工作组”、继续《京都议定书》第二承诺期、正式启动“绿色气候基金”","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-4":{"ex":"资本主义制度下，资本积累的必然结果就是两极分化，剥削程度加深，人民生活水平降低，相对人口过剩。因此，本题的正确选项是选项C。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-5":{"ex":"毛泽东同志完成了马克思主义中国化的第一次飞跃，即马克思主义与中国具体实际结合，下马看花体现了必须具体问题具体分析，寻找其本质和规律，因此，本题的正确答案是选项D。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-6":{"ex":"本题考查公有制的实现形式，巩固和发展公有制经济，还要努力寻找能够极大促进生产力发展的公有制实现形式。公有制经济的性质和实现形式是两个不同层次的问题。公有制经济的性质体现在所有权的归属上，坚持公有制的性质，根本的是坚持国家和集体对生产资料的所有权。所有制作为生产关系的基础，有公有制与私有制、社会主义与资本主义的区别。而所有制的实现形式是采取怎样的经营方式和组级形式问题，它不具有“公”与“私”、“社”与“资”的区分。同样的所有制可以采取不同的实现形式，而不同的所有制可以采取相同的实现形式。因为实现形式要解决的是发展生产力的组织形式和经营方式问题，只要能够有利于生产力的发展，公有制的实现形式可以而且应当多样化，一切反映社会化生产规律的经营方式和组织形式都可以大胆利用。要根据社会化生产规律的要求，采取多样化的经营方式和资产组织形式，使国有经济在更大的范围里获得广阔的发展空间。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-7":{"ex":"本题考查党的十七大报告明确提出了完善人民代表大会制度的具体措施。其中的第三条表示：保障人大代表依法行使职权，密切人大代表同人民的联系，建议逐步实行城乡按相同人口比例选举人大代表，跟以前的选举相比，相同比例选举更加体现出平等的观念。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-8":{"ex":"此题考查民主区域自治制度的历史依据。实行民族区域自治，是党棍据我国的历史发展、文化特点、民族关系和民族分布等具体情况作出的制度安排，符合各民族人民的共同利益和发展要求。统一的多民族国家的长期存在和发展，是我国实行民族区域自治的历史依据。中国在历史上长期就是一个集中统一的国家，各民族之间虽有战有和，有统有分，但在漫长的历史进程中，认同自己是中国大家庭中的一员，始终是民族关系的主流。","kp":"","src":"中国教育在线·2012 真题及解析"},"2012-9":{"ex":"本题考查帝国主义列强未能实现瓜分中国的图谋的原因。帝国主义侵略中国的最终目的，是要瓜分中国、灭亡中国。帝国主义列强之所以没有能够实现瓜分中国的图谋，它们之间的矛盾和互相制约，是一个重要的原因。而帝国主义列强不能灭亡和瓜分中国，其根本原因在于中华民族进行的不屈不挠的反侵略斗争。所以，本题的正确答案是选项D。","kp":"","src":"中国教育在线·2012 真题及解析"},"2013-1":{"ex":"本题考点：运动和静止的联系。 运动和静止是相互统一的关系。第一，运动和静止互为前提，相互依赖。相对静止离不开绝对运动，是一定范围内的绝对运动的结果;绝对运动通过相对静止表现出来，并且通过相对静止找到它的量度。离开相对静止来谈运动，运动也就无从获得自己的规定和衡量自己的尺度。任何事物相对静止的状况都是它过去的运动所造成的，并且是它将来运动的出发点。因为物质的多样性和事物的某种状态只有在相对静止中才体现出来，只有了解了事物的相对静止的状况，才能清楚地了解它过去的运动，预测它将来可能发生的变化，才能区别千差万别的具体事物，并对其进行研究。。第二，运动和静止相互渗透、相互包含。在绝对运动中有相对静止，在相对静止中又有绝对运动。任何事物都是绝对运动和相对静止的辩证统一。","kp":"运动和静止的联系","src":"中国教育在线·2013 真题及解析"},"2013-10":{"ex":"本题考点：中国共产党的群众路线。 将中国共产党比喻成巨人，将群众比喻成大地。中国共产党的群众路线是相信群众、依靠群众，从群众中来，到群众中去，因此D选项正确。","kp":"中国共产党的群众路线","src":"中国教育在线·2013 真题及解析"},"2013-11":{"ex":"本题考点：诚实守信的重要性。 我国公民道德基本规范的内容有爱国守法、明礼诚信、团结友善、勤俭自强和敬业奉献。其中，诚实守信既是我国公民道德规范，也是我国民法基本原则之一。所以本题答案选B。","kp":"诚实守信的重要性","src":"中国教育在线·2013 真题及解析"},"2013-12":{"ex":"本题考点：时代精神的内容。 时代精神是的内容有解放思想、实事求是。与时俱进、勇于创新，知难而进、一往无前，艰苦奋斗、务实求效，淡泊名利、无私奉献，其中改革创新是时代精神的核心。所以本题答案选C。","kp":"时代精神的内容","src":"中国教育在线·2013 真题及解析"},"2013-13":{"ex":"考点：人生的自我价值和社会价值的关系。 人是社会的人，不仅意味着个体物质和精神的需要必须在社会中才能得到满足，还意味着以怎样的方式和在多大程度上得到满足也是由社会决定的。一个人的需要能不能从社会中得到满足，在多大程度上得到满足，取决于他的人生活动对社会和他人的贡献，即他的社会价值。所以本题答案选B。","kp":"","src":"中国教育在线·2013 真题及解析"},"2013-14":{"ex":"本题考点：我国的调节制度。 我国的调解制度主要包括人民调解、行政调解、司法调解。人民调解是诉讼外调解，是在人民调解委员会主持下，当事人协商解决民间纠纷的活动。行政调解是国家行政机关依照法律规定，在其行政管理职权范围内，对特定的民事纠纷及轻微刑事案件进行的调解。也属于诉讼外调解。司法调解是诉讼中调解，是指人民法院依照严格的诉讼程序，采取调解的方式促使双方当事人达成和解，解决民事权益争议的一种诉讼活动。所以本题答案选C。","kp":"我国的调节制度","src":"中国教育在线·2013 真题及解析"},"2013-15":{"ex":"中国在南海问题上的一贯主张是“搁置争议、共同开发”，即在坚持主权属我的前提下，通过双边协商和平解决争端、与相关国家共同开发资源，故 C 正确。A“使南海问题长期化”是把暂时搁置曲解为永久搁置，不符合我方立场；B“推动南海问题国际化”恰是中国明确反对的做法，中国主张由直接当事国通过双边谈判解决；D“南海和平自由友谊合作区”并非我国主张，属编造表述。本题的关键是分清“搁置争议、共同开发”与“国际化、多边化”的对立。","kp":"中国在南海问题上的一贯主张","src":"精编（南海问题官方立场）"},"2013-16":{"ex":"时政问题。 上一篇： 历年考研政治真题下载：2013年考研政治真题 下一篇： 历年考研政治真题下载：2014年考研政治真题 相关阅读 2020考研政治马原真题复习：人类社会发展 2020考研政治马原真题复习：人民群众是历 2020考研政治马原真题复习：个人在社会历 考研政治复习做历年真题有好处吗? 2020考研政治马原真题复习：劳动力成为商 2020考研政治马原真题复习：不变资本和可 2020考研政治马原真题复习：劳动价值论 2020考研政治马原真题复习：剩余价值理论 2020考研政治马原真题复习：资本积累和周 2020考研政治马原真题复习：利润平均化与 推荐文章 2019考研政治真题及答案解析(史纲选择题 考研政治马原第三章第二节历年真题与答 2017考研政治单项选择真题下载 2018考研政治多项选择真题下载 热门文章 2014考研政治真题试卷评析 2014考研政治真题试卷评析 2014考研政治真题·单选题答案解析 2014考研政治真题·单选题答案解析 2014年考研政治真题之基本经济制度 2014年考研政治真题之基本经济制度 2014年考研政治真题(完整版) 2014年考研政治真题(完整版) 科都及时发布2014考研政治真题答案·分析 科都及时发布2014考研政治真题答案·分析 网站首页 | 招生简章 | 考研调剂 | 报录比 | 分数线 | 网站地图 咨询电话:13715250428 13534233672 客服QQ：3418428939 3474229839 考研QQ交流群：477407858 325588761 Email: 3479561617@qq.com 地址：深圳市南山区深圳大学北门海王银河科技大厦10楼 (地铁深大站A3出口) (。","kp":"","src":"文都·2013 答案解析"},"2013-17":{"ex":"本题考点：人类解放的体现 马克思主义是关于无产阶级和人类解放的科学，实现共产主义是全人类解放的根本体现。大纲解析并未对这一考点进行展开性的阐述，但是B选项肯定是错误的，没有人能够摆脱客观规律的制约，ACD都是人类解放的体现。","kp":"人类解放的体现 马克思主义是关于无产阶级和人类解放的科学，实现共产主义是全人类解","src":"中国教育在线·2013 真题及解析"},"2013-18":{"ex":"本题考点：群众史观，人民群众是历史的创造者。 人民群众是一个历史范畴。人民群众从质上说是指一切对社会历史发展起推动作用的人们，从量上说指社会人口的绝大多数。在不同的时代，人民群众有着不同的内容，包含着不同的阶级、阶层和集团。人民群众的最稳定的主体部分始终是从事物质资料生产的劳动群众及其知识分子，ABD为正确答案，C为错误选项。","kp":"群众史观，人民群众是历史的创造者","src":"中国教育在线·2013 真题及解析"},"2013-19":{"ex":"本题考点：资本。 资本是可以带来剩余价值的价值。人格化的资本是资本家，A错误;人的天然本性不是赚钱，B错误。资本只有不断运动和增殖才能带来剩余价值、进行资本积累，C正确;生产剩余价值是资本主义生产方式的绝对规律，D正确。CD为正确答案。","kp":"资本","src":"中国教育在线·2013 真题及解析"},"2013-2":{"ex":"本题考点：联系的多样性。 该题是考查唯物辩证法的联系观。“羊吃草”与“割羊草”之间的关系不是因果联系，因为“羊吃草”不必然引起“割羊草”，BC错误;A选项表述错误，联系是客观的;看羊吃什么就割什么，这体现的就是本质联系，D为正确答案。","kp":"联系的多样性","src":"中国教育在线·2013 真题及解析"},"2013-20":{"ex":"本题考点：当代资本主义新变化之劳资关系分配关系。 资本家及其代理人为缓和劳资关系所采取的激励制度有：职工参与决策、终身雇佣、职工持股，ABD为正确答案，C错误。","kp":"当代资本主义新变化之劳资关系分配关系","src":"中国教育在线·2013 真题及解析"},"2013-21":{"ex":"本题考点：社会主义发展道路的多样性，社会主义发展的前进性和曲折性 社会主义发展过程中，由于各国国情的特殊性，以及历史和现实的、国内和国际的各种因素相互作用，社会主义的发展道路必然呈现出多样性的特点。实践证明，坚持社会主义，不等于坚持某种单一的社会主义模式;改革或抛弃某种社会主义模式，不等于改掉或抛弃社会主义;某种社会主义模式的失败，整个社会主义是夜店的失败。发展社会主义，不等于不认可西方资本主义的文明成果，ABCD为正确答案。","kp":"社会主义发展道路的多样性，社会主义发展的前进性和曲折性 社会主义发展过程中，由于","src":"中国教育在线·2013 真题及解析"},"2013-22":{"ex":"本题考点：十八大关于科学发展观的论述 科学发展观是马克思主义同当代中国实际和时代特征相结合的产物，是马克思主义关于发展的世界观和方法论的集中体现，对新形势下实现什么样的发展、怎样发展等重大问题作出了新的科学回答，把我们对中国特色社会主义规律的认识提高到新的水平，开辟了当代中国马克思主义发展新境界。科学发展观是中国特色社会主义理论体系最新成果，是中国共产党集体智慧的结晶，是指导党和国家全部工作的强大思想武器。但是，科学发展观并不涉及革命理论。因此本题正确答案选择BCD。","kp":"十八大关于科学发展观的论述 科学发展观是马克思主义同当代中国实际和时代特征相结合","src":"中国教育在线·2013 真题及解析"},"2013-23":{"ex":"本题考点：全面贯彻党的民族政策和宗教政策 正确认识我国社会存在的宗教问题，关键是要立足于我国的基本国情。要贯彻党的宗教信仰自由的政策，依法管理宗教事务，坚持独立自主自办的原则，积极引导宗教与社会主义社会相适应。我国坚持独立自主自办教会原则。","kp":"全面贯彻党的民族政策和宗教政策 正确认识我国社会存在的宗教问题，关键是要立足于我","src":"中国教育在线·2013 真题及解析"},"2013-24":{"ex":"本题考点：统筹区域发展。 统筹区域发展，促进区域协调发展，是我国经济社会发展的一个重点原则，关系到现代化建设的全局，也关系到社会稳定和国家的长治久安。有利于扩大内需，拉动经济增长，有利于区域间优势互补，促进经济共同发展，有利于不同区域人民共享改革发展成果，有利于生产要素在区域间合理流动和配置，逐步缩小发展差距。","kp":"统筹区域发展","src":"中国教育在线·2013 真题及解析"},"2013-25":{"ex":"本题考点：社会主义本质。 1992年初，邓小平在南方谈话中指出：“社会主义的本质是 ，解放生产，发展生产力。消除剥削，消除两极分化，最终达到共同富裕。”这一概括一方面强调必须集中力量解放和发展生产力，另一方面指出解放和发展生产力的手段和目的。邓小平坚持公有制占主体，共同富裕，是社会主义的根本原则。他提出的社会主义本质理论突出强调消灭剥削、消除两极分化，最终达到共同富裕这一社会主义发展的目标，破除了脱离生产力水平抽象谈论社会主义的认识，并从生产力和生产关系两个方面阐明了实现这个目标的途径。","kp":"社会主义本质","src":"中国教育在线·2013 真题及解析"},"2013-26":{"ex":"本题考点：十八大报告关于“大力推进生态文明建设” 十八大报告指出：建设生态文明，是关系人民福祉、关乎民族未来的长远大计。面对资源约束趋紧、环境污染严重、生态系统退化的严峻形势，必须树立尊重自然、顺应自然、保护自然的生态文明理念，把生态文明建设放在突出地位，融入经济建设、政治建设、文化建设、社会建设各方面和全过程，努力建设美丽中国，实现中华民族永续发展。大力推进生态文明建设，(一)优化国土空间开发格局。(二)全面促进资源节约。(三)加大自然生态系统和环境保护力度。(四)加强生态文明制度建设。","kp":"十八大报告关于“大力推进生态文明建设” 十八大报告指出：建设生态文明，是关系人民","src":"中国教育在线·2013 真题及解析"},"2013-27":{"ex":"本题考点：国民大革命与辛亥革命的区别。 辛亥革命没有提出彻底的反帝反封建的革命纲领，不能充分发动和依靠人民群众。国民大革命因为国共合作，广泛的发动了工农群众，沉重打击了帝国主义在华势力，基本推翻了北洋军阀统治，广泛动员了工农大众，提高了共产党在全国人民中的威望。辛亥革命和国民大革命都发动了武装斗争，B选项是相同点，ACD选项正确。","kp":"国民大革命与辛亥革命的区别","src":"中国教育在线·2013 真题及解析"},"2013-28":{"ex":"本题考点：以王明为代表的“左”倾教条主义的主要错误。 其主要错误是：在革命性质和统一战线问题上，混淆民主革命与社会主义革命的界限，将反帝反封建与反资产阶级并列，一味排斥和打击中间势力;在革命道路上，坚持以城市为中心，要求积极攻打中心城市;在土地革命问题上，提出坚决打击富农的主张。在抗日战争时期，王明转入右倾投降主义，主张“一切经过统一战线”、“一切服从统一战线”。所以，ABC选项正确。","kp":"以王明为代表的“左”倾教条主义的主要错误","src":"中国教育在线·2013 真题及解析"},"2013-29":{"ex":"本题考点：抗日战争胜利的主要原因。 主要原因有：中国共产党在全民族抗战中起到了中流砥柱的作用;中国人民巨大的民族觉醒、空前的民族团结和英勇的民族抗争，是抗日战争胜利的决定性因素;抗日战争的胜利同世界所有爱好和平和正义的国家和人民、国际组织以及各种反法西斯力量的同情和支持也是分不开的。ACD选项正确。","kp":"抗日战争胜利的主要原因","src":"中国教育在线·2013 真题及解析"},"2013-3":{"ex":"本题考点：商品二因素。 该题是考查政治经济学中的商品二因素。使用价值是商品的自然属性，是一切劳动产品共有的属性，因此无论是裁缝自己穿(只作为劳动产品)还是顾客穿(作为商品)，上衣的使用价值对于二者都是一样的，A为正确答案。","kp":"商品二因素","src":"中国教育在线·2013 真题及解析"},"2013-30":{"ex":"本题考点：社会主义基本制度在中国全面确立的意义。 中共十六大指出：“新中国成立后，我们党创造性地完成由新民主主义到社会主义的国度，实现中国历史上最伟大最深刻的社会变革，开始了在社会主义道路上实现中华民族伟大复兴的历史征程。”中共十七大强调指出：“社会主义基本制度的建立，为当代中国一切发展进步奠定了根本政治前提和制度基础。”社会主义改造的基本完成，是生产关系由私有制到公有制的一场伟大变革，广大劳动人民真正成为国家的主人。所以，ABD选项正确。","kp":"社会主义基本制度在中国全面确立的意义","src":"中国教育在线·2013 真题及解析"},"2013-31":{"ex":"本题考点：道德修养。 材料给出的是积善成德方面的材料。选项A是非知之难 行之惟难 非行之难 终之斯难，本句话的意思是要做到知行统一，选项D见贤思齐焉 见不贤而内自省也是说学思并重的方法。只有BC符合题意。","kp":"道德修养","src":"中国教育在线·2013 真题及解析"},"2013-32":{"ex":"2012 年 6 月 24 日，神舟九号与天宫一号实现手控交会对接，同日蛟龙号载人潜水器下潜至 7020 米，两者分别代表我国在太空与深海领域的突破。B 正确，丰富了人类认识和开发宇宙的梦想与实践；C 正确，为我国在太空和海底参与国际合作提供了更多机会；D 正确，为太空和大洋这两个尚未充分利用空间的活动创造了新的可能性。A 错误，“完成了近地空间长期载人飞行”夸大了阶段成果（当时尚处交会对接与短期驻留阶段），“南海深部计划”更是与蛟龙号海试无关的拼接表述。故答案为 BCD。","kp":"神舟九号与蛟龙号深潜的里程碑意义","src":"精编（2012 年航天与深潜成就口径）"},"2013-33":{"ex":"2012 年 6 月 6 日至 7 日上合组织成员国元首理事会第十二次会议在北京举行，是该组织进入第二个十年的首次峰会。A 正确，峰会首次制定中长期发展战略规划，为该组织未来发展作出顶层设计；C 正确，峰会签署了人文领域的首份合作文件，把人文交流纳入机制化轨道；D 正确，峰会接纳阿富汗为观察员国、土耳其为对话伙伴，扩大了组织的合作面。B 错误，上合组织奉行不结盟、不针对第三方的原则，其性质不是军事同盟，不可能签订军事同盟条约。故答案为 ACD。","kp":"上海合作组织北京峰会成果","src":"精编（上合北京峰会成果与组织性质）"},"2013-4":{"ex":"本题是考查政治经济学中的剩余价值率。剩余价值率m′=m/v，利润与剩余价值在量上是一样的，都是15万元，资本有机构成为c：v=4：1，全部预付资本c+v为100万元，所以可变资本v为20万元，因此剩余价值率m′=15/20=75%，B为正确答案。","kp":"","src":"文都·2013 答案解析"},"2013-5":{"ex":"实行对外开放要处理好对外开放与独立自主、自力更生的关系。我们始终要把独立自主、自力更生作为立足点，这是我国革命、建设和改革开放的基本经验和重要原则。","kp":"对外开放与独立自主、自力更生的关系","src":"文都·2013 答案解析"},"2013-6":{"ex":"公益性文化事业是保障人民基本文化权益的主要途径，是政府主导的公共服务文化体系。公益性文化事业的根本任务是为人民群众提供基本的公共文化服务，满足人民基本文化需求是社会主义文化建设的根本任务。坚持把社会效益放在首位，社会效益和经济效益相统一。","kp":"","src":"文都·2013 答案解析"},"2013-7":{"ex":"注重社会公平防止两极分化实现社会公平正义是中国特色社会主义的内在要求，处理好效率和公平的关系是中国特色社会主义的重大课题。千方百计增加居民收入。实现发展成果由人民共享，必须深化收入分配制度改革，努力实现居民收入增长和经济发展同步、劳动报酬增长和劳动生产率提高同步，提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。初次分配和再分配都要兼顾效率和公平，再分配更加注重公平。","kp":"注重社会公平 防止两极分化 实现社会公平正义是中国特色社会主义的内在要求，处理好","src":"文都·2013 答案解析"},"2013-8":{"ex":"党的十八大报告“全面建成小康社会和全面深化改革开放的目标” 解析：党的十八大报告指出：为确保实现全面建成小康社会的宏伟目标，在发展平衡性、协调性、可持续性明显增强的基础上，到2020年，实现国内生产总值和城乡居民人均收入比2010年翻一番。","kp":"","src":"中国教育在线·2013 真题及解析"},"2013-9":{"ex":"本题考点：维新派和洋务派的区别 D本题考查的是维新派与洋务派的本质区别。洋务派主张学习西方先进的科学技术提升国力，维护清朝统治，并未涉及制度改革;维新派突破了洋务派“中体西用”思想的局限，主张改革君主专制制度，实现西方的君主立宪制度。AB选项是革命派的主张，与题意不符。因此，D选项正确。","kp":"维新派和洋务派的区别 D本题考查的是维新派与洋务派的本质区别","src":"中国教育在线·2013 真题及解析"},"2014-1":{"ex":"本题考查的是认识过程的反复性。人们对于一个复杂事物的认识往往要经由感性认识到理性认识、再由理性认识到实践的多次反复才能完成。这是因为在认识过程中始终存在着主观和客观的矛盾。在自然科学的发展中，对于某一自然现象的认识，往往需要经过实践、认识、再实践、再认识的多次反复，才能形成比较科学的实验。爱迪生之所以说“我一次都没有失败”，是因为他把每一次实验都看作整个实践过程中的一部分。所以，B选项正确。","kp":"","src":"中国教育在线·2014 真题及解析"},"2014-10":{"ex":"本题考查第一次国共合作的政治基础。新三民主义之所以成为国共合作的政治基础，是因为新三民主义的政纲同中共在民主革命阶段的纲领基本一致。","kp":"","src":"人民网·2014 真题单选解析"},"2014-11":{"ex":"本题考查毛泽东著作。1927年大革命失败以后，党的工作重点由城市转入农村，国民革命暂时进入低潮，毛泽东同志领导建立了第一个农村革命根据地——井冈山根据地。但是，当时党内有“左”倾思想的人，仍幻想以大城市为中心举行武装起义；而一些“右”倾机会主义者，在强敌进攻面前，怀疑革命根据地发展的前途，提出了“红旗到底能打多久”的疑问。他们不相信革命高潮很快就要到来，不愿经过艰苦奋斗创建农村革命根据地，主张用轻便的流动游击方式去扩大政治影响，等到全国各地争取群众的工作做好了，再来一次全国武装起义。为了批判党内存在的悲观思想，毛泽东写了《星星之火 可以燎原》。","kp":"","src":"人民网·2014 真题单选解析"},"2014-12":{"ex":"本题考查三大优良作风。引用毛泽东语录，要求干部开展批评与自我批评，保持党的纯洁性。","kp":"","src":"人民网·2014 真题单选解析"},"2014-13":{"ex":"本题考查社会主义法治理念。其中公平正义是社会主义和谐社会的基本特征，是社会主义法治的价值追求。","kp":"","src":"人民网·2014 真题单选解析"},"2014-14":{"ex":"本题考查道德与法律的关系。两者互为补充、相辅相成。道德规范作用的更好发挥，需要法律支撑；而法律作用的更好实现，则需要以道德建设为重要条件。","kp":"","src":"人民网·2014 真题单选解析"},"2014-15":{"ex":"本题考查群众路线教育实践活动的主要内容。","kp":"","src":"人民网·2014 真题单选解析"},"2014-16":{"ex":"本题考查中美新型大国关系。 来源：文都教育 延伸阅读: 2014政治毛中特真题亮点之“十八届三中全会” 姚桓：群众路线是中国共产党最大的软实力 全国130万考研用户信息被网上叫卖 原因仍不明确 GRE考试的阅读理解如何快速锁定正确答案？ 论公考中的排列组合 (责编：孙 悦（实习生）、熊旭) 相关专题 考研频道_教育频道_人民网 准模特”备战艺考 大学生COS大片海报走红 大学生创意毕业照 汉服风采展览活动 学渣逆袭娶乌克兰女神 俏洋妞的杭州留学生活 学生课间打腰鼓 人大毕业生弃高薪回渝做面 男子自制漂亮英文书签 24026405 我要留言 进入讨论区 论坛 博客 微博 SNS 育儿宝 图片 注册 / 登录 发言请遵守新闻跟帖服务协议 善意回帖，理性发言! 使用其他账号登录: 同步： 社区登录 用户名： 立即注册 密 码： 找回密码 恭喜你，发表成功! 请牢记你的用户名: ，密码: ,立即进入 个人中心 修改密码。 30 s后自动返回 推荐帖子推荐帖子推荐帖子 推荐帖子推荐帖子推荐帖子 ! 5s后自动返回 推荐帖子推荐帖子推荐帖子 推荐帖子推荐帖子推荐帖子 恭喜你，发表成功! 5s后自动返回 推荐帖子推荐帖子推荐帖子 推荐帖子推荐帖子推荐帖子 最新评论 热门评论 查看全部留言 > “不知天高地厚”的“葱油饼大姐” 嗜书成瘾藏千册 校长本色是书生 实习学霸 从环球时报到央视北美分台蜕变之旅 郑永明：一个卖建材的业余“物理学家” “洋气”学霸 东北口音逆袭成英伦腔 《寻找学霸》栏目上线 教育部：高中学业水平考试将打破百分制 教育部：为确保考试成绩可信将建立安全保密制度 教育部：高中生综合素质评价将可考察可比较 教育部：用于招生的综合素质评价材料必须公示 教育部:学生选择权扩大 走班教学要落到实处 高中学业水平考试 新闻热搜词 来源： 百度新闻 南京大屠杀公祭 习近平谈公祭日 李克强亚欧行 无人机闯空中禁区 呼格案再审结果 不动产登记 西部冰川萎缩 股市年末躁动 小年火车票今日开售 廊坊幼儿园危房倒塌 聂树斌案3大疑问 东三省人口流出 习近平公祭日讲话 李克强谈吃空饷问题 中央经济工作会议 精彩热图 | 人民电视 无臂男孩当“学霸” 西安出现英语神翻译 学校使用校币管理学生 学生戴安全帽上学 大学生制作“防霾伞” 选修课走进小学课堂 “水危机”的可怕真相 用生命传递战事信息 越野车备胎藏匿海洛因 忆1937南京\"空中赵子龙\" 南京屠城幸存者口述经历 揭秘中国慰安妇来历 精彩新闻 | 精彩博客 无臂小伙求职被爆灯 学生上课前先存手机。","kp":"","src":"人民网·2014 真题单选解析"},"2014-17":{"ex":"时间和空间是物质运动的存在形式，A选项是D选项的同义替换，故选AD。具体物质形态的时空是有限的，整个物质世界的时空是无限的，时空是有限和无限的统一，故不选C。物质运动与时间和空间的不可分割证明了时间和空间的客观性，故不选B。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-18":{"ex":"人们自己创造的历史，是由各种各样的个人活动构成的。在历史发展中，所有个人都起一定作用，社会历史发展是无数个人合力作用的结果，故选CD。杰出人物是历史人物中那些反映时代要求、代表进步阶级或阶层利益，对社会发展起显著促进作用的代表人物。杰出人物对历史发展的具体过程始终起着一定作用，有时甚至对历史事件的进程和结局发生决定性影响，但不能决定历史发展的基本趋势，杰出人物及其作用要受社会历史条件的制约，受人民群众及其实践活动的制约。故不选A。人民群众是历史的创造者。人民群众从质上说是指一切对社会历史发展起推动作用的人们，从量上说是指社会人口中的大多数，并不是每个人都是人民群众，故不选B。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-19":{"ex":"货币有五种基本职能，即价值尺度、流通手段、贮藏手段、支付手段和世界货币。价值尺度职能是指货币充当衡量商品所包含价值量大小的社会尺度。流通手段职能是指货币充当商品交换的媒介。贮藏手段职能是指货币退出流通领域，被人们当做社会财富的一般代表而加以贮藏的职能。支付手段职能是指随着商品经济的发展，发生赊购赊销，即用延期支付的方式买卖商品的情况下，货币用于清偿债务时执行的职能。世界货币职能是指货币在世界市场上作为一种购买手段、支付手段和社会财富的代表发挥作用。从材料中得知：赶考书生拿出十两银子付给店主，发挥的是货币的流通手段职能旅店的房间标价十两银子，发挥的是货币的价值尺度职能“店主立刻用它到隔壁的米店付了欠单，米店老板转身去屠夫处还了肉钱，屠夫马上去付清了赊帐的饲料款，饲料商赶紧到旅店还了房钱”，发挥的是货币的支付手段职能，故选ABC。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-2":{"ex":"此题考查的是社会规律和自然规律的区别。社会规律与自然规律的区别主要体现在两个方面。一是自然规律的重复性高，社会规律的重复性低。二是自然规律不需要人去参与，自然而然就能够出现，社会规律需要有人的参与才能体现出来。D本身表述错误，B违背了规律的客观性也是错的，C说法也不准确，所以A是正确答案。","kp":"","src":"人民网·2014 真题单选解析"},"2014-20":{"ex":"在经济调节机制变化的同时，经济危机形态变化的表现在：经济危机的四个阶段(即危机阶段、萧条阶段、复苏阶段和高涨阶段)之间的差别有所减弱各阶段的交替过程已不如过去那样明显金融危机频繁发生，对整个经济危机的影响加强。故选BC。经济危机是当资本主义基本矛盾达到尖锐化程度时，社会生产结构严重失调引发的，故不选A。经济危机的破坏作用不仅仅局限于发达资本主义国家，故不选D。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-21":{"ex":"列宁的新经济政策内容在马克思主义基本原理的科学社会主义部分，列宁的新经济政策的主要论述有：首先，把建设社会主义作为一个长期探索、不断实践的过程。其次，把大力发展生产力、提高劳动生产率放在首要地位。再次，在多种经济成分并存的条件下，利用商品、货币和市场发展经济。最后，利用资本主义，建设社会主义。故此题选ABC。如果考生对列宁的新经济政策不熟悉，就要从邓小平理论的内容出发对题目进行把握，也不难选出答案。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-22":{"ex":"十八届三中全会通过的《中共中央关于深化改革若干重大问题的决定》指出：公有制为主体、多种所有制经济共同发展的基本经济制度，是中国特色社会主义制度的重要支柱，也是社会主义市场经济体制的根基。公有制经济和非公有制经济都是社会主义市场经济的重要组成部分，都是我国经济社会发展的重要基础。必须毫不动摇巩固和发展公有制经济，坚持公有制主体地位，发挥国有经济主导作用，不断增强国有经济活力、控制力、影响力。必须毫不动摇鼓励、支持、引导非公有制经济发展，激发非公有制经济活力和创造力。故本题选BD。本题直接考查十八届三中全会的相关论断，若考生对此不够了解，通过对教材相关内容的学习，区分好社会主义市场经济与社会主义经济的差异，也不难排除另外两个错误选项。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-23":{"ex":"党的十八大把生态文明建设列为社会主义初级阶段总布局中。生态文明建设与经济建设之间的关系为：生态环境是经济发展的重要基础，生态文明建设应与经济建设协同发展，生态优势可以转化为经济优势。故此题选BCD。社会主义初级阶段的根本任务是发展生产力，因而生态文明建设不能取代经济建设，故不选A。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-24":{"ex":"我国区域经济的协调发展，主要是处理好东部和中西部的关系、沿海和内地的关系。党的十八大报告强调指出，继续实施区域发展总体战略，充分发挥各地区比较优势，优先推进西部大开发，振兴东北地区等老工业基地，大力促进中部地区崛起，积极支持东部地区率先发展，到2020年，基本形成区域发展协调机制。为推动区域协调发展，逐步缩小区域发展差距，必须实现基本公共服务均等化，引导生产要素跨区域合理流动，这是我国未来相当长的时期内缩小区域发展差距的基本目标和促进区域协调发展的基本途径。要按照资源、环境的承载能力、现有开发基础和未来发展潜力，统筹考虑未来人口分布、经济分布、国土利用和城镇化格局，引导生产要素跨区域合理流动。要创造条件引导中西部劳动力向经济相对集中的地区转移，充分发挥这些地区的人口承载力引导资金、技术等生产要素向中西部地区流动，增强中西部地区的经济实力。通过人口和生产要素的合理流动，促进区域协调发展，逐步缩小发展差距。故本题选择ABC。此题考生只要对教材中统筹区域发展的相关考点熟悉，就不难选出正确答案。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-25":{"ex":"十八届三中全会通过的《中共中央关于深化改革若干重大问题的决定》指出：激发社会组织活力。正确处理政府和社会关系，加快实施政社分开，推进社会组织明确权责、依法自治、发挥作用。适合由社会组织提供的公共服务和解决的事项，交由社会组织承担。支持和发展志愿服务组织。限期实现行业协会商会与行政机关真正脱钩，重点培育和优先发展行业协会商会类、科技类、公益慈善类、城乡社区服务类社会组织，成立时直接依法申请登记。加强对社会组织和在华境外非政府组织的管理，引导它们依法开展活动。故本题选择BCD。限期实行业协会商会与行政机关真正脱钩的目的是降低政府治理成本，扩大政府管理权限提高了政府的治理成本，故不选A。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-26":{"ex":"新时期以来，我们坚持对外开放的基本国策，从建立经济特区到开放沿海、沿江、沿边、内陆地区再到加入世界贸易组织，从大规模“引进来”到大踏步“走出去”，利用国际和国内两个市场、两种资源的水平显著提高，国际竞争力不断增强。十八大报告提出要提高开放型经济水平。坚持出口和进口并重，强化贸易政策和产业政策协调，形成以技术、品牌、质量、服务为核心的出口竞争新优势，促进加工贸易转型升级，发展服务贸易，推动对外贸易平衡发展。提高利用外资综合优势和总体效益，推动引资、引技、引智有机结合。加快走出去步伐，增强企业国际化经营能力，培育一批世界水平的跨国公司。故本题选择ABCD。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-27":{"ex":"《临时约法》规定：“中华民国之主权属于国民全体”，而“以参议院、临时大总统、国务员、法院行使其统治权。”《临时约法》规定：增设国务总理，作为政府首脑。内阁辅佐临时大总统，为行政机关，行使行政权增设法院，行使司法权参议院为立法机关，行使立法权，参议院还有弹劾大总统和国务院的权利。《临时约法》规定：中华民国国民一律平等，享有人身、财产、集会、结社、出版、言论等自由，享有请愿、陈述、考试、选举与被选举等民主权利。这样，《临时约法》就以根本大法的形式废除了两千年来的封建君主专制制度，确认了资产阶级共和国的政治制度。因此，本题选择ABD。南京临时政府的《告友邦书》中，企图用承认清政府与列强所订的一切不平等条约和清政府所欠的一切外债，来换取列强承认中华民国。这是南京临时政府的局限性之一，因此，不选C。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-28":{"ex":"抗日战争期间，中国政府向国际社会郑重声明要收复台湾。1941年底太平洋战争爆发后，中国国际地位上升，成为世界反法西斯国家四强之一，与英美等盟国的军事交往和合作也日益增多。1943年11月22日至26日，中美英三国政府首脑蒋介石、罗斯福、丘吉尔在开罗举行会议，会议发表《开罗宣言》，明确日本应将所窃取于中国的东北、台湾、澎湖列岛等在内的土地，归还中国。这是第一份确认台湾是中国领土的国际法文件。1945年7月17日，苏美英三国首脑在柏林波茨坦举行会议。会议期间，三国首脑讨论了结束对日作战的条件和有关对日本战后处置的方针，并发表一项由美、英、中代表签署的协议，即《波茨坦公告》，苏联于8月8日对日宣战后加入该公告。公告规定：“开罗宣言之条件必将实施。”同年9月2日，《日本无条件投降书》则昭告世界：“承担忠诚履行《波茨坦公告》各项规定之义务。”1945年10月25日，当时的中国政府正式收复台湾、澎湖列岛，恢复对台湾行使主权。因而，此题选择ABC。《德黑兰宣言》是针对的德国问题而签订的，故而不选D。此题在2011年曾考查过，2013年是《开罗宣言》发表70周年，这是此题的出题背景。这道题在教材中找不到确切的对应知识点，对于这类考题的准备，考生要仔细关注每年当中的历史周年纪念，以及社会关注的历史热点问题。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-29":{"ex":"1945年8月，蒋介石连发三电，邀请毛泽东赴重庆谈判。8月28日，毛泽东偕同周恩来、王若飞，在国民党政府代表张治中和美国驻华大使赫尔利陪同下，赴重庆与国民党当局进行谈判。重庆谈判从8月20日到10月10日结束。谈判期间，毛泽东直接与蒋介石就国共两党关系的重大问题进行多次商谈。10月10日，双方签署《政府与中共代表会谈纪要》，即《双十协定》，确认和平建国的基本方针，同意“长期合作，坚决避免内战”。1946年1月10日，国共双方下达停战令。同一天，政治协商会议在重庆开幕，出席会议的有国民党、共产党、民主同盟、青年党和无党派人士的代表38人。会上，共产党与民主党派和无党派人士的代表密切合作，推动政协会议达成了政府组织、国民大会、和平建国纲领、宪法草案、军事问题等五项协议。这些决议贯彻了和平民主原则，确认了和平建国方针，确定了国会制、内阁制和省自治的政治制度。政协会议结束以后，中国共产党是决心严格履行政协协议的。同时，中共中央也指出，中国民主化的道路依然是曲折的、长期的。因此，此题选BD，AC不符合题意。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-3":{"ex":"此题考查的是社会再生产的核心问题。社会再生产的核心问题是社会总产品的实现问题即价值补偿和实物补偿的问题。价值补偿是是指社会的商品资本在出售之后以货币的形式回流 实现价值以及剩余价值的过程 ，实物补偿是指两大部类都能够买到社会再生产所必需的生产资料和生活资料，剩余价值和回收的预付资本能顺利购买到必需的生产资料和生活资料，实现货币资本向生产资本的过渡。题目中因产品积压而倒闭的企业主要是由于无法实现其生产过程中的价值补偿。故B正确。","kp":"","src":"人民网·2014 真题单选解析"},"2014-30":{"ex":"根据法律的规范作用的指向和侧重，可以将公共生活中法律规范的作用分为指引作用、预测作用、评价作用、强制作用和教育作用。保障作用不属于法律规范的作用范围，故B选项首先被排除。预测作用指法律通过其规定，告知人们某种行为所具有的、为法律所肯定或否定的性质以及它所导致的法律后果，使人们可以预先估计到自己行为的后果，以及他人行为的趋向于后果。强制作用指法律能运用国家强制力制裁违法和犯罪，保障自己得以实施的作用。法律的教育作用指法律所具有的、通过其规定和实施而影响人们思想，培养和提高人们法律意识，引导人们依法行为的作用。柏拉图的话，前半句凸显法律的教育作用，后半句凸显法律的强制作用，故选CD。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-31":{"ex":"爱国主义优良传统的内涵体现在以下几个方面：热爱祖国，矢志不渝。天下兴亡，匹夫有责。维护统一，反对分裂。同仇敌忾，抗御外侮。因此，ABCD都符合题意。","kp":"","src":"中公考研·2014 真题答案解析"},"2014-32":{"ex":"建设中国(上海)自由贸易试验区，主要任务是要探索我国对外开放的新路径和新模式，推动加快转变政府职能和行政体制改革，促进转变经济增长方式和优化经济结构，实现以开放促发展、促改革、促创新，形成可复制、可推广的经验，服务全国的发展。建设中国(上海)自由贸易试验区有利于培育我国面向全球的竞争新优势，构建与各国合作发展的新平台，拓展经济增长的新空间，打造中国经济“升级版”。因此，正确答案为ABC。","kp":"","src":"中国教育在线·2014 真题及解析"},"2014-33":{"ex":"中国奉行的独立自主的和平外交政策，不跟任何国家结盟，因此A项错误，正确答案为BCD。","kp":"","src":"中国教育在线·2014 真题及解析"},"2014-4":{"ex":"此题考查的是资本主义的新变化的原因。资本主义的新变化主要是由于科学技术革命和生产力的发展，工人阶级争取自身权利和利益的斗争，社会主义制度初步显示的优越性的作用，主张改良主义的政党的作用。其中科学技术革命和生产力的发展是根本推动力量。故C正确。","kp":"","src":"人民网·2014 真题单选解析"},"2014-5":{"ex":"使市场在资源配置中起决定性作用，是十八届三中全会在理论上的一个重大突破和创新，对我国完善社会主义市场经济体制和全面深化改革都具有十分重要的意义。","kp":"","src":"人民网·2014 真题单选解析"},"2014-6":{"ex":"《中华人民共和国全国人民代表大会和地方各级人民代表大会选举法》第三十条规定第三十条全国和地方各级人民代表大会代表候选人的名额，应多于应选代表的名额。","kp":"","src":"人民网·2014 真题单选解析"},"2014-7":{"ex":"按劳分配以外的多种分配方式，其实质就是按对生产要素的占有状况进行分配。实行按劳分配的根据是生产要素的多种所有制。","kp":"","src":"人民网·2014 真题单选解析"},"2014-8":{"ex":"党的十八大报告强调，建设社会主义文化强国，关键是增强全民族文化创造活力。","kp":"","src":"人民网·2014 真题单选解析"},"2014-9":{"ex":"本题考查的是五四以前的新文化运动。他们之所以把主要注意力倾注于清除思想方面，是由于他们认定“伦理问题不解决，则政治学术，皆枝叶问题。”国民性不改造，“不但共和政治不能进行，就是这块共和招牌，也是挂不住的”。所以是将改造国民性置于优先的地位。","kp":"","src":"人民网·2014 真题单选解析"},"2015-1":{"ex":"「书本电脑里种不出水稻，只有在田里才能种出水稻」说明实践是人类认识的基础和来源，故选 B。A 把关系说反了；C 错：理论有正确与错误之分；D 错：两次飞跃中认识到实践的飞跃更重要。","kp":"实践是认识的基础"},"2015-10":{"ex":"「只把一个皇帝赶跑」指辛亥革命虽推翻帝制，但没有完成反帝反封建的革命任务，故选 B。A 错：帝制已被推翻；C 不是毛泽东此语所指；D 是失败的表现之一，但不是「只赶跑一个皇帝」的含义。","kp":"辛亥革命的失败"},"2015-11":{"ex":"一战暴露了西方资本主义文明的弊病，使中国先进分子对西方资产阶级民主主义产生怀疑，转而探索新的救国道路，故选 B。A 产生怀疑的是对西方文明而非传统文化；C、D 是新文化运动与五四运动后的认识，不属一战的影响。","kp":"一战对中国先进分子的影响"},"2015-12":{"ex":"古田会议决议的中心思想是用无产阶级思想进行军队和党的建设，确立了思想建党、政治建军的原则，故选 D。A 与此无关；B、C 是革命的形势与任务，不是决议中心思想。","kp":"古田会议决议的中心思想"},"2015-13":{"ex":"爱国主义是个人实现人生价值的力量源泉，故选 A。B「直接条件」、C「根本保障」、D「决定性因素」都把爱国主义的作用说得过满，与教材表述不符。","kp":"爱国主义的价值"},"2015-14":{"ex":"评价人生价值的根本尺度是看一个人对社会和他人的生存和发展所作的贡献，故选 C。A、B 是外在地位与影响，D 是从社会获得满足的尺度，都属于自我价值方面。","kp":"评价人生价值的尺度"},"2015-15":{"ex":"2014 年 4 月中央国家安全委员会第一次会议上，习近平提出坚持总体国家安全观，故选 C。A、B、D 是不同场合提出的安全理念，不能与此处的表述对应。","kp":"总体国家安全观"},"2015-16":{"ex":"「伊斯兰国」崛起冲击地区秩序，使美国「重返亚太」战略受到牵制，故选 D。A、B、C 都不是这一事态的直接后果。","kp":"「伊斯兰国」与美国战略"},"2015-17":{"ex":"土壤形成需要母质、气候、生物、地形、时间共同作用并随时间推进，说明事物总是作为过程而存在（A），其产生是多重因素相互作用的结果（D）。B 表述正确但材料未涉及物质运动与时间的关系；C 错：发展是螺旋式上升，不是线性上升。","kp":"事物的过程性与多因素作用"},"2015-18":{"ex":"要使「平衡」成为大智慧，就要精确把握事物的度（A）、善于协调事物内部各种因素的相互关系（C）、全面理解绝对运动和相对静止的辩证关系（D）。B 错：辩证否定的方式和方向与「保持平衡」不是同一问题。","kp":"平衡与度、运动与静止"},"2015-19":{"ex":"杰出人物的历史作用受一定历史条件制约（B），其作用的形成和发挥同服务人民群众的意愿密不可分（C），并因其智慧、性格因素对社会进程发生影响（D）。A 错：杰出人物不能改变历史发展的基本方向。","kp":"杰出人物的历史作用"},"2015-2":{"ex":"社会意识相对独立性最突出的表现是社会意识对社会存在具有能动的反作用，故选 D。A、B、C（相互影响、不完全同步、历史继承性）也是相对独立性的表现，但不是最突出的。","kp":"社会意识的相对独立性"},"2015-20":{"ex":"马克思的论断表明：资本积累必然导致工人人口供给相对资本需要而过剩（A），这种过剩是「相对」的，因为不为资本增殖所需要（B），资本主义生产的周期性需要相对过剩人口规律与之相适应（C），积累使失业规模呈扩大趋势（D），四项全选。","kp":"相对过剩人口"},"2015-21":{"ex":"国家垄断资本主义的微观规制主要有反托拉斯法（D）、公共事业规制（B）、社会经济规制（C）。A「公众生活规制」不是这一分类中的类型。","kp":"微观规制的类型"},"2015-22":{"ex":"人才是国家竞争力的重要体现（A），是第一资源和国家战略资源（C），是推进中国特色社会主义事业的关键因素（D）。B 错：先进生产力的集中体现和主要标志是科学技术，不是人才本身。","kp":"人才的地位"},"2015-23":{"ex":"材料表明我国农业经营主体呈现多样化趋势（A），而家庭承包经营仍然是最基本的经营形式（C）。B 错：土地集体所有权性质未变；D 错：土地经营权流转不改变农民的土地承包权。","kp":"农村经营体制"},"2015-24":{"ex":"提高基层代表比例有利于推动人民群众最关心最直接最现实问题的解决（A），调动基层群众参政议政的积极性与主动性（B），更充分地发挥全国人大的民意反映与监督职能（D）。C 错：我国人民是通过选举代表间接管理国家事务，不是「直接参加国家管理」。","kp":"人大代表结构优化"},"2015-25":{"ex":"新常态的主要特点是：增长速度从高速转为中高速（A）、经济结构不断优化升级（C）、发展动力从要素驱动投资驱动转向创新驱动（D）。B 错：中国经济对世界市场的需求并未减弱。","kp":"经济新常态的特点"},"2015-26":{"ex":"培育和践行社会主义核心价值观，有利于促进人的全面发展和引领社会全面进步（A），巩固全党全国人民团结奋斗的共同思想基础（B），巩固马克思主义在意识形态领域的指导地位（C），集聚实现中华民族伟大复兴中国梦的强大正能量（D），四项全选。","kp":"社会主义核心价值观的意义"},"2015-27":{"ex":"甲午战争使中国人开始有了普遍的民族意识觉醒（B），台湾被日本侵占（C），并引发帝国主义列强掀起瓜分中国的狂潮（D）。A 错：中国海关行政权落入外国人之手始于 1854 年上海海关外籍税务司制度，不是甲午战争的结果。","kp":"甲午战争的影响"},"2015-28":{"ex":"政协协议有利于推进民主政治的发展和进步（A），打破国民党一党独裁的局面（B），保障解放区政权的合法地位（D）。C 错：协议不可能改变国共两党的军事力量对比。","kp":"1946 年政协协议"},"2015-29":{"ex":"「只拥护正确的毛泽东思想」这种说法之所以错误，是因为它没有把毛泽东思想与毛泽东的思想区分开（C），没有把毛泽东晚年的错误与毛泽东思想的科学体系区分开（D）。A、B 不是这一说法错误的要点。","kp":"毛泽东思想与毛泽东的思想"},"2015-3":{"ex":"「机器换人」意味着生产资料的比重相对上升、劳动力比重相对下降，即资本技术构成提高（c/v 上升），故选 B。A 错：剩余价值的来源仍是雇佣工人的剩余劳动，不会改变；C 错：个别企业劳动生产率提高会使单位商品价值量降低；D 错：率先采用新技术的企业获得超额剩余价值，不是更多的平均利润。","kp":"资本技术构成"},"2015-30":{"ex":"个人品德是个人行为的统一整体及知、情、意、行的综合体现（A），是在实践活动中表现出来的行为的稳定倾向（B），是在实践活动中锻炼而成的一种特殊品性（C）。D 错：个人品德具有稳定性，不是偶然、短暂的道德行为现象。","kp":"个人品德的含义"},"2015-31":{"ex":"「风能进，雨能进，国王不能进」凸显权力应当以权利为界限（C），权力必须受到权利的制约（D）。A 权力优先于权利、B 权力决定权利，都是错误的权力观。","kp":"权力与权利的关系"},"2015-32":{"ex":"设立这两个纪念日有助于向中国人民和世界各国人民传播历史事实的真相（A），是对抗击日本帝国主义侵略付出巨大牺牲和作出巨大贡献的人们的敬重与缅怀（B），彰显了中国作为反法西斯主要战场的伟大作用（C），是对南京大屠杀中大量死难同胞的告慰和尊重（D），四项全选。","kp":"设立抗战胜利纪念日与国家公祭日"},"2015-33":{"ex":"《宣言》通过意味着各成员国加强了涉腐、涉案赃款跨境流动的信息共享（A），将形成携手打击跨境腐败的网络（B），达成了就追逃、追赃开展执法合作的重要共识（D）。C 错：「杜绝了」把合作成效绝对化，跨国腐败不可能因一份宣言而消失。","kp":"《北京反腐败宣言》"},"2015-4":{"ex":"马克思主义政党以工人阶级为基础，是工人阶级的先锋队，故选 A。B 错：党不等于整个阶级；C 错：先进性的根本前提不是阶级性本身，而是以科学理论武装并代表工人阶级和全体人民利益；D 颠倒了党性与阶级性的关系。","kp":"马克思主义政党的性质"},"2015-5":{"ex":"当时所讲的工业化道路问题，主要是指重工业、轻工业和农业的发展关系问题，即按农轻重次序安排国民经济，故选 D。A、B、C 都是《论十大关系》中的具体关系，不是「工业化道路」的核心所指。","kp":"中国工业化道路"},"2015-6":{"ex":"邓小平这一论述首次把社会主义初级阶段作为事关全局的基本国情加以把握，为十三大系统阐述初级阶段理论奠定基础，故选 C。A 错：概念在 1981 年《关于建国以来党的若干历史问题的决议》已提出；B 首次系统阐述是十三大报告；D 与题意不符。","kp":"社会主义初级阶段"},"2015-7":{"ex":"我国城镇化的首要任务是推进农业转移人口市民化，解决好「人」的问题，故选 A。B 错：不能使土地城镇化优于人口城镇化；C 是过程而非首要任务；D「人的无差别发展」不是城镇化任务。","kp":"新型城镇化"},"2015-8":{"ex":"香港特别行政区的高度自治权是中央授予的地方事务管理权，故选 D。A 错：不是完全自治；B 错：不是中央授权之外的剩余权力；C 错：权力来源于中央授权，不是特区本身固有。","kp":"特别行政区的高度自治权"},"2015-9":{"ex":"工业救国、教育救国、科学救国之所以走不通，根本在于没有认识到争取民族独立和人民解放是实现民族复兴的前提，故选 A。B、C 是近代中国国情，D 与当时历史条件不符。","kp":"民族独立与人民解放"},"2016-1":{"ex":"盐能提味，但加到「一把」就变成又苦又咸，说明加盐必须保持在度内，启示我们在认识和解决问题时要掌握适度原则，故选 B。A 只讲量变引起质变，没有指出「过了度就走向反面」；C 自我否定与题意无关；D 否认了透过现象认识本质的可能。","kp":"量变与质变、适度原则"},"2016-10":{"ex":"魏源所说的「长技」主要指西方先进的军事技术和科学技术（船炮制造等），故选 C。A 宗教思想文化、B 教育人才培养、D 民主政治制度都不是「长技」所指。","kp":"魏源「师夷长技」的内涵"},"2016-11":{"ex":"抗战初期华北战场上规模最大、战斗最激烈，且国共两党军队合作抗日配合得最好的一次战役是忻口会战（1937 年 10 月），故选 D。A 台儿庄战役属徐州会战、在华东；B 长城战役在 1933 年；C 平津会战规模与配合程度均不及忻口。","kp":"忻口会战"},"2016-12":{"ex":"1946 年 5 月 4 日中共中央发出《关于清算、减租及土地问题的指示》，把抗战时期的减租减息政策改变为「耕者有其田」的政策，故选 C。A 保存富农经济是 1950 年《土地改革法》的内容；B 是「左」倾土地政策；D 是井冈山时期的做法。","kp":"《五四指示》"},"2016-13":{"ex":"爱国主义在不同历史时期和文化背景下有不同内涵与表现，说明爱国主义是历史的、具体的，故选 B。A「主观的」、C「抽象的」、D「客观的、具体的」都不准确——爱国主义是历史的、具体的，既随历史条件变化，又有其客观的社会内容。","kp":"爱国主义的特征"},"2016-14":{"ex":"在人权的法律保障体系中，宪法保障是人权保障的前提和基础，立法保障是重要条件，行政保护是关键环节，司法保障是最后防线，故选 D。A、B、C 分别对应司法保障、立法保障、行政保护。","kp":"人权的宪法保障"},"2016-15":{"ex":"2015 年 10 月党的十八届五中全会审议通过了《中共中央关于制定国民经济和社会发展第十三个五年规划的建议》，故选 C。A 是十八届四中全会、B 是十四届三中全会、D 是十八届三中全会的文件。","kp":"十八届五中全会"},"2016-16":{"ex":"导致难民数量增长的根本原因是中东地区战乱、冲突和动荡加剧，故选 B。A 是直接诱因之一，C、D 属于应对层面而非「数量增长的根本原因」。","kp":"欧洲难民危机"},"2016-17":{"ex":"显微镜下的「一沙一世界」说明任何事物都具有无限多样的属性（A），人们能透过对个别事物的认识达到对世界整体的把握（C），并可通过制造和使用工具日益深化对客观世界的认识（D）。B 错：事物本质是客观的，不随人的认识变化而改变。","kp":"现象与本质、认识的深化"},"2016-18":{"ex":"时间一维性指时间单向流逝、不可逆。「物换星移几度秋」（A）、「花开堪折直须折」（B）、「黑发不知勤学早，白首方悔读书迟」（C）都表现时间流逝不复返。D「溪云初起日沉阁，山雨欲来风满楼」讲的是事物变化的前兆与联系，不含时间一维性。","kp":"时间的一维性"},"2016-19":{"ex":"马克思这段话表明：经济危机根本上源于资本主义基本矛盾（B），危机与群众贫穷及消费能力受限有关（C），资本无限扩张生产也是危机发生的原因（D）。A 错：马克思恰恰是在批判「把危机归因于社会绝对消费能力」的观点。","kp":"经济危机的根源"},"2016-2":{"ex":"第一种观点认为自由在于认识规律、利用规律为一定目的服务，是唯物辩证法（辩证唯物主义）的观点；第二种把自由理解为「随心所欲」，否认规律的客观制约，是唯意志论（主观唯心主义）的观点，故选 A。B、C、D 的组合均与两种观点的性质不符。","kp":"自由与必然"},"2016-20":{"ex":"促进经济全球化迅猛发展的因素包括：各国经济体制变革提供的有利制度条件（A）、适宜全球化的企业经营形式（B）、企业技术创新与管理创新（C）、科技进步和生产力快速发展（D），四项全选。","kp":"经济全球化的推动因素"},"2016-21":{"ex":"科学社会主义超越空想社会主义之处，在于它揭示了资本主义必然灭亡的经济根源（C），并找到了实现理想社会的现实道路——无产阶级革命（A）。B 错：「对未来社会进行细致描绘」正是空想社会主义的特点；D 错：对资本主义的批判两者都有。","kp":"科学社会主义超越空想社会主义"},"2016-22":{"ex":"中国高铁走出国门表明我国参与国际竞争能力明显增强（A）、自主创新能力显著提高（B）、国际投资合作水平日益提升（D）。C 错：传统产业结构调整并未「得到根本性改变」，表述夸大。","kp":"中国高铁走出去"},"2016-23":{"ex":"实施保障民间投资参与的政策，目的是保证各种所有制经济依法平等使用生产要素（A）、公开公平公正参与市场竞争（D）。B 错：鼓励民营企业建立现代企业制度不是政策的普遍要求；C 错：员工持股是具体改革试点，不是政策目的。","kp":"放活民间投资政策的目的"},"2016-24":{"ex":"十八届五中全会提出的精准扶贫、精准脱贫主要举措包括产业扶持（A）、转移就业（B）、社保政策兜底（C）、易地搬迁（D），即「五个一批」的核心内容，四项全选。","kp":"精准扶贫、精准脱贫的举措"},"2016-25":{"ex":"简政放权旨在处理好政府与市场的关系、加快完善社会主义市场经济体制（A），减少审批环节、降低市场交易成本（B），提高政府治理能力和治理水平（C），激发市场主体内在活力和社会创造力（D），四项全选。","kp":"简政放权的目的"},"2016-26":{"ex":"统一战线是夺取革命、建设和改革事业胜利的重要法宝（A），是中国共产党的一大政治优势（B），也是实现中华民族伟大复兴中国梦的重要法宝（C）。D 错：人民当家作主的根本保证是党的领导、人民民主专政的国家政权，不是统一战线。","kp":"统一战线的地位"},"2016-27":{"ex":"维新派「无力回天」的主要原因：遭到以慈禧太后为首的强大守旧势力的反击和镇压（B），不敢触动封建主义的经济基础（C），惧怕人民群众、把希望寄托在没有实权的皇帝身上（D）。A 错：维新派主张「中学为体，西学为用」，并未彻底否定中学。","kp":"戊戌维新失败的原因"},"2016-28":{"ex":"新文化运动是中国历史上一次前所未有的启蒙运动（A），为马克思主义在中国的传播创造了有利条件（B），在社会上掀起了一股思想解放浪潮（C）。D 错：「彻底否定孔学的历史作用」是新文化运动的局限与偏激之处，不能算作其历史意义。","kp":"新文化运动的历史意义"},"2016-29":{"ex":"1992 年邓小平南方谈话提出：革命是解放生产力，改革也是解放生产力（A）；不坚持社会主义，不改革开放，不发展经济，不改善人民生活，只能是死路一条（B）；走社会主义道路就是要逐步实现共同富裕（C）；计划多一点还是市场多一点，不是社会主义与资本主义的本质区别（D），四项全选。","kp":"南方谈话的内容"},"2016-3":{"ex":"剩余价值 m = 120 − 100 = 20 万元；用于购买劳动力的可变资本 v = 10 万元；剩余价值率 m′ = m / v = 20 / 10 = 100%，故选 D。注意固定资本 60 万元、流动资本中原材料等 30 万元都属于不变资本 c，不参与剩余价值率的计算。","kp":"剩余价值率"},"2016-30":{"ex":"「法治体系」不仅包括法律规范体系，还包括法治实施、法治监督、法治保障体系和党内法规体系（A）；强调科学立法、严格执法、公正司法、全民守法（B）；既要有制度也要保证落实（C）；既是静态法律文本又是动态法的实现过程（D），四项全选。","kp":"从法律体系到法治体系"},"2016-31":{"ex":"二者相互依存（A）、是目的与手段的关系（B）、具有二重性（D）。C 错：法律权利与法律义务并不存在谁先谁后的「顺序性」，两者是相互依存、不可分割的统一体。","kp":"法律权利与法律义务的关系"},"2016-32":{"ex":"习近平就巩固两岸关系和平发展大格局提出四点意见：坚持两岸共同政治基础不动摇（A）、坚持巩固深化两岸关系和平发展（B）、坚持为两岸同胞多谋福祉（C）、坚持同心实现中华民族伟大复兴（D），四项全选。","kp":"两岸领导人首次会面"},"2016-33":{"ex":"人民币「入篮」有助于增强 SDR 的代表性和吸引力、完善现行国际货币体系（A），中国经济地位得到国际认可、全球经济格局发生积极变化（B），有助于维护全球金融稳定和完善全球经济治理（D）。C 错：「短期内成为使用水平最高的货币」明显夸大，人民币国际化是长期过程。","kp":"人民币加入 SDR 的意义"},"2016-4":{"ex":"20 世纪 70 年代以来，西方资本主义国家推行金融自由化、放松金融管制并不断进行金融创新，为金融资本急剧膨胀提供了重要制度条件，故选 A。B、C、D 都是相关现象或其中一部分，不能概括「制度条件」这一落点（D 中「全面私有化」表述也不准确）。","kp":"金融资本快速发展的制度条件"},"2016-5":{"ex":"贯穿毛泽东思想与中国特色社会主义理论体系始终、并体现在各个基本观点中的世界观和方法论基础是实事求是，故选 D。A 群众路线、B 独立自主是与实事求是并列的活的灵魂，C 改革创新是时代精神的核心。","kp":"马克思主义中国化两大成果的共同世界观基础"},"2016-6":{"ex":"毛泽东在《论十大关系》中提出，要把国内外一切积极因素调动起来，为社会主义事业服务，这是贯穿十大关系的基本方针，故选 B。A 是 1956 年知识分子会议提出的口号，C 是 1957 年《关于正确处理人民内部矛盾的问题》的主题，D 是八大前后经济建设的方针。","kp":"《论十大关系》的基本方针"},"2016-7":{"ex":"新的阶段性特征的出现没有改变我国仍处于社会主义初级阶段的基本事实，说明社会主义初级阶段是长期性与阶段性统一的动态发展过程，故选 B。A、C、D 的表述都不是对「阶段性特征与长期性关系」的回答。","kp":"社会主义初级阶段的特征"},"2016-8":{"ex":"民族区域自治的核心是保障少数民族当家作主、管理本民族本地方事务的权利，故选 C。A 是统战工作的着眼点，B 是民族区域自治的目标与原则，D 是「两个离不开」的民族团结思想。","kp":"民族区域自治的核心"},"2016-9":{"ex":"甲午中日战争后，中国面临被瓜分的严重危机，《马关条约》的签订与「救亡图存」呼声的高涨，标志着中国人民的民族意识开始普遍觉醒，故选 B。A 日本全面侵华在 1937 年，C 八国联军侵华在 1900 年，D 中法战争在 1883—1885 年，均晚于「开始普遍觉醒」这一时间起点。","kp":"民族意识普遍觉醒的标志"},"2017-1":{"ex":"「天帮忙很重要，但人努力才是根本」说明治理雾霾必须建立在客观规律之上，尊重事物的客观规律是正确发挥主观能动性的前提，故选 B。A 错：思想活动不是掌握规律的前提，实践才是；C 错：统一的基础是社会实践，不是认识活动；D 错：题干落点是「人努力」的作用，而非尚未认识的外在自然规律。","kp":"主观能动性与客观规律的关系"},"2017-10":{"ex":"直接原因是 1919 年巴黎和会上中国外交失败：列强无视中国正当要求、把德国在山东的权益转让给日本，使「公理战胜强权」的幻想破灭，故选 D。A、B 虽然在华利益问题上存在，但不是直接触发因素；C 苏俄废除不平等条约是 1919 年 7 月之后，时间与逻辑都不符。","kp":"陈独秀对一战的看法转变"},"2017-11":{"ex":"土地革命战争后期和抗日战争时期，毛泽东系统阐明了新民主主义革命理论，标志着毛泽东思想得到多方面展开而达到成熟，故选 B。A、C、D 分属文化工作理论、政权理论、革命道路理论，是不同阶段的内容。","kp":"毛泽东思想成熟的标志"},"2017-12":{"ex":"1947 年 6 月底刘邓大军千里跃进大别山，三路大军呈「品」字形展开、相互策应，标志着人民解放军由战略防御转入战略进攻、战略进攻的序幕由此揭开，故选 B。A 错：当时解放军在数量上仍处劣势；C 错：战略决战（三大战役）在 1948 年秋；D 错：解放战争没有战略相持阶段的表述。","kp":"解放战争战略进攻"},"2017-13":{"ex":"信念有不同层次和类型，从低到高排列，高层次的信念决定低层次的信念、代表人的基本信仰，故选 A。B 把决定关系颠倒了；C、D 把某种具体信念说成「信念体系的最高层次」都不成立——最高层次的信念是信仰。","kp":"信念的层次与类型"},"2017-14":{"ex":"人生价值评价的根本尺度，是看一个人的人生活动是否符合社会发展的客观规律、是否通过实践促进了历史的进步——这是历史标准，故选 A。政治标准、经济标准、文化标准只是某一领域的衡量口径，不能作根本尺度。","kp":"人生价值评价的根本尺度"},"2017-15":{"ex":"两岸制度性沟通和协商谈判机制中断的根本原因，是台湾当局不承认「九二共识」、不认同两岸同属一个中国，动摇了两岸关系的政治基础，故选 D。A、B、C 都是外部或具体事务性因素，不是根本原因。","kp":"两岸关系的政治基础"},"2017-16":{"ex":"中东问题的核心是巴勒斯坦问题——巴勒斯坦问题长期得不到公正解决，是中东动荡的重要根源，故选 D。A 伊朗核问题、B 教派冲突、C 恐怖主义都是中东的重要问题，但不是「核心」。","kp":"中东问题的核心"},"2017-17":{"ex":"显微技术的进步推动人类对细胞、DNA、剪接体的认识不断深化，说明实践的主体和客体依靠中介系统（工具、仪器）才能相互作用（B），认识水平提高与实践条件进步有直接关系（C），主体、客体和中介有机统一构成实践的基本结构（D）。A 错：最基本的实践活动是物质生产劳动，不是科学实验。","kp":"实践的基本结构"},"2017-18":{"ex":"历史人物会因其智慧、性格等因素对社会过程发生影响（B），具有进步意义的历史人物往往能首先发现或提出新的历史任务（C），但无论发挥何种作用都不能决定和改变历史发展的总进程和总方向（D）。A 错：历史人物的作用有积极也有消极，不能一概而论。","kp":"历史人物的作用"},"2017-19":{"ex":"资本原始积累主要靠暴力手段剥夺农民土地、靠野蛮手段进行殖民掠夺，故选 AC。B 榨取剩余价值是资本主义生产方式的特征，不是原始积累的途径；D 表述错误，原始积累靠的是暴力和掠夺，不是「资本手段」。","kp":"资本原始积累的途径"},"2017-2":{"ex":"「鬼神」观念是对客观世界歪曲的、虚幻的反映，把它当成鬼神真实存在的反映，错误在于把意识对存在的反映理解为直接反映（忽视反映需要经过人脑加工并可能失真），故选 C。A 错：意识是物质的产物这一判断本身正确；B 错：这种观念是夸大意识对象的实在性，而非夸大能动作用；D 与题意无关。","kp":"意识的本质"},"2017-20":{"ex":"资本有机构成提高是由资本追求剩余价值、提高劳动生产率的本性决定的（A），是不以人的意志为转移的一般趋势（B），并成为社会产生相对过剩人口的重要原因（C）。D 错：资本主义条件下资本有机构成提高恰恰加剧贫困，不可能成为消除贫困的根本途径。","kp":"资本有机构成提高"},"2017-21":{"ex":"列宁在实施新经济政策期间提出：可以利用资本主义来建设社会主义（A），把建设社会主义看作长期探索、不断实践的过程（B），把大力发展生产力、提高劳动生产率放在首要地位（C），允许多种经济成分并存并利用商品、货币和市场发展经济（D），四项全选。","kp":"新经济政策的思想"},"2017-22":{"ex":"实践证明党的基本路线是党和国家的生命线、人民的幸福线（A），是实现科学发展的政治保证（B），是兴国、立国、强国的重大法宝（C）。D 错：思想路线的核心是实事求是，与基本路线不是同一范畴。","kp":"党的基本路线"},"2017-23":{"ex":"推进「一带一路」建设旨在统筹国内国际两个大局（A）、打造开放包容均衡普惠的区域经济合作架构（B）、促进沿线各国共同繁荣（C）、探索国际合作及全球治理新模式（D），四项全选。","kp":"共建「一带一路」"},"2017-24":{"ex":"中央环保督查「查督并举、以督政为主」，有利于强化领导责任和监管责任（B）、落实环境保护主体责任（C）、完善领导干部目标责任考核制度（D）。A 错：环保督查指向的是政府履职与企业主体责任，与「政府与市场的关系」不是同一维度。","kp":"环保督查机制"},"2017-25":{"ex":"把创新作为引领发展的第一动力，是分析世界发展历程和总结我国改革开放实践得出的结论（A），是引领经济发展新常态的根本之策（B），是提高核心竞争力的必然选择（D）。C 错：构建和谐社会与创新驱动的直接关联不成立，这一表述属于牵强附会。","kp":"创新是引领发展的第一动力"},"2017-26":{"ex":"《关于新形势下党内政治生活的若干准则》提出：着力增强党内政治生活的政治性、时代性、原则性、战斗性（A），着力提高党的领导水平和执政水平、增强拒腐防变和抵御风险能力（B），着力增强党自我净化、自我完善、自我革新、自我提高能力（C），着力维护党中央权威、保证党的团结统一、保持党的先进性和纯洁性（D），四个「着力」全选。","kp":"新形势下党内政治生活"},"2017-27":{"ex":"列强通过控制关税和盐税（B）、在华设立银行（C）、控制中国的交通运输业（D）等方式控制中国经济。A 在中国设立出版机构宣传西学属于文化渗透，不是控制经济的方式。","kp":"列强控制中国经济的方式"},"2017-28":{"ex":"孙中山领导了辛亥革命（A），重新解释三民主义并提出联俄、联共、扶助农工三大政策（B），坚定维护民主共和制度和国家完整统一（D）。C 错：北伐战争是 1926 年国共合作后发动的，孙中山已于 1925 年逝世。","kp":"孙中山先生的伟大贡献"},"2017-29":{"ex":"十一届三中全会重新确立了马克思主义的思想路线、政治路线、组织路线（A），开始了思想、政治、组织等领域的全面拨乱反正（C），揭开了改革开放的序幕（D）。B 错：十一届三中全会是「开始形成以邓小平为核心的中央领导集体」，该选项去掉了「开始」，夸大了既成事实。","kp":"十一届三中全会的意义"},"2017-3":{"ex":"生产成本 = 生产资料价值 15 万元 + 工资 5 万元 = 20 万元；平均利润 = 成本 × 平均利润率 = 20 × 10% = 2 万元；生产价格 = 成本价格 + 平均利润 = 20 + 2 = 22 万元，故选 C。","kp":"商品的生产价格"},"2017-30":{"ex":"「法，平之如水」「廌，触不直者去之」表明传统法律文化中人们对法律的理解和诉求是：法律富含公平如水、正义神圣的意蕴（C），寄托着惩恶扬善、匡扶正义的价值追求（D）。A 君权神授是古代法律的思想基础而非材料所反映的诉求，B「至高无上的地位」与古代皇权高于法律的事实不符。","kp":"传统法律文化"},"2017-31":{"ex":"尊重他人权利既是一项法律义务，也是一项道德义务（A），是公民意识的重要内容（B），不尊重他人权利就可能丧失自己的权利（D）。C 错：教材强调「只有尊重他人权利才能更好实现自己的权利」，而非把相互尊重说成「权利实现的内在动力」。","kp":"尊重他人权利"},"2017-32":{"ex":"建立五大战区、组建战区联合作战指挥机构，是构建我军联合作战体系的历史性发展（A），是为实现中国梦强军梦作出的战略决策（B），是全面实施改革强军战略的标志性举措（D）。C 错：这是国内军事体制改革，不是「加强国际军事合作与交流」的步骤。","kp":"五大战区与联合作战指挥体系"},"2017-33":{"ex":"导致英国脱欧的主要因素有：英国「疑欧主义」传统（B）、欧洲遭遇史上最大难民潮冲击（C）、英国不愿接受欧盟某些监管规则束缚（D）。A 错：英国并非始终反对欧洲一体化，它曾积极推动欧洲单一市场建设，只是对超国家让渡主权持保留态度。","kp":"英国「脱欧」的原因"},"2017-4":{"ex":"二战后资本主义着重资本所有制形式的变化，从私人股份资本所有制、垄断资本私人所有制发展到法人资本所有制，后者已成为当代资本主义社会居主导地位的资本所有制形式，故选 A。B、C 是早期形式，D 是垄断资本主义阶段的形式。","kp":"当代资本主义所有制的变化"},"2017-5":{"ex":"过渡时期个体经济向社会主义集体经济过渡的形式是合作社经济，即通过互助合作把个体农民和手工业者组织起来，故选 C。A 私人资本主义经济属于资本主义性质，B 国营经济是社会主义性质，D 国家资本主义经济是私人资本主义向社会主义过渡的形式。","kp":"过渡时期的五种经济成分"},"2017-6":{"ex":"供给侧结构性改革是用改革办法推进结构调整，提高供给质量、满足人民群众需要，其根本目的是提高供给质量满足需要，故选 A。B、C、D 都是改革的手段、配套或任务，不是根本目的。","kp":"供给侧结构性改革"},"2017-7":{"ex":"在「四个全面」战略布局中，全面建成小康社会居于引领地位，是现阶段党和人民一切工作的总目标、总抓手，其余三个全面为之提供动力、保障与支撑，故选 B。","kp":"「四个全面」战略布局"},"2017-8":{"ex":"为解决「有承包权的人不种地、种地的人没有相应权利」的问题，我国实行农村土地所有权、承包权、经营权分置（「三权分置」），这一重大制度创新开始于 2016 年国务院《关于完善农村土地所有权承包权经营权分置办法的意见》，故选 A。B 集体经营性建设用地入市、D 耕地保护制度与此无关，C 家庭联产承包责任制是 1978 年后确立的旧制度。","kp":"农村土地制度改革"},"2017-9":{"ex":"甲午战争后列强掀起瓜分中国狂潮，集中表现为竞相在中国强占租借地、划分势力范围，故选 B。A 租界是 19 世纪 40 年代以后逐步形成的，并非「1895 年后」的集中表现；C 争夺在华工业垄断地位属经济侵略方式；D 蚕食边疆地区只是局部表现。","kp":"瓜分中国的狂潮"},"2018-1":{"ex":"马克思主义的诞生是资本主义经济社会发展到一定阶段的必然产物，是社会历史条件与创始人个人努力相互作用的结果。A 把历史必然性归为天赋的「超常认知能力」，B 把家庭出身当作决定因素，D 认为德国是当时最发达的国家（史实错误），均不成立。","kp":"马克思主义的创立条件"},"2018-10":{"ex":"洋务派是封建统治阶级内部的当权派，兴办洋务新政的根本目的是维护清朝封建统治，而不是发展资本主义。A 与其阶级属性相反，C、D 不是其主要目的。","kp":"洋务运动的性质与目的"},"2018-11":{"ex":"中国共产党领导的武装斗争实质上是工人阶级领导的农民战争——农民是革命的主力军，工人阶级通过共产党实现领导。B 领导阶级错误，C、D 都没有点明「农民战争」这一实质。","kp":"中国革命武装斗争的实质"},"2018-12":{"ex":"延安整风的主要任务是反对主观主义以整顿学风，这是最中心的任务。B、C 也是整风内容（反对宗派主义、反对党八股），但不是「最主要的任务」。","kp":"延安整风的主要任务"},"2018-13":{"ex":"社会公德的主要内容是文明礼貌、助人为乐、爱护公物、保护环境、遵纪守法，其中遵纪守法是社会公德最基本的要求。A、B、C 都是社会公德的内容，但不是最基本要求。","kp":"社会公德的基本要求"},"2018-14":{"ex":"公正是法治的生命线，司法公正对社会公正具有重要引领作用，是维护社会公平正义的最后一道防线。A「唯一标准」、B「最终目标」、D「决定因素」都夸大了司法的作用。","kp":"公正司法"},"2018-15":{"ex":"2017 年中央一号文件提出，新的历史阶段农业农村工作的主线是深入推进农业供给侧结构性改革。A、B、C 都是具体工作，不是主线。","kp":"农业供给侧结构性改革"},"2018-16":{"ex":"2017 年 12 月中国共产党与世界政党高层对话会的主题是「构建人类命运共同体、共同建设美好世界：政党的责任」。A、C、D 都是其他会议的主题。","kp":"中国共产党与世界政党高层对话会"},"2018-17":{"ex":"量子纠缠表明联系是客观的、普遍的（A），联系的形式复杂多样（C），这种相互作用根源于物质世界本身的统一性（D）。B 说联系是主观的、偶然的，直接违背联系客观性原理。","kp":"联系的客观性与世界的物质统一性"},"2018-18":{"ex":"A、B、C 分别说明客观必然性为历史选择提供空间、选择过程是能动性与规律性的统一、选择归根到底是人民群众的选择。D 把历史过程归结为个人主观意志，是唯心史观。","kp":"社会形态更替的必然性与选择性"},"2018-19":{"ex":"资本积累规模取决于对工人的剥削程度、劳动生产率的高低、所用资本与所费资本的差额以及资本家垫付资本的大小，四项都正确。","kp":"资本积累规模的影响因素"},"2018-2":{"ex":"「白马非马」只承认白马（个性）而否认马（共性），割裂了矛盾普遍性与特殊性即共性与个性的辩证统一。B 把共性个性偷换成本质现象，C 换成内容形式，D 换成形态功能，都与题干逻辑不符。","kp":"矛盾普遍性与特殊性"},"2018-20":{"ex":"A、B、D 都是当代资本主义社会阶层、阶级结构变化的实际表现。C 错误：职工持股和参与决策没有改变雇佣劳动者的地位，劳动者并未因此成为资本家集团的重要力量。","kp":"当代资本主义阶级结构的新变化"},"2018-21":{"ex":"A、B、D 分别从生产力状况、历史文化传统、时代与实践的发展说明社会主义发展道路多样性的原因。C 把民族因素和地理环境说成「决定因素」，属于地理环境决定论。","kp":"社会主义发展道路的多样性"},"2018-22":{"ex":"决胜全面建成小康社会必须打好防范化解重大风险、精准脱贫、污染防治三大攻坚战。C「产业结构调整」是经济工作的内容，不在三大攻坚战之列。","kp":"全面建成小康社会的三大攻坚战"},"2018-23":{"ex":"杭绍台高铁由民营资本控股、多种所有制共同出资，体现了各种所有制资本取长补短、相互促进（A），各种所有制企业公平参与市场竞争（B），以及改善企业股权结构和公司治理结构（D）。C 不选：项目由民营资本控股，不能说明国有资本的带动力和影响力。","kp":"混合所有制经济"},"2018-24":{"ex":"全面推行河长制要求完善生态环境损害责任终身追究制度、经济社会发展考核评价体系、生态环境保护管理制度，并理顺部门职责交叉的环保监管体制，四项均属制度建设内容。","kp":"生态文明制度建设"},"2018-25":{"ex":"B、C、D 分别说明政治属性是政党的第一属性、政治建设是党的根本性建设、旗帜鲜明讲政治是马克思主义政党的根本要求。A 错误：党的根本宗旨是全心全意为人民服务，不是「坚定政治立场」。","kp":"党的政治建设"},"2018-26":{"ex":"中国企业对外直接投资增长、境外企业销售额扩大，说明我国国际投资合作水平进一步提高（A），吸引外资的结构和质量不断优化（C）。B「已经形成」、D「完全转向高端」都绝对化了，与实际不符。","kp":"引进来与走出去并重"},"2018-27":{"ex":"古田会议决议规定红军必须绝对服从共产党的领导（A），担负打仗、筹款和做群众工作三大任务（B），并加强政治工作（C）。D 是抗战时期的全国军事总动员，与古田会议无关。","kp":"古田会议与思想建党、政治建军"},"2018-28":{"ex":"抗日民主政权实行「三三制」原则（A），各级政权机构领导人通过人民选举产生（B）。C「工农兵代表大会」是土地革命时期的制度，D 民族区域自治是新中国成立后的制度。","kp":"抗日民主根据地政权建设"},"2018-29":{"ex":"A、B、C、D 从国营经济力量、资本主义经济的弱小与困难、个体农业改造对工业化的必要性、国际环境的封锁与援助四方面，说明着力进行并可能进行社会主义改造的原因。","kp":"社会主义改造的历史必然性"},"2018-3":{"ex":"唯物史观认为人民群众是历史的主体和创造者，这是「以人民为中心」的直接理论依据。A 讲人的本质，C 讲人受社会制约，D 讲人的总体主体地位，都不能直接支撑「坚持人民主体地位」这一结论。","kp":"人民群众是历史的创造者"},"2018-30":{"ex":"A、B、C 正确：守法主体是一切组织和个人，守法是严格依法办事的活动和状态，也包括依法行使权利、履行义务。D 只说「遵守宪法和法律」，遗漏依法行使权利的一面，表述不完整。","kp":"守法的含义"},"2018-31":{"ex":"民法总则将「公序良俗」确立为基本原则，体现依法治国和以德治国的有机统一（A），法律为道德建设提供制度保障（B），是对传统公序良俗原则的继承和发展（C），道德为法律提供价值基础（D）。","kp":"依法治国与以德治国相结合"},"2018-32":{"ex":"设立雄安新区有利于探索人口经济密集地区优化开发新模式（A），调整优化京津冀城市布局和空间结构（C），集中疏解北京非首都功能（D）。B 不选：雄安地处内陆，不涉及沿海和内地对外开放新模式。","kp":"雄安新区的战略意义"},"2018-33":{"ex":"「金砖+」进一步推动了全球治理体系改善（B），对南南合作形成有机补充（C），全面提升了金砖机制的代表性和影响力（D）。A 夸大其词：南北对话的僵局并未因此「破解」。","kp":"「金砖+」合作模式"},"2018-34":{"ex":"得分要点：①复杂事物中必有一种主要矛盾起领导、决定作用，要善于抓主要矛盾，集中力量解决主要矛盾（材料中「用全力找出主要矛盾」）；②主要矛盾与次要矛盾相互依存、相互影响，抓主要矛盾的同时不能忽视次要矛盾的解决；③矛盾有特殊性，要具体问题具体分析，「牵牛要牵牛鼻子」；④坚持两点论与重点论相统一，把主要矛盾的解决作为工作重点，又统筹兼顾。","kp":"分析题：矛盾分析法、主要矛盾"},"2018-35":{"ex":"得分要点：①中国特色社会主义进入新时代是我国发展新的历史方位，意味着中华民族迎来从站起来、富起来到强起来的伟大飞跃；②新时代社会主要矛盾转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾；③主要矛盾的变化没有改变我国仍处于社会主义初级阶段的判断，我国仍是最大发展中国家；④解决主要矛盾必须坚持以人民为中心，贯彻新发展理念，推动高质量发展，实现共同富裕。","kp":"分析题：新时代与社会主要矛盾"},"2018-36":{"ex":"得分要点：①太平天国运动、洋务运动、戊戌维新和辛亥革命等都没有改变中国的半殖民地半封建命运，说明旧的思想武器和道路都失败了；②十月革命一声炮响送来马克思列宁主义，五四运动促进了马克思主义在中国的传播，中国共产党应运而生；③马克思主义之所以在中国行，是因为它揭示了人类社会发展规律，并且能同中国具体实际相结合、同中华优秀传统文化相结合；④历史证明，只有社会主义才能救中国，只有坚持和发展中国特色社会主义才能实现中华民族伟大复兴。","kp":"分析题：三大运动与马克思主义在中国的确立"},"2018-37":{"ex":"得分要点：①人生价值包括自我价值和社会价值，社会价值即个人对社会和他人的贡献，是人生价值的主要方面；②评价人生价值的标准首先看对社会和他人的贡献，黄旭华隐姓埋名三十年为国铸重器，体现了崇高的人生价值；③实现人生价值需要在实践中创造必要条件，包括提高自身素质和能力、立足本职岗位艰苦奋斗；④要把个人理想融入国家和民族事业，在服务人民、奉献社会中实现人生价值。","kp":"分析题：人生价值与奉献"},"2018-38":{"ex":"得分要点：①世界面临百年未有之大变局，不稳定性不确定性突出，传统与非传统安全威胁交织，西方主导的全球治理难以应对；②人类命运共同体理念主张建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界，回应了「世界怎么了、我们怎么办」的时代之问；③中国坚持共商共建共享的全球治理观，推动构建相互尊重、公平正义、合作共赢的新型国际关系；④共建「一带一路」是重要实践平台，中国以实际行动为世界和平与发展作出贡献。","kp":"分析题：人类命运共同体与全球治理"},"2018-4":{"ex":"马克思指出，劳动二重性（具体劳动与抽象劳动）是理解政治经济学的枢纽：它揭示了价值的源泉，并派生出商品二因素、剩余价值等一系列理论。A、B、D 都是在此基础之上展开的理论，不是枢纽本身。","kp":"劳动二重性"},"2018-5":{"ex":"党的十九大报告明确，经济体制改革的重点是完善产权制度和要素市场化配置。A 讲供给体系，C 讲对外开放，D 讲区域协调发展，都是重要任务但不是「重点」。","kp":"经济体制改革的重点"},"2018-6":{"ex":"协商民主是我国在选举民主之外找到的、保证人民在日常政治生活中有广泛持续深入参与权利的特有民主形式，是社会主义民主政治的特有形式和独特优势。A、C、D 都不是我国特有的民主形式。","kp":"社会主义协商民主"},"2018-7":{"ex":"《国家创新驱动发展战略纲要》确定的方针是「自主创新、重点跨越、支撑发展、引领未来」。A 只是部分思路，B 是产学研结合的要求，D 中「消极」二字为 OCR 错字且表述不完整。","kp":"创新驱动发展战略方针"},"2018-8":{"ex":"坚持「九二共识」、反对「台独」是两岸关系和平发展的政治基础。B 只讲基本态度，C 讲认同问题，D 讲利益融合，都是重要举措，都不构成政治基础。","kp":"两岸关系和平发展的政治基础"},"2018-9":{"ex":"近代中国半殖民地半封建社会矛盾众多，其中帝国主义和中华民族的矛盾是最主要的矛盾，贯穿始终并起决定性作用。A、C 是封建社会的矛盾，B 是资本主义社会的矛盾。","kp":"近代中国社会的主要矛盾"},"2019-1":{"ex":"1847 年马克思、恩格斯把正义者同盟改组为共产主义者同盟，这是世界上第一个以科学社会主义为指导的无产阶级政党，并受其委托起草了《共产党宣言》。A 国际工人协会（第一国际）是 1864 年成立的各国工人团体联合组织，不是政党；B 正义者同盟是共产主义者同盟的前身；D 社会主义工人国际是 1923 年成立的第二半国际后继组织，与马恩无关。","kp":"马克思主义的创立"},"2019-10":{"ex":"1922 年 9 月安源路矿工人大罢工是党第一次独立领导并取得完全胜利的工人斗争，选 A。B 香港海员罢工（1922 年初）是第一次工人运动高潮的起点，但由香港海员工会领导；C 京汉铁路大罢工（1923）遭镇压失败；D 开滦五矿罢工亦被镇压。","kp":"中国共产党领导的工人运动"},"2019-11":{"ex":"中共中央促成西安事变和平解决，是从中华民族根本利益出发，为了团结国民党共同抗日，选 A。B 与事实相反；C 党的工作重心由乡村转向城市是 1949 年七届二中全会；D 和平解决方针是党独立自主作出的判断，不是「接受共产国际指示」。","kp":"西安事变"},"2019-12":{"ex":"抗战胜利后，中国共产党为争取和平民主、反对内战独裁，毛泽东亲赴重庆谈判，选 D。A 当时内战尚未全面爆发，谈判目的不是「结束国共内战」；B 抗日已胜利；C 与题意无关。","kp":"重庆谈判"},"2019-13":{"ex":"我国是中国共产党领导的社会主义国家，这就决定了教育必须把培养社会主义建设者和接班人作为根本任务，选 D。A、B、C 都是教育事业发展的重要任务或路径，不是「根本任务」。","kp":"教育的根本任务"},"2019-14":{"ex":"马克思这句话强调为同时代人工作才能使自己完美，即个人价值在社会价值实现中得到实现，二者统一，选 B。A 因果颠倒：社会价值是自我价值实现的基础而非结果；C 社会价值不能代替自我价值；D 个人价值取决于对社会和他人的贡献，不是「他人认可」。","kp":"人生价值的评价与实现"},"2019-15":{"ex":"白皮书指出中美经贸摩擦是正常的，关键在于如何增进互信、促进合作、管控分歧，选 A。B、D 的「加征关税」是摩擦手段而非解决之道；C「消除逆差」不现实，中美经贸问题不能靠单方面压制解决。","kp":"中美经贸摩擦"},"2019-16":{"ex":"2018 年 4 月 27 日金正恩与文在寅在板门店会晤，共同签署并发表《为促进朝鲜半岛和平、繁荣、统一的板门店宣言》，选 D。A、B 是 2000 年、2007 年两次朝韩首脑会晤的文件；C 是 2018 年 9 月平壤会晤的军事协议。","kp":"朝韩首脑会晤"},"2019-17":{"ex":"虚拟现实构造出的虚拟环境仍然是物质技术系统作用的结果，说明物质世界的存在形式具有多样性（B），人们可以通过实践创造出自然界原本不存在的现实状态（D）。A 错：物质世界的客观实在性不会因虚拟技术改变；C 错：信息是物质的属性和运动状态，不是独立于物质和意识的「第三种存在」。","kp":"物质与意识的辩证关系、实践"},"2019-18":{"ex":"人类严格控制基因编辑，是因为实践必须遵循真理尺度与价值尺度的统一（A）、人的实践活动是合规律性与合目的性的统一（D）；基因编辑可能突破伦理道德底线（B），科学技术有时表现为异己的、敌对的力量（C），都可能带来不可逆的伤害，故四项全选。","kp":"真理尺度与价值尺度"},"2019-19":{"ex":"利润率平均化是部门之间竞争的结果：资本在部门间转移，使各部门等量资本获得大体相等的平均利润，因此某企业工人创造的剩余价值有被其他部门资本家侵占的可能（A），各部门资本家在加强对工人阶级的剥削上有着共同的阶级利益（C）。B 错在「部门内」——平均化发生在部门之间，部门内各企业利润率并不相等；D 错在「总是低于」，银行资本家同样获得平均利润。","kp":"平均利润的形成"},"2019-2":{"ex":"橘与枳是同一物种在不同水土条件下呈现不同性状，说明事物的性质、发展变化依赖于一定的时间、地点和条件，条件变了结果就变，故选 A。B 讲联系的「中介」，C 讲联系之网上的「网结」，D 讲发展的过程性，三者都不是题干「水土异也」的落点。","kp":"联系的条件性"},"2019-20":{"ex":"过渡是复杂长期的过程，原因在于资本主义发展具有不平衡性（B）、资本主义社会具有一定的自我调节能力（C）、当代资本主义生产关系对生产力还有容纳空间（D）。A 错在「绝对稳定性」——任何社会形态都只有相对稳定性，且与「长期性」构不成因果。","kp":"资本主义向社会主义过渡的长期性"},"2019-21":{"ex":"「四个不是」说明科学社会主义绝不是一成不变的教条（A），它吸收人类优秀文化成果、是人类优秀文化传统的历史延续（C），在不同时代具有不同的内容和形式（D）。B 错：科学社会主义正是在资本主义生产方式发展到一定阶段、批判资本主义的过程中产生的，与资本主义生产方式有必然联系。","kp":"科学社会主义一般原则"},"2019-22":{"ex":"主要矛盾变化没有改变社会主义初级阶段的判断，依据是：我国总体上仍处于不发达阶段（A），仍是世界上最大的发展中国家（C），主要矛盾的变化只是社会主义初级阶段这一历史阶段中的变化（D）。B 国际环境复杂不是判断社会发展阶段的依据。","kp":"新时代社会主要矛盾的「变」与「不变」"},"2019-23":{"ex":"民营经济是推动社会主义市场经济发展的重要力量（B）、建设现代化经济体系的重要主体（C）、实现中华民族伟大复兴中国梦的重要力量（A）。D 错：控制国民经济命脉、起主导作用的是国有经济。","kp":"民营经济的地位"},"2019-24":{"ex":"二者相辅相成构成有机整体（A）：好的国家治理体系可以提高治理能力（B），提高治理能力可以充分发挥治理体系的效能（C）。D 错在「越完备就一定越强」——制度完备不等于执行能力强，二者不能简单画等号。","kp":"国家治理体系与治理能力"},"2019-25":{"ex":"正确处理「一国」与「两制」关系要做到三个「有机结合」：坚持「一国」原则和尊重「两制」差异结合（B）、维护中央权力和保障特别行政区高度自治权结合（C）、发挥祖国内地坚强后盾作用和提高港澳自身竞争力结合（D）。A「利用国际有利条件」不属于处理「一国」与「两制」关系的内容。","kp":"「一国两制」的关系"},"2019-26":{"ex":"中国特色社会主义文化源自中华民族五千多年文明历史孕育的中华优秀传统文化（A）、熔铸于党领导人民创造的革命文化和社会主义先进文化（C）、植根于中国特色社会主义伟大实践（D）。B 写成「承继于革命文化」，与原表述「熔铸于」不符，是同类题常见的偷换措辞项，故不选。","kp":"文化自信的底气"},"2019-27":{"ex":"毛泽东选择井冈山，是因为该地区有较好的群众基础（A）、地势险要易守难攻（B）、易于筹款筹粮（C）、敌人统治力量比较薄弱（D），四项都成立。","kp":"井冈山革命根据地"},"2019-28":{"ex":"新中国成立标志着新民主主义革命取得基本胜利（A）、半殖民地半封建社会结束（B）、中国共产党成为全国执政党、地位发生根本变化（C）。D 错：社会主义基本制度确立是 1956 年三大改造完成后的事。","kp":"中华人民共和国成立的意义"},"2019-29":{"ex":"十一届三中全会指出农业发展速度不快，当时农村面临的主要问题是农民的温饱问题尚未完全解决（A）、人民公社制度亟待改革（C）。B 错：土地改革 1952 年已基本完成；D 错：乡镇企业是 20 世纪 80 年代才发展起来的。","kp":"农村改革的历史背景"},"2019-3":{"ex":"马克思在《〈政治经济学批判〉序言》中说：判断变革时代必须从物质生活的矛盾、从社会生产力与生产关系之间的现存冲突中去解释，故 A 正确。经济基础与上层建筑的冲突由生产力与生产关系的冲突派生，是 B 而非「从根本上说」；C、D 都不是马克思这句话所指。","kp":"社会基本矛盾"},"2019-30":{"ex":"社会主义核心价值观是坚持和发展中国特色社会主义的价值遵循（A），是提高国家文化软实力的迫切要求（B），是增进社会团结和谐的最大公约数（C）。D 错：构建人类命运共同体的行动指南不是核心价值观的定位。","kp":"社会主义核心价值观的意义"},"2019-31":{"ex":"法治与德治是治国理政不可或缺的两种方式，因为二者发挥作用的方式不同（A）、实现途径不同（B）、所处地位不同（C）、调整范围不同（D），不能相互替代，故四项全选。","kp":"依法治国与以德治国相结合"},"2019-32":{"ex":"习近平总书记提出对外工作要把握好四对关系：世界多极化与大国关系调整（A）、经济全球化与世界经济格局演变（B）、国际环境总体稳定与国际安全挑战复杂（C）、文明交流互鉴与思想文化相互激荡（D），四项全选。","kp":"中央外事工作会议"},"2019-33":{"ex":"2018 年安倍访华期间，双方签署中日双边本币互换协议（A）、中日海上搜寻救助合作协定（B），确认恪守中日四个政治文件各项原则（C），并同意将 2019 年定为「中日青少年交流促进年」（D），四项全选。","kp":"中日关系改善成果"},"2019-34"
