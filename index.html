:{"ex":"得分要点：①1978 年十一届三中全会作出改革开放的历史性决策，实现了新中国成立以来党的历史上具有深远意义的伟大转折；②改革开放是决定当代中国命运的关键一招，也是实现中华民族伟大复兴的关键一招；③中国特色社会主义是改革开放以来党的全部理论和实践的主题，是党和人民历尽千辛万苦取得的根本成就；④实践充分证明，改革开放是坚持和发展中国特色社会主义的必由之路，必须将改革进行到底。","kp":"分析题：改革开放与中国特色社会主义"},"2019-35":{"ex":"得分要点：①深圳等经济特区是我国改革开放的重要窗口和试验田，杀出一条血路，为全国改革开放探索了经验；②创办经济特区是党和国家为推进改革开放和社会主义现代化建设作出的重大决策，体现了敢闯敢试、敢为人先的特区精神；③特区的发展成就证明改革开放是正确之路、强国之路、富民之路；④新时代要弘扬特区精神，坚持改革开放，在更高起点、更高层次、更高目标上推进改革开放。","kp":"分析题：经济特区与改革开放"},"2019-36":{"ex":"得分要点：①马克思主义是科学的理论、人民的理论、实践的理论、不断发展的开放的理论，为中国人民指明了前进方向；②马克思主义传入中国后，中国共产党把马克思主义基本原理同中国具体实际相结合，实现了两次历史性飞跃，创造了中国革命、建设、改革的伟大成就；③马克思主义中国化时代化的理论成果是党和人民实践经验和集体智慧的结晶，是行动指南；④必须坚持马克思主义指导地位，不断推进理论创新，坚持和发展当代中国马克思主义、二十一世纪马克思主义。","kp":"分析题：马克思主义深刻改变中国"},"2019-37":{"ex":"得分要点：①英雄烈士是民族的脊梁，崇尚英雄、缅怀先烈是弘扬民族精神和时代精神的重要内容；②理想信念是共产党人精神上的「钙」，英烈的牺牲奉献源于坚定的理想信念；③要铭记英雄、崇尚英雄、捍卫英雄、学习英雄、关爱英雄，旗帜鲜明反对历史虚无主义；④把对英烈的崇敬转化为爱国奋斗的实际行动，在实现中华民族伟大复兴中贡献力量。","kp":"分析题：崇尚英雄与理想信念"},"2019-38":{"ex":"得分要点：①四大主场外交活动展示了中国推动构建人类命运共同体的坚定决心和务实行动；②提出人类命运共同体理念，是因为各国相互联系、相互依存，全球性问题需要各国共同应对；③中国坚持对外开放基本国策，推动建设开放型世界经济，为世界经济增长提供动力；④中国是世界和平的建设者、全球发展的贡献者、国际秩序的维护者，构建人类命运共同体是各方共同的责任。","kp":"分析题：主场外交与人类命运共同体"},"2019-4":{"ex":"私人劳动和社会劳动的矛盾决定商品生产者的命运：私人劳动能否转化为社会劳动，决定使用价值能否让渡、价值能否实现，因此它是私有制商品经济的基本矛盾，选 B。A 使用价值与价值的矛盾、C 具体劳动与抽象劳动的矛盾，都是这一基本矛盾的具体表现。","kp":"私有制商品经济的基本矛盾"},"2019-5":{"ex":"这一思想的核心要义是坚持和发展中国特色社会主义，故选 A。B 实现社会主义现代化是总任务（建成社会主义现代化强国、实现中华民族伟大复兴）的一部分；C 是这一思想形成的理论品格；D 是初级阶段基本路线的内容，均不是「核心要义」。","kp":"习近平新时代中国特色社会主义思想的核心要义"},"2019-6":{"ex":"总体国家安全观以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托，题干问「宗旨」，选 C。A 是根本，B 是基础，D 是保障。","kp":"总体国家安全观"},"2019-7":{"ex":"新时代党的建设总要求明确「坚持党要管党、全面从严治党」是党的建设根本方针，选 B。A 加强党的长期执政能力建设是主线之一，C 解放思想、改革创新是动力，D 政治建设是统领，都不叫「根本方针」。","kp":"党的建设总要求"},"2019-8":{"ex":"实施乡村振兴战略是新时代「三农」工作的总抓手，其根本目的是推进农业农村现代化，选 D。A 确保国家粮食安全是底线要求，B、C 是具体举措，都不能覆盖「根本目的」。","kp":"乡村振兴战略"},"2019-9":{"ex":"说它是资产阶级性质的改良运动，是因为变法的政令在一定程度上反映了资产阶级的政治和经济诉求，故选 C。A 错在「触及封建制度根本」——维新派恰恰不敢否定封建制度；B 错在「开国会」等主张并未被采纳；D 戊戌变法带有妥协性、不彻底性，与「彻底性和不妥协性」相反。","kp":"戊戌维新运动的性质"},"2020-1":{"ex":"《反杜林论》系统阐述了哲学、政治经济学和科学社会主义三个组成部分，被称为马克思主义的百科全书，故选 C。A《共产党宣言》是马克思主义诞生的标志，B《家庭、私有制和国家的起源》是唯物史观关于国家起源的专门著作，D《自然辩证法》是未完成手稿，都不是「全面阐述理论体系」的著作。","kp":"马克思主义理论体系的全面阐述"},"2020-10":{"ex":"1905—1907 年论战的核心是要不要以革命手段推翻清王朝，故选 A。B 要不要推翻帝制实行共和、C 要不要社会革命（平均地权）、D 要不要发动民众，都是论战涉及的问题，但焦点在三者之中以「用革命手段推翻清政府」最为根本。","kp":"革命派与改良派论战"},"2020-11":{"ex":"党成立后不久就采取群众路线的方法，深入工农群众、发动群众，这是民族资产阶级、小资产阶级政党不可能采取的路线，故选 B。A 土地革命、C 统一战线、D 武装斗争都是党的重要方法，但题干强调的「资产阶级政党没有采取也不可能采取」的正是群众路线。","kp":"中国共产党的群众路线"},"2020-12":{"ex":"社会主义基本制度建立，标志着我国进入全面建设社会主义的历史阶段，故选 A。B 半殖民地半封建社会结束是 1949 年新中国成立；C 社会主义工业化当时只是起步；D 新民主主义革命基本胜利也是 1949 年。","kp":"社会主义基本制度确立的意义"},"2020-13":{"ex":"全面依法治国的总抓手是建设中国特色社会主义法治体系，故选 B。A 依法治国与以德治国相结合是原则，C、D 是具体环节要求，都不能「总揽全局、牵引各方」。","kp":"全面依法治国的总抓手"},"2020-14":{"ex":"当代中国爱国主义的本质是坚持爱国和爱党、爱社会主义高度统一，故选 A。B 民族平等、C 归属感认同感、D 立足民族与面向世界，都是爱国主义的具体要求或特征，不是「本质」。","kp":"当代中国爱国主义的本质"},"2020-15":{"ex":"对青少年进行爱国主义教育的主阵地是思想政治理论课，故选 C。A 手机互联网是新兴渠道，B 精品读物、D 传统节日活动是载体，都不是「主阵地」。","kp":"爱国主义教育的主阵地"},"2020-16":{"ex":"美国退约的真实原因是自我松绑、谋求绝对军事优势，故选 C。A 与事实不符（美方先指责俄方违约并借此退约）；B 退约恰恰破坏战略平衡；D 不是退约的「真实原因」。","kp":"美国退出《中导条约》"},"2020-17":{"ex":"人类首次拍到黑洞照片，说明空间的性质依赖于物质的分布及其运动状态（A），也再次印证世界是物质的统一体（B）。C 错：物质世界的客观存在不以人的实践和认识水平为转移；D「空间观念随认识发展而拓展」表述本身有合理性，但本题落点在「黑洞照片验证相对论预言」，官方答案不含 D。","kp":"时空与物质的不可分性"},"2020-18":{"ex":"区块链延伸了人与人之间的联系，但现实社会关系具有多样性和复杂性（B），归根到底受生产关系制约（C）。A 错：社会关系不只有经济商业关系；D 错：信息技术构建的是虚拟关系，不能取代现实的、以生产关系为基础的社会关系。","kp":"社会关系的本质"},"2020-19":{"ex":"不同地理空间发展出不同经济形态，进而形成有明显地域差别的文化，说明社会经济状况决定文化发展形态（A）；地域文化在交通通信高度发达的今天并未消失，还在持续影响社会发展，说明文化具有相对独立性（D）。B 的问题在于把地理环境的作用缩到「外在特征」，而材料讲的是地理环境经由经济形态塑造文化内容；C 错：决定社会发展的是物质资料生产方式，不是文化。","kp":"文化与社会经济、地理环境"},"2020-2":{"ex":"对人工智能社会效用的评价，是看客体属性是否满足主体需要，属于价值性评价，不是对规律的真理性（事实）评价，故选 D。A 说的是事实判断；B 评价的是客体对主体的意义而非「主体需要的发展程度」；C 强调主观随意，评价虽然受主体影响，但根本上要以客体属性为依据，不能归为「主观性评价」。","kp":"价值评价的特点"},"2020-20":{"ex":"产业资本循环在空间上同时并存货币资本、生产资本、商品资本三种职能形式，故选 ACD。B 借贷资本属于生息资本，不参与产业资本循环的三种形式划分。","kp":"产业资本循环的三种职能形式"},"2020-21":{"ex":"国际货币基金组织、世界银行、世贸组织促进了各国各经济体之间的联系（A）、推动商品和服务贸易迅速增加（B）、加快资本和技术等要素的国际流动（D）。C 错：这些机构无法「有效应对」全球性经济波动和危机，2008 年金融危机即为反例。","kp":"国际经济机构与全球化"},"2020-22":{"ex":"人民需要由「有没有」转向「好不好」，表明社会主要矛盾发生历史性变化（A）、人民需要出现阶段性新特征（C）、不平衡不充分的发展成为制约满足人民需要的主要因素（D）。B 错：我国尚未完全满足「从有到优」的需求，正是这一矛盾要解决的问题。","kp":"新时代社会主要矛盾"},"2020-23":{"ex":"支持深圳建设先行示范区，有利于更好实施粤港澳大湾区战略、丰富「一国两制」事业发展新实践（A），在更高起点更高层次更高目标上推进改革开放（B），率先探索全面建设社会主义现代化国家新路径（C）。D 错：全面建成小康社会的重点难点在农村特别是深度贫困地区，与深圳示范区的定位不符。","kp":"深圳建设中国特色社会主义先行示范区"},"2020-24":{"ex":"确保到 2020 年现行标准下农村贫困人口全部脱贫，举措包括坚持精准扶贫精准脱贫（A）、强化党政一把手负总责的责任制（B）、扶贫同扶志扶智相结合（C）、重点攻克深度贫困地区脱贫任务（D），四项全选。","kp":"脱贫攻坚的举措"},"2020-25":{"ex":"建立以国家公园为主体的自然保护地体系，有利于推进自然生态保护、建设美丽中国（A），保护重要的自然生态系统和独特自然遗产（B），促进人与自然和谐共生（C），维护国家生态安全（D），四项全选。","kp":"自然保护地体系的意义"},"2020-26":{"ex":"绝不能触碰的底线是危害国家主权安全（A）、挑战中央权力和香港特别行政区基本法权威（C）、利用香港对内地进行渗透破坏活动（D）。B 错：内地与香港的民间交流是正常往来，不属于触碰底线。","kp":"「一国两制」的原则底线"},"2020-27":{"ex":"列强不能像在印度那样对中国实施殖民统治，原因在于中国人民顽强持久的反抗（A）、列强之间争夺中国的矛盾无法协调（B）、中国长期以来是一个统一的大国（D）。C 错：中国封建势力恰恰与列强相勾结，并非「拒绝合作」。","kp":"列强未能瓜分中国的原因"},"2020-28":{"ex":"这场运动一开始就注意从中国实际出发学习运用马克思主义（A），重视马克思主义基本理论的学习（B），提出知识分子同劳动群众相结合的思想（C）。D 错：「马克思主义与中国实际相结合」这一命题是 1938 年毛泽东在六届六中全会上明确提出的，早期运动尚未提出。","kp":"早期马克思主义思想运动的特点"},"2020-29":{"ex":"抗美援朝胜利提高了新中国的国际威望、赢得相对稳定的和平环境（B），捍卫了国家安全、为维护亚洲和世界和平作出贡献（C），打破了美军不可战胜的神话、增强了民族自信心自豪感（D）。A 错：「结束美国在东方的霸权」夸大了战争的作用。","kp":"抗美援朝战争胜利的意义"},"2020-3":{"ex":"复杂劳动换算为简单劳动，不是谁事先规定、计算或协商的，而是在商品交换过程中由市场机制自发实现的，故选 D。A、B、C 都假设存在一个有意识的计算者或规定者，与商品经济的内在规律不符。","kp":"复杂劳动与简单劳动"},"2020-30":{"ex":"《新时代公民道德建设实施纲要》提出的重点任务是传承中华传统美德（A）、培育践行社会主义核心价值观（B）、筑牢理想信念之基（C）、弘扬民族精神和时代精神（D），四项全选。","kp":"新时代公民道德建设的重点任务"},"2020-31":{"ex":"表达权的行使不能随心所欲：要有目的的正当性（B），不能超过法定限度（C），要遵循程序正当原则（D）。A 错：行使方式具有多样性，不存在「唯一性」。","kp":"权利行使的界限"},"2020-32":{"ex":"嫦娥四号实现了人类探测器首次月背软着陆（A），实现了首次月背与地球的中继通信（C），开启了人类月球探测新篇章（D）。B 错：我国空间站建设始于 2021 年天和核心舱发射，与嫦娥四号无关。","kp":"嫦娥四号月背软着陆"},"2020-33":{"ex":"习近平提出：始终以互信为基石巩固彼此战略依托（A），着力深化利益交融拉紧共同利益纽带（B），促进民心相通夯实世代友好的民意基础（C），更加担当有为携手维护世界和平安宁（D），四项全选。","kp":"新时代中俄关系的主张"},"2020-34":{"ex":"得分要点：①化学农药在杀灭害虫的同时污染环境、危害生态，说明事物都有两面性，要坚持两点论，全面看待科技进步的作用；②矛盾双方在一定条件下相互转化，人类不合理利用自然会使自己受害，必须尊重自然、顺应自然、保护自然；③人与自然是生命共同体，人类对大自然的伤害最终会伤及人类自身；④要坚持绿色发展，在尊重规律基础上发挥主观能动性，走人与自然和谐共生的现代化道路。","kp":"分析题：人与自然、矛盾双方转化"},"2020-35":{"ex":"得分要点：①我国国家制度和国家治理体系具有显著优势，最本质的特征是中国共产党领导，最大优势是党的领导；②制度优势体现在集中力量办大事、坚持人民主体地位、解放和发展社会生产力等方面，是我国发展稳定的根本保证；③制度建设是社会主义现代化建设的重要内容，要把制度建设和治理能力建设摆到更加突出位置；④坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化，把制度优势更好转化为治理效能。","kp":"分析题：中国特色社会主义制度优势"},"2020-36":{"ex":"得分要点：①中共中央进驻香山，是中国革命重心从农村转向城市的重要标志，也是党从局部执政走向全国执政的重要一步；②毛泽东提出「进京赶考」，警示全党务必保持谦虚谨慎、不骄不躁的作风，务必保持艰苦奋斗的作风；③新时代「赶考」远未结束，要坚持党的全面领导，勇于自我革命，保持同人民群众的血肉联系；④要牢记初心使命，在实现中华民族伟大复兴的征程上答好新时代的答卷。","kp":"分析题：香山革命纪念地与「赶考」"},"2020-37":{"ex":"得分要点：①评价人生价值的根本尺度是看一个人的实践活动是否符合社会发展客观规律、是否促进了历史进步，主要看其对社会和他人的贡献；②张富清深藏功名、扎根基层，把人民利益放在首位，实现了社会价值与自我价值的高度统一；③实现人生价值需要在劳动和奉献中创造价值，在个人与社会的统一中实现价值，在砥砺自我中走向成功；④新时代青年要崇尚英雄、学习英雄，把个人理想融入国家发展，在平凡岗位上创造不平凡的业绩。","kp":"分析题：张富清与人生价值"},"2020-38":{"ex":"得分要点：①经济全球化是社会生产力发展的客观要求和科技进步的必然结果，是不可逆转的历史大势；②举办进博会是中国支持多边贸易体制、推动发展自由贸易、推动建设开放型世界经济的实际行动；③中国坚持对外开放基本国策，以开放促改革促发展，为世界经济增长提供新机遇，是经济全球化的坚定支持者和建设者；④要坚持共商共建共享，推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展，构建人类命运共同体。","kp":"分析题：进博会与经济全球化"},"2020-4":{"ex":"列宁依据资本主义经济政治发展不平衡规律，提出社会主义可能首先在一国或少数国家获得胜利，故选 A。B 当时资本主义处于发展上升期而非「不断衰落」；C、D 是客观条件的变化，不是理论依据本身。","kp":"社会主义革命可能在一国首先胜利"},"2020-5":{"ex":"搞清楚「什么是社会主义、怎样建设社会主义」，关键是在坚持社会主义基本制度的基础上进一步揭示社会主义的本质，即解放生产力、发展生产力，消灭剥削、消除两极分化，最终达到共同富裕，故选 C。A、B 是发展阶段和根本任务层面的问题；D 揭示一般规律不能直接回答「什么是社会主义」。","kp":"社会主义本质论"},"2020-6":{"ex":"全面提升实体经济发展水平的重点是加快发展先进制造业，推动制造业高质量发展，故选 A。B 要素市场化配置改革、C 人力资本培育、D「三去一降一补」都是重要举措，但不是「提升实体经济」的聚焦点。","kp":"发展实体经济的重点"},"2020-7":{"ex":"习近平指出，新时代做好人民政协工作的中心环节是加强思想政治引领、广泛凝聚共识，故选 B。A 是政协履职水平要求，C 是政协的性质定位（专门协商机构），D 是委员队伍建设要求。","kp":"新时代人民政协工作的中心环节"},"2020-8":{"ex":"习近平指出，两岸长期存在的政治分歧是影响两岸关系行稳致远的总根子，故选 B。A 不是「总根子」的规范表述；C「台独」分裂势力是最大威胁，D 外部势力干涉是重要因素，两者都不是「总根子」这一提法。","kp":"两岸关系"},"2020-9":{"ex":"要争得民族独立和人民解放，必须首先进行反帝反封建的民主革命，推翻帝国主义和封建主义的统治，故选 D。A、C 是革命胜利后的建设任务；B 废除封建土地所有制是民主革命的内容之一，不能取代「首先进行民主革命」的整体判断。","kp":"近代中国的两大历史任务"},"2021-1":{"ex":"《德意志意识形态》（1845—1846）是马克思、恩格斯首次系统阐述历史唯物主义基本观点的著作，标志唯物史观的基本形成。B《神圣家族》是向唯物史观过渡的著作，C《哲学的贫困》批判蒲鲁东，D《共产党宣言》是科学社会主义诞生的标志。","kp":"首次系统阐述唯物史观的著作"},"2021-10":{"ex":"中国人民抗日战争胜利的关键是中国共产党在全民族抗战中发挥了中流砥柱作用（D）。A、B、C 都是胜利的重要原因或条件，但不是「关键」。","kp":"抗日战争胜利的关键"},"2021-11":{"ex":"1949 年中国人民政治协商会议的召开，标志着中国共产党领导的多党合作和政治协商制度即新型政协制度的建立（D）。A 民族区域自治、B 工农兵代表大会、C 人民代表大会制度都不是这次会议建立的。","kp":"人民政协的召开"},"2021-12":{"ex":"我国对资本主义工商业的社会主义改造采取和平赎买政策（C），通过国家资本主义形式逐步过渡，避免了暴力剥夺。A 是农业合作化的做法，B 是调整方针，D 是剥夺没收，与我国实际不符。","kp":"资本主义工商业改造的形式"},"2021-13":{"ex":"个人与社会的关系最根本的是个人利益与社会利益的关系（B），它贯穿于个人价值、理想等关系之中。A、C、D 都是这一根本关系的具体表现。","kp":"个人与社会的关系"},"2021-14":{"ex":"《新时代爱国主义教育实施纲要》强调，爱国主义教育要着力维护祖国统一和民族团结（C）。A、B、D 是爱国主义教育的内容或要求，不是「着力点」的表述。","kp":"新时代爱国主义教育的着力点"},"2021-15":{"ex":"北斗三号全球卫星导航系统建成开通，标志着我国成为世界上第三个独立拥有全球卫星导航系统的国家（B）。A 指北斗一号，C「都已使用」失实，D「第二步目标」与建成开通不符。","kp":"北斗三号建成的标志意义"},"2021-16":{"ex":"2020 年中国国际服务贸易交易会的主题是「全球服务，互惠共享」（D）。A、B、C 都是其他会议或论坛的主题词。","kp":"2020 年服贸会主题"},"2021-17":{"ex":"「南极墙」的发现说明未知世界与已知世界都是客观存在的（A），世界只有尚未认识之物、没有不可认识之物（D）。B 错误：物质世界的时空是无限的；C 错误：世界的本原是物质而非暗物质、暗能量。","kp":"世界的物质统一性与可知性"},"2021-18":{"ex":"A 选项错误。人与自然是和谐共生的，人类生存一方面要不断从自然界中获取所需的生活资料，另一方面要适应自然的变化；但人不像动物那样只能被动适应环境，人有主动性和自主性，可以积极主动地改造自然。B 选项错误。人类生存发展的决定性因素是物质资料的生产方式。C、D 正确。自然是人类生存和发展的重要前提，人在受自然制约的同时也改变着自然。","kp":"人与自然的关系"},"2021-19":{"ex":"商品经济产生有两个条件：社会分工的出现及其存在（B），生产资料和劳动产品属于不同所有者（A）。C 是商品二因素而非产生条件，D 是价值形式发展的结果，都颠倒了因果。","kp":"商品经济产生的社会历史条件"},"2021-2":{"ex":"人们能汲取历史经验教训，根本原因在于人类历史发展存在着不以人的意志为转移的客观规律，人们可以认识并利用它。A 混淆社会规律与自然规律，C「循环往复」是循环史观，D「完全掌握」绝对化。","kp":"社会规律的客观性"},"2021-20":{"ex":"把人工流水线改成机器流水线，资本技术构成提高（C）；生产资料价格下降而劳动力价值相对提高，资本价值构成发生变化（A）；二者共同作用使资本有机构成发生变化（D）。B「资本积累构成」不是规范范畴。","kp":"资本构成的变动"},"2021-21":{"ex":"马克思、恩格斯总结巴黎公社经验：无产阶级政权是为人民服务的机关（A），必须打碎旧的国家机器、建立无产阶级政权（B），保持革命果实首要条件是有革命的武装（C），必须建立无产阶级政党并发挥其政治领导作用（D）。","kp":"巴黎公社的基本经验"},"2021-22":{"ex":"初步探索丰富了科学社会主义的理论和实践（B），巩固和发展了我国社会主义制度（C），为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础（D）。A 错误：马克思主义中国化第二次飞跃是改革开放后形成的中国特色社会主义理论体系。","kp":"社会主义建设初步探索的意义"},"2021-23":{"ex":"新动能持续壮大表明创新驱动的引领作用进一步加强（A）、供给侧结构性改革取得显著成效（B）。C「已成为新引擎」、D「现代化经济体系已经生成」表述过于绝对，不符合「持续壮大」的阶段性判断。","kp":"经济发展新动能壮大"},"2021-24":{"ex":"「十三五」大气污染治理成效得益于把突出环境问题作为生态文明建设的着力点（B）、构建生态廊道和生物多样性保护网络（C）、不断完善生态环境保护制度并强化环保监督（D）。A 中「全民防治」表述不规范，正确的是「全民共治、源头防治」。","kp":"大气污染治理成效的原因"},"2021-25":{"ex":"提高就业质量的主要举措包括开展大规模职业技能培训（A）、提供全方位公共就业服务（B）、构建和谐劳动关系（C）。D「使失业率保持合理区间」是宏观调控的目标或结果，不是举措。","kp":"提高就业质量的主要举措"},"2021-26":{"ex":"促进各民族像石榴籽一样紧紧抱在一起，旨在铸牢中华民族共同体意识（A）、建设各民族共有精神家园（B）、巩固发展平等团结互助和谐的社会主义民族关系（C）、使各民族手足相亲守望相助（D）。","kp":"铸牢中华民族共同体意识"},"2021-27":{"ex":"随着西方列强入侵，中国封建社会逐步变成半殖民地半封建社会（A），中国人民逐渐开始反帝反封建的资产阶级民主革命（C）。B「受制于」表述不准确，D 错误：主要矛盾是帝国主义与中华民族、封建主义与人民大众的矛盾，不是无产阶级与资产阶级的矛盾。","kp":"鸦片战争成为中国近代史起点的原因"},"2021-28":{"ex":"中国早期信仰马克思主义的人物主要有三类：五四以前新文化运动的精神领袖（B）、五四运动的左翼骨干（C）、原中国同盟会会员和辛亥革命时期的活动家（A）。D 工人群众中的活跃分子本身不是「早期马克思主义者」的主体类型。","kp":"早期马克思主义者的类型"},"2021-29":{"ex":"从总体上看成就是显著的：人民生活水平提高，教育文化医疗科技事业发展（A）；独立完整的工业体系和国民经济体系建立（B）；国际地位提高、国际环境改善（C）；探索中形成建设社会主义的若干重要原则（D）。","kp":"全面建设社会主义的成就"},"2021-3":{"ex":"法律属于社会意识、上层建筑，与社会存在（含技术发展）的发展具有不平衡性，可能超前也可能滞后。A「总是阻碍」绝对化，B「只能落后」否认超前，D 把法律说成技术发展的「内在动力」，颠倒了关系。","kp":"社会意识与社会存在的不平衡性"},"2021-30":{"ex":"民法典是推进全面依法治国、推进国家治理体系和治理能力现代化的重大举措（A），是坚持和完善中国特色社会主义制度的现实需要（B），是坚持和完善社会主义基本经济制度、推动经济高质量发展的客观要求（C），是增进人民福祉、维护最广大人民根本利益的必然要求（D）。","kp":"民法典颁布的重大意义"},"2021-31":{"ex":"法律是否具有权威，取决于法律在社会中的实施程度（A）、法律本身的科学程度（B）、法律在国家和社会治理体系中的地位和作用（C）。D 错误：法律权威取决于本国人民的认同与遵守，不是国际社会的认同程度。","kp":"法律权威的决定因素"},"2021-32":{"ex":"香港国安法有效应对各种反中乱港势力（A），确保国家主权在香港得到严格保护（B），弥补香港国安方面的立法缺失（C），保障香港长治久安和长期繁荣稳定（D）。","kp":"香港国安法的重大作用"},"2021-33":{"ex":"RCEP 签署将为区域乃至全球经济复苏注入新动能（A），开启区域经济一体化新篇章（B），推动全球贸易投资自由化便利化取得重大进展（C），并将更好发挥中国作为亚太地区价值链中心节点的作用（D）。","kp":"RCEP 签署的意义"},"2021-4":{"ex":"资本主义在发展社会劳动生产力的同时，不自觉地为更高级的生产形式创造物质条件，说明资本主义生产是历史的、过渡性的生产形式（D）。A「无限制」、B「越发展越有利于巩固」违背其历史暂时性，C 与「创造更高级形式的物质条件」相反。","kp":"资本主义生产的历史过渡性"},"2021-5":{"ex":"毛泽东思想作为马克思主义中国化第一个重大理论成果，围绕的主题是中国革命和建设（A），它系统回答了中国这样一个半殖民地半封建东方大国如何进行革命、建立和建设社会主义的问题。","kp":"毛泽东思想围绕的主题"},"2021-6":{"ex":"构建新发展格局，是以国内大循环为主体、国内国际双循环相互促进（C）。A、B、D 都只讲了某一侧面（市场、和平、制造业），没有抓住「双循环」这一核心。","kp":"新发展格局的内涵"},"2021-7":{"ex":"公有制为主体是由生产资料所有制的地位决定的：生产资料所有制决定社会的基本性质和发展方向（C）。A 讲的是公有制的地位而非「为什么坚持」，B 是所有制的共同作用，D 中「使一切社会成员全面发展」表述不正确。","kp":"公有制主体地位的根据"},"2021-8":{"ex":"习近平在科学家座谈会上指出，创造更多从「0」到「1」的突破，需要把提升原始创新能力摆在更加突出的位置（A）。B 消化吸收再创新属「从 1 到 N」，C、D 都不是「从 0 到 1」对应的能力。","kp":"提升原始创新能力"},"2021-9":{"ex":"洋务派的官督商办企业采用机器生产、雇佣工人，产品部分进入市场，属于资本主义性质的企业（C）。A、B 只看到其同封建势力的联系，D 把它等同于社会主义性质企业，均错。","kp":"官督商办企业的性质"},"2022-1":{"ex":"「为什么能、为什么好，归根到底是因为马克思主义行」，落点在马克思主义本身的真理性：它把科学性与革命性统一起来，是科学的世界观和方法论，故选 C。A、B、D 都是马克思主义的鲜明特征或功能定位，但不能解释「行」的根本原因——根本原因是它对世界作出了科学的解释。","kp":"马克思主义的鲜明特征"},"2022-10":{"ex":"南昌起义打响了武装反抗国民党反动派的第一枪，是中国共产党独立领导革命战争、创建人民军队和武装夺取政权的开端，故选 D。A 土地革命和武装起义方针是八七会议确定的；B 建设新型人民军队发端于三湾改编、古田会议；C 工农武装割据始于秋收起义后井冈山斗争。","kp":"南昌起义的历史意义"},"2022-11":{"ex":"1949 年 3 月中共中央进驻北平香山，标志着中国革命重心从农村转向城市，故选 C。A 旧民主主义向新民主主义转变以 1919 年五四运动为标志；B 新民主主义向社会主义过渡始于 1949 年新中国成立后；D 民族民主革命任务完成于 1949 年新中国成立，不以此为依据。","kp":"中共中央进驻香山的标志意义"},"2022-12":{"ex":"1956 年毛泽东提出实行马克思列宁主义基本原理同中国实际的「第二次结合」，目的是找出在中国怎样建设社会主义的道路，故选 C。A 党的建设不是这一命题的落点；B 社会主义改造 1956 年已基本完成，不存在「为改造创造条件」；D 全面建设社会主义现代化强国是新时代的目标，时代不符。","kp":"「第二次结合」的目的"},"2022-13":{"ex":"「夙夜在公」「以公灭私」「国而忘家，公而忘私」「先忧后乐」「苟利国家生死以」，共同指向重视整体利益、强调责任奉献，故选 C。A 知行合一、B 仁爱以和为贵、D 人伦价值与道德义务，都是中华传统美德的其他方面，与所引名句不匹配。","kp":"中华传统美德"},"2022-14":{"ex":"法律由一定社会的物质生活条件决定，其中决定法律本质、内容和发展方向的根本因素是物质资料的生产方式，故选 B。A 地理环境、C 人口素质是自然和社会条件，不能决定法律本质；D 统治阶级意志是法律的直接体现，但它本身由物质生活条件决定，不是「根本因素」。","kp":"法律的本质"},"2022-15":{"ex":"习近平总书记强调要加快建设世界重要人才中心和创新高地，故选 A。B 是具体布局（在北京、上海、粤港澳大湾区建设高水平人才高地），C、D 都是具体举措，都不是「加快建设」的总目标。","kp":"中央人才工作会议"},"2022-16":{"ex":"这部法律针对的是外国违反国际法和国际关系基本准则、干涉中国内政的所谓「单边制裁」，故选 D。A「贸易战」、B「货币战」、C「新冷战」都不是该法的直接规制对象。","kp":"《反外国制裁法》的指向"},"2022-17":{"ex":"「有多少汤泡多少馍」首先是一切从实际出发、实事求是（B）；「以水定城、定地、定人、定产」体现因地制宜、因时制宜（C）；水资源有限要求把握适度原则，不能超过承载能力（D）。A 错：这里强调的是尊重客观条件、按规律办事，而不是「创造条件发挥意识能动性」。","kp":"一切从实际出发、适度原则"},"2022-18":{"ex":"人工智能辅助研发使人们对材料结构与性质的认识不断深化（C），而无论结构性质怎样变化，物质世界的物质性不会改变（D）。A 错：物质的性质和结构是客观的，人不能「任意改变」；B 错：人工智能只是认识工具，不能取代人对物质世界的认识。","kp":"人工智能与物质世界的物质性"},"2022-19":{"ex":"「1 秒钟……猎豹飞奔 28 米」说明时间是测量事物运动的客观尺度（A）；时间与物质运动不可分割，是物质运动的存在形式（B、D）。C 错：时间具有客观性，不是人的主观联想。","kp":"时间与物质运动"},"2022-2":{"ex":"生态护林员既护生态又脱贫增收，说明自然要素进入生产过程、构成生产力的重要内容，合理开发利用和保护自然能促进社会发展，选 B。A 错在「自发满足」——自然不会自动满足人的需要，要靠人的实践；C 错在「只能适应」，人还能能动改造自然；D 错在把自然说成「补偿人的劳动」的主体，自然没有意识，谈不上「补偿」。","kp":"人与自然的关系、生产力要素"},"2022-20":{"ex":"网络热词是当下社会生活与社会心态的反映，说明社会意识是社会存在的反映（A），并随社会存在的发展而变化（B）。C 错：社会意识对社会存在的反映不是「自发」的，而是通过人的实践和思维能动实现的；D 错：决定社会生活多样性的是社会存在（物质生产方式等），不是「社会形态的差异性」。","kp":"社会存在与社会意识"},"2022-21":{"ex":"资本主义生产力快速发展，根本在于资本追逐剩余价值的内在动力（A）和市场竞争的外在压力（B）。C 无产阶级反对资产阶级的斗争是促使资本主义调整的动因，不是生产力发展的主要原因；D 错：资本主义国家并不「全面控制」市场，其宏观调控也无法解释生产力飞跃。","kp":"资本主义生产力迅速发展的原因"},"2022-22":{"ex":"2021 年10 月18 日，中共中央政治局就推动我国数字经济健康发展进行第三十四次集体学习，明确数字经济健康发展有利于推动构建新发展格局、有利于推动建设现代化经济体系、有利于推动构筑国家竞争新优势，故 ABD 正确。C 选项「推动化解发展中的根本制约因素」对应的措施是深化改革，不属于发展数字经济的作用，故排除。","kp":"数字经济与高质量发展"},"2022-23":{"ex":"入世 20 年证明：以开放促改革、促发展是我国现代化建设的重要法宝（B），坚持开放合作才能获得更多发展机遇和更大发展空间（C），我国是多边贸易体制的坚定支持者、积极参与者和重要贡献者（D）。A 错：我国经济正处在由高速增长向高质量发展转变的过程中，尚未「已经实现」。","kp":"入世 20 年的历史证明"},"2022-24":{"ex":"全过程人民民主是完整制度程序和完整参与实践有机统一的民主（A），是全链条、全方位、全覆盖的民主（B），是最广泛、最真实、最管用的社会主义民主（C），实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一（D），四项全选。","kp":"全过程人民民主"},"2022-25":{"ex":"我国加强和创新生物多样性保护的主要举措有：划定生态保护红线（A）、建立生物安全风险防控和治理体系（C）、构建以国家公园为主体的自然保护地体系（D）。B 错：「加大自然资源的开发利用」与保护生物多样性的方向相反，应是合理利用、保护优先。","kp":"生物多样性保护举措"},"2022-26":{"ex":"习近平主席以茶酒巧喻文明关系，旨在阐明：人类文明多样性是世界的基本特征（A），文明因多样而交流、因交流而互鉴、因互鉴而发展（B），不同文明没有高低优劣之分（C），文明差异不应成为世界冲突的根源而应成为进步动力（D），四项全选。","kp":"文明交流互鉴"},"2022-27":{"ex":"遵义会议集中解决了当时党内最迫切的组织问题和军事问题（B），结束了「左」倾教条主义错误在中央的统治（C），开始确立毛泽东在中共中央和红军的领导地位（D）。A 错：会议并未「全面讨论」政治路线的是非，政治路线问题当时被暂时搁置。","kp":"遵义会议"},"2022-28":{"ex":"《关于建国以来党的若干历史问题的决议》把毛泽东思想活的灵魂概括为实事求是、群众路线、独立自主，故选 ABD。C 武装斗争是中国革命「三大法宝」之一，不属于活的灵魂。","kp":"毛泽东思想活的灵魂"},"2022-29":{"ex":"十八届三中全会之所以也是划时代的，是因为它实现改革由局部探索、破冰突围到系统集成、全面深化的转变（A），开创了我国改革开放新局面（C）。B 错：开启改革开放新时期的是十一届三中全会；D 错：确定建立社会主义市场经济体制是 1992 年党的十四大。","kp":"十八届三中全会为什么是划时代的"},"2022-3":{"ex":"题干说的是「卖者成为债权人、买者成为债务人」，即商品让渡与货币支付在时间上分离，货币在此充当支付手段，选 D。A 价值尺度只需观念上的货币；B 流通手段是一手交钱一手交货；C 贮藏手段是退出流通被保存，均与「延期支付」不符。","kp":"货币五大职能"},"2022-30":{"ex":"民法典把诚信、公序良俗等道德要求上升为法律规范，救助人不担责的规定为善行提供保护，说明法律助推个人品德养成（A）、助推社会公德水平提升（C）、为弘扬美德提供保障（D）。B 错：法律不能「决定」道德传承的效果，道德传承还有自身规律和社会条件。","kp":"法律对道德的导向作用"},"2022-31":{"ex":"习近平法治思想中关于政治方向的是：坚持党对全面依法治国的领导（A）、坚持以人民为中心（B）、坚持中国特色社会主义法治道路（C）。D 坚持统筹推进国内法治和涉外法治属于「工作布局」，不是政治方向。","kp":"习近平法治思想中「政治方向」的内容"},"2022-32":{"ex":"天问一号成功着陆火星，标志着我国在行星探测领域进入世界先进行列（A），我国首次自主执行火星探测任务（B），为探索宇宙奥秘、增进对火星演化认知、了解生命起源作出中国贡献（C），是我国航天事业发展又一具有里程碑意义的进展（D），四项全选。","kp":"天问一号着陆火星的意义"},"2022-33":{"ex":"习近平主席在视频会晤中强调，新时期中美相处应该坚持相互尊重、和平共处、合作共赢三原则，故选 ABC。D「结伴不结盟」是我国对伙伴关系的表述，不适用于中美关系。","kp":"新时期中美相处三原则"},"2022-34":{"ex":"得分要点：①国家安全是安邦定国的重要基石，维护国家安全是全国各族人民根本利益所在；②总体国家安全观以人民安全为宗旨、以政治安全为根本、以经济安全为基础，统筹发展和安全、传统安全和非传统安全；③构建新安全格局是贯彻总体国家安全观的必然要求，要健全国家安全体系、增强维护国家安全能力；④要把维护国家安全贯穿党和国家工作各方面全过程，确保中华民族伟大复兴进程不被迟滞甚至中断。","kp":"分析题：总体国家安全观"},"2022-35":{"ex":"得分要点：①十九届六中全会审议通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》，是党历史上第三个历史决议，对统一全党思想、开创未来具有重要意义；②「两个确立」即确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，是新时代取得历史性成就的决定性因素；③总结党的百年奋斗重大成就和历史经验，要坚持唯物史观和正确党史观，从历史中汲取前进力量；④要坚定历史自信、增强历史主动，在新征程上创造新的历史伟业。","kp":"分析题：第三个历史决议与「两个确立」"},"2022-36":{"ex":"得分要点：①孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，为中华民族作出了杰出贡献；②他第一个响亮喊出「振兴中华」的口号，领导辛亥革命推翻君主专制制度，推动国共合作，始终致力于国家统一和民族振兴；③中国共产党人是孙中山先生革命事业最坚定的支持者、最忠诚的合作者、最忠实的继承者；④实现国家完全统一是民族复兴的必然要求，要坚持一个中国原则和「九二共识」，坚决反对「台独」分裂和外部干涉。","kp":"分析题：孙中山与中华民族伟大复兴"},"2022-37":{"ex":"得分要点：①人生价值在于对社会的责任和贡献，评价人生价值的标准主要看对社会和他人的贡献；②黄文秀放弃大城市工作回到家乡，投身脱贫攻坚一线，用生命践行初心使命，实现了社会价值与自我价值的统一；③实现人生价值要在劳动和奉献中创造价值，在与人民群众结合中成长，在砥砺自我中走向成功；④新时代青年要把个人理想融入党和国家事业，立志做有理想、敢担当、能吃苦、肯奋斗的新时代好青年。","kp":"分析题：黄文秀与人生价值"},"2022-38":{"ex":"得分要点：①联合国是当今世界最具普遍性、代表性、权威性的国际组织，《联合国宪章》确立了国际关系基本准则，是多边主义的旗帜；②当前单边主义、保护主义抬头，个别国家毁约退群、搞「小圈子」，冲击以联合国为核心的国际体系；③中国坚定维护以联合国为核心的国际体系、以国际法为基础的国际秩序，践行真正的多边主义，推动全球治理体系朝着更加公正合理的方向发展；④构建人类命运共同体是解决全球性问题的中国方案，需要各国共同推动、共同担当。","kp":"分析题：联合国与真正的多边主义"},"2022-4":{"ex":"当代资本主义大公司股权分散化、法人持股增多，经营活动的实际控制者由家族资本家转为高级职业经理（「经理革命」），选 A。B 股东大会是权力机构但日常经营不由其直接控制；C 监事会行使监督职能；D 董事长多为资本所有者代表，都不是「实际控制者」。","kp":"当代资本主义的新变化"},"2022-5":{"ex":"党的十九届五中全会提出：到 2035 年，全体人民共同富裕取得更为明显的实质性进展，故选 B。A「基本实现」是 2035 年对现代化的表述（基本实现现代化），共同富裕的「全面实现」要到本世纪中叶，故 A、C、D 均不符。","kp":"共同富裕的阶段性目标"},"2022-6":{"ex":"构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，关键在于经济循环的畅通无阻，故选 A。B 市场主体活力是基础，C 高水平自立自强是「最本质特征」的要求，D 产业链供应链优化升级是重要支撑，都不是「关键」。","kp":"构建新发展格局的关键"},"2022-7":{"ex":"2021 年中央一号文件把巩固拓展脱贫攻坚成果摆在首要位置，守住防止规模性返贫底线，故选 D。A、B、C 都是乡村振兴的重要举措，但都属于「发展」层面，排在防返贫之后。","kp":"三农工作重心转移后的首要位置"},"2022-8":{"ex":"加强国际传播能力建设，最重要的是讲好中国故事、传播好中国声音，展示真实、立体、全面的中国，故选 D。A、B、C 属于文化建设的内容，不针对「国际传播能力」这一主题。","kp":"国际传播能力建设的重要任务"},"2022-9":{"ex":"维新派突破了洋务派「中体西用」的局限，主张君主立宪取代君主专制，故选 A。B 民主共和、C 总统共和、D 议会共和，都是资产阶级革命派（辛亥革命）的主张，维新派恰恰要保留君主。","kp":"戊戌维新派的主张"},"2023-1":{"ex":"「忘记走过的路就无法走向未来」，说明历史、现实、未来是相通的，故选 A。B「一切历史都是当代史」是唯心史观命题，把历史归结为当代人的解释；C 错：历史发展是必然性与偶然性的统一，不可能「不包含任何偶然因素」；D 错：历史事件不会完整重复再现。","kp":"历史、现实、未来是相通的"},"2023-10":{"ex":"1927 年 8 月 7 日八七会议确定了土地革命和武装起义的方针，故选 D。A 错：会议批评的是大革命后期的右倾错误（陈独秀右倾机会主义）；B 工作重心由城市转向乡村是 1927 年后逐步开辟的，并非八七会议阐明；C 会议提出的是在湘、鄂、赣、粤四省发动秋收暴动，但「提出暴动」不能概括会议最重要的决定，且会议确定的是总方针。","kp":"八七会议"},"2023-11":{"ex":"延安精神体现的党的宗旨是全心全意为人民服务，故选 A。B 坚定正确的政治方向是延安精神的灵魂，C 解放思想、实事求是是精髓，D 自力更生、艰苦奋斗是政治本色（也是创业精神），都不是「宗旨」。","kp":"延安精神体现的党的宗旨"},"2023-12":{"ex":"1956 年生产资料私有制社会主义改造基本完成，社会主义经济制度（公有制为主体）确立，这是中国进入社会主义社会最主要的标志，故选 B。A 政治制度、D 人民民主专政政权在 1949 年已建立；C 民主革命遗留任务完成是进入社会主义社会的准备条件，不是标志。","kp":"社会主义经济制度的确立"},"2023-13":{"ex":"《新时代公民道德建设实施纲要》明确，新时代公民道德建设以社会公德、职业道德、家庭美德、个人品德建设为着力点，故选 C。A 是弘扬的精神内容，B 是理想信念教育要求，D 是传承中华传统美德的具体方面。","kp":"新时代公民道德建设的着力点"},"2023-14":{"ex":"坚持全面依法治国首先要坚持依宪治国，故选 A。B 依法行政、C 依法执政、D 公正司法都是全面依法治国的重要环节，但地位上都以依宪治国为前提。","kp":"全面依法治国首先要"},"2023-15":{"ex":"北京冬奥精神是胸怀大局、自信开放、迎难而上、追求卓越、共创未来，故选 B。A 是奥林匹克格言，C 是残奥精神相关表述，D 是北京冬奥会主题口号。","kp":"北京冬奥精神"},"2023-16":{"ex":"2022 年 11 月第二十五次中国—东盟领导人会议发表了《纪念〈南海各方行为宣言〉签署二十周年联合声明》，故选 D。《南海各方行为宣言》签署于 2002 年，至 2022 年正好二十年；A、B、C 都是此前年份的其他文件。","kp":"中国—东盟南海文件的名称"},"2023-17":{"ex":"无产阶级领袖能够引领社会发展方向（A）、影响历史事件的进程（B）、凝聚人民群众的力量（C）。D 错：人民群众是历史的创造者，领袖不能「创造」历史，只能在既定历史条件下发挥作用。","kp":"个人在历史发展中的作用"},"2023-18":{"ex":"横看成岭侧成峰，是因为价值评价过程与评价主体直接相关（B），评价结果随主客体相互关系的变化而变化（D）。A 错：评价客体有自身固有的本质和特性，这是评价的客观基础；C 错：评价有正确与错误、善与恶之别，正确评价要以客体属性和规律为依据。","kp":"价值评价的主体性"},"2023-19":{"ex":"在利润率平均化过程中，产业资本（A）、农业资本（B）、商业资本（C）都参与利润平均化，都能获得平均利润；借贷资本（D）只获得利息，利息率低于平均利润率，职能资本家获得企业利润。故答案为 ABC。","kp":"平均利润与剩余价值分割"},"2023-2":{"ex":"社会形态划分的依据是经济基础特别是生产关系的性质，故选 C。A 生产工具是生产力发展水平的标志，只能划分技术社会形态；B 阶级属性、D 交往与分工水平都不是五种社会形态划分的根据。","kp":"社会形态更替的依据"},"2023-20":{"ex":"金融垄断资本形成和壮大的重要制度条件是金融自由化（C）与金融创新（A）。B 错：金融管制加强恰恰是限制金融资本扩张的因素；D 错：金融危机是金融资本膨胀的后果和表现形式，不是「制度条件」。","kp":"金融垄断资本形成的制度条件"},"2023-21":{"ex":"主要内容是余粮收集制（A）和取消商品货币关系、实行实物配给（B）。C 错：当时实行的是单一公有制，反对多种所有制；D 错：政策曾限制甚至否定农民耕种自留地。","kp":"战时共产主义政策"},"2023-22":{"ex":"毛泽东第一次明确提出了「马克思主义中国化」的科学命题和重大任务（A），深刻论证了其必要性和重要性（B），系统阐述了其科学内涵（C）。D 错：「全面清除认识上的各种障碍」夸大了个人作用，也非毛泽东的贡献表述。","kp":"毛泽东对马克思主义中国化的贡献"},"2023-23":{"ex":"党对资本的认识包括：资本是带动各类生产要素集聚配置的重要纽带、是促进社会生产力发展的重要力量（A）；要规范和约束资本的逐利本性，防止带来不可估量的危害（B）；要完善资本市场基础制度，为各类资本发展释放更大空间（C）；既保障资本参与社会分配获得增值和发展，更维护按劳分配的主体地位（D），四项全选。","kp":"社会主义市场经济条件下资本的认识"},"2023-24":{"ex":"进博会已成为我国构建新发展格局的窗口（B）、推进高水平对外开放的平台（C）、全球共享的国际公共产品（D）。A 错：进博会是开放合作的平台，不能等同于「世界经济增长的引擎」。","kp":"中国国际进口博览会的定位"},"2023-25":{"ex":"湿地保护有利于促进人与自然和谐共生（A）、推行草原森林河流湖泊湿地休养生息（B）、提升生态系统多样性稳定性持续性（C）、发挥湿地功能推进可持续发展并应对气候变化（D），四项全选。","kp":"湿地保护的意义"},"2023-26":{"ex":"这些思想观念同科学社会主义价值观主张具有高度契合性（B），体现着中国人民的宇宙观、天下观、社会观、道德观（D）。A 错：中华优秀传统文化与马克思主义不是「一脉相承」的关系，而是彼此契合、互相成就；C 错：它们不能「完整体现」马克思主义的立场观点方法，只能提供思想资源。","kp":"中华优秀传统文化与科学社会主义"},"2023-27":{"ex":"1905—1907 年论战聚焦要不要以革命手段推翻清王朝（A），传播了民主革命思想、促进了革命形势发展（C），同时也暴露了革命派在思想理论方面的弱点（D）。B 错：论战实质上是资产阶级思想与封建主义思想（改良派代表）的交锋？——注意改良派本身也是资产阶级代表，官方答案不含此项，因为论战双方都属于资产阶级阵营内部的分歧。","kp":"革命派与改良派论战"},"2023-28":{"ex":"毛泽东在《反对本本主义》中提出「没有调查，没有发言权」（C），并强调「中国革命斗争的胜利要靠中国同志了解中国情况」（D）。A「关心群众生活，注意工作方法」出自 1934 年同名文章；B「把城市工作和根据地工作提到同等重要的地位」出自 1945 年《论联合政府》前后的表述，均不属于本文。","kp":"《反对本本主义》"},"2023-29":{"ex":"全会作出实行改革开放的历史性决策，是基于对党和国家前途命运的深刻把握（A）、对社会主义革命和建设实践的深刻总结（B）、对时代潮流的深刻洞察（C）、对人民群众期盼和需要的深刻体悟（D），四项全选。","kp":"十一届三中全会作出改革开放决策的依据"},"2023-3":{"ex":"生产力提高时同一劳动在同一时间生产的使用价值量增加，而价值总量不变，因此单个商品的价值量下降——生产力的变化影响单个商品的价值量，故选 C。A 与题干相反（数量会变）；B 生产力提高正是生产效率提高；D 价值总量只取决于劳动时间，不随生产力变化。","kp":"劳动生产率与商品价值量"},"2023-30":{"ex":"社会主义道德的先进性主要体现在：它是对人类优秀道德资源的批判继承和创新发展（A），克服了以往阶级社会道德的片面性和局限性（B），是社会主义经济基础的反映（D）。C 错：道德只是调节社会关系的行为规范之一，法律、纪律、政策等同样调节社会行为，不能说「一切」行为规范。","kp":"社会主义道德的先进性"},"2023-31":{"ex":"法律义务必须依法设定（A），源于现实需要（C），具有国家强制性。B 错：法律义务随社会物质生活条件变化而调整，不是一成不变；D 错：法律义务是义务人「必须」实施的行为，不以自主自愿为前提。","kp":"法律义务的特征"},"2023-32":{"ex":"白皮书有利于揭批「台独」分裂势力和外部势力勾连挑衅的恶劣言行（A），最大限度争取两岸同胞特别是台湾同胞与国际社会的理解支持（B），展现以最大诚意、尽最大努力争取和平统一的立场态度（C），提振全党全国各族人民矢志追求国家统一的精气神（D），四项全选。","kp":"《台湾问题与新时代中国统一事业》白皮书"},"2023-33":{"ex":"习近平主席在《共迎时代挑战 共建美好未来》讲话中倡议推动更加包容（B）、更加普惠（C）、更有韧性的全球发展（D）。A「更具竞争」与讲话精神相反，故不选。","kp":"G20 巴厘岛峰会倡议"},"2023-34":{"ex":"得分要点：①系统观念要求用普遍联系、全面系统、发展变化的观点看问题，盐碱地改良涉及土壤结构、盐分、微生物、品种、水利等多因素交织，必须统筹兼顾、整体推进；②抓主要矛盾和矛盾的主要方面，先治盐、再培肥、配套水利，分阶段推进；③坚持两点论与重点论统一，把耕地质量提升与粮食产能建设结合起来；④尊重客观规律与发挥主观能动性统一，因地制宜、分类施策，实现盐碱荒地变生态良田。","kp":"分析题：系统观念与「藏粮于地、藏粮于技」"},"2023-35":{"ex":"得分要点：①新时代十年的伟大变革在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义；②根本在于以习近平同志为核心的党中央坚强领导，在于习近平新时代中国特色社会主义思想的科学指引；③经济实力、科技实力、综合国力跃上新台阶，全面建成小康社会、实现第一个百年奋斗目标；④要坚持党的全面领导、坚持以人民为中心，在高质量发展中推进中国式现代化。","kp":"分析题：新时代十年的伟大变革"},"2023-36":{"ex":"得分要点：①团结是党的生命，党的团结统一是党和人民事业的保证，毛泽东在七大上提出「团结一致，争取胜利」的方针；②维护党中央权威和集中统一领导是党的最高政治原则，要增强「四个意识」、做到「两个维护」；③党员要在思想上政治上行动上同党中央保持高度一致，「经常喊看齐」；④团结不是一团和气，要发扬党内民主、开展批评和自我批评，实现有原则的团结。","kp":"分析题：党的团结统一"},"2023-37":{"ex":"得分要点：①科学家精神以爱国主义为底色，表现为胸怀祖国、服务人民，勇攀高峰、敢为人先，追求真理、严谨治学，淡泊名利、潜心研究，集智攻关、团结协作，甘为人梯、奖掖后学；②精神的力量可以转化为物质的力量，伟大事业孕育伟大精神、伟大精神推动伟大事业；③要把个人理想融入国家发展，在实现高水平科技自立自强中担当作为；④弘扬科学家精神要同弘扬民族精神、时代精神结合起来，营造尊重知识、尊重人才的社会氛围。","kp":"分析题：科学家精神与爱国主义"},"2023-38":{"ex":"得分要点：①世界人口达 80 亿是人类发展的里程碑，既是多样性和进步的体现，也暴露发展不平衡、不平等加剧的问题；②各国相互联系、相互依存，人类命运共同体理念回应了「世界怎么了、我们怎么办」的时代之问；③要坚持多边主义、完善全球治理，共同应对粮食、能源、气候变化等全球性挑战；④中国式现代化为人类实现现代化提供新选择，中国坚持走和平发展道路，推动构建人类命运共同体。","kp":"分析题：世界人口 80 亿与人类共同责任"},"2023-4":{"ex":"垄断组织为避免净亏损，所能接受的最低价格是成本价格（不变资本与可变资本之和），低于它就要亏本，故选 A。B 生产价格是成本价格加平均利润；C 垄断低价、D 垄断高价都是垄断组织与非垄断主体交易时使用的价格形式，不是「最低可接受」的界限。","kp":"垄断价格与成本价格"},"2023-5":{"ex":"搞清楚「什么是社会主义、怎样建设社会主义」，关键是在坚持社会主义基本制度的基础上进一步认清社会主义的本质，故选 D。A 主要矛盾、B 澄清观念、C 总结经验都是重要工作，但不能直接回答「社会主义本质是什么」这一首要基本理论问题。","kp":"社会主义本质"},"2023-6":{"ex":"第三次分配是在自愿基础上以慈善公益方式对社会资源和社会财富进行的分配，因此要引导、支持有意愿有能力的企业、社会组织和个人积极参与公益慈善事业，故选 C。A 属于初次分配（提高劳动报酬比重）；B 属于再分配（税收、社保、转移支付）；D 属于初次分配中生产要素按贡献参与分配。","kp":"第三次分配"},"2023-7":{"ex":"坚持总体国家安全观，归根到底是为了确保中华民族伟大复兴进程不被迟滞甚至中断，故选 D。A、B、C 都是维护国家安全的要求或举措，不是「归根到底」的目的。","kp":"总体国家安全观的目的"},"2023-8":{"ex":"毛泽东在延安窑洞给出的第一个答案是「让人民来监督政府」，党的二十大报告指出，经过不懈努力，党找到了第二个答案——自我革命，故选 B。A、D 属于自我革命的要求；C「把权力关进制度的笼子」是制度建设的具体举措，不是整党跳出周期率的答案本身。","kp":"跳出历史周期率的第二个答案"},"2023-9":{"ex":"19 世纪中叶中国错失工业革命机遇、大幅落后于时代，根本原因在于封建统治者夜郎自大、闭关锁国，故选 A。B 资本输出发生在 19 世纪末以后；C 阶级关系变动是结果而非原因；D「被纳入世界资本主义体系」是列强侵略的结果，不能解释「错失机遇」的主动性原因。","kp":"近代中国落后于时代的原因"},"2024-1":{"ex":"习近平总书记指出，马克思主义是我们立党立国、兴党兴国的根本指导思想，是理论创新的「魂脉」；中华优秀传统文化是中华民族的根和魂，是理论创新的「根脉」，故选 A。B、D 讲的是理想信念层面，C 讲的是价值层面，都不是「魂脉」「根脉」的所指。","kp":"「魂脉」与「根脉」"},"2024-10":{"ex":"「半封建」是指中国出现了资本主义生产关系，已不是完全的封建经济，故选 B。A 是字面误解；C「丧失完全独立地位」是「半殖民地」的含义；D 封建剥削制度的根基当时并未彻底动摇。","kp":"「半封建」的含义"},"2024-11":{"ex":"1894 年孙中山在檀香山创立兴中会，在《兴中会章程》中提出「振兴中华」的口号，故选 A。「建立民国」是 1905 年同盟会的纲领；「反帝反封」是中共二大提出的民主革命纲领；「民主自由」不是该章程的口号。","kp":"兴中会与「振兴中华」"},"2024-12":{"ex":"1937 年 7 月 7 日卢沟桥事变标志着中国进入全民族抗战阶段，故选 C。A、B 错：揭开抗日战争序幕、成为抗日战争起点的是 1931 年九一八事变；D 错：世界反法西斯同盟正式形成于 1942 年 1 月《联合国家宣言》的签署。","kp":"卢沟桥事变"},"2024-13":{"ex":"1948 年中共中央为克服党内和军队内的无纪律无政府状态、把一切必须和可能集中的权力集中于中央，决定建立请示报告制度，故选 B。A 精兵简政是抗战时期的政策；C 民主协商、D 党外通报都不是这一背景下的制度安排。","kp":"请示报告制度"},"2024-14":{"ex":"全面依法治国的关键在于坚持党领导立法、保证执法、支持司法、带头守法，故选 C。A 严密法治监督体系、B 依法治国与以德治国相结合、D 法治宣传教育都是重要环节，但不是「关键」。","kp":"全面依法治国的关键"},"2024-15":{"ex":"习近平总书记强调，加强基础研究，归根到底要靠高水平人才，故选 D。A 体制机制、B 国际合作平台、C 学科建设布局都是重要保障和条件，不是「归根到底」的依靠。","kp":"加强基础研究的根本依靠"},"2024-16":{"ex":"「全球南方」国家声音更响亮，反映国际力量对比正在发生深刻变化、百年变局深入演进，故选 D。A 错：南北对话僵局并未破解；B 错：「占据主导地位」夸大了南方国家在国际组织中的现实地位；C 错：南方国家的主张尚未成为「普遍共识」。","kp":"「全球南方」声音更响亮"},"2024-17":{"ex":"「更智慧地使用人工智能工具」意味着技术进步要以维护人民根本利益为最高标准（A），人类活动能够实现合目的性与合规律性的统一（B），成功的实践是真理尺度与价值尺度的统一（D）。C 错：科技发展是客观物质活动，由客观规律和实践需要决定，不由主观意志决定。","kp":"真理尺度与价值尺度的统一"},"2024-18":{"ex":"茶文化使一片叶子具有文化意义，说明观念的东西是移入人脑并经人脑改造过的物质的东西（A），客体潜在价值转化为现实价值依赖于实践基础上的主体创造（C），客体价值及大小取决于客体属性与满足主体需要的程度（D）。B 错：「意义只是经验外化于对象」是主观唯心主义观点。","kp":"一片叶子 → 茶文化：价值与意识"},"2024-19":{"ex":"独特的生产方式和生活方式决定文明发展的不同样态（A），每一种文明都代表着文化的独特性、是人类文明的重要组成部分（C）。B 错：「比其他文明更优越」是文明优越论；D 错：文明在交流互鉴中发展，不存在「相互隔离」的独自演进。","kp":"文明多样性的唯物史观基础"},"2024-2":{"ex":"厄尔尼诺这类因素「突然掉链子」就会引发大范围异常天气，说明偶然因素不是可有可无的，而是事物发展中不可忽视的影响因素，故选 C。A 错：决定发展趋势的是必然性、是内部矛盾；B 错：偶然因素有其作用，不能说「可有可无」；D 错：「确定不移」是必然性的特征。","kp":"偶然性在事物发展中的作用"},"2024-20":{"ex":"资本主义社会之前的简单商品经济以生产资料私有制和个体劳动为基础，故选 BC。A 生产资料公有制是社会主义经济的基础；D 雇佣劳动是资本主义商品经济（发达商品经济）的基础。","kp":"简单商品经济的基础"},"2024-21":{"ex":"导致经济全球化迅猛发展的因素有：信息技术革命打破生产要素的地域限制（A）、国际分工和要素全球流动的比较优势促进产业链深度融合（B）、国际经济组织成员国放松对市场的控制加快贸易投资自由化（D）。C 错：发达国家主导规则，发展中国家并未成为「主要受益者」。","kp":"经济全球化迅猛发展的原因"},"2024-22":{"ex":"「两次胜利两次失败」后才制定出合乎情况的总路线，说明马克思主义必须与中国革命具体实际相结合（B），党对规律的认识必须有一个过程（C），新民主主义革命理论是总结正反两方面经验形成的（D）。A 错：认识没有终点，「完全掌握」的表述绝对化。","kp":"对民主革命规律的认识过程"},"2024-23":{"ex":"我国具有超大规模市场的需求优势（A）、产业体系配套完整的供给优势（B）、社会主义市场经济的体制优势（C）、大量高素质劳动者和企业家的人才优势（D），四项全选。","kp":"我国经济长期向好的四大优势"},"2024-24":{"ex":"三者具有一致性和相互支撑性（A），在综合国力竞争中的关键性地位更加凸显（B），是全面建设社会主义现代化国家的基础性、战略性支撑（C），把三者摆在重要位置是现代化建设的历史经验（D），四项全选。","kp":"教育、科技、人才一体推进"},"2024-25":{"ex":"把握各地战略定位有利于发挥比较优势、塑造发展新优势（A），优化区域经济布局、拓展发展动力源（B），统筹发展和安全、掌握发展主动权（C）。D 错：共同富裕是逐步实现的过程，「同步实现」不符合实际。","kp":"把握各地区战略定位的意义"},"2024-26":{"ex":"数字经济快速发展表明数据已成为新的生产要素（A），数字经济正在成为新一轮国际竞争的重点领域（B），是稳增长促转型的重要引擎（D）。C 错：数字经济与实体经济深度融合，不存在「取代实体经济」。","kp":"数字经济发展"},"2024-27":{"ex":"与辛亥革命相比，大革命斗争规模更加宏伟（A），革命的社会内涵更为深刻（B），群众动员程度更广泛（D）。C 错：大革命是公开的轰轰烈烈的群众运动，不是「更加隐蔽」。","kp":"大革命与辛亥革命的比较"},"2024-28":{"ex":"1956 年以毛泽东为主要代表的中国共产党人提出：经济建设上「既反保守又反冒进，在综合平衡中稳步前进」（A），科学文化工作中「百花齐放、百家争鸣」（C），党与民主党派关系上「长期共存、互相监督」（D）。B 错：「一边倒」是新中国成立初期的外交方针，不属于 1956 年提出的社会主义建设方针。","kp":"1956 年社会主义建设的重要方针"},"2024-29":{"ex":"勇于自我革命是中国共产党区别于其他政党的显著标志（A），自我革命精神是党永葆青春活力的强大支撑（B），自我革命是党跳出历史周期率的第二个答案（D）。C 错：并非所有政党都能自我革命，「所有政党」的表述绝对化且与事实不符。","kp":"党的自我革命"},"2024-3":{"ex":"北斗在应用中不断完善、精度不断提高，说明技术创新源于社会实践的需要，实践为认识发展提供动力和检验标准，故选 D。A 科学研究的规范、B 实践主体的意志、C 认识主体的兴趣，都属于主观或规范层面，不能成为技术发展的根本动力。","kp":"实践是认识发展的动力"},"2024-30":{"ex":"体现在：挖掘传统美德中具有当代价值的道德精神（A），赋予新的时代内涵（B），用中华传统美德滋养社会主义道德建设（C）。D 错：我国道德建设以马克思主义为指导、以社会主义道德为主体，不能「以中国传统文化为主体」。","kp":"中华传统美德的创造性转化、创新性发展"},"2024-31":{"ex":"该法是社会主义核心价值观入法的具体体现（A），有利于维护国家统一和民族团结（B），是惩治危害国家安全、荣誉和利益行为的法律武器（C），为加强新时代爱国主义教育提供法治保障（D），四项全选。","kp":"《爱国主义教育法》"},"2024-32":{"ex":"主题教育要求不断增进对党的创新理论的政治认同（A）、思想认同（B）、理论认同（C）、情感认同（D），四项全选。","kp":"主题教育的「四个认同」"},"2024-33":{"ex":"中方推动沙伊握手言和，创造了调解冲突的新范式、为其他地区热点问题提供新思路（A），助力中东地区实现和平稳定与安全（C），为国际社会注入和平合作的正能量（D）。B 错：沙伊矛盾根深蒂固，复交不等于「矛盾最终解决」。","kp":"中国推动沙伊和解"},"2024-34":{"ex":"得分要点：①调查研究是党的传家宝，是谋事之基、成事之道，没有调查就没有发言权、没有决策权；②要坚持问题导向，善于抓问题、求答案，把真实情况和各种问题摸清楚；③调查与研究要相互贯通，在调查基础上深化研究，提高调研成果质量；④坚持实事求是、走群众路线，力戒形式主义、官僚主义，切实把成果转化为解决问题、改进工作的实际举措。","kp":"分析题：调查研究"},"2024-35":{"ex":"得分要点：①人与自然是生命共同体，人类对大自然的伤害最终会伤及人类自身，要尊重自然、顺应自然、保护自然；②绿水青山就是金山银山，保护生态环境就是保护生产力、改善生态环境就是发展生产力；③良好生态环境是最普惠的民生福祉，生态文明建设关系人民福祉、关乎民族未来；④坚持系统观念，统筹山水林田湖草沙一体化保护和系统治理，走绿色低碳循环发展之路，为全球生态文明建设贡献中国智慧。","kp":"分析题：人与自然和谐共生的现代化"},"2024-36":{"ex":"得分要点：①新文化运动高举民主（德先生）和科学（赛先生）两面大旗，反对封建专制和迷信愚昧，是一次空前的思想解放运动；②民主与科学的提倡，为马克思主义在中国的传播创造了条件，五四运动后新文化运动转向传播马克思主义；③历史启示：思想解放是社会变革的先导，要坚持以马克思主义为指导，发展社会主义民主政治、弘扬科学精神；④对传统文化要取其精华、去其糟粕，坚持创造性转化、创新性发展，不能全盘否定。","kp":"分析题：新文化运动与「德先生」「赛先生」"},"2024-37":{"ex":"得分要点：①「自找苦吃」体现青年在艰苦环境中磨砺意志、增长才干的成长规律，实践是认识的来源、是检验认识真理性的唯一标准；②要在实践中与人民群众相结合，走与工农相结合的道路，把个人理想融入国家和民族事业；③人生价值在于对社会的责任和贡献，在服务人民、奉献社会中实现自我价值；④红旗渠精神（自力更生、艰苦创业、团结协作、无私奉献）是激励青年艰苦奋斗的强大精神力量；⑤新时代青年要立志做有理想、敢担当、能吃苦、肯奋斗的新时代好青年。","kp":"分析题：新时代青年的「自找苦吃」"},"2024-38":{"ex":"得分要点：①共建「一带一路」以共商共建共享为原则，坚持开放包容、互利共赢，是构建人类命运共同体的重要实践平台；②「小而美」民生项目聚焦共建国家民众需求，把「硬联通」「软联通」「心联通」结合起来，让合作成果惠及普通民众；③体现正确义利观，既讲求经济效益，更重视民生改善和民心相通；④推动共建国家共同发展，为世界经济增长提供新动能，推动全球治理体系朝着更加公正合理的方向发展。","kp":"分析题：共建「一带一路」与「小而美」项目"},"2024-4":{"ex":"列宁只揭示未来社会发展的方向和基本原则，不陷入细节描绘，因为现在还没有可供解决这些问题的材料，故选 D。A 错：马克思、恩格斯没有为未来社会设计具体措施和方式方法；B 错：他们揭示了适用于人类社会发展的普遍规律；C 错：列宁恰恰提出了未来社会发展的方向、原则和基本特征。","kp":"马克思主义展望未来社会的方法"},"2024-5":{"ex":"毛泽东提出把正确处理人民内部矛盾作为国家政治生活的主题，根本着眼点是调动一切积极因素为社会主义事业服务，故选 A。B 扩大民主、健全法治是具体路径；C 维护稳定是效果；D 错：矛盾不能被「消除」，只能正确认识和处理。","kp":"《关于正确处理人民内部矛盾的问题》"},"2024-6":{"ex":"改革开放的鲜明特征和首要任务是解放和发展社会生产力，故选 A。B 形成更加成熟更加定型的制度是全面深化改革的目标；C 处理好政府和市场关系是经济体制改革的核心问题；D 促进社会公平正义、增进人民福祉是改革的出发点和落脚点。","kp":"改革开放的鲜明特征和首要任务"},"2024-7":{"ex":"新时代「枫桥经验」最突出的特点是最大限度把矛盾风险防范化解在基层，故选 B。A 顶层设计、C 人文关怀与心理疏导、D 发挥政府主导作用，都是社会治理的具体做法，不是「枫桥经验」最突出的特点（其精髓是依靠群众就地化解矛盾）。","kp":"新时代「枫桥经验」"},"2024-8":{"ex":"保障粮食安全的关键在于落实藏粮于地、藏粮于技战略，守住耕地红线、提升单产水平，故选 C。A 健全种粮农民收益保障机制、D 完善主产区利益补偿制度是调动种粮积极性的举措；B 农业供给侧结构性改革是工作主线，都不是「关键」。","kp":"保障粮食安全的关键"},"2024-9":{"ex":"对中华民族形成起决定作用的是对中华民族共同体的认同，故选 B。A 种族血缘、C 宗教信仰、D 共同生活地域都不是「起决定作用」的因素——中华民族是历史上各民族交往交流交融形成的共同体，认同是最深层的力量。","kp":"中华民族共同体的认同"},"2025-1":{"ex":"「大农业观」「大食物观」把耕地、草原、森林、海洋以及植物、动物、微生物作为一个整体来统筹，向陆地要食物也向海洋要食物，是从整体性、结构性、开放性地把握事物，属于系统思维，故选 C。A 极限思维强调底线与风险，B 历史思维强调以史为鉴，D 逆向思维强调反向思考，与题干不符。","kp":"系统思维"},"2025-10":{"ex":"毛泽东指出，外国资本主义侵入一方面破坏了中国自然经济的基础、客观上为资本主义发展造成某些条件，另一方面帝国主义勾结中国封建势力压迫中国资本主义的发展，故选 B。A「彻底破坏」不准确；C 统一的资本主义经济并未形成，中国仍是地方性农业经济占优势；D「完全成为附庸」是「半殖民地」的表述，且不是与前者「同时存在的另一个方面」。","kp":"外国资本主义侵入的双重作用"},"2025-11":{"ex":"近代中国「实业救国」之所以走不通，根本上是因为民族独立和人民解放尚未实现，没有独立自主的国家政权，实业发展处处受制于帝国主义和封建势力，故选 A。B、C、D 都是近代中国的落后表现，但不是「道路走不通」的根本原因。","kp":"「实业救国」道路走不通的原因"},"2025-12":{"ex":"1945 年党的七大把毛泽东思想确立为党的指导思想并写入党章，故选 A。B 错：民主集中制原则在建党初期和六大前后已提出；C 反帝反封建民主革命纲领是 1922 年中共二大制定的；D 思想建党、政治建军原则是 1929 年古田会议确立的。","kp":"中共七大的历史性贡献"},"2025-13":{"ex":"《决议》强调党的各项工作都必须服从和服务于经济建设这个中心，故选 B。A 错：工作重心由农村转向城市是 1949 年七届二中全会提出的；C 错：优先发展重工业是「一五」时期的方针，不是《决议》强调的内容；D 表述与《决议》主旨不符。","kp":"《关于建国以来党的若干历史问题的决议》"},"2025-14":{"ex":"隐私权属于人格尊严权，是自然人享有的私人生活安宁与私人信息依法受到保护、不被他人非法侵扰、知悉、搜集、利用和公开的人格权，故选 C。A 生命健康权、B 民主管理权、D 通信自由权都属于其他权利类型。","kp":"人格尊严权"},"2025-15":{"ex":"全会提出，教育、科技、人才是中国式现代化的基础性、战略性支撑，故选 D。A、B 属于高水平社会主义市场经济体制的内容，C 属于物质文明和精神文明相协调的要求。","kp":"中国式现代化的基础性、战略性支撑"},"2025-16":{"ex":"2024 年中非合作论坛北京峰会首次提出在非洲启动建设农业发展与减贫示范村，故选 D。A、B、C 都属于此前或同期其他场合的表述，不是本次峰会「首次提出」的成果。","kp":"2024 中非合作论坛北京峰会首次提出"},"2025-17":{"ex":"人类与病毒协同进化表明，人与自然的和谐共生以自然界的客观规律为基础（C），人的活动的选择性与自然界的先在性是动态统一的（D）。A 错：人与自然的关系包含社会历史内容，不只是生物演变过程；B 错：人类社会有其特有规律，不能由生物进化规律决定。","kp":"人与自然关系"},"2025-18":{"ex":"脑机接口使意识活动转化为对外部设备的控制，说明意识能够通过智能机器实现对象化、现实化（A），能够物化机器的物理运动从而延伸意识器官的功能（D）。B 错：机器没有情感、意念、意志，不能代替人的意识；C 错：数据信息不能还原和取代真实的社会交往与情感。","kp":"意识的能动作用"},"2025-19":{"ex":"竹的多样化功能说明价值随着主体、客体及其相互关系的变化而变化（A），并随着实践发展由潜在价值转化为现实价值（C）。B 错：价值不以主体的欲望、情感和兴趣的转移为转移，那是主观价值论；D 错：价值转化必须通过实践，不会因客体属性「自然显露」而自动实现。","kp":"价值的特性"},"2025-2":{"ex":"马克思的「从后思索法」指对历史的认识从事后、从发展过程的完成结果开始，正如「人体解剖对于猴体解剖是一把钥匙」——以发展的高级形态为钥匙去理解低级形态，故选 B。A 是主观唯心主义命题；C 讲逻辑与历史一致，与「相反顺序」不符；D 否认了历史发展的特殊性，也与辩证法相悖。","kp":"「从后思索法」"},"2025-20":{"ex":"马克思所说的「有用又是劳动产品但不是商品」的物，是产品不用于交换的情形：中世纪农民为封建主生产作为代役租的粮食（A）、农民为养活家人生产并消费的农副产品（B）、佃农生产并上缴地主的地租（D）都是如此。C 错：为获取利润而生产、用于交换的农产品是商品。","kp":"不是商品的劳动产品"},"2025-21":{"ex":"工人从传统劳动方式转向监督者、调节者、操作者，说明资本主义生产关系也要适应生产力发展要求而调整（B），阶级结构和社会阶层发生新变化（C）；资产阶级不改进生产工具和生产关系就无法生存（D）。A 错：资本主义生产资料所有制的根本性质并未改变。","kp":"当代资本主义的新变化"},"2025-22":{"ex":"一脉相承又与时俱进体现在：都贯穿实事求是、群众路线、独立自主的立场观点方法（B），都科学回答了时代提出的重大理论和实践课题（C），都以独创性理论成果丰富和发展了马克思主义（D）。A 错：不同理论成果面对的时代主题和历史任务并不相同。","kp":"马克思主义中国化时代化理论成果的关系"},"2025-23":{"ex":"民营经济迅速发展说明非公有制经济发展的政策制度环境不断优化（A）、促进其发展壮大的体制机制不断完善（B）、发展活力不断提升（D）。C 错：在国民经济中起主导作用的是国有经济，非公有制经济是社会主义市场经济的重要组成部分。","kp":"非公有制经济的地位"},"2025-24":{"ex":"基层立法联系点有利于健全汇集民智工作机制（A）、完善民意表达平台和载体（B）、践行全过程人民民主（C）、丰富中国特色社会主义民主形式（D），四项全选。","kp":"基层立法联系点"},"2025-25":{"ex":"推动废弃物循环利用有利于形成节约集约循环利用的资源观（A）、转变资源利用方式提高利用效率（B）、实现生产系统和生活系统循环链接（C）。D 错：水土流失综合治理属于生态保护修复，与废弃物循环利用不是同一范畴。","kp":"废弃物循环利用"},"2025-26":{"ex":"文化能提供价值指引和精神力量（A），文化融入经济活动有助于激活发展动能、提升发展品质（C），文化繁荣有助于激发社会创新创造活力（D）。B 错：解决新时代社会主要矛盾的根本途径是高质量发展（发展是第一要务），不是文化建设。","kp":"文化对高质量发展的作用"},"2025-27":{"ex":"党从成立起就是一个以马克思列宁主义理论为基础的党（A），是区别于第二国际旧式社会改良党的新型工人阶级革命政党（D）。B 错：党是马克思主义与中国工人运动相结合的产物，不是农民运动的产物；C 错：成立之初并未强调与其他党派合作，「统一战线」是后来在革命实践中提出并逐步完善的。","kp":"中国共产党成立的历史特点"},"2025-28":{"ex":"六届六中全会上毛泽东明确提出了「马克思主义的中国化」命题（A），会议纠正了王明的右倾错误、统一了全党思想和步调（C）。B 错：由新民主主义向社会主义转变的发展方向是 1949 年七届二中全会提出的；D 错：指明党内小资产阶级思想来源、表现及纠正方法的是 1942 年延安整风。","kp":"党的六届六中全会"},"2025-29":{"ex":"1992 年南方谈话提出「革命是解放生产力，改革也是解放生产力」（A），「计划多一点还是市场多一点，不是社会主义与资本主义的本质区别」（C），并强调在整个改革开放过程中必须始终注意坚持四项基本原则（D）。B 是 1982 年党的十二大开幕词中的话，不属于南方谈话。","kp":"1992 年南方谈话的论断"},"2025-3":{"ex":"习近平的论述强调不能简单归功或归咎于个人、不能用今天的条件衡量前人，表明要从特定历史条件出发对历史人物作具体全面的考察和评价，故选 D。A 错：杰出个人的作用不能与人民群众「同等重要」；B 错：杰出人物不能改变历史发展的基本方向；C 错：题干没有顺境逆境作用大小的比较。","kp":"评价历史人物的方法"},"2025-30":{"ex":"法律至上表现为：法律必须遵守，违反法律要受到惩罚（A）；法律在本国主权范围内对所有人具有普遍约束力（C）；多种社会规范相互矛盾时优先适用法律规范（D）。B 错：法治思维要求依法办事，但不能用法律逻辑去分析和解决「一切」社会问题，道德、政策等规范同样有其作用空间。","kp":"法律至上"},"2025-31":{"ex":"集体主义强调国家利益高于个人利益（B），同时重视和保障个人的正当利益（D）。A 错：不是无条件服从，只有个人利益与集体利益发生根本冲突时才要求个人利益服从集体利益；C 错：集体利益不是个人利益的简单相加。","kp":"集体主义的基本原则"},"2025-32":{"ex":"《意见》明确了各类「台独」分裂行径的犯罪性质、刑事责任和惩处程序（A），回应了两岸最大多数民众的诉求与期盼（B），彰显了捍卫国家主权、统一和领土完整的坚定立场（C），充实了反「台独」、反干涉的法律工具箱（D），四项全选。","kp":"依法惩治「台独」顽固分子的意义"},"2025-33":{"ex":"金砖机制持续壮大、合作常葆活力，关键在于以开放包容为襟怀（A）、以合作共赢为目标（B）、以公平正义为追求（C）。D 错：金砖是合作机制而非军事、政治同盟，「构建同盟」不符合金砖精神。","kp":"金砖机制的关键"},"2025-34":{"ex":"得分要点：①真理是绝对性与相对性的统一：任何真理都包含不依赖于人的客观内容，这是绝对性；任何真理又都是对客观世界一定范围、一定层次的近似正确反映，这是相对性；②恩格斯的话批评的是以「终极真理」标准衡量认识的形而上学观点，说明认识随历史材料增加而不断完善；③绝对真理与相对真理相互包含、相互转化，不能割裂，否则会陷入绝对主义或相对主义、怀疑主义；④对待马克思主义要坚持真理、修正错误，在实践中不断丰富和发展。","kp":"分析题：真理的绝对性与相对性"},"2025-35":{"ex":"得分要点：①制度优势是一个政党、一个国家的最大优势，国家治理体系和治理能力现代化是现代化的重要方面；②改革是社会主义制度的自我完善和发展，坚持以制度建设为主线，守正创新；③坚持党的全面领导，坚持和完善中国特色社会主义制度，把制度优势转化为治理效能；④改革要处理好顶层设计与基层探索、破与立的关系，为进一步全面深化改革、推进中国式现代化提供制度保障。","kp":"分析题：制度优势与全面深化改革"},"2025-36":{"ex":"得分要点：①中日战争是半殖民地半封建的中国与帝国主义日本之间的决死战争，日本是强国但战争是退步的、野蛮的，中国是弱国但战争是进步的、正义的；②驳斥「亡国论」和「速胜论」，指出抗日战争是持久战，最终胜利属于中国；③兵民是胜利之本，动员和依靠人民群众，实行全民族抗战；④科学预见战争的三个阶段（战略防御、战略相持、战略反攻），阐明游击战争的战略地位；⑤《论持久战》是运用唯物辩证法分析战争问题的典范，坚定了全民族抗战的信心。","kp":"分析题：《论持久战》"},"2025-37":{"ex":"得分要点：①塞罕坝人创造了荒原变林海的人间奇迹，铸就了牢记使命、艰苦创业、绿色发展的塞罕坝精神；②人与自然是生命共同体，保护生态环境就是保护生产力，改善生态环境就是发展生产力；③坚持山水林田湖草沙一体化保护和系统治理，科学治沙、久久为功；④弘扬塞罕坝精神，牢固树立和践行绿水青山就是金山银山的理念，为建设美丽中国、实现人与自然和谐共生的现代化贡献力量。","kp":"分析题：塞罕坝精神与生态文明"},"2025-38":{"ex":"得分要点：①数字经济正在成为重组全球要素资源、重塑全球经济结构、改变全球竞争格局的关键力量，是把握新一轮科技革命和产业变革新机遇的战略选择；②我国数字经济规模居世界前列，要推动数字技术与实体经济深度融合，加快建设数字中国；③数字鸿沟、数据安全、平台治理等问题凸显，需要完善全球数字治理规则；④坚持共商共建共享，推动构建网络空间命运共同体，让数字经济发展成果惠及各国人民。","kp":"分析题：数字经济与全球治理"},"2025-4":{"ex":"列宁得出这一结论的依据是资本主义经济政治发展不平衡规律，故选 C。A 错：当时各国无产阶级的国际联盟并未形成；B 普选制并未为社会主义革命创造新条件；D 错：革命意识与经济发展水平并不存在正相关，这恰恰是列宁反对的观点。","kp":"社会主义革命可能在一国首先胜利"},"2025-5":{"ex":"1930 年毛泽东写《反对本本主义》，强调中国革命斗争的胜利要靠中国同志了解中国情况，直接针对的是当时党内把马克思主义教条化、把共产国际指示神圣化的倾向，故选 B。A 巩固统一战线、C 防止非无产阶级思想侵蚀、D 改变旧军队作风，都不是此文的主要指向。","kp":"《反对本本主义》"},"2025-6":{"ex":"社会主义初级阶段理论是邓小平理论的重要组成部分，为制定路线方针政策提供了总依据，故选 C。A 根本任务和发展战略回答「干什么」，B 社会主义本质回答「什么是社会主义」，D 社会主义社会矛盾学说回答发展动力，都不是「总依据」。","kp":"社会主义初级阶段理论"},"2025-7":{"ex":"习近平总书记指出，创立习近平新时代中国特色社会主义思想是文化主体性的最有力体现，故选 A。B 创造性转化、创新性发展是路径，C 铸牢中华民族共同体意识是民族工作主线，D 把握文化发展规律是认识层面的要求。","kp":"文化主体性最有力的体现"},"2025-8":{"ex":"当前我国的高水平对外开放主要是指制度型开放，即对接国际高标准经贸规则、稳步扩大规则规制管理标准等制度型开放，故选 D。A 全局性开放、B 要素型开放、C 政策性开放都是对外开放的不同层面，不是「当前」的定位。","kp":"高水平对外开放主要指"},"2025-9":{"ex":"新时代加强社会建设，要以健全和完善社会保障体系为重要着力点，织密扎牢民生保障网，故选 A。B 城乡社区治理属于社会治理，C 第三次分配属于分配制度，D 平安中国建设属于国家安全和社会治理范畴。","kp":"社会建设的重要着力点"},"2026-1":{"ex":"「阶梯式递进」体现发展是连续性与非连续性的统一、要经过若干阶段（③），「不断发展进步」体现前进性与曲折性相统一（①）、规律性与能动性相统一（②）。④「直线性与循环性」既否认了曲折性又陷入循环论，是错误的。故 ①②③ 正确，选 A。","kp":"发展的前进性与曲折性"},"2026-10":{"ex":"西方列强通过不平等条约攫取特权，使中国由独立的封建社会逐步沦为半殖民地半封建社会，社会性质发生根本改变，选 B。A 资本主义因素的出现是侵略的客观后果，不是「重大转折」的主要表现；C 地主阶级并未退出历史舞台；D 统治集团分化是次要现象。","kp":"鸦片战争后中国社会性质的变化"},"2026-11":{"ex":"遵义会议独立自主地解决了军事和组织问题，开启了中国共产党独立自主解决中国革命实际问题的新阶段，选 D。A 抗日民族统一战线策略总方针是 1935 年瓦窑堡会议制定；B 马克思主义建党建军原则由古田会议确立；C 农村包围城市的道路在井冈山时期已开辟。","kp":"遵义会议的意义"},"2026-12":{"ex":"辽沈、淮海、平津三大战役共歼灭和改编国民党军队 154 万余人，国民党主要军事力量基本被摧毁，选 A。B 工作重心由农村转向城市是 1949 年七届二中全会提出；C 国民党统治覆灭以 1949 年 4 月渡江战役、解放南京为标志；D 转入全国性反攻是 1947 年刘邓大军挺进大别山。","kp":"三大战役的意义"},"2026-13":{"ex":"国有企业改革是建立社会主义市场经济体制的中心环节，因为企业是市场的主体，选 C。A 价格体制改革、B 财政制度改革、D 流通体制改革都是配套改革，不是中心环节。","kp":"建立社会主义市场经济体制的中心环节"},"2026-14":{"ex":"「人生的扣子从一开始就要扣好」强调的是青年处于价值观形成和确立的时期，价值观教育必须抓早抓实，选 B。A、C、D 都只是重复「核心价值观重要」，没有扣住「从一开始」这一时间性要求。","kp":"青年价值观教育要抓早抓实"},"2026-15":{"ex":"1945 年 10 月 25 日，中国战区台湾省受降仪式在台北举行，台湾重归中国版图，这一天被确定为台湾光复纪念日，选 A。B《开罗宣言》《波茨坦公告》是 1943、1945 年的国际文件；C 日本签署投降书在 1945 年 9 月 2 日；D《终战诏书》发布于 1945 年 8 月 15 日。","kp":"台湾光复"},"2026-16":{"ex":"联大设立该国际日，目的在于敦促各国不采取、不执行、不实施任何单边经济、金融或贸易措施，维护多边主义和国际法治，选 A。B 错：该决议不是专门针对某一国的关税战；C「彻底消除」绝对化；D 错：不是要「重新确立」国际关系基本准则。","kp":"反对单边强制措施国际日"},"2026-17":{"ex":"暗物质不发光、不参与电磁相互作用，却能被科学把握，说明物质不依赖于人的意识而存在，并能为人的意识所反映，选 BD。A 错：客观性不靠人的具体感知来确证；C 是把物质世界理解为直观的、机械的旧唯物主义观点；D 正确——世界没有不可认识的「物自体」。","kp":"物质的客观实在性与可知性"},"2026-18":{"ex":"科学家依据基因来源与块茎形成规律培育新作物，说明对客观事物规律的把握是人们正确活动的基础（A），人类改造世界的能力随着科学实践的发展而发展（D）。B 错：联系是客观的，不由主观意志赋予；C 错：改造客观世界不一定以先改造主观世界为前提，二者是统一的实践过程。","kp":"规律与主观能动性"},"2026-19":{"ex":"人的知识和认知能力随着生活实践的发展而发展（A），随着认识工具的变革而深化（C），随着人与外部世界互动的加深而演进（D）。B 错：具身智能的发展是认识和实践能力提升的条件，不会导致「系统退化」。","kp":"认识与实践"},"2026-2":{"ex":"叶片以翻滚旋转的复杂形态下落、朝向受内部结构、外在形态、空气阻力、涡流与风等多种因素影响，说明事物的发展变化是各种因素相互作用的结果，选 D。A 错：内因是根据，不是「取决于外在因素」；B 错：并非纯粹偶然；C 错：「物质形态变化的规律」不是题干的落点，且表述片面。","kp":"事物发展的原因"},"2026-20":{"ex":"科学美影响科学家的研究视角和风格，说明科学研究中的创新思维既包括感性认识也包括理性认识（B），审美情感等非理性因素对认识活动具有激活、驱动作用（D）。A 错：起决定性作用的是实践；C 错：「最能够揭示本质规律」夸大了审美观照的作用。","kp":"非理性因素在认识中的作用"},"2026-21":{"ex":"河流对文明的物质与精神作用表明，每一种文明都生长于特定的自然环境和民族传统（B），自然地理环境的优劣能加速或延缓社会文明进步（C）。A 错：文明交流的途径多样，不只通过河流；D 错：地理环境起影响作用而非决定作用。","kp":"地理环境对社会发展的作用"},"2026-22":{"ex":"毛泽东这段话主张尊重文化多样性（A），要有自己的文化自信（B），对外国的东西一概排斥或全盘吸收都是错误的（C），要学习外国长处、创造有自己民族风格的东西（D），四项全选。","kp":"文化多样性"},"2026-23":{"ex":"有为政府的作用是弥补市场不足（A）、引导市场更好发挥作用（C）、规范市场竞争秩序（D）。B 错：政府不直接干预各领域经济活动，而是通过宏观调控和有效治理发挥作用。","kp":"有为政府的作用"},"2026-24":{"ex":"高标准建设海南自贸港有利于引领新时代高水平对外开放（A）、助力全国构建新发展格局（B）、打造形态多样的开放高地（C）、推动我国自由贸易试验区建设（D），四项全选。","kp":"海南自由贸易港全岛封关"},"2026-25":{"ex":"该法是我国第一部专门关于民营经济发展的基础性法律（A），首次将「两个毫不动摇」写进法律（B），首次在法律中规定促进民营经济持续健康高质量发展是国家长期坚持的重大方针政策（D）。C 错：外商投资的法律地位由《外商投资法》等规定，与该法无关。","kp":"《民营经济促进法》的意义"},"2026-26":{"ex":"统一战线始终不变的是大团结大联合的本质要求（A）、凝聚人心汇聚力量的作用（B）、求同存异的原则（C）。D 错：统战工作的具体政策策略随着形势任务变化而调整，恰恰是「变」的部分。","kp":"统一战线的「不变」"},"2026-27":{"ex":"符合「在北大工作或学习期间开始阅读、传播马克思主义」的史实是：李大钊组织成立马克思学说研究会（B），邓中夏在长辛店开办劳动补习学校（C）。A 陈独秀创办《青年杂志》在上海，时间在 1915 年；D 陈望道翻译《共产党宣言》在浙江义乌，均与北大无关。","kp":"北大与马克思主义传播"},"2026-28":{"ex":"体现在坚持全面抗战路线（A）、开辟敌后战场开展游击战争（B）、提出并实施持久战的战略总方针和人民战争的战略战术（C）。D 错：「集中优势兵力、各个歼灭敌人」是解放战争时期的十大军事原则，不属于抗战时期。","kp":"中国共产党在抗战中的中流砥柱作用"},"2026-29":{"ex":"十一届三中全会后至党的十五大前，我国颁布《中外合资经营企业法》（A）、恢复在世界银行和国际货币基金组织的代表权（C）、在深圳珠海汕头厦门设置经济特区（D）。B 错：加入世界贸易组织是 2001 年，晚于十五大（1997 年）。","kp":"截至十五大前的对外开放突破"},"2026-3":{"ex":"「兵无常势，水无常形」强调用兵要因敌变化、随机应变，这正契合「意志自由只是借助于对事物的认识来作出决定」——自由以认识必然为前提，选 C。A 是教条主义（从原则出发）；B 是理性主义独断论；D 是唯心主义把思维当作联系事物的本质。","kp":"「兵无常势，水无常形」对应哪条原理"},"2026-30":{"ex":"理想是社会实践的产物，说明理想需要通过实践来实现（A），实践是检验理想科学与否的标准（B），实践能深化对理想的认识（D）。C 错：理想不是社会实践的「必备条件」，实践不以理想为前提。","kp":"理想与实践的关系"},"2026-31":{"ex":"二者相互依存：法律权利的实现必须以相应法律义务的履行为条件（C），法律权利的存在和发展以法律义务的存在和发展为条件（D）。A 错：义务离开权利就失去存在的意义，不具有独立履行价值；B 错：并非所有权利义务都具有复合性结构，表述绝对化。","kp":"法律权利与法律义务的关系"},"2026-32":{"ex":"农业新质生产力主要体现为农业传统生产领域科技的原创性突破（B）、先进生产要素的引入与集成（C）、农业向生物制造等领域跨界突破（D）。A 错：农村幸福宜居品质提升是乡村建设的目标，不属于新质生产力的内涵。","kp":"农业新质生产力的体现"},"2026-33":{"ex":"无论国际风云如何变幻，中非关系不会变的是真实亲诚的对非政策理念（B）、患难与共守望相助的初心（C）、合作共赢共同发展的根本宗旨（D）。A 错：中非是真诚友好的合作伙伴，不是「盟友关系」，中国坚持不结盟政策。","kp":"中非关系「不会变」"},"2026-4":{"ex":"列宁明确说速度、分工、劳动成为生活第一需要等具体情形「不知道也不可能知道」，可预见的只是生产力将有更大发展，选 B。A 具体方式不可预见；C 错：劳动成为「生活的第一需要」而非「唯一需要」；D 错：「无差别的全面发展」不是马克思主义的观点。","kp":"预见未来社会的方法"},"2026-5":{"ex":"「解剖麻雀」指选一两个典型单位深入调查，从个别中把握一般，从而全面深入了解本国实际、发现本国革命的规律，选 D。A、C 讲的是理论说服力与理论对实践的指导，B 讲反对错误倾向，都不是「解剖麻雀」的实际意义。","kp":"调查研究、解剖麻雀"},"2026-6":{"ex":"十三大报告以社会主义初级阶段作为立论的根据，好在它明确了社会主义初级阶段是我们制定路线方针政策的出发点和根本依据，选 C。A 错：报告不是阐明社会主义与共产主义的关系；B 只是判断本身，未说明「好在哪里」；D 根本任务问题是另一层面的内容。","kp":"社会主义初级阶段理论的地位"},"2026-7":{"ex":"在中国特色社会主义制度体系中居统治（统领）地位的是党的领导制度，它是我国的根本领导制度，选 B。A 民族区域自治制度是基本政治制度；C 社会主义基本经济制度是基本经济制度；D 全过程人民民主制度属于政治制度范畴，都不能居于统领地位。","kp":"中国特色社会主义制度的根本领导制度"},"2026-8":{"ex":"我国公共安全治理模式转型指从事后处置为主转向事前预防为主，坚持安全第一、预防为主，选 C。A 错：应是从单一管理转向多元共治；B 错：政府监管为主不能改为「市场监督为主」；D 错：由危机干预转向危机预防与疏导，方向表述错误。","kp":"公共安全治理模式转型"},"2026-9":{"ex":"环保从「加分项」变「及格线」、消费方式发生转变，说明生态环境问题的解决归根到底取决于经济发展方式和生活方式的转变，选 B。A、C、D 都是推动绿色发展的具体举措，不是「归根到底」的决定因素。","kp":"生态环境问题的根本解决"}}</script>

<script>
/* 站点前端：数据驱动渲染（参考 Alpine.js 的"声明式 + 局部状态"思路，但零依赖） */
(function () {
  'use strict';

  const PLAN = [
    ['马原', [1, 2, 3, 4], [17, 18, 19, 20, 21], [34], '#c0392b'],
    ['毛中特', [5, 6], [22], [36], '#b8860b'],
    ['新思想', [7, 8, 9], [23, 24, 25, 26], [35], '#2d6cb5'],
    ['史纲', [10, 11, 12, 13], [27, 28, 29], [36], '#0f8a5f'],
    ['思法', [14], [30, 31], [37], '#6b4bb8'],
    ['时政与当代', [15, 16], [32, 33], [38], '#5a6b85'],
  ];

  const NO2BK = new Map();
  const RANGE = new Map();
  for (const [name, s, m, a, color] of PLAN) {
    for (const n of s) { NO2BK.set(n, [name, color]); RANGE.set(n, `${name} · 单选 ${s[0]}-${s[s.length - 1]}`); }
    for (const n of m) { NO2BK.set(n, [name, color]); RANGE.set(n, `${name} · 多选 ${m[0]}-${m[m.length - 1]}`); }
    for (const n of a) { NO2BK.set(n, [name, color]); RANGE.set(n, `${name} · 分析 ${n}`); }
  }

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const store = {
    key: 'zz.pastpapers.standalone.v1',
    get() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
    set(o) { try { localStorage.setItem(this.key, JSON.stringify(o)); } catch (e) {} },
    toggleDone(id) {
      const s = this.get(); s.done = s.done || {};
      if (s.done[id]) delete s.done[id]; else s.done[id] = Date.now();
      this.set(s);
    },
    isDone(id) { return !!(this.get().done || {})[id]; },
    // 作答记录：pick=已选字母，shown=是否已揭晓答案
    getPick(id) { return (this.get().pick || {})[id] || ''; },
    setPick(id, v) {
      const s = this.get(); s.pick = s.pick || {};
      if (v) s.pick[id] = v; else delete s.pick[id];
      this.set(s);
    },
    isShown(id) { return !!(this.get().shown || {})[id]; },
    setShown(id) {
      const s = this.get(); s.shown = s.shown || {}; s.shown[id] = 1;
      s.done = s.done || {}; s.done[id] = Date.now();
      this.set(s);
    },
    /* 整卷一次性揭晓：一次读写，避免几十题各自 set 一遍 */
    revealAll(ids) {
      const s = this.get(); s.shown = s.shown || {}; s.done = s.done || {};
      const t = Date.now();
      for (const id of ids) { s.shown[id] = 1; s.done[id] = t; }
      this.set(s);
    },
    /* 整卷重置：连「已做」标记一起清，让「未做」筛选恢复干净 */
    clearIds(ids) {
      const s = this.get();
      for (const id of ids) {
        if (s.pick) delete s.pick[id];
        if (s.shown) delete s.shown[id];
        if (s.done) delete s.done[id];
      }
      this.set(s);
    },
    clear(id) {
      const s = this.get();
      if (s.pick) delete s.pick[id];
      if (s.shown) delete s.shown[id];
      // 只清作答记录，不动用户手动标记的 done
      this.set(s);
    },
  };
  const normAns = (s) => String(s || '').toUpperCase().split('').sort().join('');

  async function loadJSON(p) {
    const id = 'data-' + p.split('/').pop().replace('.json', '');
    const el = document.getElementById(id);
    if (!el) throw new Error('缺少内嵌数据：' + p);
    return JSON.parse(el.textContent);
  }

  /* ---------------------------------------------------- 真题套卷 */
  async function initPaper() {
    const [qs, model, exAll] = await Promise.all([
      loadJSON('data/questions.json'), loadJSON('data/model.json'),
      loadJSON('data/explain.json').catch(() => ({})),   // 解析可缺省
    ]);
    const EX = exAll || {};
    const perNo = {};
    for (const [k, v] of Object.entries(model.simulation.per_no_prob)) perNo[+k] = v;

    const years = [...new Set(qs.map((q) => q.year))].sort((a, b) => b - a);
    const byYear = new Map();
    for (const q of qs) {
      if (!byYear.has(q.year)) byYear.set(q.year, []);
      byYear.get(q.year).push(q);
    }

    const bar = $('.toolbar');
    const paper = $('#paper');
    const QMAP = new Map(qs.map((q) => [q.year + '-' + q.no, q]));
    let cur = years[0];
    let filter = '全部';

    /* ── 选择题计分 ────────────────────────────────────
       考研政治卷面：单选 1 分/题，多选 2 分/题。
       多选多选、少选、错选一律 0 分，所以只有全对才计分。
       只统计「已揭晓答案」的题，没收录答案的题不进分数、只提示。 */
    const PT = { 单选: 1, 多选: 2 };

    function scoreOf(year) {
      const s = store.get();
      const pick = s.pick || {};
      const shown = s.shown || {};
      const r = {
        full: 0, got: 0, cap: 0, tot: 0, judged: 0, na: 0, answered: 0,
        单选: { n: 0, ok: 0, na: 0, answered: 0 },
        多选: { n: 0, ok: 0, na: 0, answered: 0 },
      };
      for (const q of (byYear.get(year) || [])) {
        const pt = PT[q.type];
        if (!pt) continue;
        const o = r[q.type];
        o.n += 1; r.tot += 1; r.full += pt;
        const id = q.year + '-' + q.no;
        if (pick[id]) { o.answered += 1; r.answered += 1; }
        const ans = String(q.answer || '').toUpperCase();
        if (!/^[ABCD]+$/.test(ans)) { o.na += 1; r.na += 1; continue; }
        r.cap += pt;
        if (!shown[id]) continue;              // 没对答案的题不算分
        r.judged += 1;
        const p = pick[id] || '';
        if (p && normAns(p) === normAns(ans)) { o.ok += 1; r.got += pt; }
      }
      return r;
    }

    function renderScore() {
      const box = $('#scorecard');
      if (!box) return;
      const r = scoreOf(cur);
      const judgeable = r.tot - r.na;          // 有答案、可判分的题数
      const revealed = r.judged > 0;           // 是否已经对过答案
      const settled = judgeable > 0 && r.judged >= judgeable;
      const ratio = r.cap ? r.got / r.cap : 0;
      const col = ratio >= 0.8 ? 'var(--ok)' : ratio >= 0.6 ? 'var(--gold)' : 'var(--red)';
      box.className = 'scorecard' + (settled ? ' settled' : '');

      let note;
      if (!r.cap) {
        note = '这一年的答案还没收录，只能记作答进度、无法判分。';
      } else if (!revealed) {
        note = '还没对答案。做完整卷后点右上角 <b>统一对答案</b>，一次性批改并出分'
          + '（单选每题 <b>1</b> 分、多选每题 <b>2</b> 分，多选多选／少选／错选均为 0 分）。';
        if (r.answered < judgeable) {
          note += ' 还有 <b>' + (judgeable - r.answered) + '</b> 题没作答，未作答按 0 分计。';
        }
      } else {
        note = '口径：单选每题 <b>1</b> 分、多选每题 <b>2</b> 分；多选题多选、少选、错选均为 0 分。';
        note += r.judged < judgeable
          ? '已批改 ' + r.judged + ' / ' + judgeable + ' 题，还有 <b>' + (judgeable - r.judged) + '</b> 题没对。'
          : (r.na ? '可判分的 <b>' + judgeable + '</b> 题已全部批改完。'
                  : '<b>本卷选择题已全部批改完。</b>');
        if (r.na) note += '另有 <b>' + r.na + '</b> 题答案未收录（单 ' + r.单选.na + ' / 多 '
          + r.多选.na + '），这部分无法判分，本卷可判上限 ' + r.cap + ' 分。';
        note += ' 想看错题的解析，往下翻红色标注的题即可。';
      }

      box.innerHTML =
        '<div class="sc-h">本卷选择题战报<span class="sc-tag">' + cur + ' 卷</span>'
          + (settled ? '<span class="sc-tag">已批改</span>' : '') + '</div>'
        + '<div class="sc-row">'
        + '<div class="sc-item sc-main"><div class="n" style="color:' + (r.cap && revealed ? col : 'var(--muted2)') + '">'
          + (r.cap && revealed ? r.got + '<i> / ' + r.full + '</i>' : '—')
          + '</div><span>' + (!r.cap ? '暂不可判分' : (revealed ? '选择题得分' : '未对答案')) + '</span></div>'
        + '<div class="sc-item"><div class="n"' + (revealed ? '' : ' style="color:var(--muted2)"') + '>'
          + (revealed ? r.单选.ok + '<i> / ' + r.单选.n + '</i>' : '—')
          + '</div><span>单选 · 每题 1 分</span></div>'
        + '<div class="sc-item"><div class="n"' + (revealed ? '' : ' style="color:var(--muted2)"') + '>'
          + (revealed ? r.多选.ok + '<i> / ' + r.多选.n + '</i>' : '—')
          + '</div><span>多选 · 每题 2 分</span></div>'
        + '<div class="sc-item"><div class="n">'
          + (judgeable ? r.answered + '<i> / ' + judgeable + '</i>' : '—') + '</div>'
          + '<span>已作答</span></div>'
        + '</div><div class="sc-note">' + note + '</div>';

      const mini = $('#scJump');
      if (mini) {
        if (!r.cap) mini.textContent = '本卷不可判分';
        else if (!revealed) mini.textContent = '已答 ' + r.answered + '/' + judgeable;
        else mini.textContent = '选择 ' + r.got + '/' + r.full;
      }

      const jb = $('#judgeAll');
      if (jb) {
        jb._base = '统一对答案';
        if (jb._arm) { /* 等待二次确认，保留确认文案 */ } else if (judgeable && settled) {
          clearTimeout(jb._t);
          jb.textContent = '已批改 ✓'; jb.classList.add('done'); jb.disabled = true;
        } else {
          clearTimeout(jb._t);
          jb.textContent = '统一对答案'; jb.classList.remove('done', 'arm'); jb.disabled = false;
        }
      }
      syncMobileBar();
    }

    function render(force) {
      const sec = paper;
      sec.innerHTML = '';
      const list = (byYear.get(cur) || []).filter((q) => {
        if (filter === '全部') return true;
        if (filter === '未做') return !store.isDone(cur + '-' + q.no);
        return (NO2BK.get(q.no) || ['?'])[0] === filter;
      });
      const head = document.createElement('div');
      head.innerHTML = `<h1>${cur} 年全国硕士研究生招生考试 · 思想政治理论</h1>
        <p class="lead">共 ${(byYear.get(cur) || []).length} 题 · 做完点上方「统一对答案」一次批改 · 单选 1 分 / 多选 2 分 · 记录仅存本机</p>`;
      sec.appendChild(head);

      const sc = document.createElement('div');
      sc.className = 'scorecard';
      sc.id = 'scorecard';
      sec.appendChild(sc);
      renderScore();

      let lastSec = '';
      for (const q of list) {
        const secName = q.no <= 16 ? '一、单项选择题（1-16）'
          : q.no <= 33 ? '二、多项选择题（17-33）' : '三、材料分析题（34-38）';
        if (secName !== lastSec) {
          const h = document.createElement('div');
          h.className = 'section-title';
          h.textContent = secName;
          sec.appendChild(h);
          lastSec = secName;
        }
        const box = document.createElement('div');
        box.innerHTML = card(q);
        sec.appendChild(box.firstElementChild);
      }
      bindCards();
      syncMobileBar();
      if (force) window.scrollTo({ top: 0 });
    }

    function card(q) {
      const [bk, color] = NO2BK.get(q.no) || ['?', '#5a6b85'];
      const ans = (q.answer || '').toUpperCase();
      const ansSet = new Set(/^[ABCD]+$/.test(ans) ? ans.split('') : []);
      const id = q.year + '-' + q.no;
      const picked = store.getPick(id);
      const shown = store.isShown(id);
      const multi = q.type === '多选';
      const hasOpts = Object.keys(q.options || {}).length > 0;

      // 未揭晓时只显示「你选了什么」，正确/错误一律不提前暴露
      // 过滤空选项，避免两列网格里留空格子；按 A→D 排序，防止数据键序错乱
      const opts = Object.entries(q.options || {})
        .sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0)
        .filter(([, v]) => String(v).trim()).map(([k, v]) => {
        let cls = 'opt';
        if (shown) {
          if (ansSet.has(k)) cls += ' right';
          else if (picked.indexOf(k) > -1) cls += ' wrong';
        } else if (picked.indexOf(k) > -1) cls += ' picked';
        return `<li class="${cls}" data-k="${k}"><b>${k}</b>${esc(v)}</li>`;
      }).join('');

      let pred = '';
      if (multi && perNo[q.no] != null) {
        const p = perNo[q.no];
        pred = `<span class="pred${p >= 0.85 ? ' hi' : ''}">不全选 ${Math.round(p * 100)}%</span>`;
      }

      let foot;
      if (!hasOpts) {
        // 分析题没有选项可对，单独保留「看参考答案」，不影响一卷一批改的节奏
        foot = shown
          ? `<span class="ans${ans ? '' : ' na'}">${ans ? '参考答案 ' + esc(ans) : '参考答案未收录'}</span>`
          : `<button class="btn ghost act-show">看参考答案</button>`;
      } else if (!shown) {
        foot = `<span class="pickhint">${picked
          ? '已选 <b>' + picked + '</b>'
          : (multi ? '多选：可点多个' : '点选项作答')}</span>`;
      } else {
        const verdict = picked
          ? (normAns(picked) === normAns(ans)
            ? '<span class="ans ok">✓ 正确</span>'
            : '<span class="ans bad">✗ 你选 ' + picked + '</span>')
          : '<span class="ans na">未作答</span>';
        // 正确答案给出字母 + 选项全文，不用回头对照
        const ansText = ansSet.size
          ? [...ansSet].sort().map((k) => (q.options && q.options[k] ? q.options[k] : '')).filter(Boolean).join('　')
          : '';
        foot = `<span class="ans${ans ? '' : ' na'}">${ans ? '答案 ' + esc(ans) : '答案未收录'}</span>`
          + (ansText ? `<span class="ansfull">${esc(ansText)}</span>` : '') + verdict;
      }

      // 解析：批改后才出现，未收录时明确告知而不是留白
      let exd = '';
      if (shown) {
        const e = EX[id] || null;
        const kp = e && e.kp ? `<span class="exkp">考点 · ${esc(e.kp)}</span>` : '';
        const body = e && e.ex
          ? `<div class="exbody">${esc(e.ex)}</div>`
          : `<div class="exbody none">${hasOpts
            ? '这道题还没有解析，可先按考点自己梳理'
            : '这道题暂无参考答案，可先按考点自己整理答题要点'}</div>`;
        // 个人错题笔记（来自错题分析），与逐项解析分开展示
        const tip = e && e.tip
          ? `<div class="extip"><b>错题笔记</b>${esc(e.tip)}</div>`
          : '';
        exd = `<div class="exb">${kp}${body}${tip}</div>`;
      }

      return `<div class="q${shown ? ' revealed' : ''}" data-id="${id}">
        <span class="tag" style="background:${color}">${bk}</span>
        <span class="no">${q.no}.</span><span class="stem">${esc(q.stem).slice(0, 900)}</span>
        ${opts ? `<ul class="opts">${opts}</ul>` : ''}
        <div class="foot">${foot}<span class="pill">${RANGE.get(q.no) || bk + ' · ' + q.type}</span>${pred}</div>${exd}</div>`;
    }

    function bindCards() {
      if (bindCards.bound) return;
      bindCards.bound = true;
      paper.addEventListener('click', (e) => {
        const box = e.target.closest('.q');
        if (!box) return;
        const id = box.dataset.id;
        const q = QMAP.get(id);
        if (!q) return;
        const multi = q.type === '多选';

        if (e.target.closest('.opt')) {
          if (store.isShown(id)) return;          // 已揭晓不再改答案
          const li = e.target.closest('.opt');
          const k = li.dataset.k;
          let picked = store.getPick(id) || '';
          if (multi) picked = picked.indexOf(k) > -1 ? picked.replace(k, '') : picked + k;
          else picked = picked === k ? '' : k;
          picked = picked.split('').sort().join('');
          store.setPick(id, picked);
          // 局部更新，避免整卡重绘导致连点多选时丢失节点
          box.querySelectorAll('.opt').forEach((o) => {
            o.classList.toggle('picked', picked.indexOf(o.dataset.k) > -1);
          });
          const hint = box.querySelector('.pickhint');
          if (hint) hint.innerHTML = picked
            ? '已选 <b>' + picked + '</b>'
            : (multi ? '多选：可点多个' : '点选项作答');
          box.classList.remove('nopick');
          renderScore();                       // 只更新战报里的「已作答」进度
          return;
        }
        // 选择题不再逐题对答案，只有分析题保留「看参考答案」
        if (e.target.closest('.act-show')) {
          store.setShown(id); box.outerHTML = card(q); renderScore(); return;
        }
      });
    }

    bar.innerHTML = years.map((y) => `<button data-y="${y}">${y}</button>`).join('')
      + `<span class="spacer"></span><span class="hint">← → 切年份</span>`;
    const filters = ['全部', '未做', ...PLAN.map((p) => p[0])];
    const fbox = document.createElement('div');
    fbox.className = 'toolbar';
    fbox.style.top = '52px';
    fbox.innerHTML = filters.map((f, i) => `<button data-f="${f}" class="${i === 0 ? 'on' : ''}">${f}</button>`).join('')
      + `<span class="spacer"></span>`
      + `<button class="judge-btn" id="judgeAll">统一对答案</button>`
      + `<button class="reset-btn" id="resetAll" title="清空本卷作答记录，重新做一遍">重置本卷</button>`
      + `<b class="sc-mini" id="scJump" title="跳到本卷选择题战报">—</b>`;
    bar.after(fbox);
    $('#scJump').onclick = () => {
      const el = $('#scorecard');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    /* 手机 / 平板：单行下拉选择 + 操作按钮，替换 21 个年份按钮的换行堆叠 */
    const mbar = document.createElement('div');
    mbar.className = 'mtools';
    mbar.innerHTML =
      '<div class="mrow">'
      + '<label><span>年份</span><select id="mYear" aria-label="选择年份">'
      + years.map((y) => `<option value="${y}">${y} 年</option>`).join('') + '</select></label>'
      + '<label><span>筛选</span><select id="mFilter" aria-label="选择题型">'
      + filters.map((f) => `<option value="${f}">${f}</option>`).join('') + '</select></label>'
      + '</div>'
      + '<div class="mrow mact">'
      + '<button type="button" class="judge-btn" id="mJudge">统一对答案</button>'
      + '<button type="button" class="reset-btn" id="mReset">重置本卷</button>'
      + '<b class="sc-mini" id="mScore" role="button" tabindex="0">—</b>'
      + '</div>';
    bar.before(mbar);

    const mYear = mbar.querySelector('#mYear');
    const mFilter = mbar.querySelector('#mFilter');
    const mJudge = mbar.querySelector('#mJudge');
    const mReset = mbar.querySelector('#mReset');
    const mScore = mbar.querySelector('#mScore');
    mYear.value = String(cur);
    mFilter.value = filter;

    function syncMobileBar() {
      if (!mYear || !mJudge) return;
      if (mYear.value !== String(cur)) mYear.value = String(cur);
      if (mFilter.value !== filter) mFilter.value = filter;
      const jb = $('#judgeAll');
      if (jb) {
        if (mJudge.textContent !== jb.textContent) mJudge.textContent = jb.textContent;
        mJudge.classList.toggle('done', jb.classList.contains('done'));
        mJudge.classList.toggle('arm', jb.classList.contains('arm'));
        mJudge.disabled = jb.disabled;
      }
      const rb = $('#resetAll');
      if (rb) {
        if (mReset.textContent !== rb.textContent) mReset.textContent = rb.textContent;
        mReset.classList.toggle('arm', rb.classList.contains('arm'));
      }
      mScore.textContent = $('#scJump').textContent;
    }

    mYear.onchange = () => {
      cur = +mYear.value;
      $$('.toolbar button[data-y]').forEach((b) => b.classList.toggle('on', +b.dataset.y === cur));
      render(true);
    };
    mFilter.onchange = () => {
      filter = mFilter.value;
      $$('.toolbar button[data-f]').forEach((b) => b.classList.toggle('on', b.dataset.f === filter));
      render(false);
    };
    mJudge.onclick = () => $('#judgeAll').click();
    mReset.onclick = () => $('#resetAll').click();
    mScore.onclick = () => $('#scJump').click();
    mScore.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#scJump').click(); }
    };

    new MutationObserver(syncMobileBar).observe($('#judgeAll'), { attributes: true, childList: true, characterData: true, subtree: true });
    new MutationObserver(syncMobileBar).observe($('#resetAll'), { attributes: true, childList: true, characterData: true, subtree: true });
    new MutationObserver(syncMobileBar).observe($('#scJump'), { attributes: true, childList: true, characterData: true, subtree: true });

    /* ── 统一对答案：整卷一次性批改 ─────────────────────
       过程中不显示任何对错；点按钮需要再点一次确认，防止手滑提前揭晓。 */
    function choiceQs() {
      return (byYear.get(cur) || []).filter((q) => PT[q.type]
        && /^[ABCD]+$/.test(String(q.answer || '').toUpperCase()));
    }

    function flash(btn, label) {
      if (!btn._base) btn._base = btn.textContent;
      btn.textContent = label;
      btn.classList.add('arm');
      clearTimeout(btn._t);
      btn._t = setTimeout(() => {
        btn._arm = 0;
        btn.textContent = btn._base;
        btn.classList.remove('arm');
      }, 4000);
    }

    function settle(btn) {
      btn._arm = 0;
      clearTimeout(btn._t);
      btn.classList.remove('arm');
      if (btn._base) btn.textContent = btn._base;
    }

    function doJudge() {
      const list = choiceQs();
      if (!list.length) return;
      store.revealAll(list.map((q) => q.year + '-' + q.no));
      settle($('#judgeAll'));
      render(false);
      const el = $('#scorecard');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('#judgeAll').onclick = function () {
      const list = choiceQs();
      if (!list.length) {
        alert('这一年的答案还没收录，无法批改。');
        return;
      }
      const r = scoreOf(cur);
      const left = (r.tot - r.na) - r.answered;
      if (!this._arm) {
        this._arm = 1;
        flash(this, left ? '确认？还有 ' + left + ' 题未作答' : '确认对答案？');
        const el = $('#scorecard');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      doJudge();
    };

    $('#resetAll').onclick = function () {
      if (!this._arm) {
        this._arm = 1;
        flash(this, '确认清空本卷？');
        return;
      }
      settle(this);
      store.clearIds((byYear.get(cur) || []).map((q) => q.year + '-' + q.no));
      render(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    $$('.toolbar button[data-y]').forEach((b) => {
      b.onclick = () => {
        cur = +b.dataset.y;
        $$('.toolbar button[data-y]').forEach((x) => x.classList.toggle('on', x === b));
        render(true);
      };
    });
    $$('.toolbar button[data-f]').forEach((b) => {
      b.onclick = () => {
        filter = b.dataset.f;
        $$('.toolbar button[data-f]').forEach((x) => x.classList.toggle('on', x === b));
        render(false);
      };
    });
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const i = years.indexOf(cur);
      if (e.key === 'ArrowRight') { cur = years[Math.max(0, i - 1)]; }
      else if (e.key === 'ArrowLeft') { cur = years[Math.min(years.length - 1, i + 1)]; }
      else return;
      $$('.toolbar button[data-y]').forEach((x) => x.classList.toggle('on', +x.dataset.y === cur));
      render(false);
    });

    $$('.toolbar button[data-y]').forEach((x) => x.classList.toggle('on', +x.dataset.y === cur));
    render(false);
  }


  document.addEventListener('DOMContentLoaded', () => {
    initPaper().catch((e) => {
      console.error(e);
      document.getElementById('paper').innerHTML = '<div class="note">题库加载失败，请重新打开文件。</div>';
    });
  });
})();
</script>
</body>
</html>
