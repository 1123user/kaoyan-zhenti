社会公平的重要体现","B":"解决当前收入分配领域突出问题的需要","C":"实现共同富裕的内在要求","D":"为了使人民共享改革发展的成果"},"answer":"ABCD"},{"year":2011,"no":26,"type":"多选","stem":"辛亥革命是我国近代史上一次比较完全意义上的资产阶级民主革命。这是因为辛亥革命：","options":{"A":"提出了平均地权，耕者有其田的重要原则","B":"建立了中国近代史上第一个资产阶级政党","C":"制定了比较完整的资产阶级民主革命纲领","D":"结束了封建君主专制制度，建立了资产阶级共和国"},"answer":"BCD"},{"year":2011,"no":27,"type":"多选","stem":"第二次世界大战期间，明确规定将台湾、澎湖列岛归还中国的有关国际条约是：","options":{"A":"《德黑兰宣言》","B":"《开罗宣言》","C":"《雅尔塔协定》","D":"《波茨坦公告》"},"answer":"BD"},{"year":2011,"no":28,"type":"多选","stem":"延安整风运动是一场非常伟大的思想解放运动。这一运动最主要的任务是反对主观主义。主观主义的主要表现形式为：","options":{"A":"教条主义","B":"形式主义","C":"经验主义","D":"宗派主义"},"answer":"AC"},{"year":2011,"no":29,"type":"多选","stem":"中国共产党根据马克思列宁主义关于农业社会主义改造的思想，从我国的实际出发，开创了一条有中国特点的农业合作化道路，成功地实现了对个体农业的社会主义改造。其历史经验主要有：","options":{"A":"国家用先进的技术和装备发展农业经济","B":"遵循自愿互利、典型示范和国家帮助的原则","C":"在土地改革后不失时机地引导个体农民走互助合作道路","D":"采取从互助组到初级社再到高级社的逐步过渡形式"},"answer":"BCD"},{"year":2011,"no":30,"type":"多选","stem":"刑法的基本原则是指刑法特有的在刑法的立法、解释和适用过程中所必须普遍遵循的具有全局性、根本性的准则。我国刑法明文规定的基本原则有：","options":{"A":"罪刑法定原则","B":"疑罪从无原则","C":"罪刑相当原则","D":"适用刑法一律平等原则"},"answer":"ACD"},{"year":2011,"no":31,"type":"多选","stem":"有位法学家曾经说过：“法律必须被信仰，否则等于形同虚设。”这句话表明，一个人只有从内心深处真正认同、信任和信仰法律，才会自觉维护法律的权威。由此可见：","options":{"A":"法律的内在说服力是法律权威的内在基础","B":"法律权威不可能完全建立在外在强制力的基础之上","C":"法律信仰与宗教信仰没有本质的区别","D":"法律信仰是法律制定和执行的根本依据"},"answer":"AB"},{"year":2011,"no":32,"type":"多选","stem":"2010 年10 月15 日至18 日，中国共产党第十七届中央委员会第五次全体会议在北京举行。全会审议通过的《中共中央关于制定国民经济和社会发展第十二个五年规划的建议》强调，在当代中国，坚持发展是硬道理的本质要求，就是坚持科学发展，更加注重：","options":{"A":"以人为本","B":"全面协调可持续发展","C":"统筹兼顾","D":"保障和改善民生，促进社会公平正义"},"answer":"ABCD"},{"year":2011,"no":33,"type":"多选","stem":"2010 年4 月13 日，胡锦涛主席在核安全峰会上发表题为《携手应对核安全挑战，共同促进和平与发展》 的讲话，强调中国本着负责任的态度，高度重视核安全，坚决反对核扩散和核恐怖主义，为此作出了一系列积极努力。其中包括：","options":{"A":"全面加强核安全能力","B":"严格履行核安全国际义务","C":"重视并积极参与国际核安全合作","D":"积极向发展中国家提供核安全援助"},"answer":"ABCD"},{"year":2011,"no":34,"type":"分析","stem":"结合材料回答问题： 人类每天都在产生垃圾，垃圾总量一天比一天多，由此带来的问题非常棘手。不产生垃圾是不可能的。 既然如此，那就退而求其次，倡导大家减少垃圾。然而，减到多少才是少？这里并没有一个标准。而且从总体上看，生产和消费必然产生垃圾，减少垃圾很可能抑制生产和消费。接着往后退，把垃圾收集起来填埋或者焚烧。但填埋只是把垃圾从地上转移到地下，既与人争地，也有再次污染土壤和水源的隐患。焚烧不过是把污染从地上移到空中，产生二恶英等有害物质。 于是，人们进一步追问：还有没有比填埋、焚烧更好的出路？这时候，一句“垃圾是放错地方的资源” 让人茅塞顿开，垃圾可以回收利用，乃再生资源。但变废为“宝”前提是垃圾的分类投放——别把垃圾放错了地方。何谓放错？到处乱扔是放错，收集时搅混在一起也是放错。不同的垃圾只有往不同的地方放，才能实现资源的价值。即使还免不了要填埋、焚烧那些没有利用价值的垃圾，也得把它们分出来。 垃圾分类举手之劳换出绿色，好处多多不言而喻，但如何让人们乐而为之？2009 年5 月起，上海开始普遍推广新的垃圾分类概念，开展以“换出更绿色的上海”为名义的“绿色帐户”活动。何为绿色帐户？就是居民对垃圾进行分类回收，积分换取环保小礼品：再生纸笔记本、绿色小植物、环保手电筒……上海推出“绿色帐户”的实践说明，办法是可以想出来的，关键是愿不愿意琢磨。中国的垃圾问题不比哪个国家小，我们只能“没有退路就多想出路”。 摘编自《人民日报》 （1）从实践是人和自然关系的基础的角度说明为什么“垃圾是放错地方的资源” （2）运用矛盾分析方法说明“没有退路就多想出路”。","options":{},"answer":""},{"year":2011,"no":35,"type":"分析","stem":"结合材料回答问题： 材料1 成思危，著名经济学家，原民建中央主席，九届、十届全国人大常委会副委员长。谈到我国政党制度， 他深有体会地说：“西方的政党制度是”打橄榄球，一定要把对方压倒。我们的政党制度是“唱大合唱”，民主党派和中国共产党的合作共事是为了一个共同的目标，为了保持社会的和谐。要大合唱，就要有指挥，这个指挥无论从历史还是现实来看，都只有中国共产党才能胜任。”海外有评论说中国的民主党派人士在政府任职多是“坐虚位”、“无实权”，成思危说，这不符合实际情况，中国的民主党派不是“政治花瓶”。“在担任化工部副部长的时候，我对自己负责范围内的工作是完全有权作出决策的。作为全国人大常会副委员长， 我负责证券法、农村金融的执法检查。我和中共党籍的副委员长一样，也是独当一面的。” 材料2 第十一届全国人大一次会议以来，全国共有18.7 万民主党派、无党派人士当选各级人大代表。其中， 全国人大常委员副委员长6 人，省级人大常委会副主任35 人。2 人分别担任国务院科技部、卫生部部长。 2007 年有18 人担任最高人民法院、最高人民检察院和中央国家机关部委领导职务副职。 20 世纪90 年代以来，中共中央加强同各民主党派的协商，内容不断充实，程序逐步规范。据统计，1990 年至2009 年6 月，中共中央、国务院直接召开或委托有关部门召开的协商会、座谈会、情况通报会就有287 次，其中，中共中央总书记主持召开或出席的就有85 次。各民主党派中央、无党派代表人士向中共中央、 国务院及有关方面提出建议260 多项，各民主党派地方组织提出各项建议9 万多项。如关于三峡工程、耕地保护、两岸“三通”、西部大开发、中部崛起、东北地区等老工业基地振兴、建设社会主义新农村、青藏铁路沿线发展、国家级综合配套改革实验区、实施可持续发展战略、制定和实施“十一五”规划等方面提出的建议，得到了中共中央、国务院的高度重视和采纳。 材料1、材料2 摘编自《光明日报》 （1）从“打橄榄球”和“唱大合唱”的形象比较中，说明我国政党制度的特点和优点。 （2）我国各民主党派在社会主义建设中如何发挥参政议政的作用？","options":{},"answer":""},{"year":2011,"no":36,"type":"分析","stem":"结合材料回答问题： 材料1 2011 年是中国共产党成立90 周年。在这90 年里，党走过了不平凡的历程。 中华人民共和国成立前夕，毛泽东在一篇文章中指出：“一九一七年的俄国革命唤醒了中国人，中国人学得了一样新的东西，这就是马克思列宁主义。中国产生了共产党，这是开天辟地的大事变。” 摘自《毛泽东选集》 材料2 最近，有一本名为《苦难辉煌》的党史专著，颇受广大读者欢迎。 在这部著作中，作者一再追问： 为什么中国共产党从最初的几十个人，仅仅经过20 多年的发展，就打败了强大的对手，取得了辉煌的胜利，建立了新中国？历史给国民党很多机会，却只给共产党很少机会，但是共产党抓住了这仅有的机会， 实现了中国革命的胜利。这又是为什么？ 中国共产党从几十人的小党发展到今天7000多万人的大党，中国人民解放军从南昌起义后剩下不到800 人到今天的威武雄狮，党和军队为何由小到大，由弱到强，筚路蓝缕，披荆斩棘？中国共产党的力量来自哪里？中国人民解放军的力量来自哪里？ 作者回答：我们拥有一批顶天立地的真人。他们不为钱，不为官，不怕苦，不怕死，只为胸中的主义和心中的信仰。 摘编自《人民日报》、《光明日报》 （1）为什么说中国共产党的成立“是开天辟地的大事变？ （2）结合中国共产党成立以来中国社会变革的历程，说明“主义”和“信仰”是怎样成为“力量”的？","options":{},"answer":""},{"year":2011,"no":37,"type":"分析","stem":"结合材料回答问题： 郭明义，鞍山钢铁集团矿山公司齐大山铁矿采场公路管理员。几十年来，他照着雷锋那样去做，“把雷锋的道路作为自己的人生选择，把雷锋的境界作为自己的人生追求”，连续15 年每天提前2 小时上班，相当于多奉献了5 年的工作量；连续20 年先后55 次无偿献血、捐献血小板，累计近6 万毫升；连续16 年为希望工程、工友、灾区群众捐款12 万元，资助180 多名特困生。可是，他一家至今还是住在一间不过40 平米的旧楼房里。有人曾不解地问郭明义，你这么做究竟值不值得？“如果发出一点光，放出一点热，能够换来孩子幸福的笑脸，换来他人生命之花的绽放，换来人与人之间的温暖和谐，这样的人生，我无怨无悔！”“给人温暖就是给自己幸福”。他是这样说的，也是这样做的。 30 年来，郭明义就像一支火把燃烧着自己，也燃旺着志愿者和社会上更多人的爱心。他8 次发起捐献造血干细胞的倡议，得到1700 多人的响应；他7 次发起献血的建议，600 多人无偿献出15 万毫升热血；他发起成立遗体（器官）捐献志愿者俱乐部，汇聚了200 多名志愿者；他发起成立“郭明义爱心联队”，从12 人已经发展到2800 多人，捐款40 余万元、资助特困生1000 多名。 郭明义的精神是一块磁石，在鞍钢、在辽宁、在全国吸引汇集越来越多的人加入爱心行动，为他人奉献、为社会分忧、为国家尽责，凝聚成巨大的道德力量，推进着当代中国社会稳定和谐发展。郭明义的先进事迹体现了“简单中的伟大”。 摘编自《人民日报》 （1）如何理解“给人温暖就是给自己幸福”？ （2）为什么说郭明义的先进事迹是“简单中的伟大”？","options":{},"answer":""},{"year":2011,"no":38,"type":"分析","stem":"阅读下列材料： 金融危机发生后，某些西方国家的政要、媒体经常发表关于中国的言论，有“独秀”或“救世”之说、也有 “责任”之论……林林总总，用词翻新。人们可看到一白一红“两张脸”：唱红脸者夸大中国的经济表现，动辄将一切不符合实际加诸中国，仿佛中国真的是世界经济的救世主；唱白脸者却将国际金融危机、全球失衡等责任归到中国头上。无论是明“捧”实“压”，还是借“批”卸“责”，万变不离其宗的都是鼓噪“中国责任论”。 这既暴露出他们所谓“中国责任”的用心，也反映出其对“真实中国”的误解。 针对材料所反映的西方某些人士对中国的“捧”与“批”，谈谈什么是“真实的中国”以及中国的“责任”是什么？","options":{},"answer":""},{"year":2010,"no":1,"type":"单选","stem":"1884 年1 月3 日，意大利人卡内帕给恩格斯写信，请求他为即将在日内瓦出版的《新纪元》周刊的创刊号题词，而且要求尽量用简短的字句来表述未来的社会主义纪元的基本思想，以区别于伟大诗人但丁的对旧纪元所作的“一些人统治，另一些人受苦难”的界定。恩格斯回答说，除了从《共产党宣言》中摘出下面一段话外，再也找不出合适的了，这就是：“代替那存在着阶级和阶级对立的资产阶级旧社会的，将是这样一个联合体，在那里，每个人的自由发展是一切人的自由发展的条件。”这段话表明，马克思主义追求的根本价值目标是：","options":{"A":"实现人的自由而全面的发展","B":"实现人类永恒不变的普适价值","C":"建立一个四海之内皆兄弟的大同世界","D":"建立一个自由、平等、博爱的理性王国"},"answer":"A"},{"year":2010,"no":2,"type":"单选","stem":"有一则箴言：“在溪水和岩石的斗争中，胜利的总是溪水，不是因为力量，而是因为坚持。”“坚持就是胜利”的哲理在于：","options":{"A":"必然性通过偶然性开辟道路","B":"肯定中包含着否定的因素","C":"量变必然引起质变","D":"有其因必有其果"},"answer":"C"},{"year":2010,"no":3,"type":"单选","stem":"右边这张照片反映出由于气候变暖，北极冰盖融化，致使北极熊无处可去的场景，颇具震撼力。它给我们地球上的人类发出的警示是：","options":{"A":"人与自然的关系成为人与人之间一切社会关系的核心","B":"生态失衡已成为自然界自身周期演化不可逆转的趋势","C":"自然地理环境已成为人类社会发展的根本决定力量","D":"生态环境已日益成为人类反思自身活动的重要前"},"answer":"D"},{"year":2010,"no":4,"type":"单选","stem":"劳动力成为商品是货币转化为资本的前提条件，这是因为：","options":{"A":"资本家购买的是劳动力的价值","B":"劳动力商品具有价值和使用价值","C":"货币所有者购买的劳动力能够带来剩余价值","D":"劳动力自身的价值能够在消费过程中转移到新的商品中去"},"answer":"C"},{"year":2010,"no":5,"type":"单选","stem":"1981 年党的十一届六中全会通过《关于建国以来党的若干历史问题的建议》对我国社会主要矛盾作了规范的表述：“社会主义改造完成以后，我国所要解决的主要矛盾，是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。”我国社会主要矛盾的主要方面将长期是：","options":{"A":"生产力落后","B":"生产力不断发展的要求","C":"经济文化发展不平衡","D":"人民日益增长的物质文化需要"},"answer":"A"},{"year":2010,"no":6,"type":"单选","stem":"“发展才是硬道理”、“发展是党执政兴国的第一要务”、“发展是解决中国一切问题的总钥匙”，这是对社会主义建设历史经验的深刻总结。中国解决所有问题的关键是要靠自己的发展，而发展的根本目的是：","options":{"A":"增强综合国力","B":"体现社会主义优越性","C":"消灭剥削，消除两极分化","D":"使人民共享发展成果，实现共同富裕"},"answer":"D"},{"year":2010,"no":7,"type":"单选","stem":"党的十七大报告指出，坚持节约资源和保护环境的基本国策，关系人民群众切身利益和中华民族的生存发展，必须把建设资源节约型、环境友好型社会放在工业化，现代化发展战略的突出位置。建设资源节约型社会的核心是：","options":{"A":"节约使用资源和提高能源资源利用效率","B":"加强节能减排和生态保护工作","C":"限制能源资源的开发和利用","D":"发展循环经济"},"answer":"A"},{"year":2010,"no":8,"type":"单选","stem":"随着经济的快速发展和物质生活水平的提高。人们的精神文化需求日益增长，迫切要求通过深化文化体制改革，激发文化发展的活力，为人民群众提供更多更好的文化产品和文化服务，保障人民的基本文化权益。 保障人民基本文化权益的主要途径是：","options":{"A":"繁荣社会主义文化，提高文化软实力","B":"协调发展公益性文化事业，经营性文化产业","C":"发展公益性事业，建立政府主导的公共文化体系","D":"调动社会力量在市场竞争中发展壮大文化产业"},"answer":"C"},{"year":2010,"no":9,"type":"单选","stem":"“十月革命一声炮响，给我们送来了马克思列宁主义”，五四运动后，马克思列宁主义得到广泛传播。在中国最早讴歌十月革命、比较系统的介绍马克思主义的是：","options":{"A":"陈独秀","B":"李大钊","C":"毛泽东","D":"瞿秋白"},"answer":"B"},{"year":2010,"no":10,"type":"单选","stem":"1956 年4 月和5 月，毛泽东先后在中共中央政治局扩大会议和最高国务会议上作《论十大关系》报告， 他指出“最近苏联方面暴露了他们在建设社会主义过程中的一些缺点和错误，他们走过的弯路你还想走？过去，我们就是鉴于他们的经验教训，少走了一些弯路，现在当然更要引以为戒”，这表明，以毛泽东为主要代表的中国共产党人：","options":{"A":"实现了马克思主义同中国实际的“第二次结合”","B":"开始探索中国自己的社会主义建设道路","C":"开始找到自己的一条适合中国的路线","D":"已经突破社会主义苏联模式的束缚"},"answer":"B"},{"year":2010,"no":11,"type":"单选","stem":"爱因斯坦曾经说过“大多数人都以为是才智成就了科学家，他们错了，是品格”下列名言与这段话含义一致的是：","options":{"A":"道虽迩，不行不至；事虽小，不为不成","B":"才者，德之资也；德者，才之帅也","C":"不学礼，无以立","D":"是非之心，智也"},"answer":"B"},{"year":2010,"no":12,"type":"单选","stem":"中华民族精神源远流长，包含着丰富的内容。其中，夸父追日、大禹治水、愚公移山、精卫填海等动人的传说所体现出的中华民族精神是：","options":{"A":"勤劳勇敢","B":"团结统一","C":"自强不息","D":"爱好和平"},"answer":"C"},{"year":2010,"no":13,"type":"单选","stem":"2001 年中共中央印发的《公民道德建设实施纲要》中规定了公民基本道德规范的主要内容。公民道德建设的重点是：","options":{"A":"爱国守法","B":"诚实守信","C":"勤奋自强","D":"团结友善"},"answer":"B"},{"year":2010,"no":14,"type":"单选","stem":"我国宪法明确规定实行依法治国，建设社会主义法治国家。依法治国的根本要求是：","options":{"A":"有法可依、有法必依、执法必严、违法必究","B":"保障公民的知情权、参与权、表达权、监督权","C":"立法公开、执法公平、司法公正","D":"社会生活的法制化、规范化、民主化"},"answer":"A"},{"year":2010,"no":15,"type":"单选","stem":"2009 年3 月28 日，西藏自治区各族各界干部群众万余人身着节日盛装，在拉萨布达拉宫广场隆重集会。 热烈庆祝：","options":{"A":"西藏自治区和平解放58 周年","B":"西藏自治区成立44 周年","C":"西藏自治区九届人大二次会议召开","D":"首个西藏“百万农奴解放纪念日”"},"answer":"D"},{"year":2010,"no":16,"type":"单选","stem":"胡锦涛主席在2009 年9 月二十国领导人比斯堡峰会上发表了题为“全力促进增长推动平衡发展”的讲话中指出：当前国际社会十分关注全球经济失衡问题。失衡的表现为部分国家储蓄消费失衡、贸易收支失衡更表现为世界财富分配失衡，资源拥有和消费失衡，国际货币体系失衡。导致失衡的原因是复杂的，多方面的。从根本上看，失衡的根源是：","options":{"A":"经济全球化深入发展、国际产业分工转移、国际资源流动","B":"现行国际经济体系、主要经济体宏观经济政策","C":"各国消费文化和生活方式","D":"南北发展严重不平衡"},"answer":"D"},{"year":2010,"no":17,"type":"多选","stem":"从上世纪70 年代至今,商务印书馆先后出版了多个版本的《新华字典》，除了一些旧的词条，增加了一些新的词条，并对若干词条的词义给了修改。例如1971 年版对“科举”这个词条的解释是：“从隋唐到清代的封建王朝为了维护其反动统治而设的分科考选文武官吏后备人员的制度”,1992 年版删去“反动”二字，1998 版又删去“为了维护其统治而设”。再如1971 年版在解释了“雉”就是“野鸡”之后，紧跟着说“肉可以吃，羽毛可以做装饰品”。1992、1998 年版也一样，直到2008 年版删去了这句话。一本小字典，记载着词语的发展变化，也记录着时代前进的印记。字典词条释义的变化表明人们的意识：","options":{"A":"是客观世界的能动反映","B":"取决于词语含义的改变","C":"随着社会生活变化而变化","D":"需要借助语言这一物质外壳表达出来"},"answer":"ACD"},{"year":2010,"no":18,"type":"多选","stem":"历史经验表明，经济危机往往孕育着新的科技革命。1857 年的世界经济危机引发了电气革命，推动人类社会从蒸汽时代进入电气时代。1929 年的世界经济危机引发了电子革命，推动人类社会从电气时代进入电子时代。由此证明：","options":{"A":"科技革命是摆脱社会危机的根本出路","B":"科学技术是社会形态更替的根本标志","C":"社会实践的需要是科技发展的强大动力","D":"科技创新能够推动社会经济跨越式发展"},"answer":"CD"},{"year":2010,"no":19,"type":"多选","stem":"有一则寓言讲到：狐狸把鱼汤盛在平底的盘子里，请仙鹤来与它一起“平等”地喝鱼汤，结果仙鹤一点也没喝到，全被狐狸喝去了。这个寓言给人们的启示是，尽管资产阶级宣布“法律面前人人平等”，但是：","options":{"A":"法律名义上的平等掩盖着事实上的不平等","B":"这种形式上的平等即是资本主义制度的本质","C":"它的实质是将劳资之间经济利益的不平等合法化","D":"这种平等的权利是建立在财产不平等基础之上的权利"},"answer":"ACD"},{"year":2010,"no":20,"type":"多选","stem":"1989 年，时任美国国务院顾问的弗朗西斯·福山抛出了所谓的“历史终结论”，认为西方实行的自由民主制度是“人类社会形态进步的终点”和“人类最后一种统治形式”。然而，20 年来的历史告诉我们，终结的不是历史，而是西方的优越感。就在柏林墙倒塌20 年后的2009 年11 月9 日，BBC 公布了一份对27 国民众的调查，结果半数以上的受访者不满资本主义制度。此次调查的主办方之一的“全球扫描”公司主席米勒对媒体表示，这说明随着1989 年柏林墙的倒塌，资本主义并没有取得看上去的压倒性胜利，这一点在这次金融危机中表现得尤其明显。“历史终结论”的破产说明：","options":{"A":"社会规律和自然规律一样都是作为一种盲目的无意识力量起作用","B":"人类历史发展的曲折性不会改变历史发展的前进性","C":"一些国家社会发展的特殊形式不能否定历史发展的普遍规律","D":"人们对社会发展某个阶段的认识不能代替对社会发展整个过程的认识"},"answer":"BCD"},{"year":2010,"no":21,"type":"多选","stem":"中国革命建设和改革的实践证明，要运用马克思主义指导实践，必须实现马克思主义中国化。马克思主义之所以能够中国化的原因在于","options":{"A":"马克思主义理论的内在要求","B":"马克思主义与中华民族优秀文化具有相融性","C":"中国革命建设和改革的实践需要马克思主义指导","D":"马克思主义为中国革命建设和改革提供了现实发展模式"},"answer":"ABC"},{"year":2010,"no":22,"type":"多选","stem":"1952 年，党中央在酝酿过渡时期总路线时，毛泽东把实现向社会主义转变的设想，由建国之初的“先搞工业化建设，再一举过渡”改变为“建设和改造同时并举，逐步过渡”。这一改变的原因和条件是：","options":{"A":"我国社会主义经济因素的不断增长和对资本主义经济的限制","B":"为了确定我国工业化建设的社会主义方向","C":"我国工业化建设取得了重大成就","D":"民主革命的遗留任务已经完成"},"answer":"ABD"},{"year":2010,"no":23,"type":"多选","stem":"1954 年9 月，第一届全国人民代表大会第一次会议在北京召开，标志着人民代表大会制度在全国范围内建立起来。人民代表大会制度是中国人民当家作主的根本政治制度，这一制度是：","options":{"A":"中国共产党把马克思主义与中国实际相结合的伟大创造","B":"中国共产党带领全国人民长期奋斗的重要成果","C":"全国各族人民的共同利益和共同愿望的反映","D":"近代以来中国社会发展的必然选择"},"answer":"ABCD"},{"year":2010,"no":24,"type":"多选","stem":"我国是一个多民族的国家，在社会主义时期处理民族问题的基本原则是：","options":{"A":"实行民族区域自治","B":"维护祖国统一","C":"反对民族分裂","D":"坚持民族平等、民族团结、各民族共同繁荣"},"answer":"BCD"},{"year":2010,"no":25,"type":"多选","stem":"改革开放以来，中国成功地走上了一条与本国国情和时代特征相适应的和平发展道路。坚持走和平发展道路，符合中国的历史文化传统，这是因为：","options":{"A":"中华民族是热爱和平的民族","B":"和平与发展成为时代发展的潮流","C":"中国人民在对外交往中始终强调亲仁善邻、和而不同","D":"中华文化是一种和平的文化，渴望和平始终是中国人民的精神特征"},"answer":"ACD"},{"year":2010,"no":26,"type":"多选","stem":"19 世纪下半叶，以“自强”、“求富”为目标的洋务运动历时30 多年。其最终失败的主要原因是：","options":{"A":"指导思想的封建性","B":"对外国具有依赖性","C":"资金人才的匮乏性","D":"洋务企业管理的腐朽性"},"answer":"ABD"},{"year":2010,"no":27,"type":"多选","stem":"邓小平指出：“马克思、列宁从来没有说过农村包围城市，这个原理在当时世界上还是没有的。但是毛泽东同志根据中国的具体条件指明了革命的具体道路”。毛泽东找到农村包围城市、武装夺取政权这条道路的根据是：","options":{"A":"中国内无民主制度，外无民族独立","B":"农民占人口绝大多数，是民主革命的主力军","C":"中国革命的敌人长期占据着中心城市，农村是其统治的薄弱环节","D":"中国经济政治发展的不平衡"},"answer":"ABCD"},{"year":2010,"no":28,"type":"多选","stem":"1941 年1 月，震惊中外的皖南事变爆发后，《新华日报》刊出周恩来的题词手迹：“为江南死国难者志哀！”“千古奇冤，江南一叶；同室操戈，相煎何急？！”大敌当前，中国共产党以民族利益为重，坚持正确的方针和原则，避免了抗日民族统一战线的破裂。这些方针和原则包括：","options":{"A":"又联合又斗争","B":"有理、有利、有节","C":"针锋相对，寸土必争","D":"发展进步势力，争取中间势力，孤立顽固势力"},"answer":"ABD"},{"year":2010,"no":29,"type":"多选","stem":"解放战争时期，在国民党统治区形成了以学生运动为先导的人民民主运动。成为配合人民解放战争的第二条战线。第二条战线形成的原因是：","options":{"A":"国民党政府专制独裁、官员贪污腐败","B":"国民党在军事上的失利","C":"国民党顽固坚持内战政策","D":"国统区爆发严重经济危机"},"answer":"ACD"},{"year":2010,"no":30,"type":"多选","stem":"1955 年，钱学森冲破重重阻力，回到魂牵梦绕的祖国。当有人问他为什么回国时，他说：“我为什么要走回归祖国这条道路？我认为道理很简单——鸦片战争近百年来，国人强国梦不息，抗争不断。革命先烈为兴邦，为了炎黄子孙的强国梦，献出了宝贵的生命，血沃中华热土。我个人作为炎黄子孙的一员，只能追随先烈的足迹，在千万般艰险中，探索追求，不顾及其他。再看看共和国的缔造者和建设者们，在百废待兴的贫瘠土地上，顶住国内的贫穷，国外的封锁，经过多少个风风雨雨的春秋，让一个社会主义新中国屹立于世界东方。想到这些，还有什么个人利益不能丢弃呢？”钱学森发自肺腑的言语，对我们在新时期弘扬爱国主义精神的启示是：","options":{"A":"科学没有国界，但科学家有祖国","B":"个人的理想要与国家命运、民族命运相结合","C":"爱国主义与爱社会主义具有深刻的内在一致性","D":"爱国主义是爱国情感、爱国思想和爱国行为的高度统一"},"answer":"ABCD"},{"year":2010,"no":31,"type":"多选","stem":"政治权利和自由是指公民作为国家政治生活主体依法享有的参加国家政治生活的权利和自由，是国家为公民直接参与政治活动提供的基本保障。这一基本权利具体包括：","options":{"A":"人身自由权","B":"选举权和被选举权","D":"政治自由","C":"宗教信仰自由"},"answer":"BD"},{"year":2010,"no":32,"type":"多选","stem":"2009 年9 月18 日，中国共产党第十七届中央委员会第四次全体会议胜利闭幕，全会审议通过了《中共中央关于加强和改进新形势下党的建设若干重大问题的决定》，对当前和今后一个时期加强和改进党的建设作出了部署，其中除了强调要建设马克思主义学习型政党、坚持和健全民主集中制外，还要：","options":{"A":"弘扬党的优良作风","B":"深化干部人事制度改革","C":"做好抓基层打基础工作","D":"加快推进惩治和预防腐败体系建设"},"answer":"ABCD"},{"year":2010,"no":33,"type":"多选","stem":"第八次中国—东盟经贸部长会议于2009 年8 月15 日在泰国首都曼谷召开，双方共同签署了中国—东盟自贸区《投资协议》，标志着中国与东盟历时7 年之久的自贸区主要谈判任务已经完成，该协议的重要意义在于：","options":{"A":"确保中国对外建立的第一个自贸区于2010 年全面建成","B":"将中国—东盟战略伙伴关系提升到更高水平","C":"为地区和全球经济复苏与发展作出积极贡献","D":"为东亚自由贸易区的建立提供法律保障"},"answer":"ABC"},{"year":2010,"no":34,"type":"分析","stem":"结合材料回答问题： 早年，梅兰芳与人合演《断桥》，也就是《白蛇传》，剧情是白娘子和许仙两个人悲欢离合的爱情故事， 梅兰芳在剧中饰演白娘子。剧中，白娘子有一个动作就是面对负心的丈夫许仙追赶、跪在地上哀求她的时候，她爱恨交加、五味杂陈，就用一根手指头去戳许仙的脑门儿。不想，梅兰芳用力过大，跪在那里扮演许仙的演员毫无防备地向后仰去。这是剧情里没有设计的动作，可能是梅兰芳入戏太深，把对许仙的恨全都聚集在了手指头上，才造成了这样的失误。眼见许仙就要倒地，怎么办?梅兰芳下意识地用双手去扶许仙。 许仙是被扶住了，没有倒下。可梅兰芳马上意识到，我是白娘子，他是负心郎许仙，我去扶他不合常理， 这戏不是演砸了吗?大师到底是大师，梅兰芳随机应变，在扶住他的同时，又轻轻地推了他一下。所以，剧情就由原来的一戳变成了一戳、一扶和一推，更淋漓尽致地表现出了白娘子对许仙爱恨交织的复杂心情。 这个动作，把险些造成舞台事故的错误演得出神入化，得到了大家的认可。从此，在以后的演出中，梅兰芳就沿用了这个动作，而且，其他剧种也都移植采用了这个动作处理，这个动作成了经典之作。 由此可见，不仅在舞台上，在各行各业，在各个岗位，在工作中，在生活中，无论是大师还是普通人， 失误和错误是难免的，关键是出现失误和错误以后怎么去对待，怎么去处理。处理不当，会酿成事故，导致全盘失败；处理得当，能败中取胜，化腐朽为神奇。 （1）为什么“无论是大师还是普通人，失误和错误是难免的”? （2）梅兰芳为什么能“把险些造成舞台事故的错误”变为成功的“经典之作”? （3）当我们在认识和实践活动中出现错误或失败该怎样对待和处理?","options":{},"answer":""},{"year":2010,"no":35,"type":"分析","stem":"结合材料回答问题： 材料1 新中国成立60 年来，党和政府高度重视社会发展事业，着力保障和改善民生。改革开放以来，在社会建设方面取得显著成就。废除农业税，使延续几千年的“皇粮国税”成为历史。随着经济社会发展，人民生活水平显著改善，“吃穿住行用”水平显著提高。从1949 年到2008 年，城镇居民人均可支配收入从一年的不到 100 元增加到15781 元，农村居民人均纯收入从44 元增加到4761 元。从1978 年到2008 年，城市人均住宅建筑面积和农村人均住房面积，已分别从6.7 平方米和8.1 平方米增加到30.0 平方米和32.4 平方米。2008 年城乡居民人民币储蓄存款余额达21.8 万亿元，比新中国成立初期1952 年增加了2.5 万倍。 我们在看到成绩的同时，也要清醒认识到，我国是世界上最大的发展中国家，人口众多，经济发展起点低，地区之间、城乡之间发展不平衡，造成社会保障体系建设与经济社会的发展还有不适应之处，与人们的期望和需求还有一定差距。 摘编自《人民日报》、《理论热点面对面·2009》 材料2 2007 年10 月，党的十七大对医药卫生事业的发展作出了整体规划。2009 年4 月，新医改《意见》和 《实施方案》正式推出。新医改明确了建立覆盖城乡居民的基本医疗卫生制度的任务和工作。 国务院决定从2009 年开始在10%的县（市、区）实行新型农村社会养老保险的试点，2020 年前将覆盖全国。农民60 岁后享有“普惠式养老金”，对广大农民来说，是一条振奋人心的利好消息。农民在“种地不交税、上学不付费、看病不太贵”之后，又向“养老不犯愁”的新梦想迈出了坚实一步。 摘编自人民网、中国网 （1）为什么在经济发展的同时要加快推进以改善民生为重点的社会建设？ （2）如何推进以改善民生为重点的社会建设？","options":{},"answer":""},{"year":2010,"no":36,"type":"分析","stem":"结合材料回答问题： 材料1 1949 年10 月1 日。 下午15 时整，北京，天安门城楼。毛泽东向全世界庄严宣告:“中华人民共和国中央人民政府已于本日成立了!” 广场沸腾了!震天的欢呼直冲云霄，帽子、围巾甚至报纸在空中飞舞······ 身着深色旗袍的宋庆龄站在城楼上，看着眼前涌动的人潮，看着广场上矗立的孙中山画像，不禁热泪盈眶。8 天后，她这样向世人讲述在天安门城楼的那一刻—— “连年的伟大奋斗和艰苦的事迹，又在我眼前出现。但是另一个念头抓住我的心，我知道，这一次不会再回头了，不会再倒退了。这一次，孙中山的努力终于结了果实，而且这果实显得这样美丽······” 摘编自2009 年9 月6 日《人民日报》 材料2 2009 年10 月1 日。 上午10 时整，首都各界庆祝中华人民共和国成立60 周年大会在北京天安门广场隆重举行，20 万军民以盛大的阅兵仪式和群众游行欢庆伟大祖国的这一盛大节日。 天安门城楼红墙正中悬挂着新中国缔造者毛泽东的巨幅彩色画像。人民英雄纪念碑前竖立着伟大的革命先行者孙中山先生的画像，纪念碑两侧超宽电子屏上“伟大的中华人民共和国万岁”、“伟大的中国共产党万岁”等标语格外醒目。广场东西两侧，56 根绘有各族群众载歌载舞图案的民族团结柱，象征着56 个民族共同擎起祖国繁荣富强的伟大基业。 胡锦涛发表重要讲话。他指出：“60 年前的今天，中国人民经过近代以来100 多年的浴血奋战终于夺取了中国革命的伟大胜利，毛泽东主席在这里向世界庄严宣告了中华人民共和国的成立。中国人民从此站起来了，具有5000 多年文明历史的中华民族从此进入了发展进步的历史新纪元。” 摘编自2009 年10 月2 日《人民日报》 （1）如何理解宋庆龄所说的“孙中山的努力终于结了果实”？ （2）为什么说中华人民共和国的成立标志着“中华民族从此进入了发展进步的历史新纪元”","options":{},"answer":""},{"year":2010,"no":37,"type":"分析","stem":"结合材料回答问题： 交通环境是由人、车、路构成的公共生活之一。目前，我国机动车拥有量已超过1.78 亿辆，拥有驾照的公民已超过1.3 亿人。由此带来一系列的交通安全问题，引发社会公众强烈反响。下列是有关交通问题的一些调查数据： 有专家指出，道路交通上普遍存在的交通不文明现象看似个人的私事，但却折射出某些公民在公共生活领域社会公德和法律意识的缺失。要构建文明出行风尚，既是道德呼唤，也是法律要求。 （1）为什么文明出行“既是道德呼唤，也是法律要求”？ （2）我们应如何从自身做起，构建文明的公共生活秩序？","options":{},"answer":""},{"year":2010,"no":38,"type":"分析","stem":"结合材料回答问题： 材料1 从2009 年11 月23 日起，一则时长30 秒、“以中国制造、世界合作”为主题的广告在美国有线电视新闻网（CNN）正式播出。该广告由中国商务部会同4 家中国行业协会共同委托制作，被认为是中国政府的首个品牌宣传活动，接下来还计划在包括北美、欧洲等中国的主要贸易对象地区播出。广告围绕“中国制造， 世界合作”这一主题，强调中国企业为生产高质量的产品，正不断与海外各国公司加强合作。广告中展示了一系列带有“中国制造”标签的产品，例如，一个类似iPod 的MP3 播放器上用英文标注“在中国制造，但我们使用来自硅谷的软件”；一双运动鞋和一套衣服上标注有“在中国制造，但我们的设计来自于法国”；一台冰箱上写着“中国制造，但我们的采用欧洲风格”。 广告在创意上独树一帜，从引导世界受众重新认识畅销全球的中国产品入手，能够启发世界各地的消费者对“中国制造”和全球贸易的重新思考，从而逐渐抛弃对“中国制造”的偏见。 摘编自人民网材料2 在美国有线电视新闻网热播的一则“携手中国制造”为主题的广告引发的关注和反响正在发酵。 有分析人士认为，在当前金融危机阴霾尚未散去、贸易保护主义有所抬头的背景下，主动出击展示国家形象，是一次很好的尝试，有利于提升中国的软实力。 有评论认为，近年来中国经济实力崛起，如何建立国际形象成为当务之急。政府近期启动了国际公关战略，继新华社、《人民日报》等中央媒体率先向世界发声之后，国家形象广告或许会成为提升国家软实力和对外形象的新渠道。 还有人认为，中国早前一些产品安全事件令世界关注，现在希望能通过在全球投放广告推广“中国制造”， 以提升其在国际上的形象，广告中出现的法国设计、硅谷技术等字样，说明中国目前还处于产业链的低端， 它继续把中国定义为世界工厂，因此令消费者认为，中国还只是产品的制造商。现在是从“中国制造”的地位上升为“中国创造”的时候了。 摘编自《参考消息》、新华网 （1）“中国制造，世界合作”的广告说明了什么？ （2）为什么说“现在是从‘中国制造’的地位上升为‘中国创造’的时候了”？","options":{},"answer":""},{"year":2009,"no":1,"type":"单选","stem":"物质和意识的对立只有在非常有限的范围内才有绝对的意义，超过这个范围便是相对的了。这个范围是指：","options":{"A":"物质和意识何者为第一性","B":"物质和意识是否具有同一性","C":"物质和意识何者更重要","D":"物质和意识何者与社会生活的关系更密切"},"answer":"A"},{"year":2009,"no":2,"type":"单选","stem":"1978 年关于真理标准大讨论是一场新的思想解放运动。实践之所以成为检验真理的唯一标准，是由：","options":{"A":"真理的主观性和实践的客观性所要求的","B":"真理的相对性和实践的绝对性所预设的","C":"真理的属性和实践的功能所规定的","D":"真理的本性和实践的特点所决定的"},"answer":"D"},{"year":2009,"no":3,"type":"单选","stem":"近来马克思的《资本论》在西方一些国家销量大增。列宁曾说，马克思的《资本论》的成就之所以如此之大，是由于这本书使读者看到整个资本主义社会形态是个活生生的形态，既有“骨骼”，又有“血肉”。人类社会作为一种活的有机体，其“骨骼”系统是指：","options":{"A":"地理环境、人口因素和生产方式等社会物质生活条件","B":"与一定的生产力相适应的生产关系","C":"建立在一定经济基础之上的政治法律制度及设施","D":"由政治法律思想、道德、宗教、哲学等构成的社会意识形态"},"answer":"B"},{"year":2009,"no":4,"type":"单选","stem":"卢梭在《论人类不平等的起源和基础》中说道：“我认为，在人类的一切知识中，最有用但也最不完善的知识就是关于人的知识。”马克思的唯物史观破解了人是什么这一“司芬克斯之谜”。马克思在《关于费尔巴哈的提纲》中指出，人的本质在其现实性上是：","options":{"A":"自然属性和社会属性的内在统一","B":"所有人共同属性的概括","C":"一切社会关系的总和","D":"自由理性的外化"},"answer":"C"},{"year":2009,"no":5,"type":"单选","stem":"流通中的货币需要量是考查经济生活运行的重要指标，假设某国去年的商品价格总额为24 万亿元，流通需要量为3 万亿元。若今年该国商品价格总额增长10%，其他条件不变，今年流通中需要的货币量为：","options":{"A":"4.2万亿元","B":"3.5万亿元","C":"3.3万亿元","D":"2.4万亿元"},"answer":"C"},{"year":2009,"no":6,"type":"单选","stem":"国家垄断资本主义条件下，政府对经济生活进行干预和调节的实质是：","options":{"A":"维护垄断资产阶级的整体利益和长远利益","B":"维持资本主义经济稳定增长","C":"消除或防止经济危机的爆发","D":"提高资本主义社会的整体福利水平"},"answer":"A"},{"year":2009,"no":7,"type":"单选","stem":"某钢铁厂因铁矿石价格上涨，增加了该厂的预付资本数量，这使得该厂的资本构成发生了变化，所变化的资本构成是：","options":{"A":"资本技术构成","B":"资本价值构成","C":"资本物质构成","D":"资本有机构成"},"answer":"B"},{"year":2009,"no":8,"type":"单选","stem":"1925 年毛泽东在《中国社会各阶级的分析》中指出，中国过去一切革命斗争成效甚少的基本原因就是：","options":{"A":"没有找到革命的新道路","B":"没有扩大民主主义的宣传","C":"没有到群众中做实际的调查","D":"没有团结真正的朋友以攻击真正的敌人"},"answer":"D"},{"year":2009,"no":9,"type":"单选","stem":"延安时期，毛泽东写下了著名的《实践论》、《矛盾论》，主要是为了克服党内严重的：","options":{"A":"经验主义","B":"冒险主义","C":"机会主义","D":"教条主义"},"answer":"D"},{"year":2009,"no":10,"type":"单选","stem":"中共七届二中全会后，党制定和实行新民主主义经济建设的方针政策是：","options":{"A":"既反保守又反冒进，在综合平衡中稳步前进","B":"公私兼顾、劳资两利、城乡互助、内外交流","C":"调整、巩固、充实、提高","D":"实现速度、结构、效益、质量的统一"},"answer":"B"},{"year":2009,"no":11,"type":"单选","stem":"科学发展观的根本方法是：","options":{"A":"把发展作为第一要义","B":"以人为本","C":"统筹兼顾","D":"全面协调可持续"},"answer":"C"},{"year":2009,"no":12,"type":"单选","stem":"社会主义新农村建设的中心环节是：","options":{"A":"生产发展","B":"生活宽裕","C":"乡风文明","D":"管理民主"},"answer":"A"},{"year":2009,"no":13,"type":"单选","stem":"马克思主义中国化理论成果的精髓是：","options":{"A":"理论联系实际","B":"解放思想","C":"实事求是","D":"与时俱进"},"answer":"C"},{"year":2009,"no":14,"type":"单选","stem":"2008 年5 月28 日，中共中央总书记胡锦涛和中国国民党主席吴伯雄在北京人民大会堂举行了两党在新形势下的首次会谈。此次会谈：","options":{"A":"就促进两岸关系改善和发展达成了广泛共识","B":"开启了国共两党对话先声","C":"发布了“两岸和平发展共同愿景”","D":"签署了《海峡两岸包机会谈纪要》"},"answer":"A"},{"year":2009,"no":15,"type":"单选","stem":"2008 年9 月25 日，我国“神州七号”航天飞船成功飞入太空，首次实现了：","options":{"A":"载人飞行","B":"绕月探测","C":"天地对话","D":"出舱活动"},"answer":"D"},{"year":2009,"no":16,"type":"单选","stem":"在2008 年4 月中旬举行的尼泊尔制宪会议选举上，一举成为第一大党的是：","options":{"A":"尼泊尔共产党（联合马列）","B":"尼泊尔共产党（毛主义）","C":"尼泊尔大会党","D":"尼泊尔民族民主党"},"answer":"B"},{"year":2009,"no":17,"type":"多选","stem":"近一年多来由美国次贷危机引发的金融危机迅速在全球蔓延。在危机面前，人们应该积极主动应对，化 “危”为“机”。下列名言中符合意识能动性原理的有：","options":{"A":"信心比黄金更重要","B":"我们唯一恐惧的就是恐惧本身","C":"问题与解决问题的方法是同时产生的","D":"事不避难，知难不难"},"answer":"ABCD"},{"year":2009,"no":18,"type":"多选","stem":"邓小平说：“农村搞家庭联产承包，这个发明权是农民的。农村改革中的好多东西都是基层创造出来的， 我们把它拿来加工提高作为全国的指导。”这对我们实现思想理论创新具有普遍指导意义，它要求我们：","options":{"A":"要以解放思想为先导","B":"打破一切理论的约束","C":"关注生活实践的需要","D":"尊重人民群众的诉求"},"answer":"ACD"},{"year":2009,"no":19,"type":"多选","stem":"“随着新生产力的获得……人们也就会改变自己的一切社会关系。手推磨产生的是封建主义的社会，蒸汽磨产生的是工业资本家的社会。”这段话表明科学技术是：","options":{"A":"历史上起推动作用的革命力量","B":"历史变革中的唯一决定性力量","C":"推动生产方式变革的重要力量","D":"一切社会变革中的自主性力量"},"answer":"AC"},{"year":2009,"no":20,"type":"多选","stem":"华罗庚生前曾说：“我们最好把自己的生命看作是前人生命的延续，是现在人类共同的生命的一部分，同时也是后人生命的开端。如此延续下去，科学就会一天比一天更灿烂，社会就会一天比一天更美好。”这段话对我们如何实现人的个人价值的教益是：","options":{"A":"个人价值的实现与社会价值的实现是统一的","B":"个人价值的实现是一个历史过程","C":"个人价值的实现是社会价值实现的归宿","D":"个人价值的实现和个人生命的长短相一致"},"answer":"AB"},{"year":2009,"no":21,"type":"多选","stem":"“信用制度加速了生产力的物质上的发展和世界市场的形成；使这二者作为新生产形式的物质基础发展到一定的高度，是资本主义生产方式的历史使命。同时，信用加速了这种矛盾的暴力的爆发，即危机，因而加强了旧生产方式的解体的各种因素。”马克思的这一论述表明，资本主义信用制度：","options":{"A":"已成为资本主义经济危机爆发的深层原因","B":"促进了建立社会主义生产方式的物质基础的形成","C":"加速了资本主义生产方式内部矛盾发展和解体要素的形成","D":"既推动商品经济的发展，又加深了商品经济运行中的矛盾"},"answer":"BCD"},{"year":2009,"no":22,"type":"多选","stem":"劳动力是任何社会生产的基本要素，在特定的社会发展阶段和特定的历史条件下，劳动力作为一种特殊商品，其价值的构成包括：","options":{"A":"维持劳动者自身生存所必需的生活资料的价值","B":"劳动者在必要劳动时间内创造的价值","C":"劳动者繁育后代所必需的生活资料的价值","D":"培养和训练劳动者所需要的费用"},"answer":"ACD"},{"year":2009,"no":23,"type":"多选","stem":"党的十七届三中全会通过的《中共中央关于推进农村改革发展若干重大问题的决定》指出：“建立健全土地承包经营权流转市场，按照依法自愿有偿原则，允许农民以转包、出租、互换、转让、股份合作等形式流转土地承包经营权，发展多种形式的适度规模经营。”上述决定有利于：","options":{"A":"调整农村土地所有制结构","B":"完善土地承包经营权权能","C":"进一步完善生产要素市场","D":"促进土地资源的优化配置"},"answer":"BCD"},{"year":2009,"no":24,"type":"多选","stem":"合理的收入分配制度是社会公平的重要体现。在构建社会主义和谐社会过程中，初次分配和再分配都要处理好效率和公平的关系，再分配更加注重公平，逐步提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。这表明处理效率与公平的关系，就要：","options":{"A":"把效率和公平相互之间的矛盾协调统一起来","B":"充分发挥市场机制对收入分配的调节作用","C":"改革现有的收入分配制度，规范收入分配秩序","D":"合理调整国民收入分配格局，加大收入分配调节力度"},"answer":"ACD"},{"year":2009,"no":25,"type":"多选","stem":"1921 年中国共产党的成立，是中国革命历史上划时代的里程碑，中国革命的面目焕然一新，从此中国革命有了：","options":{"A":"正确的革命道路","B":"科学的指导思想","C":"坚强的领导力量","D":"崭新的奋斗目标"},"answer":"BCD"},{"year":2009,"no":26,"type":"多选","stem":"新民主主义的文化，是民族的科学的大众的文化。其中“民族的”是指：","options":{"A":"反对外来的资本主义文化","B":"反对帝国主义压迫，主张中华民族的尊严和独立","C":"在形式和内容上有中国作风和中国气派","D":"为全民族90%以上的工农大众服务"},"answer":"BC"},{"year":2009,"no":27,"type":"多选","stem":"在民主革命和社会主义革命的关系问题上，中国共产党内曾经出现过不同的观点和主张，其中错误的有：","options":{"A":"“毕其功于一役”","B":"“二次革命论”","C":"“无间断”革命","D":"中国革命分“两步走”"},"answer":"ABC"},{"year":2009,"no":28,"type":"多选","stem":"20 世纪50 年代中期，社会主义改造基本完成，标志着：","options":{"A":"社会主义制度在我国已经确立","B":"我国进入了社会主义初级阶段","C":"我国步入了社会主义改革时期","D":"我国完成了从新民主主义向社会主义的过渡"},"answer":"ABD"},{"year":2009,"no":29,"type":"多选","stem":"我们所要建设的社会主义和谐社会，应该是民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处的社会。其中“诚信友爱”的内涵包括：","options":{"A":"全社会管理完善、秩序良好","B":"全社会互帮互助、诚实守信","C":"全体人民生活富裕、安居乐业","D":"全体人民平等友爱、融洽相处"},"answer":"BD"},{"year":2009,"no":30,"type":"多选","stem":"基层群众自治制度是我国政治制度体系中的重要组成部分，其主要内容有：","options":{"A":"农村村民委员会","B":"城市居民委员会","C":"企业职工代表大会","D":"妇女联合会"},"answer":"ABC"},{"year":2009,"no":31,"type":"多选","stem":"2008 年5 月12 日，我国发生了震惊世界的四川汶川大地震。在这次抗震救灾中，全党全军全国人民在党中央国务院领导下众志成城，坚持把抢救人的生命放在第一位，只要有一线希望就尽百倍努力，84017 名群众被从废墟中抢救出来，140 万名被困群众得到解救，430 多万名伤病员得到及时救治，其中1 万多名重伤员被快速转送到全国20 个省区市375 家医院。这些事实生动地体现了：","options":{"A":"我国社会主义制度珍爱生命、保护人民的性质","B":"中华民族关爱生命、崇尚理性的民族品格","C":"党和政府全心全意为人民服务的根本宗旨","D":"社会主义核心价值体系建设的重大成效"},"answer":"ABCD"},{"year":2009,"no":32,"type":"多选","stem":"2008 年6 月20 日，胡锦涛同志到人民日报社视察工作，并在线与网民进行了交流，表达了党和政府对网络民意的高度重视。近年来，越来越多的政府官员上网收集民意。这意味着网络表达已成为：","options":{"A":"公民政治参与的新途径","B":"反腐倡廉的新通道","C":"民主政治体制的新形式","D":"密切干群关系的新方式"},"answer":"ABD"},{"year":2009,"no":33,"type":"多选","stem":"2008 年8 月8 日至24 日，第29 届奥林匹克运动会在北京成功举行。中国政府和人民认真履行了对国际社会的郑重承诺。中国提出的奥运理念丰富了奥林匹克精神，彰显了中国和世界在追求人类共同进步中坚守的共同梦想。中国提出的本届奥运会理念是：","options":{"A":"“平安奥运”","B":"“绿色奥运”","C":"“科技奥运”","D":"“人文奥运”"},"answer":"BCD"},{"year":2009,"no":34,"type":"分析","stem":"结合材料回答问题： 华佗是我国东汉名医。一次，府吏倪寻和李延俩人均头痛发热，一同去请华佗诊治。华佗经过仔细地望色、诊脉，开出两付不同的处方，给倪寻开的是泻药，而给李延开的是解表发散药。二人不解：我俩患的是同一症状，为何开的药方却不同呢？是不是华佗弄错了？于是，他们向华佗请教。华佗解释道：倪寻的病是由于饮食过多引起的，病在内，应当服泻药，将积滞泻去，病就好了。李延的病是受凉感冒引起的， 病在外，应当吃解表药，风寒之邪随汗而去，头痛也就好了。你们病症相似，但病因相异，所以治之宜殊。 二人拜服，回家后各自将药熬好服下，很快都痊愈了。 中医是我国宝贵的医学遗产，强调辩证施治。华佗对症下药治头痛发热的故事蕴含着丰富的辩证法思想。 （1）指出其中所涉及的唯物辩证法基本范畴并分析其内涵。 （2）这个故事对我们理解“具体问题具体分析”有何启示？","options":{},"answer":""},{"year":2009,"no":35,"type":"分析","stem":"结合材料回答问题: 材料1 注：CPI（消费物价指数）是反映一定时期内城乡居民家庭所购买的生活消费品的价格和服务项目价格变动趋势和程度的相对数。一般认为，CPI 的增幅大于3%时，就存在通货膨胀的压力。PPI（生产价格指数） 是衡量工业企业产品价格变动趋势和变动程度的指标。资料来源：国家统计局公布数据材料2 我国经济自2003 年进入新一轮上升期，经济增长速度从2003 年的10%一路上涨，2006 年突破11%， 并于2007 达到11.9%。然而经济偏快增长也带来一系列影响经济社会可持续发展的重大问题，经济增长有可能由偏快转为过热。2007 年12 月初召开的中央经济工作会议确定的宏观调控任务是：“防止经济增长由偏快转为过热、防止价格由结构性上涨演变为明显通货膨胀”。 2008 年随着国际经济金融危机的不断加深，国内许多外向型出口企业经营出现困难，出口持续出现下滑势头。上半年经济增长开始放缓，GDP 同比增长10.4%，比去年同期回落1.8%，上半年居民消费价格水平上涨7.9%，这表明“防过热”已见效，但物价涨幅较高仍未得到有效控制。2008 年7 月25 日召开的中央政治局会议明确了下半年经济工作的任务：把保持经济平稳较快发展、控制物价过快上涨放在突出的位置， 即“一保一控”。财政部等部门宣布自2008 年8 月1 日起提高部分出口商品的退税率，央行8 月初调整了商业银行信贷规模，9 月16 日起又下调了人民币贷款基准利率和中小金融机构人民币存款准备金率，以缓解中小企业融资难、担保难以及流动资金短缺等问题。 2008 年前三季度，我国经济增速同比回落了2.3 个百分点，经济增长5 年多来首次低于10%。随着国际经济金融危机对我国实体经济影响日益显现，国内经济的下行风险逐步加大，中国已经从持续升温转入降温状态。11 月9 日国务院宣布实行积极的财政政策和货币政策，特别是拉动内需十项新举措的公布，释放出“保增长”的强烈信号，4 万亿的投资将对经济产生最直接的拉动。十二月中央经济工作会议进一步明确指出，必须把保持经济平稳较快发展作为明年经济工作的首要任务。要着力在保增长上下功夫，把扩大内需作为保增长的根本途径，把加快发展方式转变和结构调整作为保增长的主攻方向，把深化重点领域和关键环节改革、提高对外开放水平作为保增长的强大动力，把改善民生作为保增长的出发点和落脚点。 资料来源：财政部网站、新浪财经等 （1）CPI 与PPI 的走势及其变化反映我国经济运行出现了什么问题？结合材料分析导致这些变化的主要原因。(4 分) （2）结合材料分析我国政府是如何根据国内外经济形势的变化运用财政政策和货币政策来实施宏观调控的。(6 分)","options":{},"answer":""},{"year":2009,"no":36,"type":"分析","stem":"结合材料回答问题: 材料1 矛盾是普遍存在的，不过按事物的性质不同，矛盾的性质也就不同。 社会主义社会的矛盾同旧社会的矛盾，例如同资本主义社会的矛盾，是根本不相同的。资本主义社会的矛盾表现为剧烈的对抗和冲突，表现为剧烈的阶级斗争，那种矛盾不可能由资本主义制度本身来解决， 而只有社会主义革命才能够加以解决。社会主义社会的矛盾是另一回事，恰恰相反，它不是对抗性的矛盾， 它可以经过社会主义制度本身，不断地得到解决。 在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。不过社会主义社会的这些矛盾，同旧社会的生产关系和生产力的矛盾、上层建筑和经济基础的矛盾， 具有根本不同的性质和情况罢了。 社会主义生产关系已经建立起来，它是和生产力的发展相适应的；但是，它又还很不完善，这些不完善的方面和生产力的发展又是相矛盾的。除了生产关系和生产力发展的这种又相适应又相矛盾的情况以外， 还有上层建筑和经济基础的又相适应又相矛盾的情况。 摘自毛泽东《关于正确处理人民内部矛盾的问题》（1957 年2 月27 日） 材料2 社会主义社会的基本矛盾和目前时期的主要矛盾。关于基本矛盾，我想现在还是按照毛泽东同志在《关于正确处理人民内部矛盾的问题》一文中的提法比较好。毛泽东同志说：“在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。”他在这里说了很长的一段话，现在不重复。当然，指出这些基本矛盾，并不就完全解决了问题，还需要就此作深入的具体的研究。但是从二十多年的实践看来，这个提法比其他的一些提法妥当。至于什么是目前时期的主要矛盾，也就是目前时期全党和全国人民所必须解决的主要问题或中心任务，由于三中全会决定把工作重点转移到社会主义现代化建设方面来，实际上已经解决了。我们的生产力发展水平很低，远远不能满足人民和国家的需要，这就是我们目前时期的主要矛盾，解决这个主要矛盾就是我们的中心任务。 摘自邓小平《坚持四项基本原则》 （1979 年3 月30 日） （1）毛泽东提出社会主义社会基本矛盾的历史背景以及这一理论的重大意义。 （2）邓小平对社会主义社会基本矛盾的“深入的具体的研究”所取得的理论成果主要有哪些？","options":{},"answer":""},{"year":2009,"no":37,"type":"分析","stem":"结合材料回答问题: 材料1 从1978 年到2007 年，我国国内生产总值由3645 亿元增长到24.95 万亿元，年均实际增长9.8%，是同期世界经济年均增长率的3 倍多，我国经济总量上升为世界第四。 从1978 年到2007 年，我国进出口总额从206 亿美元提高到21737 亿美元，跃居世界第三位。 外汇储备从长期没有达到10 亿美元，提高到2007 年的1.5 万亿美元左右，成为世界上拥有外汇储备最多的国家。 从1978 年到2007 年，全国城镇居民人均可支配收入由343 元增加到13786 元，实际增长6.5 倍。农民人均纯收入则由134 元增加到4140 元，实际增长6.3 倍；农村贫困人口从2.5 亿减少到1400 多万。 摘自胡锦涛在纪念党的十一届三中全会召开30 周年大会上的讲话材料2 改革开放以来我们取得一切的成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路， 形成了中国特色社会主义理论体系。高举中国特色社会主义伟大旗帜，最根本的是要坚持中国特色社会主义道路和中国特色社会主义理论体系。 摘自胡锦涛在中国共产党第十七次全国代表大会上的报告 （1）改革开放30 年来，我国在经济体制上进行了哪些主要的改革创新才带来了上述变化？ （2）简述中国特色社会主义理论体系的组成部分及其所回答的基本问题。","options":{},"answer":""},{"year":2009,"no":38,"type":"分析","stem":"本题为选做题，请在Ⅰ、Ⅱ两道试题中选取其中一道作答，若两题都回答，只按第Ⅰ道试题的成绩记入总分。 选做题Ⅰ： 材料1 如果美国不援助欧洲，它们在经济、政治和社会关系各方面都将有窒息之虞。美国这次“援欧”不同与以往，不是向个别国家提供零星援助，而是向联合的欧洲提供援助。我们的政策不是反对任何国家、任何主义，而是反对饥饿、贫穷、悲惨、混乱。我们的任务是唤起合理经济的再生，促进政治社会的结构容纳自由制度存在。任何企图阻碍别国复兴的政府，都不会得到我们的帮助。任何政府、党派为图政治私利或其他打算、不惜延续人类痛苦的，必会遭到美国的反对。 摘编自马歇尔在哈佛大学的演讲（1947 年6 月5 日） 材料2 2002 年1 月，美国国务卿鲍威尔访问尼泊尔，主要讨论反恐合作问题。此后，美国每年向尼提供4000 万美元的“经济援助”。2003 年11 月3 日美国国会批准了向伊拉克和阿富汗提供875 亿美元的军事行动及重建援助的拨款法案。西方把这些经济援助和重建计划称为“新马歇尔计划”。 伊拉克已探明拥有1100 亿桶的石油储藏，远景储量达2200 亿桶，开采成本每桶仅3～4 美元。2003 年 12 月，美国国防部公布了伊拉克重建项目中总价值达186 亿美元的26 个重大工程合同，同时以维护美国的 “基本安全利益”为由，决定剥夺包括德国、法国、俄罗斯、加拿大等在内的100 多个曾经反对美国发动伊拉克战争以及拒绝向伊拉克派兵的国家参与上述合同的竞标资格。首批约9 亿美元的伊拉克重建合同均在暗盘交易下完成，中标的是清一色的美国公司，而这些公司无不与美国政府有着紧密的联系。 摘编自人民网材料3 法国前情报员达尼埃尔·雷米在其所著《谁欲杀死法兰西》一书中认为，美国已经发动了一场看不见的“经济战争”，旨在征服欧洲。1995 年至1999 年间，美国每年立案的反倾销和反补贴调查中，有1/4 是针对欧盟的。 德国和法国不赞成美国对伊拉克动武，惹怒了美国，美前国防部长拉姆斯菲尔德抨击两国“有问题”；时任美国总统国家安全事务助理的赖斯，把包括法国与德国在内的反战政府比作是二战前法国对纳粹德国的 “姑息主义”，引起德、法等国不满，美前国务卿基辛格认为，在伊拉克问题上的分歧，已经在大西洋联盟中产生了自它50 年前成立以来最为严重的危机。 摘编自中国网 （1）结合材料一、二，比较“马歇尔计划”和“新马歇尔计划”的异同。 （2）结合材料一、三，剖析近些年来美、欧在处理国际事务中显现的分歧及原因。 选做题Ⅱ： 材料1 近些年来越来越多的国家和国际知名人士开始热议“中国贡献”，关于中国在地区和全球事务中发挥重要建设性作用的话语频频出现于国际社会。如：阿拉伯国家联盟负责政治事务的副秘书长本·哈拉2007 年4 月17 日在会见中国驻阿盟全权代表吴思科大使时说，阿盟高度赞赏中国在","options":{},"answer":""},{"year":2008,"no":1,"type":"单选","stem":"马克思主义哲学与唯心主义哲学、旧唯物主义哲学的根本区别在于：","options":{"A":"坚持人的主体地位","B":"坚持用辩证发展的观点去认识世界","C":"坚持物质第一性、意识第二性","D":"坚持从客观的物质实践活动去理解现实世界"},"answer":"D"},{"year":2008,"no":2,"type":"单选","stem":"最近，由多国科学家组成的团队利用一台粒子加速器，让两束原子在一个圆环轨道上做高速运动，发现这些原子自身的时间确实比外界时间慢了。这项实验进一步证明了作为物质运动存在形式的时间具有：","options":{"A":"客观性","B":"有限性","C":"相对性","D":"一维性"},"answer":"C"},{"year":2008,"no":3,"type":"单选","stem":"在听完一位成功的企业家讲课后，一些来自企业的学员感到有些失望，便问他：“你讲的那些内容我们也差不多知道，可为什么我们之间的差距会那么大呢？”这位企业家回答说：“那是因为你们仅是知道，而我却做到了，这就是我们的差别。”这句话表明了实践高于理论认识，因为实践具有：","options":{"A":"普遍有效性","B":"客观规律性","C":"主体能动性","D":"直接现实性"},"answer":"D"},{"year":2008,"no":4,"type":"单选","stem":"“文化蕴藏着巨大的力，这种‘力’不同于物理学上的‘力’，物理的‘力’是人类用来‘化’自然界的，文化的‘力’ 是用来‘化’自身的。”这一说法表明：","options":{"A":"文化具有培育和塑造人的功能","B":"文化构造了人的本质","C":"文化是社会发展的主导力量","D":"文化是历史进步的源泉"},"answer":"A"},{"year":2008,"no":5,"type":"单选","stem":"马克思通过对资本主义生产中价值增殖过程的分析，把雇佣工人的劳动时间分为：","options":{"A":"生产使用价值的时间和生产价值的时间","B":"转移旧价值的时间和创造新价值的时间","C":"生产生产资料价值的时间和生产剩余价值的时间","D":"再生产劳动力价值的时间和生产剩余价值的时间"},"answer":"D"},{"year":2008,"no":6,"type":"单选","stem":"某块土地，地租为200 万元，土地价格为4000 万元。若银行存款利息率不变，该土地的地租增加到300 万元时，银行存款利息率和土地价格分别是：","options":{"A":"5%、9000 万元","B":"5%、6000 万元","C":"6%、9000 万元","D":"6%、6000 万元"},"answer":"B"},{"year":2008,"no":7,"type":"单选","stem":"在完善社会主义市场经济体制过程中，要加快建立覆盖城乡居民的社会保障体系，其基本目标是：","options":{"A":"保障人民基本生活","B":"促进社会经济增长","C":"实现充分就业","D":"使更多的劳动者拥有财产性收入"},"answer":"A"},{"year":2008,"no":8,"type":"单选","stem":"在孙中山的思想中，“平均地权”、“节制资本”属于：","options":{"A":"民族主义","B":"民权主义","C":"民生主义","D":"民主主义"},"answer":"C"},{"year":2008,"no":9,"type":"单选","stem":"1927 年9 月下旬，毛泽东率领秋收起义的部队来到江西省永新县三湾村，进行了著名的三湾改编，确立了人民军队建设的根本原则。这一原则是：","options":{"A":"党指挥枪","B":"官兵平等","C":"拥政爱民","D":"一切行动听指挥"},"answer":"A"},{"year":2008,"no":10,"type":"单选","stem":"我国对个体手工业进行社会主义改造的主要方式是：","options":{"A":"赎买","B":"统购统销","C":"公私合营","D":"合作化"},"answer":"D"},{"year":2008,"no":11,"type":"单选","stem":"我国社会主义改革是一场新的革命，其性质是：","options":{"A":"解放生产力，发展生产力","B":"社会主义基本制度的根本变革","C":"社会主义制度的自我完善和发展","D":"建立和完善社会主义市场经济体制"},"answer":"C"},{"year":2008,"no":12,"type":"单选","stem":"党的领导、人民当家作主和依法治国的统一性是由：","options":{"A":"社会主义初级阶段的基本国情决定的","B":"社会主义国家的本质决定的","C":"社会主义根本任务决定的","D":"社会主义国家的发展战略决定的"},"answer":"B"},{"year":2008,"no":13,"type":"单选","stem":"为研究和完善国家法定节假日制度，国家有关部门按照国务院的部署，通过有关网站进行问卷调查，并在部分城市进行了电话调查。在广泛进行民意调查的基础上，经过一年多的研究论证，确定了新的节假日调整方案。这体现的执政理念是：","options":{"A":"依法执政","B":"科学执政","C":"民主执政","D":"理性执政"},"answer":"C"},{"year":2008,"no":14,"type":"单选","stem":"民族精神是社会主义核心价值体系的重要内容之一，其核心是：","options":{"A":"爱国主义","B":"团结统一","C":"勤劳勇敢","D":"自强不息"},"answer":"A"},{"year":2008,"no":15,"type":"单选","stem":"党的十七大报告指出，我国新时期最显著的成就是：","options":{"A":"改革开放","B":"快速发展","C":"建立社会主义市场经济体制","D":"给人民带来更多福祉"},"answer":"B"},{"year":2008,"no":16,"type":"单选","stem":"在2007 年1 月1 日欧盟第六次扩大时正式加入欧盟的国家是：","options":{"A":"罗马尼亚、波兰","B":"保加利亚、罗马尼亚","C":"波兰、爱沙尼亚","D":"爱沙尼亚、保加利亚"},"answer":"B"},{"year":2008,"no":17,"type":"多选","stem":"右边这幅漫画对于我们认识人与自然关系的警示意义在于：","options":{"A":"人类过分陶醉于对自然界的胜利将受到自然界的报复","B":"人与自然关系的紧张来自于不当的人类实践方式","C":"人与自然的关系本质上是对立的","D":"人类依附于自然是摆脱自身困境的根本出路"},"answer":"AB"},{"year":2008,"no":18,"type":"多选","stem":"19 世纪英国作家惠兹里特说：“一个除了书本以外一无所知的纯粹学者，必然对书本也是无知的。”与这句话在内涵上相一致的名言还有：","options":{"A":"纸上得来终觉浅，绝知此事要躬行","B":"尽信书，则不如无书","C":"感觉到了的东西我们不能立刻理解它，只有理解了的东西才能更深刻地感觉它","D":"饱经风霜的老人与缺乏阅历的少年对同一句格言的理解是不同的"},"answer":"ABD"},{"year":2008,"no":19,"type":"多选","stem":"马克思主义哲学中的辩证法、认识论、历史观在本质上是一致的，体现这种一致性的公式有：","options":{"A":"个别——一般——个别","B":"实践——认识——实践","C":"群众——领导——群众","D":"团结——批评——团结"},"answer":"ABC"},{"year":2008,"no":20,"type":"多选","stem":"随着科学技术和经济全球化的发展，人类的交往活动日益普遍和深化，交往作为人类特有的活动和存在方式，对社会发展具有越来越重要的作用。主要表现在：","options":{"A":"交往促进生产力的发展","B":"交往推动社会关系的变革和改善","C":"交往是科学文化传承和发展的重要途径","D":"交往促进人自身的发展"},"answer":"ABCD"},{"year":2008,"no":21,"type":"多选","stem":"同一劳动在同一时间内，当部门劳动生产率提高时会使：","options":{"A":"单位商品的价值量降低","B":"商品的使用价值量增加","C":"单位商品的价值量不变","D":"单位商品的价值量提高"},"answer":"AB"},{"year":2008,"no":22,"type":"多选","stem":"通过对社会资本简单再生产实现过程中交换关系的分析，可以看出：","options":{"A":"Ⅰc 是通过第Ⅰ部类内部交换实现的","B":"Ⅱ(v+m)是通过第Ⅱ部类内部交换实现的","C":"Ⅰ(v+m)是通过和Ⅱ(v+m)交换实现的","D":"Ⅰ(v+m)是通过和Ⅱc 交换实现的"},"answer":"ABD"},{"year":2008,"no":23,"type":"多选","stem":"为了保持物价总水平的稳定，国家实施宏观调控可以采取的货币政策手段有：","options":{"A":"调整存贷款基准利率","B":"调整法定存款准备金率","C":"实施物价补贴","D":"调整再贴现率"},"answer":"ABD"},{"year":2008,"no":24,"type":"多选","stem":"为完善社会主义个人收入分配制度，确立生产要素按贡献参与分配是基于：","options":{"A":"各种生产要素都能创造价值","B":"要素所有权关系在经济上的体现","C":"市场经济配置资源的内在要求","D":"各种生产要素都具有价值"},"answer":"BC"},{"year":2008,"no":25,"type":"多选","stem":"在中国共产党的历史上，对毛泽东思想做出系统概括和阐述的党的文献有：","options":{"A":"《关于若干历史问题的决议》","B":"刘少奇在七大上所作的《关于修改党的章程的报告》","C":"邓小平在八大上所作的《关于修改党的章程的报告》","D":"《关于建国以来党的若干历史问题的决议》"},"answer":"BD"},{"year":2008,"no":26,"type":"多选","stem":"关于民主革命时期富农身份的界定，下列选项中正确的有：","options":{"A":"剥削雇农的剩余劳动，是农村中的资产阶级","B":"既是劳动者，又是剥削者","C":"自身不劳动，出租土地并放高利贷","D":"对雇农的剥削带有浓厚的半封建性"},"answer":"ABD"},{"year":2008,"no":27,"type":"多选","stem":"新中国建立之际，毛泽东提出的外交方针有：","options":{"A":"“一边倒”","B":"“反霸权主义”","C":"“打扫干净屋子再请客”","D":"“另起炉灶”"},"answer":"ACD"},{"year":2008,"no":28,"type":"多选","stem":"党的十七大报告指出，深入贯彻落实科学发展观，必须坚持：","options":{"A":"把发展作为党执政兴国的第一要务","B":"以人为本","C":"全面协调可持续","D":"统筹兼顾"},"answer":"ABCD"},{"year":2008,"no":29,"type":"多选","stem":"党的十七大报告指出，十一届三中全会以来，中国共产党坚持马克思主义的思想路线，不断探索和回答的重大理论和实际问题是：","options":{"A":"什么是社会主义、怎样建设社会主义","B":"什么是现代化、怎样建设现代化","C":"建设什么样的党、怎样建设党","D":"实现什么样的发展、怎样发展"},"answer":"ACD"},{"year":2008,"no":30,"type":"多选","stem":"人民代表大会制度是我国的根本政治制度，这是因为：","options":{"A":"它直接体现我国人民民主专政的国家性质","B":"它能从根本上保证人民当家作主的权力","C":"它在制定国家其他各种制度中起着决定性的作用","D":"它能使广大人民在国家政治生活中直接行使民主权利"},"answer":"ABC"},{"year":2008,"no":31,"type":"多选","stem":"2005 年，胡锦涛主席就新形势下发展两岸关系提出的原则性意见是：","options":{"A":"坚持一个中国的原则决不动摇","B":"争取和平统一的努力决不放弃","C":"贯彻寄希望于台湾人民的方针决不改变","D":"反对“台独”分裂活动决不妥协"},"answer":"ABCD"},{"year":2008,"no":32,"type":"多选","stem":"党的十七大报告指出，高举中国特色社会主义伟大旗帜，最根本的就是要坚持：","options":{"A":"中国特色社会主义道路","B":"实事求是的思想路线","C":"中国特色社会主义理论体系","D":"改革开放的战略方针"},"answer":"AC"},{"year":2008,"no":33,"type":"多选","stem":"2007 年2 月，胡锦涛主席在与苏丹总统巴希尔的会谈中提出，处理达尔富尔问题应该：","options":{"A":"尊重苏丹的主权和领土完整","B":"发挥非盟、联合国的建设性作用","C":"有利于促进达尔富尔地区局势稳定","D":"通过和平方式解决问题"},"answer":"ABCD"},{"year":2008,"no":34,"type":"分析","stem":"结合材料回答问题： 最近，四川省搞了一次“医患换位体验”活动，让医生以患者的身份挂号、排队、看病、拿药……结果， 医生跑前跑后，既受累又受气，一名全程体验了“患者”的医生感慨道：“医生就像拿着个遥控器，把患者指挥得团团转，当患者确实很苦。”美国医生爱德华·罗森邦行医50 年，忽然患上了喉癌，当他重新审视医学、 医院和医生时，感慨地说：“站在我病床边和躺在病床上所看到的角度完全不同。”他后来在《亲尝我自己的药方》一书中写道：“如果我能从头来过的话，我会以完全不同的方式行医，很不幸的是，生命不给人这种重新来过的机会。 多年前，有位年轻医生患上甲状腺病，由中国医学科学院著名头颈外科专家屠规益为他主刀。当手术结束时，屠教授低下身来说：“对不起，让您受苦了！”这是屠教授术后经常对病人说的一句话，虽然简短， 却让这位年轻医生深感震撼。 著名医学家裘法祖早年从医，曾在老师的带领下，为一名中年妇女进行开腹手术。术后没几天，那名妇女就去世了，经解剖发现，患者的死亡与手术并无关系，当时，裘法祖的老师轻轻说了句，“她是4 个孩子的妈妈”，就是这句简单的话，让裘法祖至今念念不忘，他知道这句话包含了多少情感，懂得了医生的责任有多重大：医生不仅要看到人身上的病，更要看到生病的人。 （根据人民日报有关文章整理） （1）“医患换位体验”活动中蕴含着何种哲理？ （2）从人的本质属性说明为什么“医生不仅要看到人身上的病，更要看到生病的人”。 （3）你在现实生活中遇到类似医患关系的矛盾，按照矛盾辩证法该如何对待和处理？ （2）人是自然属性和社会属性的统一体，人的本质在于人的社会性。人类一切活动在本质上都体现着人与人的关系。因此医生在治病的过程中，既要“看病”，更要“看人”。（3 分） （3）矛盾是客观、普遍存在的，要正视矛盾，不要回避矛盾；矛盾具有特殊性，要全面地具体地分析矛盾；用不同方法解决不同的矛盾是辩证法的基本要求，要用正确的方法去化解矛盾。（4 分）","options":{},"answer":""},{"year":2008,"no":35,"type":"分析","stem":"结合材料回答问题： IBM 公司是世界上最大的信息工业跨国公司之一，从上世纪50 年代起致力于计算机行业，并很快在大型计算机业务上占据了统治地位。IBM 生产的计算机在技术上常常是最先进的，在某些情况下，他们即使不是最好的，但由于出色的服务和技术支持，他们仍有卓越的信誉。 在整个60 年代和70 年代，虽然有Control data，Honeywell、Sperry Univac、Burroughs 和NCR 等企业的竞争，但这些公司都不是其对手，到1980 年为止，IBM 仍占据全球大型计算机市场超过80%的份额。大型计算机是IBM 的“金母鸡”，毛利高达70%。 80 年代，随着个人计算机和工作站所连接成的网络逐渐取代大型机，日本、欧洲共同体和美国国内许多资本、技术雄厚的企业纷纷涉足这一高风险、高效益的领域。在与苹果、康柏、东芝、戴尔等企业激烈竞争中IBM 公司开始走下坡路。 迫于竞争的压力，90 年代IBM 公司进行了组织改造以降低成本、进行资产重组和资本运营，使公司的股票价格扶摇直上；进行经营战略转型，在保持计算机硬件领域领先地位的同时，成功地实现了向软件服务等高利润领域的转移；实施竞争战略调整，全面提升了企业竞争力，重塑其昔日的辉煌。 IBM 确立的战略目标是：在所处产业的所有领域都能实现高增长率；在所有领域都有技术和质量卓越的产品，并发挥领导作用；在生产、销售、服务和管理的所有业务活动上，实现最高的效率；确保企业成长所需要的高利润，以便在产业中具有不可动摇的地位。 目前，计算机技术正在向更加“开放型系统”的方向发展。往往主机是一个公司制造的，显示器是另一个公司的，打印机又是第三个公司的，软件是第四个公司的，这些组合起来使整个系统得以运行。在新的技术基础上，计算机行业的企业组织趋向网络化发展，IBM 公司面临着新的竞争挑战。IBM 公司在垄断和竞争中寻求着未来的发展。 (摘编自【美】J·E 斯蒂格利茨：《<经济学>小品和案例》及新华网有关资料) （1）用IBM 的案例说明垄断和竞争的关系。 （2）从IBM 公司的发展过程总结垄断资本条件下竞争的新特点。","options":{},"answer":""},{"year":2008,"no":36,"type":"分析","stem":"结合材料回答问题： 从党的建立到抗日时期，中间有北伐战争和十年土地革命战争。我们经过了两次胜利，两次失败。北伐战争胜利了，但是到一九二七年，革命遭到了失败。土地革命战争曾经取得了很大的胜利，红军发展到三十万人，后来又遭到挫折，经过长征，这三十万人缩小到两万多人……在民主革命时期，经过胜利、失败，再胜利、再失败，两次比较，我们才认识了中国这个客观世界。在抗日战争前夜和抗日战争时期，我写了一些论文，例如《中国革命战争的战略问题》、《论持久战》、《新民主主义论》、《<共产党人>发刊词》， 替中央起草过一些关于政策、策略的文件，都是革命经验的总结。那些论文和文件，只有在那个时候才能产生，在以前不可能，因为没有经过大风大浪，没有两次胜利和两次失败的比较，还没有充分的经验，还不能充分认识中国革命的规律。过去，特别是开始时期，我们只是一股劲儿要革命，至于怎么革法，革些什么，哪些先革，哪些后革，哪些要到下一阶段才革，在一个相当长的时间内，都没有弄清楚，或者说没有完全弄清楚。 ——毛泽东《在扩大的中央工作会议上的讲话》(1962 年1 月30 日) （1）毛泽东在20 世纪60 年代初回顾中国共产党在民主革命时期艰难地但是成功地认识中国革命规律的这段历史，是要说明什么问题？ （2）在改革开放和社会主义现代化建设取得举世瞩目成就的今天，如何看待以毛泽东为主要代表的中国共产党人在社会主义建设方面的艰辛探索？","options":{},"answer":""},{"year":2008,"no":37,"type":"分析","stem":"结合材料回答问题： 在《人民日报》“说句心里话”栏目，重庆市城乡统筹综合改革先行示范区的一位农民说出了这样的心里话： 这些年，党和政府在想办法给农民更多实惠，直补种粮农民，免除了农业税，让我们参加了新型农村合作医疗，这些以前真是想都不敢想啊！ 现如今，我们这个村先搞了“农民转市民”试点，全村131 人今年全部将农村户口转为城镇户口，由农民开始变为市民啦！ 我家承包的土地自愿流转给集体统一经营，每亩补贴我们青苗费4880 元，以后每年按照亩产1000 斤粮食的市场价补偿我们。村里把流转出来的土地集中起来，引进一些现代农业项目，经营赚了钱，我们可以分红。这些项目优先从村里招聘劳动力，我儿子就可以回来打工，离我们更近了。以前大家都出去打工， 地荒在那里，流转以后可以提高土地利用效率，我们又能从中受益，对村里经济也有好处。 我们现在住的房子是17 年前盖的，已经破旧了。根据农民转市民的政策，房子拆迁以后，会补偿给我们两套75 平方米的楼房，新房子离这不远，政府承诺我们明年9 月搬家。 最高兴的是变市民以后，参加了基本养老保险，像我们这样的老人，一次性缴4320 元钱，男的从60 岁起，女的从55 岁起，就可以每个月领156 元养老金。 （1）结合我国农村改革发展的历史进程，说明为什么一些过去农民“想都不敢想”的问题现在已经解决或正在解决。 （2）通过该示范区的变化，指出建设我国社会主义新农村的主要途径。","options":{},"answer":""},{"year":2008,"no":38,"type":"分析","stem":"本题为选做题，请在Ⅰ、Ⅱ两道试题中选取其中一道作答，若两题都回答，只按第Ⅰ道试题的成绩计入总分。 选做题Ⅰ： 材料1 2007 年是“卢沟桥事变”70 周年，也是中日邦交正常化35 周年。温家宝总理应邀于4 月中旬对日本进行了正式访问。在两国发表的《中日联合新闻公报》中，确认双方将继续遵循《中日联合声明》、《中日和平友好条约》和《中日联合宣言》的各项原则，努力构筑“基于共同战略利益的互惠关系”。温总理在日本国会众议院发表的演讲中，引用日本的谚语“尽管风在呼啸，山却不会移动”形容中日关系，引起日本国会议员们的广泛共鸣。 日本防卫大臣石破茂在为中国军舰“深圳”号访日举行的招待会上致词说，实现两国军舰互访，必将促进两国防务领域的深入交流，进一步提高彼此之间的信任关系，推进双方战略互惠关系向前发展。 （摘自人民日报、新华网） 材料2 日本首相福田康夫就职后明确表示，他作为首相不会去参拜靖国神社。他在就中日邦交正常化35 周年致温家宝的贺信中说：日中两国在地理上是无法迁移的“一衣带水”的邻邦。不论今后国际形势如何变化，日中关系对两国而言乃为最重要的双边关系之一却是不会改变的。我愿意致力于构筑日中战略互惠关系。 曾480 余次访华的日中协会理事长白西绅一郎认为，发展日中战略互惠关系，除了要“政治、经济两个轮子一起转”之外，还应特别注重扩大日中民间关系，这样才能夯实日中战略互惠关系的基石。 （摘自人民日报、东方早报） 材料3 据日本海关统计，2007 年1 月～9 月，日中双边贸易额为1715.3 亿美元，同比增长12.1%。其中，日本向中国出口786.3 亿美元，增长17.8%，日本自中国进口929.0 亿美元，增长7.7%，日本贸易逆差142.7 亿美元，减少26.7%。中国继续保持日本第二大出口目的地和第一大进口来源国的地位。 (摘自商务部网国别数据) 结合材料回答问题： （1）中日两国“战略互惠关系”的基本精神是什么？ （2）分析温家宝总理用“尽管风在呼啸，山却不会移动”形容中日关系的寓意。 选做题Ⅱ： 材料1 联合国政府间气候变化专门委员会在2007 年2 月2 日就气候问题发出了警告：从现在开始到2100 年， 全球平均气温的“最可能升高幅度”是1.8 摄氏度至4 摄氏度，海平面升高幅度是18 厘米至58 厘米。 美国著名智库国际战略研究所的报告认为，“如果温室气体排放仍得不到控制，其灾难性后果不亚于发生一场核战争。” 材料2 现在国际上担心中国很快就会成为世界头号污染物排放国；而且再过25 年，中国温室气体排放量将超过其他发达国家总和。……中国的高速崛起，会用掉全球大半的能源，加重能源危机；由于巨大的污染物和温室气体的排放量，中国将成为全球最大的污染源；中国是气候变化的主要威胁。 （摘自纽约时报） 材料3 从1950 年到","options":{},"answer":""},{"year":2007,"no":1,"type":"单选","stem":"“风定花犹落，鸟鸣山更幽”形象地表达了动和静的辩证关系是：","options":{"A":"静不是动，动不是静","B":"静中有动，动中有静","C":"动是必然的，静是偶然的","D":"动是静的原因，静是动的结果"},"answer":"B"},{"year":2007,"no":2,"type":"单选","stem":"“挟泰山以超北海，语人曰吾不能，是诚不能也。为长者折技，语人曰吾不能，是不为也，非不能也”。《孟子》中的这段话启示我们，做事情时要区分可能性和不可能性，二者的区别在于：","options":{"A":"人的主观努力程度","B":"对人是否有利","C":"现实中有无根据和条件","D":"现实中的根据和条件是否充分"},"answer":"C"},{"year":2007,"no":3,"type":"单选","stem":"马克思根据人的发展状况把人类历史划分为三大形态。它们是：","options":{"A":"自然经济社会、商品经济社会、时间经济社会","B":"原始公有制社会、私有制社会、共产主义公有制社会","C":"农业社会、工业社会、信息社会","D":"人的依赖性社会、物的依赖性社会、人的自由全面发展社会"},"answer":"D"},{"year":2007,"no":4,"type":"单选","stem":"列宁说：“意识到自己的奴隶地位而与之斗争的奴隶，是革命家。没有意识到自己的奴隶的地位而过着默默无言、浑浑噩噩，忍气吞声的奴隶生活的奴隶，是十足的奴隶。对奴隶生活的各种好处津津乐道，并对和善的好主人感激不尽以至垂涎欲滴的奴隶是奴才，是无耻之徒。”这三种奴隶的思想意识之所以有如此大的差异，是由于：","options":{"A":"人的社会意识并不都是社会存在的反映","B":"人的社会意识与社会存在具有不一致性","C":"人的社会意识中的各种形式之间相互作用","D":"人的社会意识具有历史继承性"},"answer":"B"},{"year":2007,"no":5,"type":"单选","stem":"货币的本质是：","options":{"A":"商品交换的媒介物","B":"商品价值的一般等价物","C":"商品的等价物","D":"商品相对价值形式"},"answer":"B"},{"year":2007,"no":6,"type":"单选","stem":"在资本主义社会，农业资本家和土地所有者之间争夺的是：","options":{"A":"形成级差地租I 的超额利润","B":"形成级差地租Ⅱ的超额利润","C":"形成绝对地租的超额利润","D":"形成垄断地租的超额利润"},"answer":"B"},{"year":2007,"no":7,"type":"单选","stem":"作为商品的资本是：","options":{"A":"商业资本","B":"借贷资本","C":"产业资本","D":"流通资本"},"answer":"B"},{"year":2007,"no":8,"type":"单选","stem":"在中国共产党的历史上，第一次鲜明地提出“马克思主义中国化”的命题和任务的会议是：","options":{"A":"党的二大","B":"遵义会议","C":"党的六届六中全会","D":"党的七大"},"answer":"C"},{"year":2007,"no":9,"type":"单选","stem":"国民革命失败后，毛泽东在八七会议上提出的著名论断是：","options":{"A":"须知政权是由枪杆子中取得的","B":"兵民是胜利之本","C":"一切反动派都是纸老虎","D":"星星之火,可以燎原"},"answer":"A"},{"year":2007,"no":10,"type":"单选","stem":"1957 年，毛泽东在《关于正确处理人民内部矛盾的问题》中指出，在我国，工人阶级与民族资产阶级的矛盾属于人民内部的矛盾。如果处理不当，会变成：","options":{"A":"对抗性的敌我矛盾","B":"非对抗性的敌我矛盾","C":"对抗性的人民内部矛盾","D":"非对抗性的人民内部矛盾"},"answer":"A"},{"year":2007,"no":11,"type":"单选","stem":"“三个代表”重要思想的根本出发点和落脚点是：","options":{"A":"实现社会主义现代化","B":"发展社会主义社会生产力","C":"发展社会主义民主，尊重和保障人权","D":"实现人民愿望、满足人民需要、维护人民利益"},"answer":"D"},{"year":2007,"no":12,"type":"单选","stem":"社会主义道德建设的核心是：","options":{"A":"为人民服务","B":"集体主义","C":"诚实守信","D":"爱国主义"},"answer":"A"},{"year":2007,"no":13,"type":"单选","stem":"中国共产党和中国政府始终尊重和保护人权，认为首要的人权是：","options":{"A":"参政权、议政权","B":"自由权、平等权","C":"生存权、发展权","D":"选举权、被选举权"},"answer":"C"},{"year":2007,"no":14,"type":"单选","stem":"《中共中央关于构建社会主义和谐社会若干重大问题的决定》指出，社会和谐是中国特色社会主义的：","options":{"A":"根本任务","B":"根本原则","C":"本质属性","D":"基本要求"},"answer":"C"},{"year":2007,"no":15,"type":"单选","stem":"胡锦涛在学习《江泽民文选》报告会上的讲话中指出，我们学习《江泽民文选》必须牢牢把握的主题是：","options":{"A":"建设中国特色社会主义","B":"以经济建设为中心","C":"完善社会主义民主和法制","D":"加强社会主义精神文明建设"},"answer":"A"},{"year":2007,"no":16,"type":"单选","stem":"中俄两国互办“国家年”活动是两国最高领导人做出的一项重大政治决定。这表明：","options":{"A":"两国的合作重点已转向文化领域","B":"中俄战略协作伙伴关系的内涵已发生根本变化","C":"“国家年”活动将成为中俄双边长期交往的主线","D":"双方将全面提升在各个领域的合作水平"},"answer":"D"},{"year":2007,"no":17,"type":"多选","stem":"关于龙的形象，自古以来就有“角似鹿、头似驼、眼似兔、项似蛇、腹似蜃、鳞似鱼、爪似鹰、掌似虎、 耳似牛”的说法，这表明：","options":{"A":"观念的东西是移入人脑并在人脑中改造过的物质的东西","B":"一切观念都是现实的模仿","C":"虚幻的观念也是对事物本质的反映","D":"任何观念都可以从现实世界中找到其物质“原型”"},"answer":"AD"},{"year":2007,"no":18,"type":"多选","stem":"某地乡村公路边有很多柿子园。金秋时节，农民采摘柿子时，最后总要在树上留一些熟透的柿子。农民们说，这是留给喜鹊的食物。每到冬天，喜鹊都在果树上筑巢过冬，到春天也不飞走，整天忙着捕捉果树上的虫子，从而保证了来年柿子的丰收。从这个事例中，我们受到的启示是：","options":{"A":"事物之间有其固有的客观联系","B":"人们可以发现并利用规律来实现自己的目的","C":"人与自然的关系是相互利用的关系","D":"保持生态的平衡是人类生存发展的必要条件"},"answer":"ABD"},{"year":2007,"no":19,"type":"多选","stem":"2006 年7 月12 日凌晨，刘翔在瑞士洛桑国际田联超级大奖赛男子110 米栏比赛中，以12 秒88 勇夺冠军，打破了由英国名将科林·杰克逊保持13 年之久的12 秒91 的世界记录。科林·杰克逊在谈起自己已被打破记录时，没有一丝沮丧：“我一点也不失望，正相反，我感到非常兴奋。”他说：“记录本来就是用来被打破的。”这在哲学上的启示是：","options":{"A":"创新是永无止境的","B":"不断超越前人是历史发展的规律","C":"凡是在历史上产生的都要在历史上灭亡","D":"一切事物都是作为过程而存在，作为过程而发展"},"answer":"ABCD"},{"year":2007,"no":20,"type":"多选","stem":"以人为本是科学发展观的本质和核心。以人为本中的“人”是指：","options":{"A":"具体的、现实的人","B":"广大人民群众","C":"作为个体的人","D":"社会全体成员"},"answer":"ABD"},{"year":2007,"no":21,"type":"多选","stem":"商品的市场价格发生变化：","options":{"A":"与货币的价值量变化无关","B":"与商品的价值量变化有关","C":"与商品的生产价格无关","D":"与商品的供求变化有关"},"answer":"BD"},{"year":2007,"no":22,"type":"多选","stem":"利润率表示全部预付资本的增殖程度，提高利润率的途径有：","options":{"A":"提高剩余价值率","B":"提高资本有机构成","C":"加快资本周转速度","D":"节省不变资本"},"answer":"ACD"},{"year":2007,"no":23,"type":"多选","stem":"生产要素市场包括：","options":{"A":"土地市场","B":"商品市场","C":"资本市场","D":"劳动力市场"},"answer":"ACD"},{"year":2007,"no":24,"type":"多选","stem":"G-W-G’是：","options":{"A":"货币资本的循环公式","B":"生产资本的循环公式","C":"商品资本的循环公式","D":"资本总公式"},"answer":"AD"},{"year":2007,"no":25,"type":"多选","stem":"新民主主义革命时期，以国共合作为基础所建立的统一战线有：","options":{"A":"国民革命联合战线","B":"工农民主统一战线","C":"抗日民族统一战线","D":"人民民主统一战线"},"answer":"AC"},{"year":2007,"no":26,"type":"多选","stem":"1942 年，毛泽东在《整顿党的作风》中指出，我们要的是马克思列宁主义的学风。学风问题主要是指：","options":{"A":"对待知识分子的态度问题","B":"领导机关、全体干部、全体党员的思想方法问题","C":"我们对待马克思列宁主义的态度问题","D":"全党同志的工作态度问题"},"answer":"BCD"},{"year":2007,"no":27,"type":"多选","stem":"20 世纪50 年代中期，邓小平多次强调，执政的中国共产党必须接受来自几个方面的监督，具体包括：","options":{"A":"党内的监督","B":"人民群众的监督","C":"海外人士的监督","D":"民主党派和无党派民主人士的监督"},"answer":"ABD"},{"year":2007,"no":28,"type":"多选","stem":"坚持和完善社会主义初级阶段个人收入分配制度，就要规范收入分配秩序，其中包括：","options":{"A":"着力提高低收入者收入水平","B":"逐步扩大中等收入者比重","C":"有效调节过高收入","D":"坚决取缔非法收入"},"answer":"ABCD"},{"year":2007,"no":29,"type":"多选","stem":"依法治国是中国共产党领导人民治理国家的基本方略，其基本要点有：","options":{"A":"中国共产党领导人民实行依法治国","B":"形成一套比较完备的法律制度","C":"对国家事务、经济文化事业和社会事务的管理工作都要依法进行","D":"依法治国的最重要依据是宪法和法律"},"answer":"ACD"},{"year":2007,"no":30,"type":"多选","stem":"建设社会主义新农村的一项重要任务是培养新型农民，具体措施有：","options":{"A":"加快发展农村义务教育","B":"加强劳动力技能培训","C":"发展农村文化事业","D":"加速农村剩余劳动力的转移"},"answer":"ABC"},{"year":2007,"no":31,"type":"多选","stem":"社会主义核心价值体系是建设和谐文化的根本，它的基本内容包括：","options":{"A":"马克思主义指导思想","B":"中国特色社会主义共同理想","C":"以爱国主义为核心的民族精神和以改革创新为核心的时代精神","D":"社会主义荣辱观"},"answer":"ABCD"},{"year":2007,"no":32,"type":"多选","stem":"从2006 年1 月1 日起，我国废止《农业税条例》，这是具有划时代意义的历史事件，它有利于：","options":{"A":"促进城乡税制的统一","B":"推进工业反哺农业、城市支持农村","C":"逐步清除城乡差别，推进城乡统筹发展","D":"增加农民收入，提高消费水平"},"answer":"ABCD"},{"year":2007,"no":33,"type":"多选","stem":"中非合作论坛是首脑外交的新形式。中国国家主席、副主席和总理及非洲4 国的总统和非洲统一组织秘书长参加了第一届部长级会议并发表讲话；14 个非洲国家的领导人及44 个国家的88 位部长参加了2003 年第二届部长级会议；2006 年的中非合作论坛北京峰会更是吸引了非洲40 多个国家的元首和政府首脑参加。 首脑外交对中非关系的重要意义主要表现在：","options":{"A":"推动了和平、稳定、公正、合理的国际新秩序的建立","B":"增进了友谊，促进了贸易往来","C":"体现了平等观念","D":"开辟了“南南合作”的新路"},"answer":"ABCD"},{"year":2007,"no":34,"type":"分析","stem":"成仿吾是无产阶级革命家，马克思主义理论家、教育家，他是由“文化人”成为“革命人”的典型之一， 成仿吾到底是个什么样的人呢？作家丁玲在与其谋面之前曾产生过一系列的“合理想象”：“在文学上，他主张浪漫主义，创造社最早就是这样主张的；他是从日本留学回来的，一定很洋气，很潇洒，因为曾见过一些傲气十足的诗人，趾高气扬，高谈阔论；他在国外学军械制造，或许是个庄重严肃之人；他在黄埔军校担任教官；一定有一种军人气概；他曾经跟鲁迅进行过革命文学队伍内部的文学论争，写过火气很重的文章，是不是有点张飞、李逵式的气质呢？”后来丁玲在陕北见到成仿吾时，第一个感觉就是：“我想象的全错了”，原来，成仿吾是一个“土里土气，老实巴交”的普通人，一个尊重别人、热情、虚心、平等待人的人。 丁玲十分后悔：“为什么我单单忽略了他是一个经过长征的革命老干部、红军战士，一个正派憨厚的共产党员呢？” 另据老红军杨定华回忆说，在长征中见到的成仿吾完全是士兵的装扮：破旧的棉军衣，斜挎干粮袋，手持着一枝手杖。杨定华说，成仿吾在红军大学当政治教员。有人说出他的名字，但谁也不知道他是文学家。 请运用马克思主义认识论基本原理加以分析： （1）丁玲对成仿吾的“合理想象”为什么“全错了”？ （2）丁玲对成仿吾认识的“转变”过程对我们正确认识事物有何启示？","options":{},"answer":""},{"year":2007,"no":35,"type":"分析","stem":"多种经济成分并存是当代资本主义和社会主义共有的经济现象。当代资本主义经济中不仅有私有制经济成分，也有国有制经济成分以及其他经济成分；在社会主义经济中不仅有公有制经济成分，也有私有制经济成分以及其他经济成分。但是资本主义和社会主义的基本经济制度的性质是根本不同的。在分析我国社会主义初级阶段生产资料所有制结构问题时，有人以“八宝饭”为例做了形象比喻：八宝饭中的糯米是主要成分，没有糯米不是八宝饭，但糯米本身并不就是八宝饭；八宝饭里还有其他成分，红枣、莲子、核桃、 花生、红豆、砂糖等，没有这些成分也不是八宝饭，但这些东西本身也不同于八宝饭。只有把糯米和其他成分组合在一起并以糯米为主才是八宝饭。 结合材料回答问题： （1）判断一个社会的基本经济制度性质的根本标准是什么？ （2）我国社会主义初级阶段公有制经济和其他经济成分之间是什么关系？ （3）我国社会主义初级阶段基本经济制度优越性的主要表现是什么？","options":{},"answer":""},{"year":2007,"no":36,"type":"分析","stem":"减租减息是中国共产党在抗日战争时期解决农民问题的基本政策。减租又称二五减租，即规定地主的地租一律照原租额减收25%，地租的最高额不得超过37.5%。减息的原则是“分半减息”，规定放贷的年利率最高不得超过10%。下表系1942 年至1944 年对北岳、大行等五个抗日根据地调查的结合材料回答问题： （1）当地土地流向及农村阶级关系发生了什么变化？ （2）简述实行减租减息政策的意义。 （3）解决农民土地问题是新民主主义革命的一项主要任务。结合此表说明减租减息政策的局限性。","options":{},"answer":""},{"year":2007,"no":37,"type":"分析","stem":"结合材料回答问题： 材料1 2000 年，我国国内生产总值超过了原定比1980 年翻两番的目标，这种增长主要是依赖资源的高投入、 高消耗来实现的。到2020 年实现国内生产总值再翻两番，是我国实现全面建设小康社会的奋斗目标。我国单位GDP 消耗的资源能源数量远高于发达国家，也高于印度等发展中国家。按现行汇率计算，2003 年我国单位资源的产生水平，只相当于美国的1/10，日本的1/20，德国的1/6。单位产值能耗比世界平均水平高2.4 倍，是德国的4.97 倍，日本的4.43 倍，美国的2.1 倍,印度的1.65 倍，是世界上单位产值能耗最高的国家之一。而我国人口众多，人均资源比较贫乏，水资源人均占有量仅相当于世界人均的25%，人均耕地面积不足世界平均不平的50%，石油人均占有储量为世界平均水平的11%，大多数矿产资源的人均拥有量不足世界平均水平的50%。我国环境污染和生态恶化形势十分严峻，1/5 的城市空气污染严重，1/3 的国土面积受到酸雨影响，全国水土流失面积356 万平方公里，沙化土地面积174 万平方公里，90%以上的天然草原退化， 生物多样性减少。 （1）中国经济发展面临的资源挑战对经济增长方式转变提出何种要求? （2）按照科学发展观的要求，我国如何建设资源节约型、环境友好型社会？","options":{},"answer":""},{"year":2007,"no":38,"type":"分析","stem":"本题为选做题，请在Ⅰ、Ⅱ两道题中选取其中一道作答，若两道都回答，只按第Ι道试题的成绩记入总分。 材料1 截止2005 年底，世界已探明的石油储量为12000 亿桶，其中中东地区为7427 亿桶，约占世界总储量的62%。迄今已探明石油储量居世界前列的5 个国家沙特阿拉伯、伊朗、伊拉克、科威特和阿拉伯联合酋长国都位于波斯湾地区。中东地区石油产量约占世界石油总产量的2/5，出口量约占世界总出口量的2/3。 材料2 二战后中东局势一直动荡不定，各种地区冲突和局部战争此起彼伏，连绵不断。其中仅阿拉伯国家与以色列之间就进行了5 次大规模的战争。而1980 年9 月发生的两伊战争，则整整打了8 年。特别是20 世纪90 年代初的海湾危机和海湾战争更是牵动了整个世界。时至2003 年3 月，美、英又对伊拉克发动了一场“先发制人”的战争，迅速占领了伊拉克。2006 年7 月，黎以之间再次爆发大规模的冲突。至于小规模的武装冲突从未间断过，军事政变、内战和恐怖暗杀等暴力事件也时有发生。可以说，在战后的世界上，没有哪一个地区像中东那样经历如此长期和频繁的战争与冲突。 结合地图和所给材料分析中东地区持续动荡不安的主要根源。 （1）从地图中可以看出，中东地处欧、亚、非三大洲的连接处，占据着十分重要的战略地位。里海、 黑海、地中海、红海、阿拉伯海围绕其外缘或深入其内陆，为中东地区与世界各国和地区的联系提供了便利。从黑海进入地中海的通道、连接地中海和红海的苏伊士运河及波斯湾进入阿拉伯海的咽喉要道都具有重要的国际战略意义。因此，在历史的发展过程中，各种矛盾错综复杂，其重要的战略地位使其必然成为各种势力争夺的场所。在冷战时期，中东一直是美、苏两个超级大国激烈争夺的地区。冷战后，美国更是将夺取中东控制权视为其“世界新秩序”的重要一环。（7 分） （2）中东地区是世界能源的供给中心，是西方国家经济赖以生存的主要能源供应地，这里的能源运输线是西方的“生命线”。因此，谁控制了这一地区，谁就掌握了世界经济的命脉，进而左右国际关系的进程。 （2 分） （3）错综复杂的民族和宗教问题也是影响中东稳定和发展及世界经济政治格局的重要因素。（1 分） 选做题Ⅱ： 坚持包容精神，共建和谐世界。文明多样性是人类社会的基本特征，也是人类文明进步的重要动力。 在人类历史上，各种文明都以自己的方式为人类文明进步作出了积极贡献。存在差异，各种文明才能相互借鉴、共同提高；强求一律，只会导致人类文明失去动力、僵化衰落。各种文明有历史长短之分，无高低优劣之别。历史文化、社会制度和发展模式的差异不应成为各国交流的障碍，更不应该成为相互对抗的理由。 我们应该尊重各国自主选择社会制度和发展道路的权利，相互借鉴而不是刻意排斥，取长补短而不是定于一尊，推动各国根据本国国情实现振兴和发展；应该加强不同","options":{},"answer":""},{"year":2006,"no":1,"type":"单选","stem":"世界上惟一不变的是变。这一论断的含义是：","options":{"A":"变是世界的本原","B":"世界上只有变，没有不变","C":"变是绝对的，不变是相对的","D":"变与不变是绝对对立的"},"answer":"C"},{"year":2006,"no":2,"type":"单选","stem":"“只有音乐才能激起人的音乐感；对于没有音乐感的耳朵说来，最美的音乐也毫无意义”。这表明：","options":{"A":"人的认识是主体与客体相互作用的过程和结果","B":"人的感觉能力决定认识的产生和发展","C":"人的认识能力是由人的生理结构决定的","D":"事物因人的感觉而存在"},"answer":"A"},{"year":2006,"no":3,"type":"单选","stem":"温家宝总理在给一位国务院参事的回信中，引用了两句诗：“知屋漏者在宇下，知政失者在草野。”这一古训蕴含的哲理是：","options":{"A":"人的经验是判断是非得失的根本尺度","B":"直接经验比间接经验更重要","C":"感性认识高于理性认识","D":"人民群众的直接经验即实践是认识的重要基础"},"answer":"D"},{"year":2006,"no":4,"type":"单选","stem":"“许多事情我们可以讲一千个理由、一万个理由，但老百姓吃不上饭，就没有理由。‘民以食为天’”。这段话表明：","options":{"A":"人们首先必须吃、喝、住、穿，然后才能从事政治、科学、艺术、宗教等等活动","B":"人的生理需求是历史的基础","C":"人的自然属性决定着人的本质","D":"人的物质欲望是社会发展的根本动力"},"answer":"A"},{"year":2006,"no":5,"type":"单选","stem":"某资本家投资100 万元，资本有机构成4：1，m’＝100%，一年周转4 次，其年剩余价值量和年剩余价值率分别为：","options":{"A":"80 万，100%","B":"40 万，400%","C":"40 万，100%","D":"80 万，400%"},"answer":"D"},{"year":2006,"no":6,"type":"单选","stem":"商业资本作为一种独立的职能资本，也获得平均利润，其直接原因是：","options":{"A":"商业部门与产业部门之间的竞争和资本转移","B":"产业资本家为销售商品将部分利润让渡给商业资本家","C":"商业资本家加强对商业雇员的剥削","D":"产业部门将工人创造的一部分剩余价值分割给商业部门"},"answer":"A"},{"year":2006,"no":7,"type":"单选","stem":"现代企业制度的典型形式是：","options":{"A":"股份制","B":"股份合作制","C":"合伙制","D":"公司制"},"answer":"D"},{"year":2006,"no":8,"type":"单选","stem":"“墙上芦苇，头重脚轻根底浅；山间竹笋，嘴尖皮厚腹中空。”毛泽东在延安整风运动期间用这幅对联形象地讽刺了：","options":{"A":"主观主义的学风","B":"宗派主义的党风","C":"党八股的文风","D":"官僚主义的作风"},"answer":"A"},{"year":2006,"no":9,"type":"单选","stem":"中国新民主主义革命时期的统一战线包含着两个联盟。其中基本的、主要的联盟是：","options":{"A":"工人阶级同城市小资产阶级的联盟","B":"以工农联盟为主体的工人阶级同农民、小资产阶级等其他劳动人民的联盟","C":"以工农联盟为主体的工人阶级同农民、小资产阶级和民族资产阶级的联盟","D":"工人阶级同可以合作的非劳动人民的联盟"},"answer":"B"},{"year":2006,"no":10,"type":"单选","stem":"1939 年毛泽东在《中国革命和中国共产党》中指出，中国是在许多帝国主义国家的统治或半统治之下， 实际上处于长期的不统一状态，再加上土地广大，其结果是：","options":{"A":"帝国主义侵略势力日益成为统治中国的决定性力量","B":"封建经济在社会经济生活中占着显然的优势","C":"经济、政治和文化的发展表现出极端的不平衡","D":"人民的贫困和不自由的程度是世界所少见的"},"answer":"C"},{"year":2006,"no":11,"type":"单选","stem":"要实现我国经济发展的战略目标，必须加快经济增长方式的转变，其核心是正确处理好：","options":{"A":"积累与消费关系","B":"投入与产出的关系","C":"速度与效益的关系","D":"数量与质量的关系"},"answer":"C"},{"year":2006,"no":12,"type":"单选","stem":"创新是一个民族进步的灵魂，是一个国家兴旺发达的不竭动力，也是一个政党永葆生机的源泉。创新包括理论创新、制度创新、技术创新、文化创新及其他各方面的创新。在各项创新中处于先导地位的是：","options":{"A":"科技创新","B":"制度创新","C":"文化创新","D":"理论创新"},"answer":"D"},{"year":2006,"no":13,"type":"单选","stem":"我国社会主义经济体制改革与政治体制改革的关系表现为：","options":{"A":"前者是目的，后者是手段","B":"前者是基础，后者是目标","C":"前者是内容，后者是形式","D":"二者相互依赖，相互配合"},"answer":"D"},{"year":2006,"no":14,"type":"单选","stem":"《中共中央关于制定国民经济和社会发展的第十一个五年规划的建议》提出，“十一五”时期要做到资源利用效率显著提高，单位国内生产总值能源消耗比“十五”期末降低：","options":{"A":"10%左右","B":"20%左右","C":"30%左右","D":"40%左右"},"answer":"B"},{"year":2006,"no":15,"type":"单选","stem":"2005 年10 月27 日，十届全国人大常委会审议通过《关于修改<中华人民共和国个人所得税法>的决定》 将个人所得税工薪费用扣除标准调整为：","options":{"A":"800 元","B":"1200 元","C":"1600 元","D":"2000 元"},"answer":"C"},{"year":2006,"no":16,"type":"单选","stem":"2005 年5 月底6 月初，欧盟成员国法国和荷兰先后在全民公决中以多数票否决了《欧盟宪法条约》，这一事件说明：","options":{"A":"欧盟已失去其吸引力","B":"法、荷两国民众对欧洲一体化建设现状不满","C":"法、荷两国将退出欧盟","D":"《欧盟宪法条约》与欧洲一体化进程背道而驰"},"answer":"B"},{"year":2006,"no":17,"type":"多选","stem":"人对物质世界的实践把握是在实践的运行过程中实现的，其基本环节有：","options":{"A":"区分实践活动的主体与客体","B":"确立实践目的和实践方案","C":"实践主体依据目的、方案，借助手段作用于客体","D":"完成、检验和评价实践活动的结果，进行反馈调节"},"answer":"BCD"},{"year":2006,"no":18,"type":"多选","stem":"马克思指出：“一个社会即使探索到了本身运动的自然规律，……它还是既不能跳过也不能用法令取消自然的发展阶段。但是它能缩短和减轻分娩的痛苦。”这表明：","options":{"A":"人类社会的发展是合规律性与合目的性的统一","B":"社会发展过程与自然界演变过程一样都是自觉的","C":"人的自觉选择在社会发展中具有重要作用","D":"人类总体历史进程是不可超越的"},"answer":"ACD"},{"year":2006,"no":19,"type":"多选","stem":"据报载，北京市××区开展以文化育文明的活动，通过文化资源孕育文明、群众文化哺育文明、文化兴区培育文明等三种途径，营造文明城区。这是因为：","options":{"A":"文化和文明是没有区别的","B":"文化中的积极成分构成文明","C":"文化和文明都是人类活动的结果","D":"文化进步程度与文明发展水平是同步的"},"answer":"BCD"},{"year":2006,"no":20,"type":"多选","stem":"深圳青年歌手丛飞在8 年时间内，捐资上百万元资助了很多贫困山区的失学儿童，而自己却身患癌症， 负债17 万元。有人这样评价他：“丛飞能够从帮助别人的过程中得到快乐。”丛飞的行为表明：","options":{"A":"人的价值不包含个人的价值选择和目标设计等主观方面","B":"人的价值的大小取决于对社会的贡献","C":"人的价值不仅表现在物质方面，更表现在精神方面","D":"社会价值的实现总是以个人价值的牺牲为代价"},"answer":"BC"},{"year":2006,"no":21,"type":"多选","stem":"在资本积累过程中，实现个别资本增大的形式是：","options":{"A":"资本循环","B":"资本积聚","C":"资本周转","D":"资本集中"},"answer":"BD"},{"year":2006,"no":22,"type":"多选","stem":"垄断资本主义的基本经济特征包括：","options":{"A":"垄断组织在经济生活中起决定作用","B":"资本输出有了特别重要的意义","C":"在金融资本的基础上形成金融寡头的统治","D":"垄断使竞争趋于缓和"},"answer":"ABC"},{"year":2006,"no":23,"type":"多选","stem":"社会主义市场经济条件下按劳分配的特点有：","options":{"A":"按劳分配中的“劳”不是直接的社会劳动","B":"按劳分配中的劳动量按照劳动者实际付出的劳动量来计量","C":"按劳分配在全社会范围内按统一标准实现","D":"按劳分配必须通过商品货币形式实现"},"answer":"AD"},{"year":2006,"no":24,"type":"多选","stem":"我国宏观经济调控政策有：","options":{"A":"财政政策","B":"货币政策","C":"产业政策","D":"收入政策"},"answer":"ABCD"},{"year":2006,"no":25,"type":"多选","stem":"在土地革命战争后期和抗日战争时期，毛泽东思想得到系统总结和多方面展开而达到成熟。下列毛泽东的科学著作中，写于这个时期的有：","options":{"A":"《星星之火，可以燎原》","B":"《反对本本主义》","C":"《新民主主义论》","D":"《论联合政府》"},"answer":"CD"},{"year":2006,"no":26,"type":"多选","stem":"1948 年中国共产党制定了土地改革总路线。下列选项中对这一总路线所含内容理解正确的有：","options":{"A":"按照平分土地的原则，满足贫雇农的要求","B":"团结中农，允许中农保有比他人略多的土地","C":"没收地主土地，不再对地主分配土地","D":"实行耕者有其田，将土地的所有权分配给农民"},"answer":"ABD"},{"year":2006,"no":27,"type":"多选","stem":"中华人民共和国的成立标志着：","options":{"A":"半殖民地半封建社会结束","B":"中国进入新民主主义社会","C":"中国进入社会主义社会","D":"新民主主义革命基本胜利"},"answer":"ABD"},{"year":2006,"no":28,"type":"多选","stem":"“三个代表”重要思想深化了对中国特色社会主义的认识，表现在：","options":{"A":"进一步回答了什么是社会主义，怎样建设社会主义的问题","B":"明确提出了解放思想、实事求是的思想路线","C":"创造性地回答了建设一个什么样的党，怎样建设党的问题","D":"确定了党在社会主义初级阶段的基本路线"},"answer":"AC"},{"year":2006,"no":29,"type":"多选","stem":"“计划经济不等于社会主义，资本主义也有计划；市场经济不等于资本主义，社会主义也有市场”。邓小平这一论断的内涵是：","options":{"A":"计划和市场都属于社会基本制度的范畴","B":"计划和市场都是资源配置的方式","C":"计划和市场不是社会主义与资本主义的本质区别","D":"计划和市场是不能兼容的"},"answer":"BC"},{"year":2006,"no":30,"type":"多选","stem":"中国共产党领导的多党合作和政治协商制度，是我国的一项基本政治制度。多党合作的主要方式有：","options":{"A":"各民主党派和无党派民主人士参加人大、政协参与管理国家和参政议政","B":"共产党和各民主党派互派成员到对方担任领导职务","C":"共产党和各民主党派通过多种渠道实行政治协商和民主监督","D":"吸收各民主党派和无党派民主人士中的优秀人才到国家机关担任领导职务"},"answer":"ACD"},{"year":2006,"no":31,"type":"多选","stem":"农业、农村和农民问题始终是我国现代化建设的根本性问题，在现代化建设中必须依靠广大农民群众， 因为：","options":{"A":"广大农民是我国现代化事业发展中人数最多的依靠力量","B":"工农联盟是人民民主专政的基础，也是实现社会主义现代化的保证","C":"农业是国民经济的基础，保证和支持着整个国民经济的运行和稳定发展","D":"没有农村的稳定和全面进步，就不可能有整个社会的稳定和全面进步"},"answer":"ABCD"},{"year":2006,"no":32,"type":"多选","stem":"2005 年9 月15 日，国家主席胡锦涛在联合国成立60 周年首脑会议上，发表了《努力建设持久和平、共同繁荣的和谐世界》的讲话，他提出：","options":{"A":"坚持多边主义，实现共同安全","B":"坚持互利合作，实现共同繁荣","C":"坚持包容精神，共建和谐世界","D":"坚持积极稳妥方针，推进联合国改革"},"answer":"ABCD"},{"year":2006,"no":33,"type":"多选","stem":"主要在越南、泰国等东南亚国家发生的禽流感于2005 年10 月扩散到欧洲、中国、中东及美洲等地。一直被认为是传染病“拒入”地带的俄罗斯、乌克兰、克罗地亚、希腊、瑞典和英国等欧洲国家也相继出现禽流感疫情，世界各国都感到了危机。这一事件表明：","options":{"A":"人类面临的全球性问题日益突出","B":"发展中国家的贫困直接导致了这一全球问题","C":"协商对话和携手合作是应对全球性问题的理性选择","D":"全球公共卫生能力建设亟待加强"},"answer":"ACD"},{"year":2006,"no":34,"type":"分析","stem":"从前，沧州城南有一座临河寺庙，庙前有两尊面对流水的石兽，据说是“镇水”用的。一年暴雨成灾， 大庙山门倒塌，将那两尊石兽撞入河中。庙僧一时无计可施，待到10 年后募金重修山门，才感到那对石兽之不可或缺，于是派人下河寻找。按照他的想法，河水东流，石兽理应顺流东下，谁知一直向下游找了十里地，也不见其踪影。这时，一位在庙中讲学的先生提出其见解：石兽不是木头做的，而是由大石头制成， 它们不会被流水冲走，石重沙轻，石兽必然于掉落之处朝下沉，你们往下游找，怎么找得到呢？旁人听来， 此言有理。不料，一位守河堤的老兵插话：我看不见得，凡大石落入河中，水急石重而河床沙松者应求之于上游。众人一下子全愣住了：这可能吗？老兵解释道：“我等长年守护于此，深知河中情势，那石兽很重， 而河沙又松，西来的河水冲不动石兽，反而把石兽下面的沙子冲走了，还冲成一个坑，时间一久，石兽势必向西倒去，掉进坑中。如此年复一年地倒，就好像石兽往河水上游翻跟头一样。”众人听后，无不服膺。 寻找者依照他的指点，果真在河的上游发现并挖出了那两头石兽。 请运用马克思主义哲学有关原理，结合材料回答问题： (1)庙僧按照常理，认为石兽应顺流而下。从真理的具体性分析其失当之处。(4 分) (2)守河堤老兵关于石兽“逆流而上”的见解对我们辩证地思考问题有何启示？并举一例说明之。(6 分)","options":{},"answer":""},{"year":2006,"no":35,"type":"分析","stem":"自2002 年以来，南京、成都、石家庄等地相继发生奶农把鲜奶倒入下水道的事件。另据2004 年7 月15 日中央电视台《经济半小时》报道，进入夏季之后，浙江某市160 多户奶农也频频把鲜奶倒入水沟， 有时在一天内倒掉14 吨。倒奶那几天，畜牧兽医站的工作人员分头外出，帮助奶农联系收购鲜奶的企业， 但收效甚微。时隔一年，这样的事件又见诸媒体。2005 年8 月11 日新华网报道，陕西某村十几家奶农无奈把鲜奶倒进污水沟。为帮助奶农售奶，当地政府联系了一家公司，收奶价格是每公斤1.2 元。可就是这样的低价，该企业后来也不收了。 人们不禁要问：如今牛奶多得喝不完了吗？ 其实，全球年人均奶类消费量为93 公斤，中国仅为7.2 公斤。奶农倒奶固然与牛奶易变质且不能大量贮存有关，但前几年一些地方农民一窝蜂地饲养奶牛，鲜奶的供应大量增加。同时，很多企业纷纷介入乳品加工业，有些产品尚未达标就上市，消费者不敢购买。当乳品销路不好时，企业便限量收购鲜奶。 根据以上材料回答问题： （1）历史上资本主义国家经济危机时农场主把牛奶倒入大海的现象，与材料中的“倒奶事件”有何本质区别？(3 分) （2）“倒奶事件”中隐含着什么样的经济规律?(3 分) （3）为避免发生类似的“倒奶事件”，你认为地方政府应如何作为?(4 分)","options":{},"answer":""},{"year":2006,"no":36,"type":"分析","stem":"新中国成立前夕，朱德在全国工会工作会议上的讲话中指出：“私人资本主义企业中的职工，他们在经济上还没有获得完全解放，他们还受着资本家剥削，这种剥削在新民主主义时期只能够受到限制，而不能够消灭”；为了工人阶级根本的长远的利益，还必须“在现阶段自觉地忍受资本家之一定限度以内的剥削”。 根据以上材料回答问题： （1）新中国成立后,工人阶级成了国家的主人,为什么私人资本主义企业中的职工还要“忍受”资本家的剥削? (5 分) （2）既然如此,为什么从1953 年开始又要对私人资本主义进行社会主义改造? (5 分)","options":{},"answer":""},{"year":2006,"no":37,"type":"分析","stem":"建立健全与经济发展水平相适应的社会保障体系，是建成完善的社会主义市场经济体制的重要内容， 是贯彻以人为本为核心的科学发展观、构建社会主义和谐社会的必然要求。 胡锦涛同志《在省部级主要领导干部提高构建社会主义和谐社会能力专题研讨班上的讲话》中指出：“我们所要建设的社会主义和谐社会，应该是民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处的社会。”而要“切实维护和实现社会公平和正义”，其中一项重要内容就是“进一步完善社会保障体系，逐步扩大社会保障的覆盖面，切实保障各方面困难群众的基本生活，让他们感受到社会主义大家庭的温暖”。 根据以上材料回答问题： （1）从我国社会保障体系的主要内容说明，为何建立健全社会保障体系体现着科学发展观以人为本的本质和核心？(5 分) （2）公平正义是社会主义和谐社会的重要特征。从社会保障的基本功能说明建立健全社会保障体系与实现公平正义之间的内在联系。(5 分)","options":{},"answer":""},{"year":2006,"no":38,"type":"分析","stem":"本题为选做题，请在Ι、Ⅱ两道题中选取其中一道作答，若两题都回答，只按第Ι道试题的成绩记入总分。 选做题Ι： 2005 年X 月X 日下午，XX 大学学生王文、李波、张彬在自习室相遇。 王文：哎，你们注意没有，这两天，胡锦涛主席去北美访问，随行的居然有70 多家像海尔集团这样的企业“大腕”。上次加拿大总理访华，来了277 家企业，360 多人。领导人出访，带这么多企业代表干什么？ 李波：这有什么新鲜！当年克林顿一上台不就宣布在世界上推销美国产品是他的责任吗？韩国更绝，居然要求所有的外交官都要成为韩国商品的推销员。 张彬：所以啊，EADS①的老总跟德国总理施罗德访华，拿到了价值13 亿美元的合同，包括23 架空中客车，还有为北京奥运会提供的安保系统。 李波：施罗德有什么办法？国内经济不景气，他可以用这些订单来证明自己还是有海外营销能力的嘛。 现在领导人出访可不能只谈友谊，经济合作程度是考查领导人出访成果的一个主要指标。 王文：难怪欧盟不顾美国反对，要取消对华武器禁运，看来也是出于经济利益的考虑。 张彬：经济全球化时代竞争这么激烈，要保护本国利益，又不能损害别国利益，难啊。看来各国外交都得为经济“打工”。 李波：有位外交官不是说，50 年前，如果大使讲经济会被认为是笑柄，现在大使如果不懂经济更会成为笑柄。冷战期间，国与国的较量，军事力量起着重要的作用。现在靠什么？还不是靠经济与技术！ 王文：看来，世界真的变了！ 注①：指欧洲航空防务与航天公司根据以上材料回答问题： （1）他们正在讨论国际社会发生的一种什么样的变化？(4 分) （2）为什么“现在大使如果不懂经济更会成为笑柄”？(6 分) 选做题Ⅱ： 随着人口的急剧增长，人类社会面临着三种主要因素的制约，即经济增长，资源以及环境。人们将发现我们面临的是相互制约的三重困境（如下图）人类必须从这三重困境结构中寻找出路。 根据以上材料回答问题： （1）运用普遍联系的观点说明人类发展所面临的三重困境。(4 分) （2）分析人类发展走出三重困境的战略选择。(6 分)","options":{},"answer":""},{"year":2017,"no":1,"type":"单选","stem":"某地区进入供暖季后常出现雾霾，而一旦出现大风天气或等到春暖花开后雾霾就会散去减少，从该地区较长时间的数据变化看，经过人们努力治霾，污染物排放总量在持续走低，但在某些时段，环境空气质量污染指数会迅速攀升，甚至“爆表”，这种看似“矛盾”的现象凸显了大气污染防治的一个特点：天帮忙很重要，但人努力才是根本。“人努力”与“天帮忙”之间的关系对我们处理主观能动性和客观规律之间辩证关系的启示是：","options":{"A":"人类有意识的思想活动是掌握客观规律的根本前提","B":"尊重事物的客观规律是正确发挥主观能动性的前提","C":"认识活动是客观规律性与主观能动性相统一的基础","D":"尚未认识的外在自然规律对人的实践活动起着至关重要的作用"},"answer":"B"},{"year":2017,"no":2,"type":"单选","stem":"有人认为，既然人的意识是对客观外部世界的反映，那么人脑里的“鬼”、“神”意识就是对外在世界鬼、神真实存在的反映。这种观念错误在于","options":{"A":"把意识看成是物质的产物","B":"夸大了意识的能动作用","C":"认为意识是对存在的直接反映","D":"混淆了人类意识自然演化的阶段"},"answer":"C"},{"year":2017,"no":3,"type":"单选","stem":"某企业投资汽车生产。生产一辆汽车所耗费的生产资料价值为15 万元，支付给工人的工资为5 万元，假定市场的平均利润为10%，那么，在自由竞争条件下，该汽车的生产价格是（ ）","options":{"A":"20 万元","B":"21 万元","C":"22 万元","D":"25 万元"},"answer":"C"},{"year":2017,"no":4,"type":"单选","stem":"从历史发展的角度看，资本主义生产资料所有制是不断演进和变化的，当今资本主义社会居主导地位的资本所有制形式是","options":{"A":"法人资本所有制","B":"私人资本所有制","C":"私人股份资本所有制","D":"垄断资本私人所有制"},"answer":"A"},{"year":2017,"no":5,"type":"单选","stem":"从中华人民共和国成立到社会主义改造完成，是我国从新民主主义到社会主义的过渡时期。这一时期，个体经济向社会主义集体经济过渡形式是","options":{"A":"私人资本主义经济","B":"国营经济","C":"合作社经济","D":"国家资本主义经济"},"answer":"C"},{"year":2017,"no":6,"type":"单选","stem":"2016年是“十三五”规划开局之年，也是推进供给侧结构性改革的攻坚之年，推进供给侧结构性改革是适应我国经济发展新常态的重大决策，其根本目的是().","options":{"A":"提高供给质量满足需要","B":"加快政府职能转变","C":"深化价格、财税、金融、社保等领域基础性改革","D":"推进“去产能、去库存、降成本、补短板”"},"answer":"A"},{"year":2017,"no":7,"type":"单选","stem":"协调推进“四个全面”战略布局，是党十八大以来党中央从实现“两个一百年”奋斗目标，实现中华民族伟大复兴的中国梦的战略高度，统筹国内国际两个大局，把握我国发展新特征确定的治国理论新方略。在“四个全面”战略布局居于引领地位的是()","options":{"A":"全面深化改革","B":"全面建成小康社会","C":"全面依法治国","D":"全面从严治党"},"answer":"B"},{"year":2017,"no":8,"type":"单选","stem":"随着工业化、城镇化的深入推进，大量农民转向非农产业，我国农村土地流转现象日益普遍，农业经营方式发生深刻变化，截至2016年6月全国家庭承包经营耕地面积流转已超过30%，流转土地4.6亿亩。当前为解决拥有土地承包经营权的人不再种地，种地的人又没有相应权利这一突出问题，我国在深化农村改革方面做出重大制度创新是()","options":{"A":"实行农村土地所有权、承包权、经营权分量","B":"实行农村集体经营性建设用地入市","C":"实行农村家庭联产承包责任制","D":"实行农村耕地保护制度"},"answer":"A"},{"year":2017,"no":9,"type":"单选","stem":"帝国主义侵略中国的最终目的是要瓜分中国，灭亡中国。1895年中国在甲午战争中战败后，列强掀起了瓜分中国的狂潮，这集中表现在()","options":{"A":"设立完全由外国人直接控制和统治的租界","B":"竞相租借港湾和划分势力范围","C":"外国资本主义在中国近代工业中争夺垄断地位","D":"从侵占中国边邻国发展到蚕食中国边疆地区"},"answer":"B"},{"year":2017,"no":10,"type":"单选","stem":"第一次世界大战，德国战败。1918年12月，陈独秀在《每周评论》里的发刊词中说大战结果是“公理战胜强权”，并把美国总统威尔逊称作“现在世界第一好人”，然而陈独秀在1919年5月4日出版的《每周评论》上的一篇文章中又写到“什么公理，什么永久和平，什么威尔逊总统十四条宣言，都成了不值一文的空话。”导致陈独秀认识发生变化的直接原因是()","options":{"A":"美国不愿放弃在华种种特权","B":"日本对德宣战，出兵山东","C":"苏俄宣布废除以前同中国签订的一切不平等条约","D":"中国在巴黎和会上的外交失败"},"answer":"D"},{"year":2017,"no":11,"type":"单选","stem":"毛泽东思想是马克思主义中国化的第一大理论成果，是在中国革命和建设的实践中逐步形成和发展起来的，在土地革命战争后期和抗日战争时期，毛泽东思想得到多方面展开而达到成熟，其标志是()","options":{"A":"思想政治工作和文化工作理论的系统提出","B":"新民主主义的理论的系统阐明","C":"人民民主专政理论的完整论述","D":"农村包围城市和武装夺取政权理论的科学概括"},"answer":"B"},{"year":2017,"no":12,"type":"单选","stem":"1947年6月底，根据中共中央的决策和部署，刘伯承、邓小平率领的晋冀鲁豫野战军主力，实施中央突破，千里跃进大别山;陈毅、粟裕指挥的华东野战军主力为东路，挺进鲁豫皖地区;陈赓、谢富治指挥的晋冀鲁豫野战军一路为西路，挺进豫西。三大主力军相互策应，机动歼敌，迫使国民党处于被动地位。这说明()","options":{"A":"人民解放军在数量上已经超过国民党军队","B":"人民解放军战略进攻的序幕由此揭开","C":"人民解放军同国民党军队进行战略对决的时机已经成熟","D":"人民解放军进入战略相持阶段"},"answer":"B"},{"year":2017,"no":13,"type":"单选","stem":"信念是认知、情感和意志的有机统一体，是人们在一定的认知基础上确立的对某种思想或事物坚信不疑并身体力行的心理态度和精神状态。信念有不同的层次和类型，其中（ ）","options":{"A":"高层次的信念决定低层次的信念","B":"低层次的信念决定高层次的信念","C":"社会共同的信念是信念体系的最高层次","D":"个人信念是信念体系的最高层次"},"answer":"A"},{"year":2017,"no":14,"type":"单选","stem":"社会主义核心价值观，为人们确定和实现人生价值提供了基本遵循。人生价值评价，主要是看一个人的人生活动是否符合社会发展的客观规律、是否通过实践促进了历史的进步，其评价的根本尺度是（ ）","options":{"A":"历史标准","B":"政治标准","C":"经济标准","D":"文化标准"},"answer":"A"},{"year":2017,"no":15,"type":"单选","stem":"自2016年5月20日台湾地区新领导人入职以来，两岸制度性沟通和协商谈判机制中断，其根本原因在于","options":{"A":"台湾在美国测试新的导弹防御系统","B":"美国高规格“礼遇”台湾当局领导人过境","C":"台湾当局减少了赴台旅游大陆游客的配额","D":"台湾当局未明确承认“九二共识”及其核心意涵"},"answer":"D"},{"year":2017,"no":16,"type":"单选","stem":"二战后，中东经历了长期和频繁的战争与冲突，是世界上最动荡的地区，被称为“火药库”。2016.11.29联合国举行“声援巴勒斯坦人民国际日”纪念大会，中国国家主席习近平向大会致贺电，表示中国作为联合国安理会常任理事国，愿同国际社会—起为早日实现中东全面，公正，持久和平做出不断努力，中东问题的核心是","options":{"A":"伊朗核问题","B":"教派冲突问题","C":"恐怖主义问题","D":"巴勒斯坦问题"},"answer":"D"},{"year":2017,"no":17,"type":"多选","stem":"生物学史，可说是显微镜的发展史。17世纪中叶，英国科学家使用诞生不久的显微镜观察软木塞，发现了植物细胞，开启了近现代生物学的大门。此后，显微镜的放大能力和成像质量不断提升，人类对细胞的认知也随之深刻和全面。20世纪中叶，科学家们利用X射线晶体学发现了DNA（双螺旋结构），人类的观察极限从亚细胞结构推向了分子结构。我国科学家们的重要科研成果：剪接体的高分辨率三维结构的背后，也站着一个默默无闻的英雄——冷冻电子显微镜。显微技术的发展表明（ ）","options":{"A":"探索未知世界的科学实验是人类最基本的实践活动","B":"实践的主体和客体正是依靠中介系统才能够相互作用","C":"人类认识水平的提高与实践条件的进步有直接的关系","D":"主体、客体和中介三者有机统一构成的实践的基本结构"},"answer":"BCD"},{"year":2017,"no":18,"type":"多选","stem":"唯物史观在坚持人民群众是历史的创造者这一基本前提下，高度重视个人在历史上的作用。历史人物是一定历史事件的主要倡导者、组织领导者或思想理论、科学文化的重要代表人物。下列关于历史人物作用的正确认识是","options":{"A":"历史人物对历史发展的作用都是积极的","B":"历史人物会因其智慧、性格等因素对社会过程发生影响","C":"具有进步意义的历史人物往往能够首先发现或提出历史进程中新的历史任务","D":"历史人物无论发挥什么样的历史作用都不能决定和改变历史发展的总进程和总方向"},"answer":"BCD"},{"year":2017,"no":19,"type":"多选","stem":"马克思指出，所谓资本原始积累只不过是生产者和生产资料分离的历史过程。这个过程所以表现为“原始的”，因为它形成资本及与之相适应的生产方式的前史。资本原始积累的主要途径有()","options":{"A":"用暴力手段剥夺农民土地","B":"用剥削手段榨取剩余价值","C":"用野蛮手段进行殖民掠夺","D":"用资本手段获取市场暴利"},"answer":"AC"},{"year":2017,"no":20,"type":"多选","stem":"当今世界正处在新科技革命和产业革命的交汇点，以机器人技术为代表的科技产业发展十分迅速。机器人在生产过程中的广泛使用，使资本有机构成不断提高。然而，就一般意义而言，资本有机构成的提高实际上是","options":{"A":"由资本的本性决定的","B":"不以人的意志为转移的一般趋势","C":"社会产生相对过剩人口的一个重要原因","D":"一个社会增长财富和消除贫困的根本途径"},"answer":"ABC"},{"year":2017,"no":21,"type":"多选","stem":"1921年3月，俄共(布)召开十大，决定从战时共产主义政策过渡到新经济政策。在实施新经济政策期间，列宁对苏维埃俄国如何建设社会主义进行了深刻的理论思考，提出了许多精辟的论述，其内容包括","options":{"A":"可以利用资本主义来建设社会主义","B":"把建设社会主义作为一个长期探索、不断实践的过程","C":"把大力发展生产力、提高劳动生产率放在首要地位","D":"允许多种经济成分并存，可以利用商品、货币和市场发展经济"},"answer":"ABCD"},{"year":2017,"no":22,"type":"多选","stem":"在庆祝中国共产党成立95周年大会上，习近平总书记强调指出：“坚持不忘初心、继续前进，要坚持党的基本路线不动摇，不断把中国特色社会主义伟大事业推向前进。”改革开放以来，党和国家领导人一再强调要毫不动摇地坚持党的基本路线，这主要是因为，实践已经证明党的基本路线是","options":{"A":"党和国家的生命线、人民的幸福线","B":"实现科学发展的政治保证","C":"兴国、立国、强国的重大法宝","D":"思想路线的核心"},"answer":"ABC"},{"year":2017,"no":23,"type":"多选","stem":"“一带一路”倡议提出三年来，已经有100多个国家和国际组织参与其中，我国同沿线30多个国家签署共建合作协议，与20多个国家开展了国际产能合作，一批有影响力的标志性项目逐步落地。截至2016年7月，我国对“一带一路”相关国家的投资累计已达511亿美元，占同期对外直接投资总额的12%；与沿线国家新签承包工程合同1.25万份，累计合同额2790亿美元。我国推进“一带一路”建设旨在（ ）","options":{"A":"统筹国内国际两个大局","B":"打造开放、包容、均衡、普惠的区域经济合作架构","C":"促进沿线各国共同繁荣","D":"探索国际合作及全球治理新模式"},"answer":"ABCD"},{"year":2017,"no":24,"type":"多选","stem":"2016年7月以来，中央陆续派出环保督查组进驻各地进行现场督查，掀起了一场新的环保问责风暴。环保督查，从环保部门牵头到中央主导，从以查企业为主转变为 “查督并举，以督政为主”，这是我国环境监管模式的重大变革和完善生态文明制度体系的重要举措。建立环保督查工作机制有利于","options":{"A":"处理好政府与市场的关系","B":"强化领导责任和监管责任","C":"落实环境保护主体责任","D":"完善领导干部目标责任考核制度"},"answer":"BCD"},{"year":2017,"no":25,"type":"多选","stem":"党的十八届五中全会提出“创新、协调、绿色、开放、共享”的新发展理念，把创新作为引领发展的第一动力。在新发展理念的指导下，2016年5月党中央和国务院颁布了《国家创新驱动发展战略纲要》。把创新作为引领发展的第一动力是","options":{"A":"分析世界发展历程和总结我们改革开放实践得出的结论","B":"引领经济发展新常态的根本之策","C":"构建和谐社会的内在要求","D":"提高核心竞争力的必然选择"},"answer":"ABD"},{"year":2017,"no":26,"type":"多选","stem":"严肃党内政治生活是我们党的优良传统和政治优势，也是全面从严治党的基础。党的十八届六中全会审议通过了《关于新形势下党内政治生活的若干准则》和《中国共产党党内监督条例》，提出了新形势下加强和规范党内政治生活的新要求，其主要内容是","options":{"A":"着力增强党内政治生活的政治性、时代性、原则性和战斗性","B":"着力提高党的领导水平和执政水平，增强拒腐防变和抵御风险能力","C":"着力增强党自我净化、自我完善、自我革新、自我提高能力","D":"着力维护党中央权威，保证党的团结统一、保持党的先进性和纯洁性"},"answer":"ABCD"},{"year":2017,"no":27,"type":"多选","stem":"在半殖民地半封建社会的条件下，中国不可能在独立的基础上与外国发生经济往来，资本-帝国主义列强同中国发生经济关系，不是为了推动中国经济的发展，而是为了控制中国的经济。列强控制中国经济的方式有：","options":{"A":"在中国设立出版机构宣传西学","B":"控制中国的关税和盐税","C":"在中国设立银行","D":"控制中国的交通运输业"},"answer":"BCD"},{"year":2017,"no":28,"type":"多选","stem":"孙中山先生是伟大的民族英雄、伟大的爱国主义者、中国民主革命的伟大先驱，一生以革命为己任，立志救国救民，为中华民族作出了彪炳史册的贡献。孙中山先生的伟大表现在","options":{"A":"领导了辛亥革命","B":"重新解释了三民主义并提出了联俄、联共、扶助农工三大政策","C":"发动了以推翻北洋军阀统治为目标的北伐战争","D":"坚定维护民主共和制度和国家完整统一"},"answer":"ABD"},{"year":2017,"no":29,"type":"多选","stem":"1978年12月18日到22日，党的十一届三中全会在北京召开。会议的主要任务是确定把全党工作重点转移到社会主义现代化建设上来。这次全会是新中国成立以来党的历史上具有深远意义的伟大转折。全会结束了粉碎“四人帮”后两年党和国家工作在徘徊中前进的局面，标志着中国共产党","options":{"A":"重新确立了马克思主义的思想路线、政治路线、组织路线","B":"形成了以邓小平为核心的党的中央领导集体","C":"开始了在思想、政治、组织等领域的全面拨乱反正","D":"揭开了改革开放的序幕"},"answer":"ACD"},{"year":2017,"no":30,"type":"多选","stem":"我国法律文化有悠久的历史和传承，据《说文解字》阐释，汉语中“法”的古体是“灋”。“灋，刑也，平之如水，从水；廌，所以触不直者去之，从去。”在古代，“法”主要表现为“刑”或“刑律”，“刑”既有刑戮、罚罪之意，也有规范之意;“廌”也称“獬豸”，是神话中的独角兽，它公正不阿，善断是非曲直。上述材料表明，在传统文化中人们对法律的理解和诉求是","options":{"A":"法律体现了君权神授的思想","B":"法律具有至高无上的地位","C":"法律富含着公平如水、正义神圣的深刻意蕴","D":"法律寄托着惩恶扬善、匡扶正义的价值追求"},"answer":"CD"},{"year":2017,"no":31,"type":"多选","stem":"公共生活中的个人权利与他人权利发生冲突在所难免，比如学生宿舍里有人看书，有人休息，有人要听音乐……对解决权利冲突要有正确的认识，虽然每个人都有行使个人权利的自由，但也要尊重他人权利。这是因为","options":{"A":"尊重他人权利即是一项法律义务，也是一项道德义务","B":"尊重他人权利是公民意识的重要内容","C":"权利实现的内在动力是人们彼此之间对各自权利的相互尊重","D":"不尊重他人权利，就可能丧失自己的权利"},"answer":"ABD"},{"year":2017,"no":32,"type":"多选","stem":"中国人民解放军战区成立大会于2016年2月1日在北京隆重举行。中共中央总书记、国家主席、中央军委主席习近平向东部战区、南部战区、西部战区、北部战区、中部战区授予军旗并发布训令。建立五大战区及组建战区联合作战指挥机构是","options":{"A":"构建我军联合作战体系的历史性发展","B":"为实现中国梦强军梦作出的战略决策","C":"加强国际军事合作与交流的重大步骤","D":"全面实施改革强军战略的标志性举措"},"answer":"ABD"},{"year":2017,"no":33,"type":"多选","stem":"2016年6月23日，英国举行脱离欧盟全民公投，脱欧阵营以51.9%对留欧阵营48.1%的微弱得票优势胜出，英国成为首个投票脱离欧盟的国家，为欧洲一体化进程带来变数。导致英国“脱欧”的因素主要有","options":{"A":"英国始终反对欧洲一体化","B":"英国“疑欧主义”传统","C":"欧洲遭遇史上最大难民潮冲击","D":"英国不愿接受欧盟某些监管规则束缚"},"answer":"BCD"},{"year":2017,"no":34,"type":"分析","stem":"结合材料回答问题 2016年3月，世界围棋冠军李世石与谷歌围棋人工智能程序AlphaGo(阿尔法围棋)的人机大战吸引了全世界的目光。AlphaGo最终以4:1击败李世石，此次AlphaGo的胜利被业界认为是人工智能发展史上的一个重要的里程碑。 人工智能一般被认为是通过模拟，延伸和扩展人类智能，产生具有类人智能的计算系统。经过半个多世纪的努力，人类在人工智能技术的诸多领城取得了一连串重要突破。1968年，斯坦福大学的计算机科学家设计出了第一个专家系统;1982年，加州理工学院物理学家提出了新的神经网络模型;1997年，I BM“深蓝”电脑战胜国际象棋世界冠军卡斯帕罗夫;2011年，IBM超级计算机“沃森”在美国电视答题节目中战胜两位人类冠军;2013年，机器在人脸识别上超过人类;仅一年后，机器人在物体识別上也获胜……未来人工智能继续超越人类的可能性很高。 在人工智能应用前景充满无限可能的情况下，其潜在风险也引发了广泛讨论。 2016 年2月，在美国加州发生了一起无人驾驶汽车因躲避路上障碍物而撞上公交车的交通事故，这凸显出人工智能设备在应对人类社会各种场景时面临的挑战。人们还担心人工智能技术成熟后的问題，比如将机器人用于战争是否会带来像核武器一样的后果。 有学者表示，人机对弈是人类思考自身作用的契机，人工智能的目的是帮助人类，创造出比李世石更优秀的棋手应该是人类的胜利。也有学者认为，在面对复杂的伦理问题时，人工智能技术可能会陷入不可预知的选择困境。著名物理学家霍金也发出警告：“我不认为人工智能的进步一定会是良性的。” 德国人工智能研究所柏林分所所长汉斯•乌斯克莱特强调说，人工智能的矸究方向不是要取代人类，而是要与人类互补，增强人类的能力。人工智能不会取代人类，因为只有人类才具有创造力和目标，而机器只关注如何解决眼前遇到的问題。要让人工智能避免犯下道德层面的错误，关健在于人类自己。在美国《连线》杂志创始主编凯文•凯利看来，每个发明都不可避免带来新问题，但同时也会带来新的解决方案。解决这些问题的方式不是減少技术的使用，而是通过改进技术来提供解决方案。他认为，即使新的科技发明带来的49%是问题，但它首先带来了51%的好处。这正是人类进步的动力。 从这个意义上讲，“阿尔法围棋”和李世石无论谁胜谁败，人类都是最后的赢家。总之，用好人工智能，关键还在人类自身。 摘编自《人民日报》(2016年4月12日)、《参考消息》(2016年6月30日) (1) 从真理和价值辩证关系的视角看，为什么人们对人工智能技术会产生多种多样的看法和评价?(4分) (2) 如何理解“用好人工智能，关键还在人类自身”?(6分)","options":{},"answer":""},{"year":2017,"no":35,"type":"分析","stem":"结合材料回答问题 1984年6月24日，《人民日报》头版刊登的一封反映福建宁德地区福鼎县磻溪镇赤溪村扶贫状况的读者来信，引发社会的关注和中央的重视，当年9月，党中央国务院发出关于帮助贫困地区尽快改变面貌的通知，拉开了新时期扶贫开发的序幕。赤溪村因此被称作“中国扶贫第一村”。时隔32年之后，2016年2月1日，赤溪村作为新时期扶贫开发“宁德模式”的典范亮相“人民日报”头版，再次引发关注。 当年，赤溪14个自然村散落在9平方公里的大山里，山高路险鸟稀疏，要跳出“贫困的陷阱”殊为不易，最初的办法是“输血”，由政府和社会筹措资金送钱运物，但这种救济式扶贫治标不治本，到上世纪80年代末，整个赤溪贫困率仍在90%以上。 针对当地贫困状况，时任宁德地委书记的习近平同志多次强调，弱鸟可望先飞，至贫可能先富……首先要看我们头脑里有无这种意识，“必须探索一条因地制宜发展经济的路子”。他非常富有前瞻性指出: “抓山也能致富，把山管住，坚持10年，15年，20年，我们的山上就是‘银行’了。 在宁德地委强力推动下，赤溪村打响了以转变观念为突破口的“换血”攻坚战——“挪穷窝”，用移民搬迁的方式把分散的14个自然村集中起来，通路、通电，搬迁成功了，生活环境改善了，新问题又来了：挪了穷窝，靠着人均不足1亩的土地，如何拔掉穷根，走一条自我致富之路?赤溪村两委干部再次帮助群众转变观念，因地制宜培育旅游特色优势产业。今天，生态旅游已成为赤溪人致富的主导产业。2015年全村人均纯收入达1.3万多元，其中45%以上来自旅游业。 三十年来，赤溪村干部群众在党的扶贫政策支持下，在社会各方的大力帮扶下，从“输血”帮扶到“换血”搬迁再到“造血”开发，走出了一条适合自身特点的扶贫脱贫之路，把一个远近闻名的贫困村建成了小康村。2016年2月19日，习近平总书记同赤溪村干部群众进行在线交流时指出：“中国扶贫第一村”这个评价是很高的，滴水穿石，久久为功，弱鸟先飞，你们的实践印证了现在的扶贫方针，就是精准扶贫。” 赤溪村矢志不渝推进扶贫开发，脱贫致富的艰辛历程，正是中国特色扶贫开发探索之路的一个缩影。改革开放以来，我们党成功走出一条中国特色扶贫开发道路，使七亿多贫困人口成功脱贫，为全面建成小康社会打下了坚实的基础。当前，我国脱贫攻坚已进入冲刺阶段。习近平总书记指出“全面建成小康社会关键是把经济社会‘短板’尽快补齐”，而“农村贫困人口脱贫是最突出的短板”，脱贫攻坚战的冲锋号已吹响。我们要立下愚公移山志，咬定目标，苦干实干，坚决打赢脱贫攻坚战。 ——摘编自人民网(2016年2月1日、11月9日)、新华网(2016年7月25日)、央视网(2016年8月6日)等 (1)如何理解农村贫困人口脱贫是我国全面建成小康社会“最突出的短板”?(5分) (2)赤溪村脱贫致富之路对当前我国实施精准扶贫，打赢脱贫攻坚战有何启示?(5分)","options":{},"answer":""},{"year":2017,"no":36,"type":"分析","stem":"结合材料回答问题： 从1934年10月至1936年10月，红军第一、第二、第四方面军和第二十五军进行了伟大的长征，我们党领导红军，以非凡的智慧和大无畏的英雄气概，战胜千难万险，付出巨大牺牲，胜利完成震撼世界、彪炳史册的长征，宣告了国民党反动派消灭中国共产党和红军的图谋彻底失败，宣告了中国共产党和红军肩负着民族希望胜利实现了北上抗日的战略转移，实现了中国共产党和中国革命事业从挫折走向胜利的伟大转折，开启了中国共产党为实现民族独立、人民解放而斗争的新的伟大进军。 长征途中，英雄的红军，血战湘江，四渡赤水，巧渡金沙江，强渡大渡河，飞夺泸定桥，鏖战独树镇，勇克包座，转战乌蒙山，击退上百万穷凶恶极的追兵阻敌，征服空气稀薄的冰山雪岭，穿越渺无人烟的沼泽草地，纵横十余省，长驱二万五千里。 长征途中，党中央召开的遵义会议，是我们党历史上一个生死攸关的转折点，这次会议确立了毛泽东同志在红军和党中央的领导地位，开始确立了以毛泽东同志为主要代表的马克思主义正确路线在党中央的领导地位，开始形成以毛泽东同志为核心的党的第一代中央领导集体，这是我们党和革命事业转危为安、不断打开新局面最重要的保证。 长征途中，我们党通过艰苦卓绝的实践探索，成功把解决生存危机同拯救民族危亡联系在一起，把长征的大方向同建立抗日前进阵地联系在一起，实现了国内革命战争向抗日民族战争的转变，为夺取中国人民抗日战争胜利、进而夺取新民主主义革命胜利打下了坚实基础。 长征的胜利，不仅保存了革命力量，而且使我们党找到了中国革命力量生存发展新的落脚点，找到了中国革命事业胜利前进新的出发点。从长征的终点出发，我们党领导中国人民展开了中国革命波澜壮阔的新画卷。 历史是不断向前的，要达到理想的彼岸，就要沿着我们确定的道路不断前进，每一代人有每一代人的长征路，每一代人都要走好自己的长征路。今天，我们这一代人的长征，就是要实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦。 实现伟大的理想，没有平坦的大道可走。夺取坚持和发展中国特色社会主义伟大事业新发展，夺取推进党的建设新的伟大工程新成效，夺取具有许多新的历史特点的伟大的斗争新胜利，我们还有许多“雪山”、“草地”需要跨越，还有许多“娄山关”、“腊子口”需要征服，一切贪图安逸、不愿继续艰苦奋斗的想法都是要不得的，一切骄傲自满、不愿继续开拓前进的想法都是要不得的。 长征永远在路上，一个不记得来路的民族，是没有出路的民族，不论我们的事业发展到哪一步，不论我们取得了多大的成就，我们都要大力弘扬伟大长征精神，在新的长征路上继续奋勇前进。 摘自习近平《在纪念红军长征胜利80周年大会上的讲话》 (1)为什么说长征的胜利既是“中国革命力量生存发展新的落脚点”，也是“中国革命事业胜利前进新的出发点”?(6分) (2)如何理解“长征永远在路上”?(4分)","options":{},"answer":""},{"year":2017,"no":37,"type":"分析","stem":"结合材料回答问题： 2015年五一劳动节前夕，央视新闻频道播出了《大国工匠》系列节目，讲述了8个工匠“八双劳动的手”所缔造的“神话”。节目播出之后，很快引起社会热议，在不到十天的时间里，相关话题的微博阅读量就超过了3560万次。人们发现，走入镜头的工匠们，他们文化不同，年龄有别，但拥有一个共同的闪光点——立足于本职工作，敬业奉献，数十年如一日地追求着职业技能的极致化，靠着传承和钻研，凭着专注和坚守，创造了一个又一个“中国制造”的奇迹。在2016年“两会”上，国务院总理李克强在《政府工作报告》中提出要积极培育“工匠精神”。“工匠精神”第一次正式写入政府工作报告。 “工匠精神”是一种职业精神。工匠们对所从事的事业的爱心和忠心，令人高山仰止。中国航天科技集团一院火箭总装厂高级技师高凤林，36年一直从事火箭的“心脏”——发动机焊接工作，以国为重、扎根一线，是发动机焊接第一人，面对很多企业试图高薪聘请不为所动，他说：“每每看到自己生产的发动机把卫星送到太空，就有一种成功后的自豪感，这种自豪感用金钱买不到。”这也代表了大国工匠们的心声。 “工匠精神”是一种工作态度。在工匠们的心目中，制作出来的产品没有最好，只有更好。高凤林在36年的工作中，攻克了200多项技术难关，经他的手焊接了140多发火箭的发动机，焊接的焊缝总长度达到了12万多米，没有出现过一次质量问题。他先后获得过部院科技进步一等奖、国家科技进步二等奖、2014年纽伦堡国际发明展览会金奖等30多种奖励，而这没有一丝不苟的工作态度显然是无法做到的。 随着时代的发展，工匠的工作或许会逐渐被机器所取代，但是“工匠精神”却不可能被代替。我国作为一个拥有“四大发明”的发明古国，具有历史悠久而技术高超的手工业，薪火相传的能共巧匠们留下了数不胜数的传世佳作。我们今天弘扬“工匠精神”，不仅是对传统工匠技艺的留恋，而且是对一切职业的道德呼唤。“工匠精神”，不仅仅是制造业的需要，也不仅仅是企业家的需要，它代表了一个时代的气质，是我们每一个人的事业追求与人生态度。 摘编自《中国青年报》(2015年5月11日)、央视网(2016年4月22日、10月9日)等 (1)“工匠精神”的实质是什么?(5分) (2)为什么说弘扬“工匠精神”是“对一切职业的道德呼唤”?(5分)","options":{},"answer":""},{"year":2017,"no":38,"type":"分析","stem":"请结合材料回答问题 2016年，世界将期待的目光聚集在了中国杭州。9月4日至5日，二十国集团(G20)领导人峰会在这里隆重举行，中国国家主席习近平主持会议并致开幕辞。本届峰会的主题是“构造创新、活力、联动、包容的世界经济”。作为今年中国最重要的主场外交，也是近年来中国主办的级别最高、规模最大、影响最深远的国际峰会，除了G20成员，还有8个嘉宾国领导人以及7个国际组织负责人与会。人们希望中国智慧能为长期疲软的世界经济准确把脉，找到病根，开出标本兼治，综合施策的良方。 中国一直是G20积极的参与者、建设者、贡献者，今年肩负起G20峰会主席国的重任，跃变为全方位的协调者和强有力的主导者。本届峰会尚未开幕，习近平主席就和奥巴马总统先后向联合国秘书长潘基文交存了中国和美国关于气候变化的《巴黎协定》批准文书，不仅提前向峰会送上一份“大礼”，也为会议定下了以建设性伙伴关系处理各项议题的基调。 在中国的精心组织和与会各方的共同努力下，杭州峰会取得了丰硕的成果：发表了《二十国集团领导人杭州峰会公报》，就推动世界经济增长达成许多重要共识;聚焦创新、结构性改革、新工业革命、数字经济等新方式，制定并通过了《二十国集团创新增长蓝图》、《二十国集团深化结构性改革议程》、《2016年二十国集团创新行动计划》、《二十国集团新工业革命行动计划》、《二十国集团落实2030年可持续发展议程行动计划》等28份成果文件，明确了世界经济的前进方向和具体行动计划，以期为世界经济开辟新道路、拓展新疆界;第一次把发展问题置于全球宏观政策框架突出位置，第一次就落实联合国2030年可持续发展议程制度行动计划，第一次集体支持非洲和最不发达国家工业化，在二十国集团历史上具有重要开创性意义;强调二十国集团成员虽然国情不同、发展阶段不同、面临的现实挑战不同，但推动经济增长的愿望相同，应对危机挑战的利益相同，各方应该“彼此包容、守望相助”，“坚定前行、共抵彼岸”。习近平主席特地用“桥”来比喻二十国集团，称其为“友谊之桥”、“合作之桥”、和“未来之桥”。 中国在本次峰会上发挥的巨大作用，得到与会国家和国际组织领导人的高度认可。联合国秘书长潘基文高度赞赏杭州峰会，称中国作为G20轮值主席国，作出了杰出贡献;尤其是推动峰会在“说易行难”的可持续发展议题上制定行动计划，更是历史性的贡献，向世界展示出卓越领导力。 摘编自《人民日报》(2016年9月4日、9月5日、9月6日) ⑴结合当前国际环境，分析二十国集团领导人杭州峰会主题的现实意义。(6分) ⑵习近平主席用“桥”比喻二十国集团，体现出中国怎样的外交理念与世界情怀?(4分)","options":{},"answer":""},{"year":2016,"no":1,"type":"单选","stem":"《百喻经》中有一则寓言，有一个愚人到别人家去做客，他嫌菜没有味道，主人就给他加了点盐。菜里加了盐以后，味道好极了，愚人就想：“菜之所以鲜美，是因为有了盐，加一点点就如此鲜美，如果加更多的盐岂不是更加好吃?”回家以后，他把一把盐放进嘴里，结果又苦又咸，这则寓言给我们的启示是","options":{"A":"持续的量变会引起事物发生质的变化","B":"在认识和处理问题时要掌握适度的原则","C":"在事物的发展过程中要时时注意事物的自我否定","D":"不可能通过一些现象而去认识某个事物的本质"},"answer":"B"},{"year":2016,"no":2,"type":"单选","stem":"有一种观点认为，“自由不在于幻想中摆脱自然规律而独立，而在于认知这些规律，从而能够有计划地使自然规律为一定的目的服务”。还有一种观点认为，“‘自由’倒过来就是‘由自’，因此‘自由’等于‘由自’，‘由自’即是随心所欲”，这两种关于自由的观点：前者是( )的观点，后者是( )的观点。","options":{"A":"唯物辩证法/唯意志论","B":"机械唯物主义/唯心主义","C":"历史唯心主义/历史唯物主义","D":"主观唯心主义/唯物辩证法"},"answer":"A"},{"year":2016,"no":3,"type":"单选","stem":"某资本家100万元创办企业从事生产，60万元用于固定资本，以购买机器设备等，40万元用于流动资本，以购买原材料和劳动力等(其中购买劳动力支付了10万元)。一轮生产结束后，该企业的总资本达到了120万元。那么该企业的剩余价值为","options":{"A":"20%","B":"50%","C":"200%","D":"100%"},"answer":"D"},{"year":2016,"no":4,"type":"单选","stem":"20世纪70年代以来，西方资本主义国家的金融资本急剧膨胀，这一方面促进了资本主义的发展，另一方面也造成了经济过度虚拟化，致使金融危机频繁发生。西方资本主义金融资本快速发展壮大的重要制度条件是","options":{"A":"金融自由化与金融创新","B":"技术创新与大力发展互联网金融","C":"去工业化与大力发展现代服务业","D":"全面私有化与放松金融监管"},"answer":"A"},{"year":2016,"no":5,"type":"单选","stem":"毛泽东思想和中国特色社会主义理论体系是马克思主义中国化的两大理论成果，贯穿这两大理论成果始终，并体现在两大成果各个基本观点中的世界观和方法论的基础是","options":{"A":"群众路线","B":"独立自主","C":"改革创新","D":"实事求是"},"answer":"D"},{"year":2016,"no":6,"type":"单选","stem":"社会主义基本制度确立后，如何在中国这样一个经济文化比较落后的东方大国建设和巩固社会主义，是党面临的全新课题，1956年4月，毛泽东作了《论十大关系》的报告，在初步总结我国社会主义建设经验的基础上，从十个方面论述了我国社会主义建设需要重点把握的重大关系，“十大关系”所围绕的基本方针是","options":{"A":"集中力量向科学进军","B":"调动一切积极因素为社会主义事业服务","C":"正确处理人民内部矛盾","D":"既反保守又反冒进，在综合平衡中稳步前进"},"answer":"B"},{"year":2016,"no":7,"type":"单选","stem":"新世纪以来，我国经济和社会发展呈现出一系列新的阶段性特征，但是，这些新的阶段性特征的出现并没有改变我国仍处于社会主义初级阶段这一基本事实，这表明社会主义初级阶段是","options":{"A":"科学社会主义基本原则与时代精神相结合的过程","B":"长期性与阶段性统一的动态发展过程","C":"社会性质与发展程度的有机统一过程","D":"先进社会制度与落后社会生产的矛盾过程"},"answer":"B"},{"year":2016,"no":8,"type":"单选","stem":"西藏自治区成立五十年来，通过实行民族区域自治制度，从落后走向进步、从贫穷走向富裕、从封闭走向开放，社会制度实现了历史性的跨越，今天的西藏，社会稳定、经济发展、民生改善、生态向好，各方面成绩卓越，实践证明，民族区域自治制度是适合民族地区特点，具有中国特色的一项基本政治制度，民族区域自治的核心是","options":{"A":"党凝聚力量、增进共识","B":"实现各民族平等、团结、合作和共同繁荣","C":"保障少数民族当家作主、管理本民族本地方事务的权利","D":"汉族离不开少数民族，少数民族离不开汉族"},"answer":"C"},{"year":2016,"no":9,"type":"单选","stem":"1840年鸦片战争以后，中国遭受西方列强“坚船利炮”的欺凌不断加强，中华民族面临生死存亡的形势日益严峻，中国“睡狮”在西方列强的隆隆炮声中逐渐苏醒，中国人民的民族意识开始普遍觉醒的重大事件是","options":{"A":"日本全面侵略战争","B":"中日甲午战争","C":"八国联军侵华战争","D":"中法战争"},"answer":"B"},{"year":2016,"no":10,"type":"单选","stem":"1843年，魏源编成《海国图志》。他在书中写道：“是书何以作?曰：为以夷攻夷而作，为以夷款夷而作，为师夷长技以制夷而作。”魏源所说的夷之“长技”主要是指西方的","options":{"A":"宗教和思想文化","B":"教育和人才培养","C":"军事和科学技术","D":"民主和政治制度"},"answer":"C"},{"year":2016,"no":11,"type":"单选","stem":"抗日战争是一场全民族反抗外敌入侵的正义战争。抗战初期，在华北战场上规模最大，最激烈的一次战役，也是国共两党军队合作抗日、配合最好的一次战役是","options":{"A":"台儿庄战役","B":"长城战役","C":"平津会战","D":"忻口会战"},"answer":"D"},{"year":2016,"no":12,"type":"单选","stem":"1946年5月4日，中国中央发出《关于清算、减租及土地问题的指示》(史称《五四指示》)，决定将党在抗日战争时期实行的减租减息政策改变为","options":{"A":"“保存富农经济”的政策","B":"“地主不分田，富农分坏田”的政策","C":"“耕者有其田”的政策","D":"“没收一切土地”的政策"},"answer":"C"},{"year":2016,"no":13,"type":"单选","stem":"爱国主义在不同的历史时期和文化背景有着不同的内涵和特点。在新民主主义革命时期，爱国主义主要表现为致力于推翻帝国主义封建主义和官僚资本主义的反动统治。把黑暗的旧中国改造成光明的新中国。在现阶段，爱国主义主要表现为心系国家的前途和命运。献身于社会主义现代化事业，献身于祖国统一大业。这表明","options":{"A":"爱国主义是主观的、现实的","B":"爱国主义是历史的、具体的","C":"爱国主义是客观的、抽象的","D":"爱国主义是客观的、具体的"},"answer":"B"},{"year":2016,"no":14,"type":"单选","stem":"我国宪法将“国家尊重和保障人权”定为一项基本原则。法律的重要使命就是充分尊重和保障人权，人权的法律保障包括宪法保障、立法保障、行政保护和司法保障。其中，宪法保障是","options":{"A":"人权保障的最后防线","B":"人权保障的重要条件","C":"人权保障的关键环节","D":"人权保障的前提和基础"},"answer":"D"},{"year":2016,"no":15,"type":"单选","stem":"2015年10月26日至29日，中国共产党第十八届中央委员会第五次全体会议在北京举行。全会审议通过了","options":{"A":"《中共中央关于全面推进依法治国若干重大问题的决定》","B":"《中共中央关于建立社会主义市场经济体制若干问题的决定》","C":"《中共中央关于制定国民经济和社会发展第十三个五年规划的建议》","D":"《中共中央关于全面深化改革若干重大问题的决定》"},"answer":"C"},{"year":2016,"no":16,"type":"单选","stem":"自2015年初开始，欧洲遭受了二战以来规模最大的难民危机。导致难民数量增长的根本原因在于","options":{"A":"极端组织“伊斯兰国”疯狂驱逐当地民众","B":"中东地区战乱、冲突和动荡加剧","C":"美国等发达国家无力接收大量难民","D":"欧盟在难民问题上没有形成共同的应对策略"},"answer":"B"},{"year":2016,"no":17,"type":"多选","stem":"显微摄影是一门使用照相拍摄显微镜下一般用肉眼无法看清的标本的技术。肉眼中千篇一律的细沙，在显微镜下，却是“一沙一世界”，有的晶莹剔透像宝石，有的金黄酥脆像饼干，即使是司空见惯的柴米油盐，在显微镜下也会展现神奇而充满魅力的另一面。显微镜下的“一沙一世界”表明","options":{"A":"任何事物都具有无限多样的属性","B":"事物的本质随着人们的认识变化而改变","C":"人们能够透过对个别事物的认识而达到对世界整体的把握","D":"人们可以通过制造和使用工具日益深化对客观世界的认识"},"answer":"ACD"},{"year":2016,"no":18,"type":"多选","stem":"唐朝诗人张若虚《春江花月夜》中，“人生代代无穷已，江月年年只相似”两句诗蕴含着时间一维性的哲理，下列诗句中蕴含相同哲理的是","options":{"A":"闲云潭影日悠悠，物换星移几度秋","B":"花开堪折直须折，莫待无花空折枝","C":"黑发不知勤学早，白首方悔读书迟","D":"溪云初起日沉阁，山雨欲来风满楼"},"answer":"ABC"},{"year":2016,"no":19,"type":"多选","stem":"马克思说：“一切现实的危机的最终原因始终是：群众贫穷和群众的消费受到限制，而与此相对立，资本主义生产却竭力发展生产力，好像只有社会的绝对的消费能力才是生产力发展的界限。”这段论述表明","options":{"A":"社会的绝对的消费能力导致了经济危机的发生","B":"经济危机的发生根本上在于资本主义的基本矛盾","C":"经济危机的发生与群众的贫穷及其消费能力受到限制有关","D":"资本积累与无限大生产也是经济危机发生的原因"},"answer":"BCD"},{"year":2016,"no":20,"type":"多选","stem":"20世纪80年代，随着冷战的结束，分割的世界经济体系也随之被打破，技术、资产、商品信息真正完成了全球范围的活动，各国之间的经济联系日益密切，相互合作和依存大大加强，世界进入到经济全球化迅猛发展的新时代。促进经济全球化迅猛发展的因素有","options":{"A":"各国经济体制变革给出的有利制度条件","B":"出现了适宜于全球化的企业经营形式","C":"企业不断进行适宜于全球化技术创新与管理创新","D":"科学技术的进步和生产力快速发展"},"answer":"ABCD"},{"year":2016,"no":21,"type":"多选","stem":"1516年，英国人托马斯·莫尔发表了《乌托邦》一书，标志着空想社会主义的诞生。1848年，马克思恩格斯发表了《共产党宣言》，标志着科学社会主义的产生，社会主义实现了从空想到科学的历史性飞跃。科学社会主义超越空想社会主义之处在于","options":{"A":"找到了实现理想社会的现实道路","B":"对未来社会进行了细致的描绘","C":"揭示了资本主义必然灭亡的经济根源","D":"对资本主义进行了无情的批判"},"answer":"AC"},{"year":2016,"no":22,"type":"多选","stem":"2015年10月16日，中国铁路总公司牵头组成的中国企业联合体，与印度尼西亚维卡公司牵头的印尼国企联合体正式签署组建中印尼合资公司协议，该公司将负责印度尼西亚雅加达至万隆高速铁路项目的建设和运营。中国高铁走出国门，走向世界。表明我国","options":{"A":"参与国际竞争能力明显增强","B":"自主创新能力显著提高","C":"传统产业结构调整得到根本性改变","D":"国际投资合作水平日益提升"},"answer":"ABD"},{"year":2016,"no":23,"type":"多选","stem":"在全面深化改革中，我国提出了一系列放活民间投资的普惠政策，如保障民间投资在电网、电信、铁路等非竞争性领域的参与力度等。实施这些政策的目的是","options":{"A":"保证各种所有制经济依法平等使用生产要素","B":"鼓励所有民企建立现代企业制度","C":"允许各种所有制经济实行企业员工持股","D":"保证各种所有制经济公开公平公正参与市场竞争"},"answer":"AD"},{"year":2016,"no":24,"type":"多选","stem":"改革开放以来，党和国家实施大规模扶贫开发，使7亿农村贫困人口摆脱贫困，但直到2014年末，仍有7017万农村贫困人口。农村贫困人口脱贫是全面建设小康社会最艰巨的任务，为打赢脱贫攻坚战，党的十八届五中全会提出了精准扶贫、精准脱贫的基本方略，实施这一方略的主要举措有","options":{"A":"产业扶持","B":"转移就业","C":"社保政策兜底","D":"易地搬迁"},"answer":"ABCD"},{"year":2016,"no":25,"type":"多选","stem":"从2013年3月到2015年7月，李克强总理主持召开了101次国务院常务会议，其中有46次会议部署简政放权，取消和下放了800多项行政审批事项，他还用“大道至简，有权不可任性”“用政府权力的‘减法’换取市场活力的‘乘法’”等生动深刻的话语回应了公众对简政放权的期待。简政放权旨在","options":{"A":"处理好政府与市场的关系，加快完善社会主义市场经济体制","B":"减少审批环节，降低市场交易成本","C":"提高政府治理能力和治理水平","D":"激发市场主体内在活力和社会创造力"},"answer":"ABCD"},{"year":2016,"no":26,"type":"多选","stem":"2015年召开的中央统战工作会议强调，我们党所处的历史方位，所面临的国内外形势，所肩负的
