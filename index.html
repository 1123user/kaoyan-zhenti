使命任务发生了重大变化。越是变化大，越是要把统一战线发展好，把统战工作开展好，统一战线作为党的一项长期方针，决不能动摇，中国共产党之所以高度重视统战工作，因为统一战线是","options":{"A":"夺取革命、建设和改革事业胜利的重要法宝","B":"中国共产党的一大政治优势","C":"实现中华民族伟大复兴中国梦的重要法宝","D":"人民当家作主的根本保证"},"answer":"ABC"},{"year":2016,"no":27,"type":"多选","stem":"1898年的“百日维新”如昙花一现只经历103天就夭折了。谭嗣同在慷慨就义前仰天长叹：“有心杀贼，无力回天。”维新派“无力回天”的原因主要是：","options":{"A":"他们提倡全面学习“西学”，彻底否定“中学”","B":"他们遭到了以慈禧太后为首的强大的守旧势力的反击和镇压","C":"他们不敢触动封建主义的经济基础","D":"他们惧怕人民群众，把改革的全部希望寄托在一个没有实权的皇帝身上"},"answer":"BCD"},{"year":2016,"no":28,"type":"多选","stem":"1915年陈独秀在上海创办了《青年杂志》，吹响了新文化运动的号角，新文化运动高举民主科学两面大旗，向封建主义思想发动了前所未有的冲击，新文化主义历史意义( )","options":{"A":"是中国历史上一次前所未有的启蒙运动","B":"为马克思主义在中国传播创造有利条件","C":"社会上掀起一股思想解放浪潮","D":"彻底否定孔学历史作用"},"answer":"ABC"},{"year":2016,"no":29,"type":"多选","stem":"1992年初，在关乎中国改革开放和社会主义现代化建设前途命运的关键时刻，邓小平在视察武昌、深圳、珠海、上海等地时，发表了重要谈话。谈话的主要内容有：","options":{"A":"革命是解放生产力，改革也是解放生产力","B":"不坚持社会主义，不改革开放，不发展经济，不改善人民生活，只能是死路一条","C":"走社会主义道路，就是要逐步实现共同富裕","D":"计划多一点还是市场多一点，不是社会主义与资本主义的本质区别"},"answer":"ABCD"},{"year":2016,"no":30,"type":"多选","stem":"我国在建设社会主义法治国家的道路上不断探索，继2011年宣布中国特色社会主义法律体系已经形成以后，2014年又提出“建设中国特色社会主义法治体系”的目标。从“法律体系”到“法治体系”的变化体现在","options":{"A":"法治体系不仅有法律规范体系，还包括法治实施体系、法治监督体系、法治保障体系和党内法规体系","B":"法治体系强调科学立法、严格执法、公正司法、全民守法","C":"法治体系既要有法律的制度，也要保证法律的落实","D":"法治体系不仅仅是静态的法律文本，而且也是动态的法的实现过程"},"answer":"ABCD"},{"year":2016,"no":31,"type":"多选","stem":"法律权利和法律义务的关系，就像一枚硬币的两面，密不可分。二者之间关系的正确表述是","options":{"A":"法律权利与法律义务是相互依存的关系","B":"法律权利与法律义务是目的与手段的关系","C":"法律权利与法律义务具有顺序性","D":"法律权利与法律义务具有二重性"},"answer":"ABD"},{"year":2016,"no":32,"type":"多选","stem":"2015年11月7日，中共中央总书记、国家主席习近平同台湾地区领导人马英九在新加坡会面，这是1949年以来两岸领导人的首次会面，翻开了两岸关系历史性的一页，习近平就携手巩固两岸关系和平发展大格局、让中华民族子孙后代共享美好未来提出的意见是()","options":{"A":"坚持两岸共同政治基础不动摇","B":"坚持巩固深化两岸关系和平发展","C":"坚持为两岸同胞多谋福祉","D":"坚持同心实现中华民族伟大复兴"},"answer":"ABCD"},{"year":2016,"no":33,"type":"多选","stem":"2015年11月30日，国际货币基金组织执行董事会批准人民币加入特别提款权(SDR)货币篮子，新的货币篮子将于2016年10月1日正式生效。人民币成为除美元、欧元、日元和英镑之外“入篮”的第五种货币。世界货币秩序16年来第一次发生改变。人民币“入篮”对世界经济的重大意义主要在于","options":{"A":"有助于增强SDR的代表性和吸引力，完善现行国际货币体系","B":"中国的经济地位得到国际认可，全球经济格局发生积极变化","C":"人民币短期内将成为在全球金融市场上使用水平最高的货币","D":"有助于维护全球金融稳定和完善全球经济治理"},"answer":"ABD"},{"year":2016,"no":34,"type":"分析","stem":"结合材料回答问题材料1 要着力服务全面建成小康社会、全面深化改革、全面依法治国、全面从严治党的战略布局。“四个全面”的战略布局是从我国发展现实需要中得出来的，从人民群众的热切期待中得出来的，也是为推动解决我们面临的突出矛盾和问题提出来的。 摘自习近平《同党外人士共迎新春时的讲话》(2015年2月11日) 材料2 辩证唯物主义是中国共产党人的世界观和方法论，我们党要团结带领人民协调推进全面建成小康社会、全面深化改革、全面依法治国、全面从严治党，实现“两个一百年”奋斗目标，实现中华民族伟大复兴的中国梦，必须不断接受马克思主义哲学智慧的滋养，更加自觉地坚持和运用辩证唯物主义世界观和方法论，增强辩证思维、战略思维能力，努力提高解决我国改革发展基本问题的本领。 摘自习近平《在十八届中央政治局第二十次集体学习时的讲话》(2015年1月23日) 材料3 全面建成小康社会是党的十八大提出来的，它是中党的十六大、十七大全面建设小康社会目标任务的基础上发展而来。他们之间虽然只有一字之差但内涵却发生了深刻的变化，外延大大拓展了。全面建设小康社会是正在进行时，全面建成小康社会是将来完成时。全面深化改革是党的十八届三中全会所确定的主题，是三中全会对我国改革作出的战略部署。全面依法治国是党的十八届四中全会所确定的主题，是四中全会对我国法制建设提出的战略任务。全面从严治党是党的群众路线教育实践活动总结大会上，习近平总书记对教育实践活动以及对党的十八大以来党风廉政建设和反腐败斗争，党的各项工作所取得的成效，获得的经验，形成的成果进行的概括和总结，又是对今后党的建设进一步提出的新要求。 “四个全面”即是重大的战略布局，也是治国理政的重要战略思想，从哲学的高度来讲，“四个全面”是一个过程，不仅是因为它的提出而和形成时一个过程，而是它的协调推进也将是一个过程。摘编自《光明日报》(2015年4月1日) (1) 从认识的本质及其发展规律的视角，分析为什么说“四个全面”是一个过程?5分 (2) “四个全面”重要战略思想体现了怎样的辩证思维?5分","options":{},"answer":""},{"year":2016,"no":35,"type":"分析","stem":"结合材料回答问题 2015年1月1日，新环保法正式实施，2月底，环保部相关部门公开约谈L市主要领导，作为新环保法实施后第一个被约谈城市，L市的污染经媒体曝光后引发全国关注，重压之下，L市对57家污染大户紧急停产整顿，对412家重点污染企业限期限产智力~~~~铁腕治污立竿见影，PM2.5、PM10、二氧化碳、二氧化氮指标大幅下降，但环保风暴很快遭遇新的困境，L市经济基础薄弱，改革开放后，为加快发展，招商时铺设了一些“绿色通道”，不少企业缺乏环评手续。此次停产整顿，部分企业因无环评手续一时难以复产，企业关停后，工人失业又带来了新的社会问题，潜在的金融风险也渐成燃眉之势，环保风暴遇到现实利益的的严峻挑战。 对于L市力治污痛下猛药的做法，中央电视台、《人民日报》、《经济日报》、新华网、人民网、光明网、环保部官网及不少地方媒体纷纷跟进报道发表评论，众多网友也争相发声，且看一些比较有代表性的观点： A：用环境污染换来的经济发展，早晚得淘汰，重疾要猛药，现在天蓝水绿多好啊! B：一个小地主的命，非要过比尔盖茨的生活，怎么可能! C:政府要达标，企业要生存，百姓要环境，非常难!…决心不等于蛮干，环保和经济的平衡点找不好，再好的决定也会成为二次伤害。 D:休克式治霾太惊悚了，在如今经济持续低迷的背景下人为制造大面积失业和债务危机，简直是生态大跃进! E：铁腕治污力度值得赞赏，但有些问题可以讨论，意识到方向有问题，是急刹车还是有个滑行过程?L市这次是狠狠踩了一脚刹车，车停了，但乘客人仰马翻，有的摔得很重，有的勉强站着，还不知能站多久。 F：被关停企业满满的全是委屈，责任全部推给外界，以受害者姿态对自己不堪回首的过却只字不提，今天的L市，是很多历史账严重的城市经济转型时期的一个缩影，历史账总是要还的。 一场空前的铁腕治污风暴，承受着截然不同的评价，一时间，L市又因治污被推上风口浪尖，但L市以前所未有的决心，直面大气污染这场艰难的硬仗，用环保倒逼企业转型升级，上千万市民看到了山青水绿，享受着洁净的空气。9月16日，环保部接触L市大气污染问题挂牌整办。 既让环境好转，又让经济同时得到发展，这可能是中国环境治理持续深入后各地亟需作答的选择题。 摘编自央视网《2015年7月3日》 新华网《2015年7月3日》 人民网《2015年7月6日、11月3日》 (1)从“铁腕治污”引发广泛讨论看，我们应如何认识发展同环境治理的关系?(6分) (2)“铁腕治污”及其引发的讨论对于推动我国生态文明制度建设有何启示?(4分)","options":{},"answer":""},{"year":2016,"no":36,"type":"分析","stem":"结合材料回答问题： 材料1 1944年正值李自成领导的农民起义军进入北京推翻明王朝300周年。郭沫若毅然放下正在进行的先秦思想史研究，撰写《甲申三百年祭》。在这篇文章中，郭沫若深刻总结了李自成农民起义成功建立起大顺朝但旋即失败的历史教训。从3月19日起，这篇长文在重庆《新华日报》全文连载。文章发表后，引起社会各界的广泛关注。仅隔20天，毛泽东就在《学习和时局》的报告中指出;“我党历史上曾经有过几次表现了大的骄傲，都是吃了亏的……近日我们印了郭沫若论李自成的文章，也是叫同志们引以鉴戒，不要重犯胜利时骄傲的错误”。11月21日，毛泽东复信郭沫若：“你们的《甲申三百年祭》，我们把它当做整风文件看待。小胜即骄傲，大胜更骄傲，一次又一次吃亏，如何避免此种毛病，实在值得注意。” 摘编自《<甲申三百年祭>风雨六十年》人民出版社2005年版材料2 1949年3月23日，毛泽东率中共中央机关离开西柏坡前往北平(北京)。临行前，他对周围的人说：“同志们，我们就要进北平了。我们进北平，可不是李自成进北平，他们进了北平就变了。我们共产党人要继续革命，建设社会主义，实现共产主义。”他兴奋的对周恩来说：”今天是进京“ 赶考“嘛”。周恩来说：”我们都能考试及格，不要退回来”。毛泽东说：”退回来就失败了，我们决不当李自成，我们都希望考个好成绩。” 摘编自金冲及主编《毛泽东传1893-1949》中央文献出版社1993年版材料3:2013年7月11日至12日，习近平总书记来到革命圣地西柏坡，在同县乡村干部和群众座谈时指出：当年党中央离开西柏坡时，毛泽东同志说是“进京赶考”，六十多年过去了，我们取得了巨大进步，中国人民站起来了，富起来了，但我们党要带领人民实现全面建设小康社会的目标，不断坚持和发展中国特色社会主义，就是这场考试的继续。所有领导干部和全体党员要继续把人民对我们党的“考试”，把我们党正在经受和将要经受各种考验的“考试”，把我们党正在经受和将要经受各种考验的“考试”考好，努力交出优异的答卷。“ 摘编自《习近平关于实现中华民族伟大复兴的中国梦论述摘编》中央文献出版社2013年版 (1)1949年春，为什么毛泽东把离开西柏坡前往北平比作“赶考”?(5分) (2)如何让理解习近平所说的“党面临的“赶考”远未结束”?(5分)","options":{},"answer":""},{"year":2016,"no":37,"type":"分析","stem":"结合材料回答问题： 材料1 中华民族历来有重家风，重家教，守家规的传统，好家风的事例可谓不胜枚举。 宋代的司马光，在给儿子司马康的家训—《训俭示康》中说道：“平生衣取蔽寒，食取充腹，亦不敢服垢弊以矫俗于名，但顺吾性而已，众人皆以奢靡为荣，吾心独以俭表为美。”司马光教育儿子，要以俭素为美，不要以奢靡为荣，说的是个人志向，批评的是奢靡风气，令人信服，在他的言传身教下，家族后人也都以贤德立身。 清代的郑板桥，自幼家贫，为官以后生活条件虽然得以改善，但从未将所得俸银留作自家使用，而是分给亲友，乡邻。他在一封家信中写道：“每一念及，真含泪欲落也，汝持俸钱南归，可挨家比户，逐一散给。”他还开列了族人及亲友、同窗的具体名单，将俸银全部分完。郑板桥这种乐善好施的行为直到晚年都没有改变，在他的周围产生了广泛的影响，更得到后世的赞赏。 周恩来一向视侄辈如己出，对他们要求非常严格，并约定了十条家规，如不能丢下工作专程来京看望他，只能在出差路过时才可以来，进京来看望他一律住招待所，住宿费由他支付，一律到机关食堂排队就餐，不许动用公车，在任何场合都不能说出与自己的关系，不谋私利，不搞特殊化等，周恩来定的家规，他自己做到了，他的侄辈也做到了。 材料2 家风是一个人精神成长的重要源头，有什么样的家风，往往就有什么样的做人做事的态度，为人处世的风格。从一人的举手投足到行为处事，能折射出好家风对他的影响，会让人看到父母长辈在他成长中精心抚育的印记，可以说，好家风的传承过程，同样也是延续优良文明基因的过程。 随着社会的发展，家风也要与时俱进，将不利于文明进步不利于社会和谐的因素剔除，不断被赋予新的内容。鉴于此，国家通过倡导家风建设，培育和践行社会主义核心价值观，给社会注入暖暖的正能量。 正如习近平总书记所说：“家庭是社会的基本细胞，是人生的第一所学校，无论时代发生多大变化，无论生活格局发生多大变化，我们都要重视家庭建设，注重家庭、注重家教、注重家风”。家风这个源头清澈了，更有利于好的党风、政风、民风和社风的形成。 摘编自《光明日报》(2014年3月27日、12月25日，2015年2月18日等) (1)为什么好家风的传承过程，同样也是延续优良文明基因的过程?(5分) (2)如何通过好家风的传承弘扬社会主义核心价值观?(5分)","options":{},"answer":""},{"year":2016,"no":38,"type":"分析","stem":"阅读下列材料材料1 中国人民抗日战争和反法西斯战争是正义和邪恶，光明和黑暗，进步和反动的大决战，在那场惨烈的战争中，中国人民抗日战争开始时间最早，持续时间最长。中国人民以巨大民族牺牲支撑起了世界反法西斯的东方主战场，为世界反法西斯战争胜利作出了重大贡献。中国人民抗日战争也得到了国际社会广泛支持，中国人民将永远铭记各国人民为中国抗战胜利作出的贡献! 战争是一面镜子，能够让人民更好认识和平的珍贵。今天，和平与发展已经成为时代主题，但世界仍很不太平，战争的达摩克利斯之剑仍然悬在人类头上，我们要以史为鉴，坚定维护和平的决心。 为了和平，我们要牢固树立人类命运共同体意识。偏见和歧视、仇恨和战争，只会带来灾难和痛苦，相互尊重、平等相处、和平发展、共同繁荣。才是人间正道。世界各国应该共同维护以联合国宪章宗旨和原则为核心的国际秩序和国际体系，积极构建以合作共赢为核心的新型国际关系，共同推进世界和平与发展的崇高事业。 摘自习近平：《在纪念中国人民抗日战争暨世界反法西斯战争胜利70周年大会上的讲话》(2015年9月3日) 材料2 当习近平主席带着对世界前途命运的思考走上联合国讲台的时候，充满生机与希望的中国已经站在世界舞台的中央，在第七十届联合国大会一般性辩论会场，发展壮大的中国对全人类福祉的担当，赢得世界赞誉与支持。 开创未来，离不开对历史的敬畏。70年前，联合国诞生。奠定现代国际秩序基石，确立了当代国际关系基本准则的联合国宪章，寄寓着先贤对和平的期盼，描绘出了战后世界的基本轮廓。中国作为世界反法西斯战争伟大胜利的主要贡献者之一，成为联合国创始会员国和安理会常任理事国。 今天，当世界格局加快演变，各国互相依存、休戚与共成为世界的基本特征时，人类社会又该以怎样的思考和行动跟上历史的步伐?面对这个根本性问题，习近平主席提出打造人类命运共同体。这一主张在21世纪的今天，继承了联合国宪章精神，符合国际宪法普遍需要，实现了对传统国际关系的超越与创新。 摘选自《人民日报》(2015年9月3日) (1)分析当今世界各国“共同维护以联合国宪章宗旨和原则为核心的国际秩序和国际体系”的重要性所在。(5分) (2)如何理解“打造人类命运共同体”的主张“继承了联合国宪章精神，符合国际社会的普遍需要”?(5分)","options":{},"answer":""},{"year":2015,"no":1,"type":"单选","stem":"院士袁隆平曾结合自己的科研经历，语重心长地对年轻人说：“书本知识非常重要，电脑技术也很重要，但是书本电脑里种不出水稻来，只有在田里才能种出水稻来。”这表明：","options":{"A":"实践水平的提高有赖于认识水平的提高","B":"实践是人类认识的基础和来源","C":"理论对实践的指导作用没有正确与错误之分","D":"由实践到认识的第一次飞跃比认识到实践的第二次飞跃更加重要"},"answer":"B"},{"year":2015,"no":2,"type":"单选","stem":"社会意识，社会意识是社会存在的反映。社会意识具有相对独立性，即它在反映社会存在的同时，还有自己特有的发展形式和规律。社会意识相对独立性最突出的表现是：","options":{"A":"社会意识内部各种形式之间的相互作用和影响","B":"社会意识与社会存在发展的不完全同步性","C":"社会意识各种形式各自具有其历史继承性","D":"社会意识对社会存在具有能动的反作用"},"answer":"D"},{"year":2015,"no":3,"type":"单选","stem":"第二次世界大战以后，资本主义国家经历了第三次科技革命，机器大工业发展到自动化阶段。智能化工厂创造出了较高的生产效率，显露出巨大的竞争力。企业在“机器换人”中取得了一定的经济效益。这意味着率先使用机器人的个别企业：","options":{"A":"剩余价值来源的改变","B":"资本技术构成的提高","C":"所生产商品价值提高","D":"获得更多的社会平均利润"},"answer":"B"},{"year":2015,"no":4,"type":"单选","stem":"马克思主义政党是科学社会主义与工人运动相结合的产物，是工人阶级的先锋队，这表明：","options":{"A":"马克思主义政党以工人阶级为基础","B":"马克思主义政党即工人阶级本身","C":"马克思主义政党的阶级性是其先进性的根本前提","D":"马克思主义政党的先进性决定了工人阶级的先进性"},"answer":"A"},{"year":2015,"no":5,"type":"单选","stem":"新中国的工业化是在苏联的影响下起步的。走中国工业化道路，是中国共产党初步探索我国社会主义建设道路的一个重要思想。当时所讲的工业化道路问题，主要是指：","options":{"A":"经济建设和国防建设的关系问题","B":"中央和地方的关系问题","C":"沿海工业和内地工业的关系问题","D":"重工业、轻工业和农业的发展关系问题"},"answer":"D"},{"year":2015,"no":6,"type":"单选","stem":"十三大召开前夕，邓小平强调指出：“社会主义本身是共产主义的初级阶段，而我们中国又处在社会主义的初级阶段，就是不发达的阶段。一切都要从这个实际出发，根据这个实际来制定规划。”这一论述：","options":{"A":"首次提出了社会主义初级阶段概念","B":"首次系统阐述了社会主义初级阶段理论","C":"首次把社会主义初级阶段作为事关全局的基本国情加以把握","D":"首次对社会主义发展阶段进行了划分"},"answer":"C"},{"year":2015,"no":7,"type":"单选","stem":"城镇化是现代化的必由之路，解决好人的问题是推进城镇化的关键。当前，我国实现城镇化的首要任务是：","options":{"A":"推进农业转移人口市民化","B":"使土地的城镇化优于人口的城镇化","C":"促进农村劳动力向非农产业转移","D":"实现“人的无差别发展”"},"answer":"A"},{"year":2015,"no":8,"type":"单选","stem":"1997年7月1日，中国政府对香港恢复行使主权，香港特别行政区成立，香港特别行政区基本法开始实施。香港进入“一国两制”、“港人治港”、高度自治的历史新纪元。香港特别行政区的高度自治权是:","options":{"A":"特别行政区的完全自治","B":"中央授权之外的剩余权力","C":"特别行政区本身固有的权力","D":"中央授予的地方事务管理权"},"answer":"D"},{"year":2015,"no":9,"type":"单选","stem":"近代中国，一些爱国人士提出过工业救国、教育救国、科学救国等主张，并为此进行过努力，但这些主张并不能从根本上给濒临危亡的中国指明正确的出路，这是因为他们没有认识到 :","options":{"A":"争取民族独立和人民解放是实现民族复兴的前提","B":"中国已经被卷入世界资本主义经济体系和世界市场中","C":"中国是一个经济政治发展不平衡的国家","D":"资本主义制度已经过时"},"answer":"A"},{"year":2015,"no":10,"type":"单选","stem":"毛泽东在谈到辛亥革命时指出,辛亥革命有它胜利的地方,也有它失败的地方,“辛亥革命把皇帝赶跑,这不是胜利了吗?说它失败,是说辛亥革命只把一个皇帝赶跑。”毛泽东这里所说的“只把一个皇帝赶跑”是指 :","options":{"A":"没有推翻帝制","B":"反帝反封建的革命任务没有完成","C":"孙中山没有继续革命","D":"袁世凯窃取了胜利果实"},"answer":"B"},{"year":2015,"no":11,"type":"单选","stem":"1914年至1918年的第一次世界大战,是一场空前残酷的大屠杀.它改变了世界政治的格局,也改变了各帝国主义国家在中国的利益格局,对中国产生了巨大的影响。大战使中国的先进分子 :","options":{"A":"对中国传统文化产生怀疑","B":"对西方资产阶级民主主义产生怀疑","C":"认识到工人阶级的重要作用","D":"认识到必须优先改造国民性"},"answer":"B"},{"year":2015,"no":12,"type":"单选","stem":"1929年12月下旬，红四军党的第九次代表大会在福建上杭县古田村召开，会议总结了红军创立以来的经验，通过了著名的古田会议决议，决议的中心思想是 :","options":{"A":"中国共产党必须服从共产国际的领导","B":"武装斗争是中国革命的主要形式","C":"在农村根据地广泛开展土地革命","D":"用无产阶级思想进行军队和党的建设"},"answer":"D"},{"year":2015,"no":13,"type":"单选","stem":"习近平在欧美同学会成立100周年庆祝大会上的讲话中说：“希望广大留学人员继承和发扬留学报国的光荣传统，做爱国主义的坚守者和传播者，秉持‘先天下之忧而忧，后天下之乐而乐’的人生理想，始终把国家富强、民族振兴、人民幸福作为努力志向，自觉使个人成功的果实结在爱国主义这颗常青树上。”个人成功的果实之所以应该结在爱国主义这棵常青树上，是因为爱国主义是:","options":{"A":"个人实现人生价值的力量源泉","B":"人人实现人生价值的直接条件","C":"个人成功的根本保障","D":"个人成功的决定性因素"},"answer":"A"},{"year":2015,"no":14,"type":"单选","stem":"钱学森曾经说过：“我作为一名中国的科技工作者，活着的目的就是为人民服务。如果人民最后对我的一生所做的工作表示满意的话，那才是最高的奖赏。”这说明评价人生价值的根本尺度是 :","options":{"A":"个体在社会中的地位","B":"个体在社会中的影响","C":"个人对社会和他人的生存和发展的贡献","D":"个体从社会获得的满足尺度"},"answer":"C"},{"year":2015,"no":15,"type":"单选","stem":"2014年4月15日，中共中央总书记、中央国家安全委员会主席习近平主持召开中央国家安全委员会第一次会议并发表重要讲话，他强调，面对传统安全威胁与非传统安全威胁交织的局面，要准确把握国家安全形势变化新特点新形势，坚持:","options":{"A":"共同安全观","B":"亚洲安全观","C":"总体国家安全观","D":"地区集体安全观"},"answer":"C"},{"year":2015,"no":16,"type":"单选","stem":"近年来，中东地区局势持续动荡，恐怖主义、分离主义愈加猖獗，教派矛盾不断升级。尤其是极端恐怖势力于2014年6月29日宣布成立“伊斯兰国”（ISIS），并宣称将建立地跨西亚北非的“哈里发帝国”，对该地区的秩序造成了重大冲击，并且给国家的全球战略带来了影响，这种影响表现为美国 :","options":{"A":"“中东收缩”战略提上议程","B":"“和平演变”战略归于失败","C":"“北约东扩”战略被迫搁置","D":"“重返亚太”战略收到牵制"},"answer":"D"},{"year":2015,"no":17,"type":"多选","stem":"母质、气候、生物、地形、时间是土壤形成的五大关键成土因素。母质是土壤形成物质基础的初始无机养分的最初来源。气候导致矿物的风化和合成，有机质的形成和积累，土壤中物质的迁移，分解和合成。生物包括植物、动物和微生物等，是促进土壤发生发展最活跃的因素。地形可以使物质在地表进行再分配，使土壤及母质在接受光、热、水等条件方面发生差异。时间是阐明土壤形成发展的历史动态过程，母质、气候、生物和地形等对成土过程的作用随着时间延续而加强。土壤的生产过程说明 :","options":{"A":"事物总是作为过程而存在","B":"时间是物质运动的存在形式","C":"事物的发展总是呈现出线性上升的态势","D":"事物的产生是多重因素相互作用的结果"},"answer":"AD"},{"year":2015,"no":18,"type":"多选","stem":"平衡是事物发展的一种状态，小到体操中人在平衡木上的行走，杂技中的骑车走钢丝，独轮车表演，直升机在空中的悬停，大到人类的生存，地球的运转，天体的运行等等，都是保持平衡的一种状态，世间的万事万物，之所以能不停的运动、发展、前进，一个重要原因就在于保持了平衡，要使“平衡”成为人们的“大智慧”，就要 :","options":{"A":"精确把握事物的度","B":"准确掌握辩证否定的方式和方向","C":"善于协调事物内部各种因素的相互关系","D":"全面理解绝对运动和相对静止的辩证关系"},"answer":"ACD"},{"year":2015,"no":19,"type":"多选","stem":"马克思主义从必然性和偶然性的辩证统一中理解杰出人物的历史作用,认为 :","options":{"A":"杰出人物能够改变历史发展的基本方向","B":"杰出人物的历史作用受到一定历史条件的制约","C":"杰出人物历史作用的形成和发挥与其服务人民群众的意愿,密不可分","D":"杰出人物们因其智慧性格因素对社会进程发生影响"},"answer":"BCD"},{"year":2015,"no":20,"type":"多选","stem":"马克思指出:“资本主义积累不断地并且同它的能力和规模成比例地生产出相对的,即超过资本增殖的平均需要的,因而是过剩的或追加的工人人口。”“过剩的工人人口是积累或资本主义基础上的财富发展的必然产物,但是这种过剩人口反过来又成为资本主义积累的杠杆,甚至成为资本主义生产方式存在的一个条件.”上述论断表明 :","options":{"A":"资本主义积累必然导致工人人口的供给相对于资本的需要而过剩","B":"资本主义社会过剩人口之所以是相对的,是因为它不为资本价值增殖所需要","C":"资本主义生产周期性特征需要有相对过剩的人口规律与之相适应","D":"资本主义积累使得资本主义社会的人口失业规模呈现越来越大的趋势"},"answer":"ABCD"},{"year":2015,"no":21,"type":"多选","stem":"国家垄断资本主义是国家政权和私人垄断资本融合在一起的垄断资本主义。第二次世界大战结束以来,在国家垄断资本主义获得充分发展的同时,资本主义国家通过宏观调节和微观规制对生产、流通、分配和消费各个环节的干预也更加深入。其中,微观规制的类型主要有 :","options":{"A":"公众生活规制","B":"公共事业规制","C":"社会经济规制","D":"反托拉斯法"},"answer":"BCD"},{"year":2015,"no":22,"type":"多选","stem":"2014年5月22日,习近平在上海召开的外国专家座谈会上指出,“要实行更加开放的人才政策,不唯地域引进人才,不求所有开发人才,不拘一格用好人才。”当前,我们之所以比历史上任何时期都更加强调重视人才\\用好人才,是因为人才是 :","options":{"A":"国家竞争力的重要体现","B":"先进生产力的集中体现","C":"第一资源和国家战略资源","D":"推进中国特色社会主义事业的关键因素"},"answer":"ACD"},{"year":2015,"no":23,"type":"多选","stem":"到2012年底,我国仍在耕地上从事农业生产经营的农民家庭约1.9亿户，所经营的耕地面积占农村家庭承包耕地总面积的92.5%；仍实行由集体统一经营的村，组约有2000个；已发展起农业专业合作社68.9万个，入社成员5300多万户；各类农业产业化经营组织30余万个，带动的农户约1.18亿户；约有2556万亩耕地由企业租赁经营，上述现象表明在我国农村 :","options":{"A":"农业经营主体呈现多样化趋势","B":"土地的集体所有权性质已经发生变化","C":"家庭承包经营仍然是最基本的经营形式","D":"土地经营权的流转使农民失去了对土地的承包权"},"answer":"AC"},{"year":2015,"no":24,"type":"多选","stem":"与十一届全国人民代表大会相比，十二届人代会在代表结构与组成上，呈现“两升一降”的变化，来自一线的工人、农民代表401名，占代表总数的13.42%，提高了5.18个百分点；专业技术人员代表610名，占代表总数的20.42%，提高了1.2个百分点；党政领导干部代表1042名，占代表总数的34.88%，降低了6.93个百分点。提高基层人大代表特别是一线工人，农民，知识分子代表比例，降低党政领导干部代表比例，有利于 :","options":{"A":"推动人民群众最关心最直接最现实问题的解决","B":"调动基层群众参政议政的积极性与主动性","C":"保证人民群众直接参加国家管理","D":"更为充分地发挥全国人大的民意反映与监督职能"},"answer":"ABD"},{"year":2015,"no":25,"type":"多选","stem":"国家统计局发布的最新数据显示，2014年前三季度我国GDP增长为7.4%，其中第三季度增长为7.3%，创下了2009年一季度以来的新低。总体上看，虽然经济增长有所放缓，但国民经济继续运行在合理区间，稳中有进的态势没有变，今后一个时期经济保持平稳较快发展的可能性仍然较大。这是一种趋势性的变化，是经济到了新的发展阶段表现出来的一种新常态。我国经济新常态的主要特点是:","options":{"A":"经济增长速度从高速增长转为中高速增长","B":"中国经济对世界市场的需求减弱","C":"经济结构不断优化升级","D":"经济发展动力从要素驱动，投资驱动转向创新驱动"},"answer":"ACD"},{"year":2015,"no":26,"type":"多选","stem":"人类社会发展的历史表明，对一个民族，一个国家来说，最持久、最深层次的力量是全社会共同认可的核心价值观。面对世界范围思想文化交流交融交锋形势下价值观的新态势，面对改革开放和发展社会主义市场经济条件下思想意识多元多样多变的新特点，积极培育和践行社会主义核心价值观，有利于 :","options":{"A":"促进人的全面发展和引领社会全面进步","B":"巩固全党全国人民团结奋斗的共同思想基础","C":"巩固马克思主义在意识形态领域的指导地位","D":"集聚实现中华民族伟大复兴中国梦的强大正能量"},"answer":"ABCD"},{"year":2015,"no":27,"type":"多选","stem":"甲午，对中国人民和中华民族具有特殊含义，在我国近代史上也具有特殊含义。1894年7月，日本发动甲午战争，清朝在战争中战败。这场战争对中国的影响主要有：","options":{"A":"中国海关的行政权落入外国人手中","B":"中国人开始有了普遍的民族意识觉醒","C":"台湾被日本侵占","D":"帝国主义列强掀起瓜分中国的狂潮"},"answer":"BCD"},{"year":2015,"no":28,"type":"多选","stem":"1946年1月10日，政治协商会议在重庆开幕，出席会议的有国民党，共产党，民主同盟，青年党和无党派人士的代表38人。会议通过了宪法草案，政府组织案，国民大全案，和平建国纲领，军事问题案五项协议。按照协议规定建立的政治体制相当于英国、法国的议会制和内阁制，不是新民主主义性质的而且国民党在政府中占着明显的优势。对政协的上述协议，共产党赞同并决心严格履行，这是因为它有利于：","options":{"A":"推进民主政治的发展和进步","B":"打破国民党一党独裁的局面","C":"改变国共两党军事力量对比","D":"保障解放区政权的合法地位"},"answer":"ABD"},{"year":2015,"no":29,"type":"多选","stem":"1979年,针对当时存在的是否还要坚持毛泽东思想的问题，邓小平指出“有些同志说，我们只拥护‘正确的毛泽东思想’，而不是拥护错误的毛泽东思想。这种说法也是有错误的。”“这种说法”之所以错误，是因为 :","options":{"A":"没有把毛泽东与党的其他领导人对毛泽东思想的贡献区分开","B":"没有把毛泽东思想与有中国特色社会主义理论区分开","C":"没有把毛泽东思想与毛泽东的思想区分开","D":"没有把毛泽东晚年的错误与毛泽东思想的科学体系区分开"},"answer":"CD"},{"year":2015,"no":30,"type":"多选","stem":"个人品德是通过社会道德教育和个人自觉的道德修养所形成的稳定的心理状态和行为习惯。它是个体对某种道德要求认同和践履的结果，集中体现了道德认知、道德情感、道德意志和道德行为的内在统一，这表明个人品德是:","options":{"A":"个人行为的统一整体及知、情、意、行的综合体现","B":"在实践活动中表现出来的行为的稳定倾向","C":"在实践活动中锻炼而成的一种特殊品性","D":"偶然的、短暂的道德行为现象"},"answer":"ABC"},{"year":2015,"no":31,"type":"多选","stem":"1763年，老威廉·皮特在《论英国人个人居家安全的权利》的演讲中说：“即使最穷的人，在他的小屋里也能够对抗国王的权威。屋子可能很破旧，屋顶可能摇摇欲坠；风可以吹进这所房子，雨可以淋进这所房子，但是国王不能踏进这所房子，他的千军万马也不敢跨进这件破房子的门槛。”这段话后来被浓缩成“风能进，雨能进，国王不能进”。这凸显了权力与权利的关系是 :","options":{"A":"权力优先于权利","B":"权力决定权利","C":"权力应当以权利为界限","D":"权力必须受到权利的制约"},"answer":"CD"},{"year":2015,"no":32,"type":"多选","stem":"2014年2月27日，十二届全国人大常委会第七次会议通过决定，将9月3日确定为中国人民抗日战争胜利纪念日，将12月13日确定为南京大屠杀死难者国家公祭日，设立这两个纪念日：","options":{"A":"有助于向中国人民和世界各国人民传播历史事实的真相","B":"是对抗击日本帝国主义侵略付出巨大牺牲和作出巨大贡献的人们的敬重与缅怀","C":"彰显了中国作为反法西斯主要战场的伟大作用","D":"是对南京大屠杀中大量死难同胞的告慰和尊重"},"answer":"ABCD"},{"year":2015,"no":33,"type":"多选","stem":"2014年11月5日至11日，亚太经济合作组织（APEC）第二十二次领导人非正式会议在北京召开。这是一次开创性的历史盛会，硕果累累，其中，《北京反腐败宣言》的通过尤为引人注目。该《宣言》通过的意义在于，各成员国:","options":{"A":"加强了涉腐、涉案赃款跨境流动的信息共享","B":"将形成携手打击跨境腐败的网络","C":"杜绝了跨国腐败行为的发生","D":"达成了就追逃、追赃开展执法合作的重要共识"},"answer":"ABD"},{"year":2015,"no":34,"type":"分析","stem":"结合材料回答问题： 材料1 2014年11月19日，首届世界互联网大会在浙江乌镇召开，习近平总书记在致大会的贺词中指出，互联网真正让世界变成了地球村，让国际社会越来越成为你中有我、我中有你的命运共同体、李克强总理20日下午在杭州会见出席大会的中外代表并同他们座谈，他表示，互联网是人类最伟大的发明之一，改变了人类世界的空间轴、时间轴和思想维度。中国接入互联网20年来，已发展成为世界互联网大国，不仅培育起一个巨大市场，也促生了许多新技术、新产品、新业态、新模式，创造了上千万就业岗位，很多人特别是年轻人，大学生因此实现了事业梦，人生梦。 目前，全世界网民数量达到了30亿人，普及率达40%，全球范围内实现了网络互联、信息互通。即使是世界上最偏僻的一角，只要接入互联网，就接入了人类这个大家庭。同住地球村的“居民”，借助互联网的力量极大的拉近了距离，互联经济已经成为世界经济发展速度最快、潜力最大、合作最活跃的领域之一，形成了世界网络大市场；一个短小的视频通过全世界网民的点击，可以一夜之间成为全球流行文化的宠儿；提供高速的移动通信和无线宽带服务，几乎已是各国旅游“设施”的标配。 当然，互联网发展过程中也产生了一系类问题，如网络信息安全、网络犯罪等，甚至对国家主权、安全、发展利益形成了新的挑战。互联网到底是阿里巴巴的宝库，还是潘多拉的魔盒？这取决于“命运共同体”如何认真应对，谋求共治。从这样的视野来看，已走过20年岁月的中国互联网，站在了大有可为的新起点上。 摘编自《人民日报》（2014年11月21日） 材料2 中国互联网从1994年全功能接入国际互联网至今，实现了20年的高速发展，不仅在技术层面一再突破，而且带来了新的思维理念，有人把他概括为“互联网思维”。对何谓“互联网思维”目前还没有定论。然而，打破思维定势，主动革新自我是互联网思维不变的主题，意味着“便捷、互动、用户至上”等理念。这些理念让人们不断感受到互联网带来的变化与变革。 如果把沃尔玛等传统龙头企业比多大象，那么互联网上的小商户只能叫蚂蚁。数百万只蚂蚁聚合起来，吃掉大象并非没有可能。试想，如果没有互联网，任何一家传统商业企业要想把数百万个商家和近亿客户装进来是不可想象的。 既然去中心的互联网更有利于“蚂蚁”生存，“大象”要彻底摆脱危机，可能就要让自己某种程度上也变成“蚂蚁”，至少自身要具备“蚂蚁”的特性。道理很简单，在互联网环境下与灵活的“蚂蚁军团”作战，庞大的体量以及传统组织形式带来的大企业病，很可能让“大象”的优势转变为劣势。只有彻底改变基因，让“象”内部产生无数个热衷创业的“蚂蚁”，这仗才有的打，毕竟，和蚂蚁打仗，大象有力用不上，但更庞大、更强大的蚁群则成为最后的胜者。 摘编自《人民日报》（2014年5月5日、5月26日等） （1）联系自身实际，分析为什么“互联网到底是阿里巴巴的宝库，还是潘多拉的魔盒”取","options":{},"answer":""},{"year":2015,"no":35,"type":"分析","stem":"结合材料回答问题让大猫小猫都有路走计划经济时期全靠国家管理市场，市场边角被忽略，很多小商品没人去生产，有些新的市场需求也没人去注意。非公有制经济的特点是只要市场有需求，它就会去满足。要保证各种所有制经济依法平等使用生产要素，公平参与市场竞争，同等收到法律保护，就需要重视中小企业融资难的问题，经济学家成思危讲过这样一则寓言：著名科学家牛顿养了两只猫。一只大猫一只小猫。他在墙上开了两个洞，一个大洞。一个小洞，有人笑话他说，你还是大科学家呢，开一个洞就够了，小猫也可以走大洞嘛。牛顿说不对，如果两个猫同时要出去，那大洞肯定被大猫占住了，小猫就无路可走。要真正解决小微企业的问题，就要建立真正为小微企业服务的小型银行，让大银行服务大企业，小银行服务小企业。因为从商业角度说，大银行本身就嫌平爱富，嫌小爱大。小微企业市场风险很大，交易成本也高。跟大企业签一个1亿元的合同，相当于跟小企业签20个500万的合同。现在居民和企业手中有大量存款，而小微企业却贷不到款。这就需要一条通道，这条通道就是社区银行等中小银行。发展民营的、小型的金融机构有利于解决好小微企业的融资困难。大企业是我国经济的脊梁，小微企业是血肉。没有大企业国民经济站不起来，但是如果小微企业垮了，那国民经济不成了骨头架子了吗？十八届三中全会以来，国务院陆续出台了关于大力扶持小微企业健康发展的多项政策，国务院常务会议也多次强调要加快发展民营银行等中小金融机构，为小微企业减负添力。2014年11月，李克强总理在浙江考察时再次对民营银行长期致力于服务小微企业给与了充分肯定。为小微企业打开直接融资大门，是开创性的制度安排。一大批有巨大市场潜力的小微企业将会成长为支撑中国经济转型升级的参天大树。 摘编自光明网(2013年11月15日)、新华网（2014年11月21日） （1） 现阶段我国发展社会主义市场经济为什么应坚持“让大猫小猫都有路走”？（6分） （2） 如何更好地发挥非公有制经济在经济发展中的作用？（4分）","options":{},"answer":""},{"year":2015,"no":36,"type":"分析","stem":"结合材料回答问题： 1925年郭沫若在一篇文章中讲述了这样一个故事： 十月十五日丁祭过后的第二天，孔子和他的得意门生颜回、子路、子贡三位在上海的文庙里吃着冷肉的时候，有四位年轻的大班抬了一乘朱红漆的四轿，一直闯进庙来，里面走出一位脸如螃蟹，胡须满腮的西洋人来，原来这位胡子螃蟹脸就是马克思。 孔子一见来的是马克思，他便禁不得惊喜着叫出：啊啊，有朋自远方来，不亦乐乎呀！你来到敝庙来，有什么见教呢？ 马克思说:我是特为领教而来，我们的主义已经传到你们中国，我希望在你们中国能够实现，但是近来有些人说，我的主义和你的思想不同，所以在你的思想普遍着的中国，我的主义是没有实现的可能性，因此我便来直接领教你：究竟你的思想是怎么样？和我的主义怎样不同？ 孔子说：难得你今天亲自到了我这里来，太匆促了，不好请你演讲，至少请你作一番谈话罢。你的理想的世界是怎样的呢？ 马克思说：我的理想的世界，是我们生存在这里面，万人要能和一人一样自由平等地发展他们的才能，人人都各能尽力做事而不望报酬，人人都各能得生活的保障而无饥寒的忧虑，这就是我所谓“各尽所能，各取所需”的共产社会。 孔子说：你这个理想社会和我的大同世界竟是不谋而合，你请让我背一段我的旧文章给你听罢。“大道之行也，天下为公，选贤与能，讲信修睦；故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者皆有所养，男有分，女有归；货恶其弃于地也不必藏于己；力恶其不出于身也不必为己；是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓大同”，这不是和你的理想完全一致的吗？ 马克思说我的理想和有些空想家不同，我的理想不是虚构出来的，也并不是一步可以跳到的。我们先从历史上证明社会的产业有逐渐增值之可能，其次是逐渐增值的财产逐渐集中于少数人之手中，于是使社会生出贫乏病来，社会上的争斗便永无宁日。 孔子说：我从前也早就说过“不患寡而患不均，不患贫而患不安”的呀！ 孔子的话还没有十分钟落脚，马克思早反对起来了：不对，不对！你和我的见解终竟是两样，我是患寡且患不均，患贫且患不安的，你要晓得，寡了便不均起来，贫了便是不安的根本。所以我对于私产的集中虽是反对，对于产业的增值却不惟不敢反对，而且还极力提倡，所以我们一方面用莫大的力量去剥夺私人的财产，而同时也要以莫大的力量来增值社会的产业。孔子说：尊重物质本是我们中国的传统思想，洪范八政食货为先，管子也说过“仓源实而知礼节，衣食足而知荣辱”，我的思想乃至我国的传统思想，根本和你一样，总要先把产业提高起来，然后才来均分。 马克思到此才感叹起来：我不想在两千年前，在遥远的东方，已经有了你这样的一个老同志！你我的见解完全一致的，怎么有人曾说我的思想和你的不合，和你们中国的国情不合，不能施行于中国呢？ （1）“马克思进文庙”的历史背景是什么？（4分） （2）如何理解孔子与马克思对话中谈到的他们之间思","options":{},"answer":""},{"year":2015,"no":37,"type":"分析","stem":"结合材料回答问题： 材料1 2014年10月闭幕的十八届四中全会，是党在中央全会上第一次专题讨论已发治国的问题，体现了对法治的高度重视。会议结束后，微博上的各种评论满是对法治进步的热望：“想要法治的果实，就要给它阳光雨露”“期待法治进入与人民互动的2.0时代”“法治不仅是宏大的，也是具体的；它关乎国家治理，更关于百姓福祉”…… 《韩非子》有句名言“国无常强，无常弱。奉法者强则国强，奉法者弱则过弱”。尊奉法律，需要执政者，治理者发力，引导之，提倡之，遵守法律，需要全体公民给力，用法律来定分止争，维护之，践行之。网络上已经有人以普通人“小明”为例，演绎“四中全会与你我有啥关系”。有认识，法治于人就如同空气，你可能不会时时刻刻意识到它的存在，可一旦缺少就立刻窒息。的确，从出生到成长，从成家到立业，舞步需要法治的护航：加强对财产权的保护，完善教育、医疗、视频安全等方面的法律法规，提高环境污染的违法成本……四中全会促动“法治的春天”有着温暖人心的春意。当越来越多人在法治的护佑下感受着畅快的呼吸，法治才能成为内心时时恪守的律令。 也不用回避中国的法治还有很多问题，从“暂行50多年”的高温条例，到保护个人信息安全等方面尚无完善法律，中国的法治进程需要紧跟时代的步伐。四中全会从立法、司法、执法、守法等方面开出来药方，但最根本的还是提升全社会对法治的信心与信任，正如党的十八届四中全会公报所说，法律的权威源自于人民内心的拥护和真诚信仰。这才是法治的力量所在，尊严所系。 摘自《人民日报》2014年10月24日材料2 法治是人类为了征服自己，由人类自己立法进行自我管理，这远比征服自然困难得多。特别是约束公权力，非有高度的觉悟，顽强的毅力和坚强的意志难以成其事。任何国家法治的确立都不是在一盘散沙的状态下随随便便建立起来的，而是必须有坚定有力的集中统一领导和部署。 迄今为止，尚未有法治成功的国家是在群龙无首，四分五裂的状态下实现法治的。恰恰相反，就法治发达国家的经验来看，这些国家的法治之所以能够最终确立，都是自上而下，从官到民表现出对法治制作的追求，付出巨大的努力。在中国这个拥有13亿人口，情况极其复杂的大国建设法治，更需要有自上而下将强统一的领导，要有统一的意志，坚决果断一体推行。正是基于这样的情况，十八界四中全会指出，全面推进依法治国，必须坚持党的领导。 摘自《人民日报》2014年10月29日 （1）如何理解“法治关乎国家治理，更关乎百姓福祉”？（6分） （2）为什么“全面推进依法治国，必须坚持党的领导”（4分）","options":{},"answer":""},{"year":2015,"no":38,"type":"分析","stem":"阅读下列材料材料1 1960年5月27日，毛泽东与来华访问的英国元帅蒙哥马利，围绕“50年以后中国的命运”有一段深刻的对话。蒙哥马利说，我有一个有趣的问题想问下主席：中国大概需要50年，一切事情就办得差不多了。到那时候，你看中国的前途将会怎样？历史的教训是，当一个国家非常强大的时候，就倾向于侵略，是不是？要向外国侵略，就会被打回来；外国是外国人住的地方，别人不能去，没有权利也没有理由硬挤进去，如果去，就要被赶走，这是历史教训。如果我们占人家一寸土地，我们就是侵略者。 “蒙哥马利之问”折射的是一些西方人内心深处的“国强必霸”逻辑。然而，这样的逻辑与中国人千百年来的民族心理完全不在一个“频道”上。正如习近平所说，“中华民族的血液中没有侵略他人，称霸世界的基因。” 600多年前，郑和受命出使西洋，足迹遍布30多个国家和地区。明朝初期的中国，是综合国力位居世界前列的强国。但是，与地理大发现时期欧洲国家的殖民政策不同。郑和船队始终奉行“共享太平之福”的宗旨，尊重当地习惯，平等开展多边贸易，把中国的建筑、绘画、雕刻、服饰等领域的精湛技术带入亚非国家，促进了中外文化的双向交流和共同进步。郑和下西洋的“和平之旅”永载史册。 明朝洪武年间，缅甸与百夷(今缅甸北部)交战，明太祖未发一兵，派李思聪、钱古训二人劝和。二人先奉劝缅甸“两国之民居处虽分，惟存关市之讥。是其和也，其或纷争不已，天将昭鉴福善祸淫”，又告诫百夷“莫如守全，以图绵长，不亦美乎”。双方均为道义所感悟，最终罢战息兵。 孙中山先生曾在日本演说，“东方的文化是王道，主张仁义道德，西方的文化是霸道，主张功利强权。讲仁义道德，是由正义公理来感化人，讲功利强权，是用洋枪大炮来压迫人。”近代中国遭受列强欺凌，无数仁人志士高喊“落后就要挨打”“振兴中华”，但只是为了获得免于被欺凌的自由，为了以平等的姿态屹立于世界民族之林。正如“和平学之父”约翰·加尔通所说，有些人总希望有一个暴力选择，但中国以自己特有的视角来观察现实，阴阳平衡、尊重智慧、众生平等理念被视为理所当然，和平关系的普遍原则以相互合作、平等互利为起点。 拿破仑说，中国是一头沉睡的狮子，当这头睡狮醒来时，世界都会为之发抖。今年3月， 习近平同志在法国巴黎向世界宣示，中国这头狮子已经醒了，但这是一只和平的、可亲的、文明的狮子。读懂了“和”文化是中国人千百年来流淌的血脉，就感受到了走向世界的中国那种无法改变的“和”的气度与内质。 摘编自《人民日报》（2010年12月22日，2014年5月20日） （1）毛泽东和蒙哥马利的“对话”反映了什么？（4分） （2）如何理解习近平所说“中国这头狮子已经醒了，但这是一只和平的、可亲的、文明的狮子”？（6分）","options":{},"answer":""},{"year":2018,"no":1,"type":"单选","stem":"马克思主义的产生具有深刻的社会根源、阶级基础和思想渊源。其创始人马克思1818年5月5日出生在德国特利尔城的一个律师家庭，恩格斯1820年11月28日出生在德国巴门市的一个工厂主家庭，他们放弃了舒适安逸的生活，毅然选择了充满荆棘坎坷的革命道路，创立了科学社会主义。马克思、恩格斯之所以能够创立科学社会主义，主要是因为（ ）","options":{"A":"他们对时代有着超常人的认知能力","B":"他们拥有优良的家庭背景和教育经历","C":"社会历史条件和个人努力的相互作用","D":"德国是当时最为发达的资本主义国家"},"answer":"C"},{"year":2018,"no":2,"type":"单选","stem":"“马者所以命形也；白者所以命色也。命色者非命形也，故曰白马非马。”从唯物辩证法的观点看，“白马非马”这一命题的命题的错误在于（ ）","options":{"A":"割裂了事物共性和个性之间的联系","B":"模糊了事物本质和现象之间的联系","C":"混淆了事物内容和形式之间的区别","D":"颠倒了事物形态和功能之间的关系"},"answer":"A"},{"year":2018,"no":3,"type":"单选","stem":"坚持以人民为中心，就必须坚持人民主体地位，坚持立党为公、执政为民，践行全心全意为人民服务的根本宗旨，把党的群众路线贯彻到治国理政全部活动之中，把人民对美好生活的向往作为奋斗目标，“坚持以人民为中心”的理论基础是唯物史观关于（ ）","options":{"A":"人的本质是一切社会关系的总和的原理","B":"人民群众是历史的创造者的原理","C":"人民群众的活动受到社会历史条件制约的原理","D":"总体的人在总体的历史过程中的主体地位的原理"},"answer":"B"},{"year":2018,"no":4,"type":"单选","stem":"《资本论》（德文版）第一卷于1867年9月在汉堡出版，其影响力经历150年风雨而不衰，至今对我们分析、理解现实经济问题依然具有很强的指导意义。马克思主义政治经济学的理论十分丰富，其中“理解政治经济学的枢纽”理论是（ ）","options":{"A":"价值规律理论","B":"商品二因素理论","C":"劳动二重性理论","D":"剩余价值理论"},"answer":"C"},{"year":2018,"no":5,"type":"单选","stem":"经济建设是全党的中心工作，坚持以经济建设为中心不动摇。就必须坚持以经济体制改革为重点不动摇。当前，我国深化经济体制改革的重点是（ ）","options":{"A":"扩大优质增量供给，实现供需动态平衡","B":"完善产权制度和要素市场化配置","C":"加快培育国际经济合作和竞争新优势","D":"建立更加有效的区域协调发展新机制"},"answer":"A"},{"year":2018,"no":6,"type":"单选","stem":"实行人民民主，保证人民当家作主，实现形式是丰富多样的。经过长期探索，我国在通过依法选举让人民的代表来参与国家生活和社会生活管理的同时，找到了一种保证人民在日常政治生活中有广泛持续深入参与权利的特有民主形式，这一特有民主形式是（ ）","options":{"A":"谈判民主","B":"协商民主","C":"票决民主","D":"竞争性民主"},"answer":"B"},{"year":2018,"no":7,"type":"单选","stem":"党的十八大以来，我国大力实施创新驱动发展战略，加快创新型国家建设步伐，成果丰硕，天宫、蛟龙、天眼、悟空、墨子。大飞机等重大科技成果相继问世。我国实施创新驱动发展战略所坚持的方针是（ ）","options":{"A":"集中力量、重点突破、实现跨越式发展","B":"企业为主体、市场为导向、产学研相结合","C":"自主创新、重点跨越、支撑发展、引领未来","D":"原始创新、集成创新、引进消化吸收再创新"},"answer":"C"},{"year":2018,"no":8,"type":"单选","stem":"解决台湾问题，实现祖国完全统一，是全体中华儿女共同愿望，是中华民族根本利益所在。党的十八大以来，在习近平同志为核心的党中央坚强领导下，在两岸同胞共同努力下，两岸关系取得重要积极成果。两岸关系和平发展的政治基础是（ ）","options":{"A":"坚持“九二共识”，反对“台独”","B":"相互尊重，求同存异","C":"增强两岸同胞的民族认同、文化认同、国家认同","D":"深化两岸利益融合，共创两岸互利双赢，增强两岸同胞福祉"},"answer":"A"},{"year":2018,"no":9,"type":"单选","stem":"近代中国半殖民地半封建社会的矛盾，呈现出错综复杂的状况。其中，贯穿整个中国半殖民地半封建社会的始终，并对中国近代社会的发展变化起着决定性作用的最主要的矛盾是（ ）","options":{"A":"农民阶级和地主阶级的矛盾","B":"无产阶级和资产阶级的矛盾","C":"封建主义和人民大众的矛盾","D":"帝国主义和中华民族的矛盾"},"answer":"D"},{"year":2018,"no":10,"type":"单选","stem":"19世纪60年代到90年代，清朝统治阶级内部的洋务派兴办近代企业，建立新式海陆军，创办新式学堂，派遣留学生。洋务派兴办洋务新政的主要目的是（ ）","options":{"A":"发展资本主义","B":"维护封建统治","C":"对抗顽固派","D":"迎合帝国主义"},"answer":"B"},{"year":2018,"no":11,"type":"单选","stem":"中国共产党在领导人民革命的过程中，积累了丰富的经验，锻造了有效的克敌制胜的武器。武装斗争就是中国共产党在中国革命中战胜敌人的重要法宝之一，其实质是（ ）","options":{"A":"工人阶级领导的农民战争","B":"资产阶级领导的反封建战争","C":"工农联合的反军阀战争","D":"无产阶级领导的反帝国主义战争"},"answer":"A"},{"year":2018,"no":12,"type":"单选","stem":"20世纪40年代前期，为了提高广大党员的思想理论水平，增强党的凝聚力和战斗力，中国共产党在全党范围内开展了一场整风运动，这场整风运动最主要的任务是（ ）","options":{"A":"反对主观主义以整顿学风","B":"反对宗教主义以整顿党风","C":"反对党八股以整顿文风","D":"反对享乐主义以整顿作风"},"answer":"A"},{"year":2018,"no":13,"type":"单选","stem":"社会公德是指人们在公共生活和社会交往中应该遵守的行为准则，是维护公共利益、公共秩序、社会和谐稳定的起码道德要求。社会公德最基本的要求是（ ）","options":{"A":"文明礼貌","B":"助人为乐","C":"爱护公物","D":"遵纪守法"},"answer":"D"},{"year":2018,"no":14,"type":"单选","stem":"习近平总书记在《关于<中共中央关于全面推进依法治国若干重大问题的决定>的说明》中引用英国哲学家培根的一段话:“一次不公正的审判，其恶果甚至超过十次犯罪”。因为犯罪虽是无视法律——好比玷污了水流，而不公正的审判则损坏法律——好比污染了水源。”这说明公正司法的重要性。公正司法是（ ）","options":{"A":"社会公正的唯一标准","B":"社会公正的最终目标","C":"维护社会公平正义的最后一道防线","D":"维护社会公平正义的决定因素"},"answer":"C"},{"year":2018,"no":15,"type":"单选","stem":"2017年中央1号文件聚焦“三农”工作，提出新的历史阶段我国农业农村工作的主线是（ ）","options":{"A":"改善农业生态环境","B":"发展农村新产业新业态","C":"确保国家粮食安全","D":"深入推进农业供给侧结构性改革"},"answer":"D"},{"year":2018,"no":16,"type":"单选","stem":"2017年12月1日，中国共产党与世界政党高层对话会在北京开幕，来自120多个国家近300个政党和政治组织的领导人分享治党治国经验，共商合作发展大计。本次对话的主题是（ ）","options":{"A":"中国改革：执政党的角色","B":"构建人类命运共同体、共同建设美好世界：政党的责任","C":"从严治党：执政党使命","D":"为完善全球经济治理贡献政党智慧和力量"},"answer":"B"},{"year":2018,"no":17,"type":"多选","stem":"2017年6月，我国科学家利用“墨子号”量子科学实验卫星在国际上率先成功实现了千公里级的星地双向量子纠缠分发。“量子纠缠”是两个（或多个）粒子共同组成的量子状态，无论粒子之间相隔多远，测量其中一个粒子必然会影响其他粒子。“墨子纠缠”现象虽然未被完全认知，但他仍然能够说明（ ）","options":{"A":"物质世界联系的客观性和普遍性","B":"事物联系的主观性和偶然性","C":"事物联系的复杂性和多样性","D":"世界的真正统一性在于它的物质性"},"answer":"ACD"},{"year":2018,"no":18,"type":"多选","stem":"社会形态的更替具有客观性和必然性，但这并不否定人们的历史活动的能动性，并不排斥人们在遵循社会发展规律的基础上，对于某种社会形态的历史选择性。人们历史活动的能动性和选择性主要体现在（ ）","options":{"A":"社会发展的客观必然性为人们的历史选择提供了基础、范围和可能性空间","B":"社会形态更替的过程是主体能动性与客观规律性相统一的过程","C":"人们的历史选择性归根结底是人民群众的选择性","D":"社会发展的客观过程由每一个参与历史活动的个人的主观意志所决定"},"answer":"ABC"},{"year":2018,"no":19,"type":"多选","stem":"为了追逐最大化的利润，资本家总是想方设法地进行资本积累，而资本积累的源泉是剩余价值 。一般而言，资本积累规模的大小取决于（ ）","options":{"A":"资本家对工人的剥削程度","B":"劳动生产率的高低","C":"资本家垫付资本的大小","D":"所用资本与所费资本之间的差额"},"answer":"ABCD"},{"year":2018,"no":20,"type":"多选","stem":"与第二次世界大战之前的资本主义相比，当代资本主义生产关系中的社会阶层、阶级结构发生了许多新的变化，主要体现在（ ）","options":{"A":"高级职业经理成为资本主义社会大公司经营活动的实际控制者","B":"资本家由从前的直接生产经营者变成了以剪息票为生的食利者","C":"职工持股和参与决策使得劳动者成为资本家集团的重要力量","D":"知识型和服务型劳动者数量随科技革命不断深入而持续地增加"},"answer":"ABD"},{"year":2018,"no":21,"type":"多选","stem":"列宁指出“一切民族都将走向社会主义，这是不可避免的，但是一切民族的走法却不会完全一样，在民主的这种或那种形式上，在无产阶级专政的这种或那种形态上，在社会生活各方面的社会主义改造的速度上，每个民族都有自己的特点。”这一论述从历史唯物主义的高度揭示了各民族发展道路道路的多样性的内涵。下列关于社会主义发展道路多样性特点的正确观点有（ ）","options":{"A":"各国生产力发展状况和社会发展阶段决定了社会主义发展道路具有不同的特点","B":"历史文化传统的差异性是造成不同国家社会主义发展道路多样性的重要条件","C":"各国民族因素和地理环境的不同是造成社会主义发展道路多样性的决定因素","D":"时代和实践的不断发展是造成社会主义发展道路多样性的现实原因"},"answer":"ABD"},{"year":2018,"no":22,"type":"多选","stem":"从现在到2020年，是全面建成小康社会的决胜期，也是确保实现第一个百年目标，为第二个百年目标打好基础的关键阶段。面对各种严峻复杂的挑战，如期全面建成小康社会必须打好的攻坚战有（ ）","options":{"A":"污染防治","B":"精准脱贫","C":"产业结构调整","D":"防范化解重大风险"},"answer":"ABD"},{"year":2018,"no":23,"type":"多选","stem":"积极发展混合所有制经济，是完善我国基本经济制度的重要途径。2017年9月11日，我国首条由民营资本控股的高铁——杭绍台高铁项目在浙江杭州签约。该项目预计投资超过400亿元，其中民营联合体占51%，中国铁路总公司占比15%，各级地方政府合计占比34%。本项目坚持风险分担、利益共享原则，构建政府和社会资本都能接受的投资回报机制。这是我国发展混合所有制经济的一个典型案例。发展混合所有制经济有利于（ ）","options":{"A":"各种所有制资本取长补短、互相促进、共同发展","B":"各种所有制企业公平参与市场竞争","C":"发挥国有资本的带动力和影响力","D":"改善企业控股股权结构和公司治理结构"},"answer":"ABD"},{"year":2018,"no":24,"type":"多选","stem":"维护河湖健康生命，实现河湖功能永续利用，需要进一步加强河湖管理保护工作，落实属地责任，健全长效机制。2016年11月28日，中共中央办公厅、国务院办公厅联合印发《关于全面推行河长制的意见》。2017年11月20日召开的中央全面深化改革领导小组会议审议通过了《关于在湖泊实施湖长制的指导意见》。全面推行河长制、湖长制是建设生态文明制度体系的重要举措。我国生态文明制度体系建设主要包括（ ）","options":{"A":"完善生态环境损害责任终身追究制度","B":"完善经济社会发展考核评价体系","C":"完善生态环境保护管理制度","D":"完善部门职责分散交叉的环保监督体系"},"answer":"ABCD"},{"year":2018,"no":25,"type":"多选","stem":"党的十九大提出以党的政治建设为统领，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，并特别强调把党的政治建设摆在首位。之所以要把党的政治建设摆在首位，是因为（ ）","options":{"A":"坚定政治立场是党的根本宗旨","B":"政治属性是政党的第一属性","C":"政治建设是党的根本性建设，决定党的建设方向和效果","D":"旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求"},"answer":"BCD"},{"year":2018,"no":26,"type":"多选","stem":"全面提高对外开放水平，需要实施更为主动的开放战略。近年来，我国坚持引进来和走出去并重，全面开放进一步深化。据统计，2016年中国企业对外直接投资1832亿美元，连续两年位列世界第二;中国境外企业销售额1.5万亿美元，向所在国缴纳税费400亿美元，雇佣外方员工150万人;我国高技术服务业实际使用外资超过955亿人民币，同比增长86%，在全国引资东道主中排列第三位，高附加值以及服务行业的外国直接投资流入量持续增长，这说明","options":{"A":"我国国际投资合作水平进一步提高","B":"我国防范经济风险和外部冲击的能力已经形成","C":"我国吸引外资的结构和质量正在不断优化","D":"我国对外直接投资已经完全转向高端"},"answer":"AC"},{"year":2018,"no":27,"type":"多选","stem":"忠诚于党、听党指挥是我军的光荣传统。1929年12月下旬，红四军党的第九次代表大会在福建上杭县古田村召开。这次会议史称古田会议。会议通过的毛泽东起草的决议案，确立了思想建党、政治建军原则，规定红军是一个执行革命的政治任务的武装集团，必须（ ）","options":{"A":"绝对服从共产党的领导","B":"负担打仗、筹款和做群众工作的任务","C":"加强政治工作","D":"实行全国军事的总动员"},"answer":"ABC"},{"year":2018,"no":28,"type":"多选","stem":"抗日民主根据地是认真贯彻和实现中国共产党全面战略路线、坚持抗争和争取胜利的坚强阵地。中国共产党高度重视抗日民主根据地的政权建设，其主要举措有（ ）","options":{"A":"抗日民主政府在工作人员分配上实施“三三制”原则","B":"各级抗日民主政权机构领导人通过人民选举产生","C":"实施工农兵代表大会制度","D":"在少数民族聚居地区实行民族区域自治"},"answer":"AB"},{"year":2018,"no":29,"type":"多选","stem":"从1953年开始，在过渡时期总路线的指引下，中国共产党领导人民开始进行有计划的社会主义建设和有系统的社会主义改造。当时中国之所以要着力进行和可能进行社会主义改造，主要是因为（ ）","options":{"A":"社会主义性质的国营经济力量相对来说比较强大","B":"资本主义力量强力量弱小，发展困难","C":"对个体农业进行社会主义改造，是实现国家工业化的一个必要条件","D":"资本主义国家的封锁和遏制，社会主义国家的同情和援助"},"answer":"ABCD"},{"year":2018,"no":30,"type":"多选","stem":"“天下之事，不难于立法。而难于法之必行。”法律的生命力在于实施。法律的权威也在于实施，守法是法律实施和实现的基本途径。对守法的正确理解是（ ）","options":{"A":"守法的主体是一切组织和个人","B":"守法意味着一切组织和个人严格依法办事的活动和状态","C":"守法是行使法定的权利，履行法定的义务","D":"守法是遵守宪法和法律"},"answer":"ABC"},{"year":2018,"no":31,"type":"多选","stem":"我国民法通则、合同法、物权法中，都有要求民事主体在进行民事活动时应当遵守社会公德，不得损害公共利益和经济秩序的内容，已经具有“公序良俗”的含义。2017年10月1日起施行的民法总则明确规定“民事主体从事民事活动。不得违反法律，不得违背公序良俗”，从民法基本原则的高度确立了禁止违反公序良俗的原则。这一规定体现了（ ）","options":{"A":"依法治国和以德治国的有机统一","B":"法律为道德建设提供制度保障","C":"对传统民法上的公序良俗原则的继承和发展","D":"道德为法律提供价值基础"},"answer":"ABCD"},{"year":2018,"no":32,"type":"多选","stem":"2017年4月1日，中共中央、国务院发布通知，决定设立河北雄县新区。这是以习近平同志为核心的党中央作出的一项重大的历史性战略选择，是千年大计、国家大事。雄安新区的设立有利于（ ）","options":{"A":"探索人口经济密集地区优化开发新模式","B":"探索沿海和内地对外开放新模式","C":"调整优化京津冀城市布局和空间结构","D":"集中疏解北京的非首都功能"},"answer":"ACD"},{"year":2018,"no":33,"type":"多选","stem":"2017年9月5日，新兴市场国家与发展中国家对话会在金砖国家领导人厦门会晤期间举行。金砖国家领导人在和受邀的埃及、几内亚、墨西哥、塔吉克斯坦、泰国五国出席会议，开启了“金砖+”合作模式，其重大意义在于","options":{"A":"破解了南北对话的僵局","B":"进一步推动了全球治理体系的改善","C":"对南南合作形成了有机补充","D":"全面提升了金砖机制的代表性和影响力"},"answer":"BCD"},{"year":2018,"no":34,"type":"分析","stem":"结合材料回答问题: 材料1 任何过程如果有多数矛盾存在的话，其中必定有一种是主要的，起著领导的、决定的作用，其他则处于次要和服从的地位。因此，研究任何过程，如果是存在两个以上矛盾的复杂过程的话，就要用全力去找出它的主要矛盾。捉住了这个主要矛盾，一切问题就迎刃而结解了。 …… 矛盾着两方面中，比有一方面是主要的，它方面是次要的，其主要的方面，即所谓矛盾起主导作用的方面，事务的性质，主要地是由取得支配地位的矛盾的主要方面所规定的。 …… 对于矛盾的各种不平衡情况的研究，对于主要的矛盾和非主要的矛盾、主要的矛盾方面和非主要的矛盾方面的研究，成为革命政党正确的决定其政治上和军事上的战略战术方针的重要方法之一，是一切共产党人都应当注意的。 ———摘自《毛泽东选集》第一卷材料2 中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。我国稳定解决了十几亿人的温饱问题，总体上实现小康，不久将全面建成小康社会，人民美好生活需要日益广泛，不仅对物质文化生活提出了更高要求，而且在民主、法治、公平、正义、安全、环境等方面的要求日益增长。同时，我国社会生产力水平总体上显著提高，社会生产能力在很多方面进入世界前列，更加突出的问题是发展不平衡不充分，这已经成为满足人民日益增长的美好生活需要的主要制约因素。 必须认识到，我国社会主要矛盾的变化是关系全局的历史性变化，对党和国家工作提出了许多新要求。我们要在继续推动发展的基础上，着力解决好发展不平衡不充分问题，大力提升发展质量和效益，更好满足人民在经济、政治、文化、社会、生态等方面日益增长的需要，更好推动人的全面发展、社会全面进步。 …… 发展是解决我过一切问题的基础和关键，发展必须是科学发展，必须坚定不移贯彻创新、协调、绿色、开放、共享的发展理念。 ——摘自习近平《决胜全面建成小康社会夺取新时代中国特色社会主义伟大胜利——在中国共产党第十九次全国代表大会上的报告》 （1）如何理解“捉住了这个主要矛盾，一切问题就迎刃而解了”？（5分） （2）根据矛盾主要方面在事物发展中的地位和作用原理，说明为什么“发展是解决我国一切问题的基础和关键”。（5分）","options":{},"answer":""},{"year":2018,"no":35,"type":"分析","stem":"结合材料回答问题习近平同志在向党的十九大作报告时指出：“经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。进入新时代，最鲜明的历史坐标，就是中华民族迎来了从站起来、富起来到强起来的伟大飞跃，2017年10月25日，在中共十九届一中全会上，习近平同志再次当选中共中央总书记，体现了全党的意愿。 新时代标示新方位，党的十八大以来的5年，以习近平同志为核心的党中央科学把握当今世界和当代中国发展大势，顺应实践要求和人民愿望，举旗定向、运筹帷幄，统揽伟大斗争、伟大工程、伟大事业、伟大梦想，统筹推进“五位一体”总体布局、协调推进“四个全面”战略方布局，以巨大的政治勇气和强烈的责任担当，提出一系列新理念新思想新战略，出台一系列重大方针政策，推出一系列重大举措，推进一系列重大工作，解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事，推动党和国家事业发生深刻的历史性变革，5年来，我国经济建设取得重大成就，全面深化改革取得重大突破，民主法制建设迈出重大步伐，思想文化建设取得重大进展，人民生活不断改善，生态文明建设成效显著，强军兴军开创新局面，港澳台工作取得新进展，全方位外交布局深入展开，全面从严治党成效卓著。5年来的成就是全方位的、开创性的，5年来的变革是深层次的、根本性的，表明中国特色社会主义已进入新的发展阶段。 新时代聚焦新目标，党的十九大上承“三步走”战略目标，下启全面建设社会主义现代化国家新征程，既对全面建成小康社会作出新部署，又提出从2020年到本世纪中叶分两步走全面建设社会主义现代化国家的新目标，明确了新时代中国特色社会主义发展的战略安排——从全面建成小康社会到基本实现现代化，再到全面建成社会主义现代化强国。十九大到二十大的5年，正处在实现“两个一百年”奋斗目标的历史交汇期，第一个百年奋斗目标要实现，第二个百年目标要开篇。 新时代催生新思想。党的十八大以来，以习近平同志主要代表的中国共产党人，顺应时代发展，围绕重大时代课题，创立了习近平新时代中国特色社会主义思想，这一思想的主要创立者是西平习近平同志。在领导全党全国推进党和国家事业的实践中，习近平同志提出了一系列具有开创性意义的新理念新思想新战略，为新时代中国特色社会主义思想创立发挥了决定性作用、作出了决定性贡献。习近平新时代中国特色社会主义思想是马克思主义中国化最新成果，其内涵十分丰富。党的十九大报告用“8个明确”概括了这一思想的主要内容，为贯彻落实这一思想，报告提出新时代坚持和发展中国特色社会主义的基本方针，并概括为“14个坚持”。“8个明确”的基本内容、“14个坚持”的基本方略，构成了系统完整的科学理论体系。党的十九大把习近平新时代中国特色社会主义思想写入新修订的党章，上升为全党统一意志，确立为党必须长期坚持的指导思想。这是党的指导思想又一次与时俱进，是党的十九大的一个","options":{},"answer":""},{"year":2018,"no":36,"type":"分析","stem":"结合材料回答问题： 材料一从一八四〇年的鸦片战争到一九一九年的五四运动的前夜，共计七十多年中，中国人没有什么思想武器可以抗御帝国主义，旧的顽固的封建主义的思想武器打了败仗了，抵不住，宣告破产了，不得已，中国人被迫从帝国主义的老家即西方资产阶级革命时代的武器库中学来了进化论、天赋人权论和资产阶级共和国等项思想武器和政治方案，组织过政党，举行过革命，以为可以外御列强，内建民国。但是这些东西也和封建主义的思想武器一样，软弱得很，又是抵不住，败阵下来，宣告破产了。 十月革命一声炮响，给中国送来了马克思列宁主义。中国先进分子从马克思列宁主义的科学真理中看到了解决中国问题的出路。在近代以后中国社会的剧烈运动中，在中国人民反抗封建统治和外来侵略的激烈斗争中，在马克思列宁主义同中国工人运动的结合过程中，一九二一年中国共产党应运而生。从此，中国人民谋求民族独立、人民解放和国家富强、人民幸福的斗争就有了主心骨，中国人民就从精神上由被动转为主动。 ——摘自《毛泽东选集》第四卷、习近平《决胜全面建成小康社会夺取新时代中国特色社会主义伟大胜利——在中国共产党第十九次全国代表大会上的报告》 材料2 2017年10月18日，中国共产党第十九次全国代表大会在北京隆重举行，大会的主题是：不忘初心，牢记使命，高举中国特色社会主义伟大旗帜，决胜全面建成小康社会，夺取新时代中国特色社会主义伟大胜利，为实现中华民族伟大复兴的中国梦不懈奋斗，习近平同志代表十八届中央委员会向大会作报告，指出：“不忘初心，方得始终”中国共产党的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴，这个初心和使命就是共产党人不断前进的根本动力。 10月31日，十九大闭幕仅一周，习近平总书记带领中共中央政治局常委专程从北京前往上海和浙江嘉兴，瞻仰上海中共一大会址和浙江嘉兴南湖红船，在瞻仰中共一大会议室原址时，习近平动情地说，毛泽东同志称这里是中国共产党的“产床”，这个比喻很形象，我看这里也是我们中国共产党人的精神家园。在参观南湖革命纪念馆时，习近平说，在浙江工作期间，我曾经把\"红船精神\"概括为开天辟地、敢为人先的首创精神，坚定理想、百折不挠的奋斗精神，立党为公、忠诚为民的奉献精神。我们要结合时代特点大力弘扬\"红船精神\"。参观结束时，习近平同志发表了重要讲话，指出，上海党的一大会址、嘉兴南湖红船是我们党梦想起航的地方，我们党从这里诞生，从这里出征，从这里走向全国执政，这里是我们党的根脉。习近平同志强调，“其作始也简，其将毕也必巨。”96年来，我们党团结带领人民取得了举世瞩目的伟大成就，这值得我们骄傲和自豪。同时，事业发展永无止境，共产党人的初心永远不能改变。唯有不忘初心，方可告慰历史、告慰先辈，方可赢得民心赢得时代，方可善作善成，一往无前。 ——摘编自《人民日报》（2017年11月1日） （1）为什么说中国共产党是“应运而生","options":{},"answer":""},{"year":2018,"no":37,"type":"分析","stem":"结合材料回答问题： 材料1 2017年11月17日在全国精神文明建设表彰大会上，习近平总书记请老人坐在自己身边的暖心举动，感动了全国人民，同时也让大家记住了这位93岁高龄的中国核潜艇之父——黄旭华。 1937年，日本开始了全面侵华，黄旭华随同学在向内地转移途中，看到无数城市在日军的轰炸下化为了废墟。年少的黄旭华默默思考：国家太弱就会任人欺凌、宰割！我要学习航空、造船，将来制造飞机捍卫我们的蓝天，制造军舰抵御外国的侵略。凭着这个信念他考入大学学习舰船技术。 由此他把自己的专业志向与国家需要紧紧结合在一起，从20世纪50年代起，他隐姓埋名30多年，自力更生、艰苦奋斗、孜孜不倦地战斗在核潜艇研制一线。1970年，我国第一艘鱼雷攻击型核潜艇终于顺利下水试航，中国也由此成为世界上第五个拥有核动力核潜艇的国家。如今，已是90岁多高龄的黄旭华仍然每天准时出现在研究所，在他身上好像蕴涵着无穷的力量，永远不知疲倦，而这一力量正是源自他年轻时确立的正确的理想信念，他说：“研制核潜艇是我的梦想，一辈子从事自己热爱的事业，我很幸福。” 黄旭华为我国第一代核潜艇从无到有、第二代核潜艇的跨越发展到和第三代核潜艇的探索赶超作出了卓越贡献，被誉为“中国核潜艇之父”。 ——摘编自《人民日报》（2017年7月30日）、《光明日报》（2017年11月26日） 材料2 2017年5月24日，习近平总书记在对黄大年同志先进事迹作出重要指示时强调，黄大年同志秉持科技报国理想，把为祖国富强、民族振兴、人民幸福贡献力量作为毕生追求，为我国教育科研事业做出了突出贡献，他的先进事迹感人肺腑，我们要以黄大年同志为榜样，从自己做起，从本职岗位做起，为实现中华民族伟大复兴的中国梦贡献智慧和力量。 黄大年是我国著名地球物理学家、国家“千人计划”专家。2017年1月8日因病去世，年仅58岁。黄大年青年时期就立下“振兴中华，乃我辈之责”的宏大志向。他17岁考到地质队工作，成为一名物探操作员。1977年考入大学，从此与地球物理结下一生的缘分。1992年被选送至国外大学攻读博士学位，临出国前，他说：“等着我，我一定会把国外的先进技术带回来”，“我是国家培养出来的，我的归宿在中国”。2009年，黄大年放弃国外优越的生活科研条件，回到了阔别多年的母校。四国7年多，他作为国家多个技术攻关项目首席专家，带领科技团队只争朝夕、项强拼搏，取得了一系列重大科研成果，填补了多项国内技术空白，部分成果达到国际领先水平。他秉持“祖国的需要就是最高需要”的人生信条，为实现科技强国梦殚精竭虑，直到生命最后一刻。他常说：“中国要由大国变成强国，需要有一批‘科研疯子’，这其中能有我，余愿足矣！” 黄大年的一生从“物探操作员”到“地球物理学家”，变的是称呼，不变的是他对理想信念的不懈追求。 ——摘编自《人民日报》（2017年7月13日）、《光明日报》（2","options":{},"answer":""},{"year":2018,"no":38,"type":"分析","stem":"请结合材料回答问题材料1 2008年国际金融危机以来，经济增长动能不足，贫富分化日益严重，地区热点问题此起彼伏，恐怖主义、网络安全、重大传染性疾病、气候变化等非传统安全威胁持续蔓延。世界面临的不稳定性不确定性突出，一些人把世界乱象归咎于经济全球化，以致民粹主义、孤立主义和贸易保护主义等逆经济全球化思潮涌动。曾经的经济全球化“推手”美国，不仅反对多边贸易体系，而且主张以“美国主义”替代“全球主义”；曾经的区域一体化“标杆”欧盟，不仅遭遇英国“脱欧”，而且其他几个老牌发达国家也接连上演“投票箱大戏”……曾被人当成“阿里巴巴的山洞”的经济全球化，历史久远，促进了贸易大繁荣、投资大便利、人员大流动、技术大发展，现在何以又被不少人视作“潘多拉的盒子”？处于质疑声中的经济全球化将何去何从，成为各方关注的焦点。而如何引导经济全球化释放出更多正面效应，则是对大国智慧与责任担当的考验。 ——摘编自《经济日报》（2017年5月12日） 材料2 中国是经济全球化的积极参与者和推动者。“一带一路”倡议即是最好佐证。“一带一路”倡议提出四年多来，习近平主席在多个场合强调：“‘一带一路’以打造人类命运共同体和利益共同体为合作目标”，“‘一带一路’不是中国一家的独奏，而是沿线国家的合唱”。这不仅使“一带一路”共商、共建、共享的理念深入人心，而且取得超出预期的成果。全球100多个国家和国际组织积极响应；50多个国家和国际组织同中国签署合作协议；“一带一路”倡议先后被载入联合国大会、联合国安理会的重要决议。2014年至2016年，中国同“一带一路”沿线国家贸易总额超过3万亿美元；中国对“一带一路”沿线国家投资累计超过500亿美元；中国企业在20多个国家建设56个经贸合作区，为有关国家创造11亿美元税收的和18万个就业岗位。 2017年5月14日，举世瞩目的“一带一路”国际合作高峰论坛在北京隆重开幕，30多位国家元首、政府首脑和联合国、世界银行、国际货币基金组织三大国际机构负责人以及来自130多个国家的约1500名各界贵宾出席。习近平主席在开幕式上演讲中表示：中国将加大对“一带一路”建设资金支持，将向参与“一带一路”建设的发展中国家和国际组织提供更多的资金援助……中国正以十足的诚意和坚定的行动，落实着“一带一路”倡议，为经济全球化注入强劲动力。 联合国秘书长古特雷斯表示，习近平主席提出的“一带一路”倡议，为世界发展带来了中国方案，有助于推动经济全球化更加平衡、包容、和谐发展，对于通过国际合作解决当今世界面临的诸多挑战具有重大意义。 ——摘编自《习近平谈治国理政》第二卷、《人民日报》（2017年4月11日） （1）为何要引导经济全球化释放出更多“正面效应”？（5分） （2）如何理解“‘一带一路’不是中国一家的独奏，而是沿线国家的合唱”？（5分）","options":{},"answer":""},{"year":2019,"no":1,"type":"单选","stem":"马克思、恩格斯始终站在革命斗争的最前沿，他们的一生是为推翻旧世界，建立新世界而不息战斗的一生。 马克思恩格斯领导创建的世界上第一个无产阶级政党是（ ）","options":{"A":"国际工人协会","B":"正义者联盟","C":"共产主义者同盟","D":"社会主义工人国际"},"answer":"C"},{"year":2019,"no":2,"type":"单选","stem":"“橘生淮南则为橘，生于淮北则为枳，叶徒相似，其实味不同。所以然者何？水土异也。”橘逾淮为枳说明了（ ）","options":{"A":"事物的发展变化以时间地点和条件为转移","B":"事物的普遍联系是通过中介来实现的","C":"任何实体事物都是普遍联系之网上的一个网结","D":"事物的变化和发展是一个过程"},"answer":"A"},{"year":2019,"no":3,"type":"单选","stem":"马克思指出，判断一个变革时代不能以该时代的意识为依据，相反，这个意识必须从物质生活的矛盾中去解释。这里的“物质生活的矛盾”从根本上说是（ ）","options":{"A":"社会生产力和生产关系的现存冲突","B":"经济基础与上层建筑的现存冲突","C":"人类社会与自然界的现存冲突","D":"社会存在与社会意识的现存冲突"},"answer":"A"},{"year":2019,"no":4,"type":"单选","stem":"在以私有制经济为基础的商品经济中，商品生产者的私人劳动生产的产品是否与社会的需求相适应，作为其体劳动的有用性质能否为社会所承认，商品的使用价值和价值之间的矛盾是否能得到解决，决定着商品生产者的命运。以私有制为基础的商品经济的基本矛盾是（ ）","options":{"A":"使用价值和价值之间的矛盾","B":"私人劳动和社会劳动之间的矛盾","C":"具体劳动和抽象劳动的矛盾","D":"脑力劳动和体力劳动的矛盾"},"answer":"B"},{"year":2019,"no":5,"type":"单选","stem":"习近平新时代中国特色社会主义思想是对马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想，科学发展观的继承和发展，是马克思主义中国化最新成果，是党和人民实践经验和集体智慧的结晶， 是中国特色社会主义理论体系的重要组成部分，是全党全国人民为实现中华民族伟大复兴而奋斗的行动指南。 这一思想的核心要义是（ ）","options":{"A":"坚持和发展中国特色社会主义","B":"实现社会主义现代化","C":"推进马克思主义中国化时代化大众化","D":"坚持以经济建设为中心"},"answer":"A"},{"year":2019,"no":6,"type":"单选","stem":"党的十八大以来，为更好地适应我国国家安全面临的新形势新任务实现国家长治久安，我们党明确提出了总体国家安全观。总体国家安全观的宗旨是（ ）","options":{"A":"政治安全","B":"经济安全","C":"人民安全","D":"军事、文化、社会安全"},"answer":"C"},{"year":2019,"no":7,"type":"单选","stem":"高度重视和不断加强党的自身建设，是中国共产党从小到大、由弱变强，从挫折中奋起，在战胜困难中不断成熟的一大法宝，也是党领导的伟大事业不断取得胜利的根本保证。中国特色社会主义进入新时代，党的建设根本方针是（ ）","options":{"A":"全面加强党的执政本领","B":"坚持党要管党、全面从严治党","C":"坚持解放思想、改革创新","D":"全面推进党的政治建设"},"answer":"B"},{"year":2019,"no":8,"type":"单选","stem":"党的十九大提出实施乡村振兴战略，是以习近平同志为核心的党中央着眼党和国家事业全局，深刻把握现代化建设规律和城乡关系变化特征，顺应亿万农民对美好生活的向往，对“三农”工作作出的重大决策部署， 是新时代做好“三农”工作的总抓手。实施乡村振兴战略的根本目的是（ ）","options":{"A":"确保国家粮食安全","B":"建立新型土地承包关系","C":"转移农村剩余劳动力","D":"推进农业农村现代化"},"answer":"D"},{"year":2019,"no":9,"type":"单选","stem":"由于民族危机越来越严重，在维新派的推动和策划下，1898 年6 月11 日，光绪皇帝颁布了“明定国是” 谕旨，宣布开始变法，并在此后的103 天中，接连发布了一系列推行新政的政令，史称“戊戌变法”，又称 “百日维新”。戊戌维新是一场资产阶级性质的改良运动，这是因为变法的政令。（ ）","options":{"A":"触及封建制度根本","B":"采纳了维新派提出的开国会等政治主张","C":"一定程度上反映了资产阶级的政治和经济诉求","D":"带有彻底性和不妥协性"},"answer":"C"},{"year":2019,"no":10,"type":"单选","stem":"中国共产党成立后，积极发动工农群众开展革命斗争，中国共产党第一次独立领导并取得完全胜利的工人斗争是（ ）","options":{"A":"安源路矿工人罢工","B":"香港海员罢工","C":"京汉铁路工人罢工","D":"开滦五矿工人罢工"},"answer":"A"},{"year":2019,"no":11,"type":"单选","stem":"1936 年12 月12 日，张学良、杨虎城发动“兵谏”，扣留了蒋介石。这就是震撼中外的西安事变。事变发生后，中共中央确定了促成事变和平解决的方针，其原因是中国共产党（ ）","options":{"A":"为了团结国民党共同抗日","B":"不赞成张学良、杨虎城的主张","C":"工作重心转向城市斗争","D":"接受了共产国际的指示"},"answer":"A"},{"year":2019,"no":12,"type":"单选","stem":"1945 年8 月29 日，重庆《大公报》就毛泽东赴重庆谈判发表了《毛泽东先生来了！》的社评，其中写道： “毛泽东先生来了，中国人听了高兴，世界人听了高兴，无疑问的大家都认为这是中国的一件大喜事。”毛泽东赴重庆谈判的目的是（ ）","options":{"A":"结束国共内战","B":"商讨联合抗日","C":"寻求外国援助","D":"争取和平民主"},"answer":"D"},{"year":2019,"no":13,"type":"单选","stem":"2018 年9 月10 日，全国教育大会在北京召开。习近平在讲话中指出，培养什么人是教育的首要问题，我国是中国共产党领导的社会主义国家，这就决定了我们的教育必须（ ）","options":{"A":"把推进教育现代化作为根本任务","B":"把建设教育强国作为根本任务","C":"把全面深化教育体系改革作为根本任务","D":"把培养社会主义建设者和接班人作为根本任务"},"answer":"D"},{"year":2019,"no":14,"type":"单选","stem":"马克思说：“人只有为同时代人的完美、为他们的幸福而工作，自己才能达到完美。如果一个人只为自己劳动，他也许能够成为著名的学者、伟大的哲人、卓越的诗人，然而他永远不能成为完美的、真正伟大的人物。”这表明（ ）","options":{"A":"实现自我价值是创造社会价值的原因","B":"人生价值是自我价值和社会价值的统一","C":"人生社会价值可以代替自我价值","D":"个人价值的实现取决于他人的认可"},"answer":"B"},{"year":2019,"no":15,"type":"单选","stem":"2018 年9 月，中华人民共和国国务院新闻办公室发布了《关于中美经贸摩擦的事实与中方立场》白皮书。 白皮书指出，中美两国经济发展阶段、经济制度不同，存在经贸摩擦是正常的，关键是。（ ）","options":{"A":"如何增进互信、促进合作、管控分歧","B":"如何增加出口、降低关税、管控分歧","C":"如何增加进口、消除逆差、管控分歧","D":"如何加强合作、加征关税、管控分歧"},"answer":"A"},{"year":2019,"no":16,"type":"单选","stem":"2018 年4 月27 日，朝鲜国务委员会委员长金正恩与韩国总统文在寅在板门店韩方一侧的“和平之家”举行会晤。本次两国首脑会晤最终重要的成果是共同签署并发表了（ ）","options":{"A":"《北南共同宣言》","B":"《北南关系发展与和平繁荣宣言》","C":"《（板门店宣言）军事领域履行协议》","D":"《为促进朝鲜半岛和平、繁荣、统一的板门店宣言》"},"answer":"D"},{"year":2019,"no":17,"type":"多选","stem":"虚拟现实技术是一种运用计算机仿真系统创建多源信息融合的交互式三维动态实景以及动作仿真的技术， 可以给使用者提供沉浸性，多感知性，交互性的互动体验，虚拟现实技术所构造的虚拟环境说明（ ）","options":{"A":"物质世界不再具有客观实在性","B":"物质世界的存在形式具有多样性","C":"信息是独立于物质和意识的第三种存在状态","D":"人们可以通过实践创造出自然界原本不存在的现实状态"},"answer":"BD"},{"year":2019,"no":18,"type":"多选","stem":"基因编辑是应对遗传性疾病的一种潜在治疗方法，但其技术运用极具争议，这不仅是因为基因的变化会传给后代并最终有可能影响整个基因库，而且更重要的是基因编辑会产生长远而深刻的社会影响，可能衍生出一系列棘手的伦理、法律和安全难题，正因如此，许多国家对人类基因编辑技术制定了相应的伦理、法律规范。人类严格控制基因编辑行为的原因在于，（ ）","options":{"A":"人的实践活动要遵循真理尺度与价值尺度的统一","B":"基因编辑技术可能突破人类的伦理道德底线","C":"科学技术有时表现为异己的、敌对的力量","D":"人的实践活动是合规律性与合目的性的统一"},"answer":"ABCD"},{"year":2019,"no":19,"type":"多选","stem":"资本主义的生产目的是追逐利润最大化，为了获得尽可能多的利润，分布在不同部门（行业）的资本家之间必然展开激烈的竞争，而竞争的结果必将导致利润的平均化。利润率的平均化的过程意味着（ ）","options":{"A":"某企业工人创造的剩余价值有被其他资本家侵占的可能","B":"各部门内不同资本家的等量投资所得到的利润大体上均等","C":"各部门资本家在加强对工人阶级的剥削上有着共同的阶级利益","D":"不从事直接生产的银行资本家所获得的利润总是低于平均利润"},"answer":"AC"},{"year":2019,"no":20,"type":"多选","stem":"资本主义必然为社会主义所替代，并不意味着资本主义将在短期内自行消亡。资本主义向社会主义的过渡必然是一个复杂的、长期的历史过程，其原因在于（ ）","options":{"A":"任何社会形态的存在都有绝对稳定性","B":"资本主义的发展具有不平衡性","C":"资本主义社会具有一定的自我调节能力","D":"当代资本主义的发展还显示出生产关系对生产力容纳的空间"},"answer":"BCD"},{"year":2019,"no":21,"type":"多选","stem":"习近平指出：“当代中国的伟大社会变革，不是简单延续我国历史文化的母版，不是简单套用马克思主义经典作家设想的模板，不是其他国家社会主义实践的再现，不是国外现代化发展的翻版，”这对我们的理解科学社会主义一般原则的启示是（ ）","options":{"A":"科学社会主义绝不是一成不变的教条","B":"科学社会主义与资本主义生产方式没有必然的联系","C":"科学社会主义是人类优秀文化传统的历史延续","D":"科学社会主义在不同的时代具有不同的内容和形式"},"answer":"ACD"},{"year":2019,"no":22,"type":"多选","stem":"中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。但是，我国社会主要矛盾的变化没有改变我们对我国社会主义所处历史阶段的判断， 依据是（ ）","options":{"A":"我国总体上仍处于不发达阶段","B":"我国仍然面临极其复杂的国际环境","C":"我国仍然是世界上最大的发展中国家","D":"我国社会主要矛盾的变化只是社会主义初级阶段这个历史阶段中的变化"},"answer":"ACD"},{"year":2019,"no":23,"type":"多选","stem":"改革开放40 年来，我国民营经济从小到大、从弱到强，不断发展壮大。截至2017 年底，我国民营企业数量超过2700 万家，个体工商户超过6500 万户，注册资本超过165 万亿元。概括起来说，民营经济具有“五六七八九”的特征，即贡献了50%以上的税收，60%以上的国内生产总值，70%以上的技术创新成果，80%以上的城镇劳动力就业，90%以上的企业数量。我国经济发展能够创造中国奇迹，民营经济功不可没。这表明， 民营经济已成为（ ）","options":{"A":"实现中华民族伟大复兴中国梦的重要力量","B":"推动社会主义市场经济发展的重要力量","C":"建设现代化经济体系的重要主体","D":"控制国民经济命脉的主导力量"},"answer":"ABC"},{"year":2019,"no":24,"type":"多选","stem":"国家治理体系是在党的领导下管理国家的制度体系，是一套紧密相连、相互协调的国家制度；国家治理能力则是运用国家制度管理社会各方面事务的能力。二者的关系主要表现为（ ）","options":{"A":"国家治理体系和治理能力是相辅相成的有机整体","B":"好的国家治理体系可以提高国家治理能力","C":"提高国家治理能力可以充分发挥国家治理体系的效能","D":"国家治理体系越完备国家治理能力就一定越强"},"answer":"ABC"},{"year":2019,"no":25,"type":"多选","stem":"全面准确的理解和把握“一国”与“两制”的关系，应在坚持“一国”的基础上，实现“两制”之间的和谐相处、相互促进。为此，必须做到（ ）","options":{"A":"把利用国际有利条件和发挥港澳优势有机结合起来","B":"把坚持“一国”原则和尊重“两制”差异有机结合起来","C":"把维护中央权力和保障特别行政区高度自治权有机结合起来","D":"把发挥祖国内地坚强后盾作用和提高港澳自身竞争力有机结合起来"},"answer":"BCD"},{"year":2019,"no":26,"type":"多选","stem":"坚定文化自信，是事关国运兴衰，事关文化安全、事关民族精神独立性的大问题。坚定中国特色社会主义道路自信、理论自信、制度自信，说到底就是要坚定文化自信。讲文化自信，我们有充足的理由和充足底气， 因为中国特色社会主义文化（ ）","options":{"A":"源自于博大精深的中华优秀传统文化","B":"承继于激昂向上的革命文化","C":"熔铸于生机勃勃的社会主义先进文化","D":"植根于中国特色社会主义伟大实践"},"answer":"ACD"},{"year":2019,"no":27,"type":"多选","stem":"1927 年10 月，毛泽东率领湘赣边界秋收起义的工农革命军，开始创建以宁冈为中心的井冈山农村革命根据地，走农村包围城市、武装夺取政权的革命新道路。毛泽东确定在井冈山建立根据地，是因为这个地区（ ）","options":{"A":"有较好的群众基础","B":"地势险要且易守难攻","C":"易于部队筹款筹粮","D":"敌人统治力量比较薄弱"},"answer":"ABCD"},{"year":2019,"no":28,"type":"多选","stem":"1949 年10 月1 日，首都军民30 万人齐集北京天安门广场，欢庆中华人民共和国的诞生。中华人民共和国的成立，标志着，（ ）","options":{"A":"新民主主义革命取得了基本的胜利","B":"半殖民地半封建社会的结束","C":"中国共产党的地位发生了根本性的变化","D":"社会主义基本制度的确立"},"answer":"ABC"},{"year":2019,"no":29,"type":"多选","stem":"我国经济体制的改革首先在农村取得突破性进展。党的十一届三中全会曾指出：“我国农业近二十年来的发展速度不快，它同人民的需要和四个现代化的需要之间存在着极其尖锐的矛盾。”当时我国农业和农村经济发展面临的主要问题有（ ）","options":{"A":"农民的温饱问题尚未完全解决","B":"农民的农村的土地改革尚未完成","C":"人民公社制度亟待改革","D":"乡镇企业管理体制亟待改革"},"answer":"AC"},{"year":2019,"no":30,"type":"多选","stem":"2018 年3 月，十三届全国人民代表大会第一次会议通过宪法修正案，把国家倡导社会主义核心价值观正式写入宪法，进一步凸显了社会主义核心价值观的重大意义。社会主义核心价值观是（ ）","options":{"A":"坚持和发展中国特色社会主义的价值遵循","B":"提高国家文化软实力的迫切要求","C":"增进社会团结和谐的最大公约数","D":"构建人类命运共同体的行动指南"},"answer":"ABC"},{"year":2019,"no":31,"type":"多选","stem":"中国特色社会主义法治道路的一个鲜明特点，就是坚持依法治国和以德治国的结合。法治和德治，是治国理政不可或缺的两种方式。这是因为法治和德治（ ）","options":{"A":"发挥作用方式不同","B":"实现途径不同","C":"所处地位不同","D":"调整范围不同"},"answer":"ABCD"},{"year":2019,"no":32,"type":"多选","stem":"2018 年6 月22 日至23 日，中央外事工作会议在北京召开。习近平总书记在会上发表重要讲话，强调要深入分析世界转型过渡期国际形势的演变规律，准确把握历史交汇期我国外部环境的基本特征，统筹谋划和推进对外工作。其基本要求是（ ）","options":{"A":"既要把握世界多极化加速推进的大势，又要重视大国关系深入调整的态势","B":"既要把握经济全球化持续发展的大势，又要重视世界经济格局深刻演变的动向","C":"既要把握国际环境总体稳定的大势，又要重视国际安全挑战错综复杂的局面","D":"既要把握各种文明交流互鉴的大势，又要重视不同思想文化相互激荡的现实"},"answer":"ABCD"},{"year":2019,"no":33,"type":"多选","stem":"2018 年是中日和平友好条约缔结40 周年。日本首相安倍晋三于10 月25 日至27 日对中国进行正式访问。 习近平主席、李克强总理分别与其举行了会晤、会谈。中日双方就改善、发展两国关系及共同关心的国际和地区问题交换了意见，在政治、经济、安全及其他国际问题上达成诸多共识，取得务实成果。这些成果主要有（ ）","options":{"A":"签署了中日双边本币互换协议","B":"签署了中日两国海上搜寻救助合作协定","C":"双方一致确认将恪守中日四个政治文件的各项原则","D":"双方一致同意将2019 年作为“中日青少年交流促进年”"},"answer":"ABCD"},{"year":2019,"no":34,"type":"分析","stem":"结合材料回答问题: 材料1 1978 年，中国正徘徊在一个新的十字路口，中国发展的逻辑是什么，中国现代化到底要通过何种方式抵达？近代以来盘恒在中华民族头上的问题，再次成为时代之问。 时间定格在这一刻。中国上百台印刷机转动，不同的报头之下，出现了同一个标题；校园的阅报栏前挤满年轻的面孔，无数学子闻风而至，阅读同一篇文章；千百人重新铺展稿纸，千百支笔重新抖落尘埃，准备书写同一个主题；被一种沉重的沉默笼罩的中国大地，随着第一声响动，忽然爆发出轰鸣。 这是1978 年5 月，一篇名为《实践是检验真理的唯一标准》的特约评论员文章在《光明日报》一版刊发，掀起了席卷中国的真理标准大讨论，成为了那支撬动改革开放的哲学杠杆。 这场讨论，成为拨乱反正、改革开放的哲学宣言，不但为十一届三中全会的召开凝聚了思想共识，而且确立了中国改革进程的理论原则和思维模式。 这场讨论，推动了马克思主义中国化的进一步深入，既成为改革开放的前奏，也成为中国特色社会主义的前奏，使中国在道路探索上实现了理论创新与实践检验的良性互动。 这场讨论，成为中国社会思想现代化的重要一环，解放思想的力量、实事求是的精神，强有力的推动着中国由传统型社会向现代化社会演进，从封闭型社会向开放型社会过渡。 摘编自《光明日报》（2018 年5 月11 日） 材料2 实践没有止境，理论创新也没有止境。世界每时每刻都在发生变化，中国也每时每刻都在发生变化，我们必须在理论上跟上时代，不断认识规律，不断推进理论创新、实践创新、制度创新、文化创新以及其他各方面创新。 时代是思想之母，时间是理论之源。只要我们善于聆听时代的声音，勇于坚持真理，修正错误，二十一世纪中国的马克思主义一定能够展现出更强大、更有说服力的真理力量！ 摘自习近平《决胜全面建成小康社会夺取新时代中国特色社会主义伟大胜利——在中国共产党第十九次全国代表大会上的报告》 （1）如何理解“实践是检验真理的唯一标准”？（5 分） （2）从实践标准的绝对性与相对性的关系，谈谈你对“实践没有止境，理论创新也没有止境”的认识。（5 分）","options":{},"answer":""},{"year":2019,"no":35,"type":"分析","stem":"结合材料回答问题材料1 深圳故事始于改革开放之初。当时，以时任广东省委第一书记习仲勋同志为代表的改革先行者向中央提出创办对外加工贸易区的设想建议，邓小平同志审时度势，创造性地提出“可以划出一块地方，就叫做特区”。 1980 年，深圳蛇口工业区一声炮响，拉开了经济特区建设大幕。特区建立前，深圳还只是一个仅有两条小巷和一条200 米长小街的小渔村；今天的深圳，已是一座充满魅力、动力、活力和创新力的现代化国际化大都市，创造了工业化、城市化、现代化发展的奇迹，被誉为中国改革开放的“样板间”。如果把视线聚焦到党的十八大以来这五年多，深圳故事更是精彩纷呈。五年来，深圳扎实践行习近平新时代中国特色社会主义思想，不断在高质量发展中发力，发展动力持续增强，百姓福祉稳步改善，城市文明进一步提升，绿色发展特质更显更加凸显。在中国特色社会主义新时代，深圳依然是改革开放的排头兵。 作为我国改革开放的重要起源地和中国特色社会主义忠实践行地，深圳故事连着中国故事，深圳的成就是中华民族实现从站起来到富起来、并迎来从富起来到强起来伟大飞跃的生动缩影。改革开放40 年来，接可比价格计算，我国国内生产总值年增长率约9.5%，7 亿多人成功脱贫：中国成为世界第二大经济体，连续多年对世界经济增长贡献率超过30%，特别是党的十八大以来，以习近平同志为核心的党中央以前所未有的决心和力度，把改革开放提升到新的战略高度，推动党和国家事业取得历史性成就、发生历史性变革。40 年的辉煌成就充分证明，改革开放是决定当代中国命运的关键抉择，是当代中国发展进步的活力之源。 摘编自《人民日报》（2018 年4 月10 日、5 月21 日） 材料2 2012 年12 月，习近平总书记在党的十八大后首次离京考察，首站即到改革开放中得风气之先的深圳， 现场回顾中国改革开放的历史进程，宣示继续推进改革开放的坚定信念，他指出，改革开放是我们党的历史上一次伟大的觉醒，正是这个伟大觉醒孕育了新时代从理论到实践的伟大创造，现在我国改革开放已经进入攻坚期和深水区，我们必须以更大的政治勇气和智慧，不失时机深化重要领域改革。 时隔近6 年，习近平总书记于2018 年10 月再次南下广东，他考察调研时指出，党的十八大后我考察调研的第一站就是深圳，改革开放40 周年之际再来这里，就是像要向全世界宣示中国改革不停顿，开放不止步， 我们要不忘改革开放初心，认真总结改革开放40 年成功经验，提升改革开放质量和水平，他反复强调，进入新时代，国际国内形势发生广泛而深刻变化，改革发展面临的新形势任务新挑战，必须以改革开放的眼光看待改革开放，抓住机遇、迎接挑战，高举新时代改革开放旗帜，继续全面深化改革，全面扩大开放。 摘编自《人民日报》（2018 年10 月26 日），人民网（2018 年10 月26 日） （1）为什么说“","options":{},"answer":""},{"year":2019,"no":36,"type":"分析","stem":"结合材料回答问题： 材料1 马克思主义不仅深刻改变了世界，也深刻改变了中国，中华民族在几千年的历史进程中创造了灿烂的中华文明，为人类文明进步作出了重大贡献。1840 年鸦片战争以后，西方列强凭着坚船利炮野蛮轰开了中国的大门，中华民族陷入内忧外患的悲惨境地。 近代以后，争取民族独立、人民解放和实现国家富强，人民幸福就成为了中国人民的历史任务。在旧式的农民战争走到尽头，不触动封建根本的自强运动和改良主义屡屡碰壁，资产阶级革命派领导的革命和西方资本主义的其它种种方案纷纷破产的情况下，十月革命一声炮响，为中国送来了马克思列宁主义，给苦苦探寻救亡图存出路的中国人民指明了前进方向，提供了全新选择。 中国共产党诞生后，中国共产党人把马克思列宁主义基本原理同中国革命和建设具体实际结合起来，团结带领人民经过长期奋斗，完成新民主主义革命和社会主义革命，建立起中华人民共和国和社会主义基本制度，进行了社会主义的艰辛探索，实现了中华民族从东亚病夫到站起来的伟大飞跃。 改革开放以来，中国共产党人把马克思列宁主义基本原理同中国改革开放的具体实际结合起来，团结带领人民进行建设中国特色社会主义新的伟大实践，使中国大踏步赶上了时代，实现了中华民族从站起来到富起来的伟大飞跃。 材料2 经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。 中国特色社会主义进入新时代，意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景，意味着科学社会主义在二十一世纪的中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜，意味着中国特色社会道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。 摘自习近平《决胜全面建成小康社会度夺取新时代中国特色社会主义伟大胜利——在中国共产党第十九次全国代表大会上的报告》 （1）如何理解马克思列宁主义给中国人民“指明了前进方向，提供了全新选择”？（5 分） （2）中华民族实现了从东亚病夫到站起来，从站起来到富起来的伟大飞跃，并迎来了从富起来到强起来的伟大飞跃说明了什么？","options":{},"answer":""},{"year":2019,"no":37,"type":"分析","stem":"结合材料回答问题： 2018 年9 月30 日，在我国第五个烈士纪念日到来之时，党和国家领导人同各界代表向天安门广场人民纪念英雄敬献花篮，表达着13 亿多人民对英烈的深切缅怀和崇高敬意。 人民英雄纪念碑基座上镶嵌的8 幅革命历史浮雕，镌刻了从虎门销烟到解放战争时期为争取民族独立和人民幸福而牺牲的人民英雄。这一纪念中国革命胜利的全景图，凝聚了无数先烈的铁骨精魂，更象征着中国人民不忘历史、砥砺奋进的民族精神。 欲知大道，必先为史。习近平总书记指出：“历史是一面镜子。以史为鉴，才能避免重蹈覆辙。对历史， 我们要心存敬畏、心怀良知。历史无法改变，但未来可以塑造。” “天地英雄气，千秋尚凛然。”一个有希望的民族不能没有英雄，一个有前途的国家不能没有先锋。英雄烈士的事迹和精神是中华民族共同的历史记忆和宝贵的精神财富。 一段时间以来，历史虚无主义思潮沉渣泛起。社会上质疑英雄烈士、歪曲历史的现象和行为不时出现， 造成了极其恶劣的社会影响，引起了社会舆论的高度关注。 在社会各界不断的呼声中，2018 年4 月27 日，十三届全国人大常委会第二次会议全票表决通过了《中华人民共和国英雄烈士保护法》，英雄烈士的姓名、肖像、名誉、荣誉受法律保护，禁止歪曲、丑化、亵渎、 否定英雄烈士的事迹和精神，宣扬、美化侵略战争和侵略行为将被依法惩处直至追究刑责。 英雄烈士保护法生效一个月后，最高人民法院、最高人民检察院相继下发通知要求依法惩处侵害英雄烈士权益、形象等违法行为；文化和旅游部部署现查处抹黑英雄烈士等违法违规经营行为；各主要互联网文化单位纷纷采取措施清理违规信息、视频和账号；多地检察机关针对侵害英雄烈士名誉等问题依法启动诉讼程序。 “昨天你用生命捍卫我们，今天我们用法律保护你，”网友真挚的话语道出了人们对英雄烈士的敬意和爱戴。 从设立烈士纪念日“立大德于社会”，到缅怀英雄烈士仪式“扬大义于国家”，再到制定英雄烈士保护法“布大信于天下”，一系列致敬英烈、崇尚英雄的国家行为，筑起了民族复兴征程的闪亮灯塔。 摘编自《光明日报》（2018 年4 月6 日），《人民日报》（2018 年6 月13 日、10 月1 日等） （1）如果理解“英雄烈士的事迹和精神是中华民族共同的记忆和宝贵的精神财富”？（5 分） （2）从法律社会作用的角度，分析为什么要用法律的名义保护英雄烈士？（5 分）","options":{},"answer":""},{"year":2019,"no":38,"type":"分析","stem":"请结合材料回答问题 2018 年，中国相继举办了四大主场外交活动：博鳌亚洲论坛年会、上海合作组织峰会、中非合作论坛峰会、中国国际进口博览会。习近平悉数出席并作重要主旨演讲，深入阐述了构建人类命运共同体重要思想， 为世界发展提供了中国智慧、中国方案，产生了日益广泛而深远的国际影响。主场外交是党的十八大以来中国外交一大亮点，已成为全新的“中国名片”。 坚持开放共赢共创美好未来 2018 年4 月10 日，习近平在博鳌亚洲论坛年会开幕式上发表题为《开放共创繁荣创新引领未来》的主旨演讲，强调“中国开放的大门不会关闭，只会越开越大！”“让我们坚持开放共赢，勇于变革创新，向着构建人类命运共同体的目标不断迈进，共创亚洲和世界的美好未来！” 面向未来，习近平为各国携手构建新型国际关系、构建人类命运共同体进一步明确了路径：相互尊重、 平等相待；对话协商、共担责任；同舟共济、合作共赢；兼容并蓄、和而不同；敬畏自然、珍爱地球。 弘扬“上海精神”增添时代内涵 2018 年6 月10 日，上海合作组织扩员后的首次峰会在青岛举行，习近平在题为《弘扬“上海精神”构建命运共同体》的重要讲话中强调，“上海精神”是上合组织的灵魂和共同财富，必须加以坚持和弘扬，习近平提出的发展观、安全观、合作观、文明观和全球治理观，为“上海精神”增添了新的时代内涵，赋予上合组织新的历史史命。 习近平呼吁各方齐心协力构建共命运共同体，经各方协商一致，“确定人类命运共同体的共同理念”被写入青岛宣言，成为上合组织8 国最重要的政治共识和努力目标. 中非携手同心共同促进发展 2018 年9 月3 日，习近平在中非合作论坛北京峰会发表题为《携手共命运同心促发展》的主旨讲话， 对中非特色鲜明的合作共赢之路，做出清晰概括：真诚友好、平等相待，义利相兼，以义为先；发展为民， 务实高效，开放包容、兼收并蓄。习近平提出要携手打造责任共担，合作共赢、幸福共享、文化共兴，安全共筑、和谐共生的中非命运共同体；在中中非合作计划全面落实的基础上，未来三年和今后一段时间重点实施“人大行动”为构建更加紧密的中非命运共同体指明了行动路径，为推动构建人类命运共同体树立了典范。 扩大对外开放机遇世界共享 2018 年11 月5 日，首届中国国际进口博览会在上海隆重举行，习近平《共建创新包容的开放型世界经济》的主旨演讲中强调更高水平的脚步不会停滞！中国推动建设开放型世界经济的脚步不能停滞！中国推动构建人类命运共同体的脚步不会停滞！习近平同志强调，中国国际进口博览会不是中国的独唱，而是各国合唱，中国将在激发进口潜力，持续放宽市场的准入，营造国际一流营商环境，打造对外开放新高地，推动多边和双边合作深入发展等方面加大进一步开放的力度。与世界各国向着构建人类命运共同体目标不懈奋进， 开创人类更加美好的未来。 摘编自《人民日报》 （1","options":{},"answer":""},{"year":2020,"no":1,"type":"单选","stem":"恩格斯于1820 年11 月28 日出生在德国巴门市的一个工厂主家庭。他称自己一生所做的事就是“拉第二小提琴”。恩格斯不仅与马克思一起创立马克思主义，参加并指导国际工人运动，而且在传播和发展马克思主义方面作出了杰出的贡献。恩格斯全面阐述马克思主义理论体系的著作是（ ）","options":{"A":"《共产党宣言》","B":"家庭、私有制和国家的起源","C":"《反杜林论》","D":"《自然辩证法》"},"answer":"C"},{"year":2020,"no":2,"type":"单选","stem":"逐渐“飞入寻常百姓家”的人工智能对人类的社会生活产生了巨大影响，对此，技术乐观派认为人工智能为人类发展更新了“发动机”，悲观派则认为人工智能的发展可能导致“人类的终结”。对人工智能社会效用的评价是（ ）","options":{"A":"对客观事物发展规律的真理性评价","B":"对主体需要发展程度的认知性评价","C":"受主体情感、兴趣和爱好影响的主观性评价","D":"对客观事物的属性及其满足主体需要的价值性评价"},"answer":"D"},{"year":2020,"no":3,"type":"单选","stem":"在相同的劳动时间里，复杂劳动创造的价值大于简单劳动创造的价值。在以私有制为基础的商品经济条件下，复杂劳动转化为简单劳动（ ）","options":{"A":"是商品生产者自觉计算出来的","B":"是市场管理部门事先规定的","C":"是商品生产者协商出来的","D":"是商品交换过程中市场机制自发实现的"},"answer":"D"},{"year":2020,"no":4,"type":"单选","stem":"十月革命之前，列宁总结当时变化了的新情况，得出“社会主义可能首先在少数甚至在单独一个资本主义国家内获得胜利”的结论。列宁得出这个结论的理论依据是（ ）","options":{"A":"资本主义经济和政治发展不平衡规律","B":"资本主义国家的不断衰落","C":"科学社会主义理论的广泛传播","D":"无产阶级力量的不断壮大"},"answer":"A"},{"year":2020,"no":5,"type":"单选","stem":"“什么是社会主义?怎样建设社会主义?”是邓小平在领导改革开放的现代化建设这一新的革命过程中，不断提出和反复思考的、首要的基本理论问题，搞清楚这一问题的关键是（ ）","options":{"A":"在认清基本国情的基础上，进一步把握我国社会主义的发展阶段","B":"在正确分析我国社会主义矛盾的基础上，进一步明确社会主义的根本任务","D":"在总结我国社会主义历史经验的基础上，进一步揭示社会主义社会发展的一般规律","C":"在坚持我国社会主义基本制度的基础上，进一步揭示社会主义的本质"},"answer":"C"},{"year":2020,"no":6,"type":"单选","stem":"实体经济是一国经济的立身之本和财富之源，是国家强盛的重要支撑，党的十九大报告指出，建设现代化经济体系必须着力发展实体经济，全面提升实体经济发展水平，我国全面提升实体经济的重点是 （ ）","options":{"A":"加快发展先进制造业","B":"深化要素市场化配置改革","C":"加大人力资本培育力度","D":"持续推进“三去一降一补”"},"answer":"A"},{"year":2020,"no":7,"type":"单选","stem":"2019 年9 月20 日，习近平在中央政协工作会议暨庆祝中国人民政治协商会议成立70 周年大会上的讲话中，提出了新时代加强和改进人民政协工作的总体要求，指出新时代做好人民政协工作的中心环节是 （ ）","options":{"A":"提高政治协商、民主监督、参政议政水平","C":"发挥好人民政协专门协商机构作用","D":"强化政协委员责任担当","B":"加强思想政治引领，广泛凝聚共识"},"answer":"B"},{"year":2020,"no":8,"type":"单选","stem":"1979 年1 月1 日，全国人民代表大会常务委员会发表《告台湾同胞书》，郑重宣示争取祖国和平统一的大政方针，揭开了两岸关系发展新的历史篇章。2019 年1 月2 日，习近平在《告台湾同胞书》发表 40 周年纪念会上的讲话中指出:“在一个中国原则基础上，台湾任何政党、团体同我们的交往都不存在障碍。以对话取代对抗、以合作取代争斗、以双赢取代零和，两岸关系才能行稳致远。”影响两岸关系行稳致远的总根子是（ ）","options":{"A":"两岸对历史现状缺乏认同","B":"两岸长期存在的政治分歧","C":"“台独”分裂势力的存在","D":"外部势力的干涉"},"answer":"B"},{"year":2020,"no":9,"type":"单选","stem":"近代以来中华民族面临着争取民族独立、人民解放和实现国家富强、人民富裕两大历史任务。近代中国的历史表明，要争得民族独立和人民解放，必须首先（ ）","options":{"A":"发展教育提高国民素质","B":"废除封建地主土地所有制","C":"改变经济技术落后的面貌","D":"进行反帝反封建的民主革命"},"answer":"D"},{"year":2020,"no":10,"type":"单选","stem":"1905 年至1907 年间，资产阶级革命派和改良派进行了一场大论战，双方论战的焦点是（ ）","options":{"A":"要不要以革命手段推翻清王朝","B":"要不要推翻帝制实行共和","C":"要不要社会革命","D":"要不要发动广大民众"},"answer":"A"},{"year":2020,"no":11,"type":"单选","stem":"中国共产党一经成立，中国革命就展现了新的面貌。不久中国共产党就开始采取民族资产阶级， 小资产阶级的政党和政治派别没有采取过也不可能采取的路线，即（ ）","options":{"A":"土地革命的方法","B":"群众路线的方法","C":"统一战线的方法","D":"武装斗争的方法"},"answer":"B"},{"year":2020,"no":12,"type":"单选","stem":"1956 年社会主义改造基本完成。随着中国建立了社会主义基本政治制度，社会主义基本经济制度也建立起来。中国社会主义基本制度的建立，标志着（ ）","options":{"A":"进入了全面建设社会主义的历史阶段","B":"半殖民地半封建社会结束","C":"社会主义工业化已经初步实现","D":"新民主主义革命基本胜利"},"answer":"A"},{"year":2020,"no":13,"type":"单选","stem":"全面推进依法治国，涉及立法、执法、司法、守法等各个方面，涉及中国特色社会主义事业“五位一体”总体布局的各个领域，必须加强顶层设计、统筹谋划，在实际工作中必须有一个总揽全局、牵引各方的总抓手。全面依法治国的总抓手是（ ）","options":{"A":"依法治国和以德治国相结合","B":"建设中国特色社会主义法治体系","C":"坚持有法可依有法必依","D":"坚持科学立法严格执法"},"answer":"B"},{"year":2020,"no":14,"type":"单选","stem":"习近平在纪念五四运动100 周年大会上的讲话中指出:“爱国主义是我们民族精神的核心，是中华民族团结奋斗、自强不息的精神纽带。”“对每一个中国人来说，爱国是本分，也是职责，是心之所系、 情之所归。对新时代中国青年来说，热爱祖国是立身之本、成才之基。”当代中国爱国主义的本质就是 （ ）","options":{"A":"坚持爱国和爱党、爱社会主义高度统一","B":"维护社会和谐和民族平等的统一","C":"对民族和文化的归属感、认同感的统一","D":"坚持立足民族和面向世界的统一"},"answer":"A"},{"year":2020,"no":15,"type":"单选","stem":"2019 年11 月，中共中央、国务院印发的《新时代爱国主义教育实施纲要》指出，爱国主义是中华民族的民族心、民族魂，是中华民族最重要的精神财富，是中国人民和中华民族维护民族独立和民族尊严的强大精神动力。新时代爱国主义教育要面向全体人民、聚焦青少年。当前，对青少年进行爱国主义教育的主阵地是（ ）","options":{"A":"手机和互联网","B":"精品读物","C":"思想政治理论课","D":"传统节日纪念活动"},"answer":"C"},{"year":2020,"no":16,"type":"单选","stem":"2019 年8 月2 日，美国宣布正式退出《中导条约》(全称《苏联和美国消除两国中程和中短程导弹条约》)。其真实原因是（ ）","options":{"A":"俄罗斯首先违约","B":"谋求全球战略平衡与稳定","C":"自我松绑谋求绝对军事优势","D":"其他国家不受条约限制"},"answer":"C"},{"year":2020,"no":17,"type":"多选","stem":"2019 年4 月10 日晚9 点，全球多国科研人员合作的“事件视界望远镜”项目在全球六地同步举行新闻发布会，发布了世界上首张黑洞图像，公布了人类首次拍到的黑洞照片，这是继2015 年人类通过引力波视测“听到”两个“黑洞”合体之后，证明黑洞存在的直接“视界”证据。有科学家认为，这张看起来有点模糊的照片意义非凡，它再次验证了爱因斯坦广义相对论的预言是对的，并将进一步帮助科学家解答星系演化等一系列宇宙本质问题。人类首次“看到”黑洞正面照表明（ ）","options":{"A":"空间的性质依赖于物质的分布及其运动状态","B":"世界是物质的统一体","C":"物质世界的客观存在与人的实践和认识水平有关","D":"空间的观念随着人的认识发展而拓展"},"answer":"AB"},{"year":2020,"no":18,"type":"多选","stem":"2019 年10 月24 日，中共中央政治局就区块链技术发展现状和趋势进行集体学习。习近平在主持学习时指出，我们要提高运用和管理区块链技术能力，使区块链技术在建设网络强国、发展数字经济、助力经济社会发展等方面发挥更大作用。有专家认为，基于区块链技术，人们可以构建在没有中介辅助下多个参与方之间的资产交易、价值传递的网络，通过建立执行智能合约，推动契约关系和规则的维护和履行， 降低信用建立成本，营造良好市场环境。区块链技术所实现的人与人之间相互联系的延伸和变化，表明人们的现实社会关系（ ）","options":{"A":"一种单纯的经济和商业关系","B":"具有多样性和复杂性的特征","C":"归根到底受生产关系的制约","D":"由信息技术构造的虚拟关系"},"answer":"BC"},{"year":2020,"no":19,"type":"多选","stem":"一方水土孕育一方文化。很早以前，人们就在平原、高原、山地、河谷，海域等广阔的地理空间发展出农耕、渔猎、游牧等不同经济形态，进而形成具有明显地域差别的文化。高铁、互联网等虽然极大消除了不同地域空间之间的界限，加速地域文化的同质性转化，但地域文化并没有消失，还在持续对当代社会发展产生重要影响。“一方水土孕育一方文化”表明（ ）","options":{"A":"社会经济状况决定文化发展形态","B":"自然地理空间影响文化的外在特征","C":"文化是人类社会发展的决定力量","D":"不同形态文化的发展具有相对独立性"},"answer":"AD"},{"year":2020,"no":20,"type":"多选","stem":"资本循环是资本实现价值增殖的重要前提。所谓资本循环，是指资本从一种形式出发，经过一系列形式的变化，又回到原来出发点的运动，产业资本循环过程中在空间上同时存在的资本形式有（ ）","options":{"A":"生产资本","B":"借贷资本","C":"货币资本","D":"商品资本"},"answer":"ACD"},{"year":2020,"no":21,"type":"多选","stem":"为了加强对各国垄断资本的协调和制约。第二次世界大战后，国际垄断资本建立了国际货币基金组织，世界银行和世界贸易组织等国际经济机构。这些国际经济机构在协调和合作的基础上促进了经济全球化的发展，主要表现在（ ）","options":{"A":"加强了各国和各经济体之间的联系","B":"推动了商品和服务贸易的迅速增加","C":"有效应对全球性经济波动和经济危机","D":"加快了资本和技术等要素的国际流动"},"answer":"ABD"},{"year":2020,"no":22,"type":"多选","stem":"中国特色社会主义进入新时代，人民群众的新期待内容更广泛。不仅关注“有没有”，更关注“好不好”;不仅包括既有的物质文化需求，更包括在此基础上衍生出来的获得感。幸福感、安全感及尊严、权利等新需求。这一变化表明（ ）","options":{"A":"我国社会主要矛盾发生了历史性变化","B":"我国已经满足了人民“从有到优”的需求","C":"人民群众对日益增长的物质文化需要出现了阶段性新特征","D":"我国不平衡不充分的发展已成为制约满足人民需要的主要因素"},"answer":"ACD"},{"year":2020,"no":23,"type":"多选","stem":"深圳经济特区是我国改革开放的排头兵和重要窗口。2019 年8 月，中共中央、国务院印发《关于支持深圳建设中国特色社会主义先行示范区的意见》，要求深圳建设成为高质量发展高地，法治城市示范， 城市文明典范，民生幸福标杆，可持续发展先锋。支持深圳建设中国特色社会主义先行示范区，有利于 （ ）","options":{"A":"更好实施粤港澳大湾区战略，丰富“一国两制”事业发展新实践","B":"在更高起点，更高层次，更高目标上推进改革开放","C":"率先探索全面建设社会主义现代化国家新路径","D":"破解制约建成小康社会重点难点问题"},"answer":"ABC"},{"year":2020,"no":24,"type":"多选","stem":"消除贫困，改善民生，逐步实现共同富裕，是社会主义的本质要求，是我们党的重要使命，新中国成立70 余年，我国已有7 亿多人摆脱贫困，占全球减贫人口的70%以上，中国是第一个完成联合国千年发展目标中减贫目标的发展中国家，也是唯一一个实现了经济较快增长，与大规模减贫同步，综合国力增强与人民生活水平提高同步，这一历史跨越的发展中国家。进入新时代，为了确保到2020 年现行标准下农村贫困人口实现脱贫，贫困县全部摘帽的目标，我国的重要举措是（ ）","options":{"A":"坚持精准扶贫，精准脱贫","B":"强化党政一把手负总责的责任制","C":"注重扶贫同扶志扶智相结合","D":"重点攻克深度贫困地区脱贫任务"},"answer":"ABCD"},{"year":2020,"no":25,"type":"多选","stem":"从1956 年我国建立第一个自然保护区鼎湖保护区，到目前全国已拥有了2750 个自然保护区，面积147 万平方公里，约占陆域国土面积15%，自党的十八届三中全会决定“建立国家公园体制”以来，涉及12 个省，总面积约为22. 29 万平方公里，我国建立以国家公园为主体的自然保护地体系的意义是（ ）","options":{"A":"推进自然生态保护，建立美丽新中国","B":"保护重要的自然生态系统和独特的自然遗产","C":"促进人与自然和谐共生","D":"维护国家生态安全"},"answer":"ABCD"},{"year":2020,"no":26,"type":"多选","stem":"止暴制乱、恢复秩序是香港当前最紧迫的任务。贯彻落实“一国两制”方针，绝不能允许触碰的原则底线是（ ）","options":{"A":"危害国家主权安全","B":"干扰内地与香港的民间交流","C":"挑战中央权力与香港特别行政区基本法权威","D":"利用香港对内地进行渗透破坏"},"answer":"ACD"},{"year":2020,"no":27,"type":"多选","stem":"鸦片战争后，资本列强通过发动侵略战争，强迫中国签订一系列不平等条约。但列强也没能如英国在印度那样，对中国实施殖民统治，这是因为（ ）","options":{"A":"中国人民顽强、持久的反抗","B":"列强间争夺中国的矛盾无法协调","C":"中国封建势力拒绝与列强合作","D":"中国长期以来是一个统一的大国"},"answer":"ABD"},{"year":2020,"no":28,"type":"多选","stem":"在北洋军阀反动统治的艰难环境中，以李大钊为代表的早期马克思主义者掀起了一场研究、传播马克思主义的运动。这场运动从一开始就（ ）","options":{"A":"注意从中国实际出发学习运用马克思主义理论","B":"重视对马克思主义基本理论的学习","C":"提出知识分子同劳动群众相结合的思想","D":"明确提出马克思主义与中国实际相结合的命题"},"answer":"ABC"},{"year":2020,"no":29,"type":"多选","stem":"1950 年6 月，朝鲜战争爆发，美国宣布武装干涉南朝鲜，同时命令其海军第七舰队，开入台湾海峡，“阻止对台湾的任何进攻”公然干涉中国内政。中国政府在美国把战火烧到鸭绿江边的时候，毅然做出抗美援朝的决定。中朝两国人民及其军队经过艰苦作战以及谈判斗争，终于在1953 年7 月迫使美国代表在停战协定上签字。克拉克后来回忆录中沮丧地写到：“我是美国历史上第一个，在没有取得胜利的停战协定上签字的司令官”。抗美援朝战争的胜利（ ）","options":{"A":"打退了美国侵略扩张的势头，结束美国在东方的霸权","B":"提高了新中国的国际威望，为新中国赢得了相对稳定的和平环境","C":"捍卫了中国的国家安全，为维护亚洲和世界和平，做出了贡献","D":"打破了美国军队不可战胜的神话，增强了中国人民的信心和自豪感"},"answer":"BCD"},{"year":2020,"no":30,"type":"多选","stem":"2019 年10 月，中共中央国务院印发的《新时代公民道德建设实施纲要》是在中国特色社会主义进入新时代的背景下，推动我国精神文明建设再上新高度，为实现中华民族伟大复兴中国梦凝心铸魂的指导性文件，新时代公民道德建设的重点任务是（ ）","options":{"A":"传承中华传统美德","B":"培育践行社会主义核心价值观","C":"筑牢理想传承之基","D":"弘扬民族精神和时代精神"},"answer":"ABCD"},{"year":2020,"no":31,"type":"多选","stem":"法律规定公民有表达权，但权力要依法行使，尤其是“自媒体”时代，人人都有“麦克风”，处处都是“直播间”，这支“麦克风”并不是可以随心所欲使用的，应以法律的相关规定为界限，对行使法律界限的正确理解是（ ）","options":{"A":"权利行使的方式具有唯一性","B":"权利行使要有目的的正当性","C":"权利行使不能超过法定的限度","D":"权利行使要遵循程序正当的原则"},"answer":"BCD"},{"year":2020,"no":32,"type":"多选","stem":"2019 年1 月3 日10 时26 分，嫦娥四号探测器成功着陆，月球背面预选着陆区，并通过“鹊桥” 中继星传回了月背影像图，揭开了古老月背的神秘面纱。这次月球探测（ ）","options":{"A":"实现了人类探测器首次月背软着陆","B":"开启了我国太空站建设的序幕","C":"实现了首次月背与地球的中继通信","D":"开启了人类月球探测新篇章"},"answer":"ACD"},{"year":2020,"no":33,"type":"多选","stem":"2019 年是中俄建交70 周年，应俄罗斯总统普京邀请，6 月5 日至7 日，习近平主席对俄罗斯进行国事访问并出席第二十三届圣彼得堡国际经济论坛，在中俄建交70 周年纪念大会讲话中， 习近平对“新时代的中俄关系”提出的主张是（ ）","options":{"A":"始终以互信为基石，巩固彼此战略依托","B":"着力深化利益交融，拉紧共同利益纽带","C":"促进民心相通，夯实世代友好的民意基础","D":"要更加担当有为，携手维护世界和平安宁"},"answer":"ABCD"},{"year":2020,"no":34,"type":"分析","stem":"结合材料回答问题： 人类在大面积地驯化种植农作物以获取食物的过程中，一刻也没有停止过同病虫害的斗争。在上世纪 40 年代，为遏止庄稼发生病虫害，人类发明了化学农药。然而，化学农药在迅速杀死害虫、有效保护农作物的同时，对环境和农产品的危害也很快显现出来。于是，科学家们开始在生物防治领域寻找新的突破。 生物防治就是利用自然界的某种生物来控制有害生物。这种防治病虫害的方法大大减轻了对环境和农产品的危害，提升了农产品的安全性和品质。 生物防治的方法，其实就是充分利用了自然界“一物降一物”的平衡法则。例如，水花生原产于南美洲，这种看起来很寻常的植物，生命力极其顽强，一颗植物一年就可以发展成一大片，如不及时清除，农作物很可能会绝收。水花生不仅侵占农田、林地，还侵染塘堰及沟渠，堵塞水道，限制水流，增加沉积，造成局部水域的水体交换受阻、水质恶化、水体缺氧、鱼蟹大面积死亡。在公共绿地和居民区生长蔓延，还会传播多种寄生虫。为了防止水花生泛滥，农业技术人员最初分别尝试了物理防治和化学防治，如采取人工打捞、机械粉碎等手段。但物理防治手段成本高，而且加剧水花生蔓延;化学防治则会将其他水生植物一并杀死，还会带来农药次生污染。通过实地调研，农业技术人员最终确定采用生物防治手段，引进水花生叶甲。叶甲的神奇之处在于它具有专食性，只吃水花生，不会对一般农作物造成祸害。 再如，大棚菜容易产生一种暗红色的叶螨，科学家就找到了一种叶螨的天生“死对头”捕食蟎，巧妙地化解了这个难题。生物防治帮助人们跳出了防治病虫害必须用化学农药的传统思维模式。据统计，我国每年应用生物防治技术的农作物面积达4 亿至5 亿亩次，“十三五”期间，还力争将有害生物绿色防控率提高至40%以上。生物防治技术成为农业病虫害治理的又一项创新之举。跳出传统思维模式，创新之路会越走越宽，这是生物防治带给我们的重要启示。 - 6 - ——摘编自《人民日报》(2018 年5 月18 日、2019 年1 月22 日) (1)分析自然界中的“一物降一物”平衡法则所体现的唯物辩证法原理。 (2)为什么说“跳出传统思维模式，创新之路会越走越宽”?","options":{},"answer":""},{"year":2020,"no":35,"type":"分析","stem":"结合材料回答问题: 材料1 建设社会主义现代化国家、实现中华民族伟大复兴，是我们党孜孜以求的宏伟目标。自成立以来，我们党就团结带领人民为此进行了不懈奋斗。随着改革开放逐步深化，我们党对制度建设的认识越来越深入。 1980 年，邓小平同志在总结“文化大革命”的教训时就指出：“领导制度、组织制度问题更带有根本性、 全局性、稳定性和长期性。”“制度好可以使坏人无法任意横行，制度不好可以使好人无法充分做好事， 甚至会走向反面。”1992 年，邓小平同志在南方谈话中说:“恐怕再有三十年的时间，我们才会在各方面形成一整套更加成熟、更加定型的制度。”党的十四大提出:“到建党一百周年的时候，我们将在各方面形成一整套更加成熟更加定型的制度。”党的十五大、十六大、十七大都对制度建设提出明确要求。 党的十八大以来，我们党把制度建设摆到更加突出的位置，强调“构建系统完备、科学规范、运行有效的制度体系，使各方面制度更加成熟更加定型”。党的十八届三中全会首次提出“推进国家治理体系和治理能力现代化”这个重大命题，并把“完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化”确定为全面深化改革的总目标。党的十八届五中全会进一步强调，“十三五”时期要实现“各方面制度更加成熟更加定型，国家治理体系和治理能力现代化取得重大进展，各领域基础性制度体系基本形成”。 党的十九大作出到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国的战略安排……党的十九届二中、三中全会分别就修改宪法和深化党和国家机构改革作出部署，在制度建设和治理能力建设上迈出了新的重大步伐。党的十九届三中全会指出:“必须加快推进国家治理体系和治理能力现代化，努力形成更加成熟更加定型的中国特色社会主义制度”。 ——摘自习近平《关于(中共中央关于坚持和完善中国特色社会主义制度推进国家治理体系和治理能力现代化若干重大问题的决定)的说明》 材料2 中国特色社会主义制度是党和人民在长期实践探索中形成的科学制度体系，我国国家治理一切工作和活动都依照中国特色社会主义制度展开，我国国家治理体系和治理能力是中国特色社会主义制度及其执行能力的集中体现。 实践证明，中国特色社会主义制度和国家治理体系是具有强大生命力和巨大优越性的制度和治理体系， 是能够持续推动拥有近十四亿人口大国进步和发展、确保拥有五千多年文明史的中华民族实现“两个一百年”奋斗目标进而实现伟大复兴的制度和治理体系。 坚持和完善中国特色社会主义制度，推进我国国家治理体系与治理能力现代化的总目标是，到我们党成立一百年时，在各方面制度更加成熟更加定型上取得明显成效;到2035 年，各方面制度更加完善，基本实现国家治理水平和治理能力现代化，使中国特色社会主义制度更加巩固、优越性充分体现。 推进全面深化改革，既要保持中国特色社会主义制度与我国国","options":{},"answer":""},{"year":2020,"no":36,"type":"分析","stem":"结合材料回答问题: 材料1 在庆祝新中国成立70 周年前夕，中共中央总书记习近平于2019 年9 月12 日专程前往 - 7 - 中共中央北京香山革命纪念地，瞻仰双清别墅、来青轩等革命旧址，参观香山革命纪念馆，观看《为新中国奠基》主题展览，回顾中国共产党领导中国人民夺取全国胜利和党中央筹建中华人民共和国的光辉历史，缅怀毛泽东同志等老一辈革命家的丰功伟绩。 参观结束时，习近平发表了重要讲话。他指出，1949 年3 月23 日，中共中央和毛泽东同志离开西柏坡前往北平，25 日进驻香山，这里成为党中央所在地。中共中央在香山虽然只有半年时间，但这里是我们党领导解放战争走向全国胜利、新民主主义革命取得伟大胜利的总指挥部，是中国革命重心从农村转向城市的重要标志，在中国共产党的历史上、中华人民共和国的历史上具有非常重要的地位。习近平强调，我们缅怀这段历史，就是要继承和发扬老一辈革命家“宜将剩勇追穷寇，不可沽名学霸王”的革命到底精神， 不断增强中国特色社会主义的道路自信、理论自信、制度自信、文化自信，勇于进行具有许多新的历史特点的伟大斗争，坚决战胜前进道路上的各种艰难险阻，使“中国号”这艘巨轮继续破浪前进、扬帆远航。 ——摘编自《人民日报》(2019 年9 月13 日) 材料2 2019 年10 月1 日，中共中央总书记、国家主席、中央军委主席习近平在庆祝中华人民共和国成立70 周年大会上的讲话中指出： 70 年前的今天，毛泽东同志在这里向世界庄严宣告了中华人民共和国的成立，中国人民从此站起来了。 这一伟大事件，彻底改变了近代以后100 多年中国积贫积弱、受人欺凌的悲惨命运，中华民族走上了实现伟大复兴的壮阔道路。 70 年来，全国各族人民同心同德、艰苦奋斗，取得了令世界刮目相看的伟大成就。今天，社会主义中国巍然屹立在世界东方，没有任何力量能够撼动我们伟大祖国的地位，没有任何力量能够阻挡中国人民和中华民族的前进步伐。 中国的昨天已经写在人类的史册上，中国的今天正在亿万人民手中创造，中国的明天必将更加美好。 全党全军全国各族人民需更加紧密地团结起来，不忘初心，牢记使命，继续把我们的人民共和国巩固好、 发展好，继续为实现“两个一百年”奋斗目标、实现中华民族伟大复兴的中国梦而努力奋斗! ——摘自《人民日报》(2019 年10 月2 日) (1)如何理解中共中央在香山虽然只有半年时间，但“在中国共产党历史、中华人民共和国历史上具有非常重要的地位”? (2)为什么说中华人民共和国的成立“彻底改变了近代以后中国100 多年积贫积弱、受人欺凌的悲惨命运”?","options":{},"answer":""},{"year":2020,"no":37,"type":"分析","stem":"2019 年9 月29 日，中华人民共和国国家勋章和国家荣誉称号颁授仪式在人民大会堂隆重举行。95 岁的老英雄张富清是受表彰者之一。 张富清是原西北野战军战上，在解放战争的枪林弹雨中，九死一生，先后荣立特等功一次、一等功三次、二等功一次，“战斗英雄”称号两次。1955 年，他退役转业，主动选择到湖北省最偏远的来凤县工作， 先后任城关粮油所主任，三胡区副区长、区长、建行来凤支行副行长等职务，直至在此岗位上离休。 对工作，他脚踏实地，担当奉献，想群众之所想，急群众之所急，他推动水电站建设。让山村进入“电力时代”:他牵头办起桐油和茶叶基地，牧场，群众生活明显改善:他与群众一起。找水源修道路，解决群众出行难，吃水难的问题…… 对待战功荣誉，他刻意隐瞒，连自己的儿女都不知情。如果不是2018 年一次退役军人的信息采集， 他的事迹可能依旧无人知晓。 很多人不禁好奇，张富清为何一辈子深藏功名?为何在平凡岗位上如此低调奉献却甘之如饴?他在回答记者提问时说:“和我并肩作战的战友，献出了自己宝贵的生命，和牺牲的战友相比，我有什么资格张扬呢? 我和战友们跟着党奋斗的目标是为了建立新中国，就是为了人民能走上幸福美满的道路，这一切都是我应该做的。” 正是有这样的信念。他在每一次的战斗中都要担任“突击队员”;正是有这样的信念，他放弃留在大城市。他的岗位，身份一再改变。始终不变的，是他的赤子之心。 新中国70 年的不凡岁月中，闪耀着一个个光辉的名字，一段段感人的故事。他们不懈奋斗的精神和忠诚，执着，朴实的鲜明品格，是亿万中华儿女的榜样，激励我们在追梦之路 - 8 - 上砥砺前行。 ——摘自《人民日报》(2019 年5 月27 日、9 月24 日、9 月30) (1)结合张富清高尚的追求，说明理想信念的力量。 (2)国家颁发国家勋章和国家荣誉称号，对全社会弘扬和践行社会核心价值观有何重要意义?","options":{},"answer":""},{"year":2020,"no":38,"type":"分析","stem":"结合材料回答问题: 材料1 2018 年11 月5 日，首届中国国际进口博览会(简称进博会)在上海开幕。这是世界上第一个以进口为主题的国家级展会，是国际贸易发展史上一大创举，体现了中国推动发展自由贸易的一贯立场，是中国支持经济全球化的实际行动。共有172 个国家、地区和国际组织参会，3600 多家企业参展，展览总面积达30 万平方米，超过40 万名境内外采购商到会洽谈采购。 在开幕式上，中国国家主席习近平发表了题为《共建创新包容的开放型世界经济》的主旨演讲，明确表示:“中国国际进口博览会由中国主办，世界贸易组织等多个国际组织和众多国家共同参与，不是中国的独唱，而是各国的大合唱……不仅要年年办下去，而且要办出水平，办出成效、越办越好。”习近平阐述了“经济全球化是不可逆转的历史大势”观点：提出了各国应该“坚持开放通融、拓展互利合作空间，坚持创新引领、加快新旧动能转换，坚持包容普惠、推动各国共同发展”的主张;宣布了中国在推进“激发进口潜力，持续放宽市场准入、营造国际一流营商环境、打造对外开放新高地、推动多边和双边合作深入发展”方面的措施。 ——摘编自新华网(2018 年11 月5 日) 材料2 2019 年11 月5 日到10 日，第二届中国国际进口博览会在上海如期举行，共有181 个国家，地区国际组织与会3800 多家企业参展，注册报名的专业采购商和观众达50 万，展览面积33 万平方米，涵盖装备、贸易、汽车、科技生活、品质生活、医疗器械及医药保健、 服务等五大板块、七个展区。不少世界500 强和行业龙头企业的高管亲自带队参展。首发的新产品、新技术超过首届。值得一提的是，美国企业参展数量达192 家，参展面积达4. 75 万平方米， 为所有参展国之首。习近平在开幕式上发表的题为《开放合作，命运与共》的主旨演讲中指出，首届进博会上宣布的中国扩大对外开放的5 方面举措已经基本落实，同有关国家达成的98 项合作事项中，23 项已经办结，47 项正在积极推进，28 项也在跟进推进。习近平明确表示:站在新的历史起点，中国开放的大门只会越开越大，中国将继续扩大市场开放、继续完善开放格局，继续优化营商环境，继续深化多双边合作， 继续推进“带一路”。习近平在欢迎与会各国贵宾时发表的致辞中进一步指出:“中国国际进口博览会交易的是商品和服务，交流的是文化和理念。” ——摘自新华网(2019 年11 月5 日) (1)阐述中国举办国际进口博览会的背景和意义。 (2)为什么说进博会交资方商品和服务，交流的是文化和理念?","options":{},"answer":""},{"year":2021,"no":1,"type":"单选","stem":"马克思和恩格斯首次系统阐述历史唯物主义基本观点的著作","options":{"A":"德意志意识形态","B":"神圣家族","C":"哲学的贫困","D":"共产党宣言"},"answer":"A"},{"year":2021,"no":2,"type":"单选","stem":"人们能从历史中汲取经验教训是因为","options":{"A":"历史规律和自然规律有惊人的相似性性性性性性性性性性性性性","B":"人类历史发展存在着不以人的意志为转移的规律","C":"历史总是在循环往复中不断向前发展","D":"人类已经完全掌握了历史发展的内在规律"},"answer":"B"},{"year":2021,"no":3,"type":"单选","stem":"从社会意识和社会存在的关系看，法律法规","options":{"A":"总是阻碍新技术的健康发展","B":"只能落后于新技术发展","C":"与新技术发展具有不平衡性","D":"归根到底是新技术发展的内在动力"},"answer":"C"},{"year":2021,"no":4,"type":"单选","stem":"马克思指出：资本主义在发展“社会劳动的生产力”的同时进而不自觉的创造着一种更高级的生产形式的物质条件，这表明：","options":{"A":"资本主义生产方式能够无限制解放和发展社会生产力","B":"资本越发展越有利于巩固资本主义","C":"资本越扩张越不利于创造更多的物质财富","D":"资本主义生产是一种历史的、过渡性生产形式"},"answer":"D"},{"year":2021,"no":5,"type":"单选","stem":"毛泽东思想作为马克思主义中国化的第一个重大理论成果，是由一系列相互联系的重要理论观点所构成的科学思想体系这一科学体系所围绕的主题是","options":{"A":"中国革命和建设","B":"中国命运和前途","C":"中国社会性质和阶段状况","D":"中国改革和发展"},"answer":"A"},{"year":2021,"no":6,"type":"单选","stem":"构建新发展格局，是以习同志为核心的党中央积极应对国际国内形势变化，与时俱进提升我国经济发展水平，塑造国际经济合作和竞争新优势提出的战略决策，这一发展格局是","options":{"A":"以体制机制创新为主体，利用好国际国内两个市场","B":"以维护和平稳定为主体，促进国际国内经济复苏","C":"以国内大循环为主体，国内国际双循环相互促进","D":"以发展先进制造业为主体，促进产业结构优化升级"},"answer":"C"},{"year":2021,"no":7,"type":"单选","stem":"改革开放初期，确立了公有制为主体的市场经济，多种所有制共同发展，按劳分配为主体，多种分配制度并存，社会主义市场经济制度等社会主义基本经济制度， 这一基本经济制度中，坚持公有制的主体地位是因为","options":{"A":"公有制是社会主义市场经济的重要组成部分","B":"公有制是我国经济社会发展的重要基础","C":"生产资料所有制决定社会的基本性质和发展方向","D":"由生产资料所有制决定的分配方式能使一切社会成员实现全面发展"},"answer":"C"},{"year":2021,"no":8,"type":"单选","stem":"创新是引领发展的第一动力，必须把创新摆在现代化建设全局的核心地位。 2020 年9 月11 日习在《科学家座谈会上讲话》中指出我国经济发展及改善民生比以往任何时候都需要加强创新这个第一动力，创造更多从“0”到“1”的突破，需要摆在更加突出位置的是","options":{"A":"提升原始创新能力","B":"加快推进消化吸收再创新","C":"加强了企业创新主体地位","D":"改善科技创新"},"answer":"A"},{"year":2021,"no":9,"type":"单选","stem":"洋务运动时期，洋务派兴办了一些企业，少数官办或官商合办，多数是官督商办。这些官督商办的企业是什么性质（ ）","options":{"A":"封建性质企业","B":"半封建性质企业","C":"资本主义性质企业","D":"社会主义性质企业"},"answer":"C"},{"year":2021,"no":10,"type":"单选","stem":"中国人民抗日战争胜利的关键是","options":{"A":"民族意识的觉醒与全民的抗战","B":"反侵略战争的正义性与进步性","C":"世界反法西斯力量的团结与支持","D":"中国共产党中流砥柱的作用"},"answer":"D"},{"year":2021,"no":11,"type":"单选","stem":"人民政协的召开标志着","options":{"A":"民族区域自治制度的建立","B":"工农兵代表大会制度的建立","C":"人民代表大会制度的建立","D":"新型政协制度的建立"},"answer":"D"},{"year":2021,"no":12,"type":"单选","stem":"我国对资本主义工商业的社会主义改造执行的是","options":{"A":"互助合作政策","B":"调整巩固","C":"和平赎买","D":"剥夺没收"},"answer":"C"},{"year":2021,"no":13,"type":"单选","stem":"个人与社会的关系最根本的是","options":{"A":"个人价值与社会价值","B":"个人利益与社会利益","C":"个人理想与社会理想","D":"个人存在与社会存在"},"answer":"B"},{"year":2021,"no":14,"type":"单选","stem":"新时代爱国主义教育的着力点是","options":{"A":"坚持实现中华民族伟大复兴的中国梦","B":"坚持依法治国和以德治国相结合","C":"坚持祖国统一和民族团结","D":"坚持立足中国又面向世界"},"answer":"C"},{"year":2021,"no":15,"type":"单选","stem":"北斗三号全球卫星导航系统建成并开通服务，标志着","options":{"A":"我国卫星导航系统实现了零的突破","B":"我国成为世界上第三个独立拥有全球卫星导航系统的国家","C":"世界所有国家都已使用我国北斗导航系统","D":"我国全球卫星导航系统建设实现了第二步目标"},"answer":"B"},{"year":2021,"no":16,"type":"单选","stem":"2020 年全球服务贸易会于9 月4 日-9 日在北京成功举办。本届服贸会的主题是：","options":{"A":"文化融合，创新发展","B":"开放包容，团结合作","C":"齐心协力，携手前行","D":"全球服务，互惠共享"},"answer":"D"},{"year":2021,"no":17,"type":"多选","stem":"最近，科学家利用宇宙三维地图发现了迄今最大的宇宙结构之一，包含了数十万星系、长达14 亿光年的「南极墙」。中国科学院表示，由于万有引力，密度较高的区域会产生较强的引力，将周围物质吸引进来，形成星系以及更大尺度的结构。现代宇宙学表明，宇宙是由暗物质、暗能量和普通物质组成的。这一发现进一步佐证了（ ）","options":{"A":"未知世界与已知世界都是客观存在的","B":"整个物质世界的时间和空间是有限的","C":"世界的本原是暗物质和暗能量","D":"世界上只有尚未认识之物，没有不可认识之物"},"answer":"AD"},{"year":2021,"no":18,"type":"多选","stem":"人体是抗击病毒的“机制”。当病原体进入人体，升高的体温刺激免疫系统打败病毒。在理想的情况下，免疫系统创造了一个环境让病原体难以生存。一旦病原体适应更高的温度，人的免疫系统就无法发挥作用。人的免疫与自然环境之间的联系表明（ ）","options":{"A":"人类只能适应自然环境变化而不能改变自然环境","B":"自然环境对人类发展有决定性作用","C":"自然是人类生存发展的重要前提","D":"人在受自然制约的同时也改变自然环境"},"answer":"CD"},{"year":2021,"no":19,"type":"多选","stem":"商品经济是一定社会历史条件的产物，商品经济得以产生的社会历史条件","options":{"A":"生产资料和劳动产品属于不同所有者","B":"社会分工的出现及其存在","C":"商品具有了使用价值和价值两个因素","D":"交换过程中形成了充当一般等价物的商品"},"answer":"AB"},{"year":2021,"no":20,"type":"多选","stem":"某企业为了实现盈利，将人工流水线改造成机器流水线。受经济危机影响，该企业从市场上采购生产资料的价格下降。资本构成发生变化的是（ ）","options":{"A":"资本价值构成","B":"资本积累构成","C":"资本技术构成","D":"资本有机构成"},"answer":"ACD"},{"year":2021,"no":21,"type":"多选","stem":"1871 巴黎公社革命，马、恩总结的经验主要有","options":{"A":"无产阶级政权是为人民服务的机关","B":"必须打碎旧的国家机器建立无产阶级政权","C":"无产阶级革命取得成功并保持果实的首要条件是要有革命的武装","D":"必须建立无产阶级政党，发挥党的政治领导作用"},"answer":"ABCD"},{"year":2021,"no":22,"type":"多选","stem":"社会主义基本制度确立以后，如何在中国这一个经济文化比较落后的东方大国建设和巩固社会主义：是党面临的一项崭新课题.为找到一条适合中国国情的社会主义建设道路，党带领人民进行了艰难曲折的初步探索。这一份初步探索的意义主要体现在","options":{"A":"体现了马克思主义中国化的第二次飞跃","B":"丰富了科学社会主义的理论和实践","C":"巩固和发展了我国社会主义制度","D":"为开创中国特色社会主义提供了宝贵经验，理论准备，物质基础"},"answer":"BCD"},{"year":2021,"no":23,"type":"多选","stem":"我国经济发展新动能的持续壮大表明","options":{"A":"创新驱动了引领作用进一步加强","B":"供给侧结构性改革取得了显著成效","C":"数字经济已成为我国经济高质量发展的新引擎","D":"现代化经济已经生成"},"answer":"AB"},{"year":2021,"no":24,"type":"多选","stem":"十三五时期我国大气污染治理取得了明显成效，主要得益于?","options":{"A":"坚持全民共治、源头防治","B":"把突出环境问题作为生态文明建设的着力点","C":"构建生态通道的生物多样性保护网络","D":"不断完善生态环境保护制度和强化环保监督"},"answer":"BCD"},{"year":2021,"no":25,"type":"多选","stem":"我国提高就业质量的主要举措是","options":{"A":"开展大规模职业技能培训","C":"构建和谐劳动关系","D":"使失业率保持合理区间","B":"提供全方位公共就业服务"},"answer":"ABC"},{"year":2021,"no":26,"type":"多选","stem":"促进各民族像石榴籽一样紧紧抱在一起旨在","options":{"A":"铸牢中华民族共同体意识","B":"建设各民族共有精神家园","C":"巩固和发展平等团结互助和谐社会的社会主义民族关系","D":"使各民族在中华民族大家庭手足相亲，守望相助"},"answer":"ABCD"},{"year":2021,"no":27,"type":"多选","stem":"鸦片战争成为中国近代史起点是因为随着西方列强入侵","options":{"A":"中国封建社会逐渐变成了半殖民地半封建社会","B":"中国开始受制于西方资本主义国家","C":"中国人民逐渐开始反帝反封建的资产阶级民主革命","D":"无产阶级与资产阶级的矛盾上升为占支配地位的主要矛盾"},"answer":"AC"},{"year":2021,"no":28,"type":"多选","stem":"五四运动后，社会主义思潮在中国蓬勃兴起，马克思主义开始在知识界得到传播。中国早期信仰马克思主义的人物，就类型而言，主要包括：","options":{"A":"五四运动的左翼骨干","B":"五四以前的新文化运动的精神领袖","C":"原中国同盟会会员，辛亥革命时期的活动家","D":"工人群众中的活跃分子"},"answer":"ABC"},{"year":2021,"no":29,"type":"多选","stem":"中国从开始全面建设社会主义到1976 年尽管经历过严重的曲折，但从总体上来说，社会主义建设取得的成就是显著的，主要表现在","options":{"A":"人民生活水平的提高与文化教育，医疗，科技事业的发展","B":"独立完整的工业体系的建立和国民经济体系的建设","C":"国际地位的提高与国际环境的改善","D":"探索中形成的建设社会主义的若干重要原则"},"answer":"ABCD"},{"year":2021,"no":30,"type":"多选","stem":"2020 年颁布的《中华人民共和国民法典》是新中国第一部以法典命名的法律， 这部法典共七编，1260 条，包括总则、物权、合同、人格权、婚姻、家庭、继承、侵权责任以及附则。被称为“社会生活的百科全书”。它系统地整合了新中国成立七十多年来司法实践中形成的民事法律规范，汲取和借鉴了中外优势法治建设的有益成果，是一部具有鲜明中国特色、实践特色、时代特色的民法典，开创了我国法典编纂立法的先河。编纂民法典的重大意义是：","options":{"A":"推进全面依法治国，推进国家法律体系和治理能力现代化的重大举措","B":"坚持和完善中国特色社会主义制度的现实需求","C":"坚持和完善社会主义基本经济制度、推动经济高质量发展的客观要求","D":"增进人民福祉，维护广大人民根本利益的必然要求"},"answer":"ABCD"},{"year":2021,"no":31,"type":"多选","stem":"法律权威是指法律在社会中的作用力、影响力和公信力，是法律应有的尊严和生命，法律是否具有权威取决于（ ）","options":{"A":"法律在社会中的实施程度","B":"法律本身的科学程度","C":"法律在国家和社会治理体系中的地位和作用","D":"法律被国际社会认同和尊崇的程度"},"answer":"ABC"},{"year":2021,"no":32,"type":"多选","stem":"2020 年6 月30 日，十三届全国人大常委会第二十次会议表决通过的《中国人民共和国香港特别行政区维护国家安全法》，是新形势下坚持和完善“一国两制”制度体系的标志性法律，其重大作用在于（ ）","options":{"A":"有效应对各种反中乱港势力","B":"确保国家主权在香港受到严格保护","C":"弥补香港国安方面的立法缺失","D":"保障香港长治久安和长期繁荣稳定"},"answer":"ABCD"},{"year":2021,"no":33,"type":"多选","stem":"2020.11.15，东盟16 国与中，日，韩，澳和新西兰正式签署《区域全面经济伙伴关系协定》（RCEP），全球最大贸易区诞生其重要意义主要体现在（ ）","options":{"A":"将为区域乃至全球经济复苏注入新动能","B":"开启了区域经济一体化新篇章","C":"全球贸易投资自由化、便利化取得压倒性优势","D":"将更好地发挥中国作为亚太地区价值新中心节点作用"},"answer":"ABCD"},{"year":2021,"no":34,"type":"分析","stem":"（马原） 材料： 第1 段：当今世界正经历百年未有之大变局，不稳定性不确定性明显增强（首句） 第4 段：只有准确把我分析我国发展阶段、环境、条件变化、看清变局本质和发展大势，顺势而为，谋事而动，提升危中寻机，化危为机的能力，沉着应对变局， 开拓新局，集中力量办好自己的事，推动形成新发展格局，才能牢牢把握化危为机的主动权，为不确定的世界增加确定性。（末句）摘自《人民日报》（2020 年4 月3 日、4 月16 日、9 月25 日） （1）分析在“危机中育新机，于变局中开新局”，这一论断蕴含的唯物辩证理论。（5 分） 解析：“在危机中育新机，于变局中开新局”这一论断蕴含的唯物辩证法原理为事物内部和事物之间存在着对立统一的关系。 事物内部和事物之间存在对立统一关系，也即矛盾关系。矛盾双方具有同一性和斗争性双重属性。同一性是指矛盾双方相互依存、相互贯通的性质和趋势。它具有两个方面的含义：一是矛盾着的对立面相互依存，互为存在的条件，并处于一个统一体中；二是矛盾着的对立面之间相互贯通，在一定条件下相互转化。材料中所提及的“危”与“机”作为矛盾的双方，二者相伴而生、相互依存、相互转化。这就需要我们坚持用全面、辩证、长远的眼光分析当前经济形势，发挥主观能动性，创造有利条件，努力在危机中育新机、于变局中开新局，实现中国的飞跃式发展。 （此题用“联系”“发展”原理回答，也会酌情给分） （2）运用主观能动性与客观规律性相统一的原理，分析“主动永变”与“准确识变”之间的关系。（5 分） 解析：作为矛盾的双方的“危”与“机”在一定条件下可以相互转化，但是这一转化不是自发实现的，需要发挥人的主观能动性去正确发现、认识、利用客观规律去改造世界，从而实现自己的目的。也就需要我们正确的处理主观能动性和客观规律之间的关系。首先，尊重客观规律是正确发挥主观能动性的前提。人们只有在认识和掌握客观规律的基础上,才能达到认识世界和改造世界的目的。其次， 只有充分发挥主观能动性，才能正确认识和利用客观规律。尊重事物发展的规律与发挥人的主观能动性是辩证统一的。最后，实践是客观规律性与主观能动性统一的基础。材料中的“准确识变”就是准确的认识客观规律，而“主观求变”就是发挥主观能动性去改造世界，所以二者体现了尊重客观规律和发挥主观能动性的辩证统一。","options":{},"answer":""},{"year":2021,"no":35,"type":"分析","stem":"（毛中特） 1.从人民生活水平不断提高的视角，分析我国从“解决温饱”到“达到小康水平” 再到“全面达成小康社会”中体现的中国特色社会主义制度优势。（6 分） 解析：（1）①全面建成小康社会是我们党向人民、向历史作出的庄严承诺，是 14 亿中国人民的共同期盼,中国共产党人的初心和使命，就是为中国人民谋幸福，为中华民族谋复兴。②全面建成小康社会为实现中华民族伟大复兴中国梦夯实基础，在中华民族发展史上，全面建成小康社会是关键一步，它延续着中华民族源远流长的盛世期盼和对美好生活的向往，又为民族的伟大复兴奠定了坚实的基础，继往开来，既是胜利的丰碑，又是进一步发展的起点。③全面建成小康社会是中华民族发展史上的光辉时刻，它意味着中华民族作为一个民族整体摆脱了绝对贫困，两千多年来世代追求的小康梦想得以真正实现。 （2）①全面建成小康社会，最艰巨的任务是脱贫攻坚，最突出的短板在于农村贫困人口。②消除贫困、改善民生、实现共同富裕，是中国特色社会主义的本质要求，是彰显社会主义优越性的体现。③2020 年脱贫攻坚任务完成后，我国将历史性地解决困扰中华民族几千年的绝对贫困问题，在共同富裕的道路上迈出坚实一步，对中国和世界都具有重要意义。④为全球贫困治理提供了中国智慧和中国方案。脱贫攻坚的重大胜利，为实现第一个百年奋斗目标打下坚实基础，极大增强了人民群众获得感、幸福感、安全感，彻底改变了贫困地区的面貌，改善了生产生活条件，提高了群众生活质量，“两不愁三保障”全面实现。 （3）①脱贫摘帽体现了社会主义的本质,体现了社会主义的根本目的是共同富裕，是社会主义优越性的充分体现。②脱贫攻坚战是全面建成小康社会的重中之重，这也是党中央向全国人民作出的郑重承诺。③巩固脱贫成果，这是打赢脱贫攻坚战必须解决的重要问题。脱贫不返贫才是真脱贫。④消除贫困、改善民生、 实现共同富裕，进而实现两个百年目标、实现中华民族伟大复兴中国梦奋斗目标， 是改革开放和社会主义现代化建设的重大任务，是全党全国各族人民始终不渝的奋斗目标。 2.如何理解“实现小康社会不是终点，而是新生活新奋斗的起点?”（4 分） 解析：（1）全面小康，覆盖的领域要全面，是“五位一体”全面进步的小康。 “五位一体”是一个整体性目标要求，它们之间相互联系、相互促进、不可分割。 全面小康，覆盖的人口要全面，是惠及全体人民的小康。“小康不小康，关键看老乡”，“没有全民小康，就没有全面小康”。 全面小康，覆盖的区域要全面，是城乡区域共同发展的小康。缩小城乡区域发展差距，不仅是缩小国内生产总值总量和增长速度的差距，而且是缩小居民收入水平、基础设施通达水平、基本公共服务均等化水平、人民生活水平等方面的差距。 （2）.全面建成小康社会的目标要求是经济实现高质量发展。创新驱动成效显著。 发展协调性明显增强。人民生","options":{},"answer":""},{"year":2021,"no":36,"type":"分析","stem":"材料： 第1 段：1950 年6 月朝鲜内战爆发。（首） 第5 段：抗美援朝战争伟大胜利，是中国人民站起来站立于世界东方的宣言书， 是中华民族走向伟大复兴的主要里程碑，对中国和世界都有重大而深远的意义。 摘自《习在纪念中国人民志愿军抗美援朝出国作战70 周年大会上的讲话》 （1）“党和政府作出抗美援朝，保家卫国的历史性决策需要“非凡的气魄和胆略”请结合新中国成立初期的形式和党的任务，加以分析说明。（5 分） 解析：（1）建国初期，我国面临着许多严重的困难和紧迫的问题，解放全中国的任务还没有完全结束，中国经济十分落后，以美国为首的西方资本主义阵营企图通过强硬的措施搞垮中国，所以新生的中国面临着两大历史任务，一是继续完成新民主主义革命遗留任务，二是动员人民去医治战争的创伤，恢复国民经济。 美国政府从其全球战略和冷战思维出发，做出武装干涉朝鲜内政的决定，并派出第七舰队侵入台湾海峡，1950 年美国不顾中国政府的警告，悍然越过三八线， 将战火烧到中朝边境。当时，美国作为世界上的超级大国之一，无论在经济和军事方面都优于中国，尽管当时中美两国的军事和经济力量悬殊，但是，当美国侵略军把战火烧到鸭绿江边的时候，中国政府依然做出抗美援朝的决定，维护祖国的安定和朝鲜的稳定。 （2）为什么说“抗美援朝战争伟大胜利”对中国和世界都有重大和深远的意义? （5 分） 解析：（2）伟大的抗美援朝战争，抵御了帝国主义侵略扩张，捍卫了新中国安全，保卫了中国人民和平生活，稳定了朝鲜半岛局势，维护了亚洲和世界和平。 经此一战，第一，中国人民粉碎了侵略者陈兵国门、进而将新中国扼杀在摇篮之中的图谋，打被了美军不可战胜的神话，新中国真正站稳了脚跟;第二，中国人民彻底扫除了近代以来任人宰割，仰人鼻息的百年耻辱，彻底扔掉了\"东亚病夫\" 的帽子，中国人民真正扬眉吐气了;第三，中国人民打败了侵略者，震动了全世界，奠定了新中国在亚洲和国际事务中的重要地位，彰显了新中国的大国地位; 第四，人民军队在战争中学习战争，实现了由单一军种向诸军兵种合成军队转变， 极大促进了国防和军队现代化;第五，第二次世界大战结束后亚洲乃至世界的战略格局得到深刻塑造，全世界被压迫民族和人民争取民族独立和人民解放的正义事业受到极大鼓舞，有力推动了世界和平与人类进步事业。","options":{},"answer":""},{"year":2021,"no":37,"type":"分析","stem":"（思修法基） 材料： 1979 年12 月6 日，邓同志在会见日本首相大平正芳时谈到了二十世纪末我过的奋斗目标：“我们要实现四个现代化，是中国式的现代化”（首） 第2 段：党的十九届五中全会通过的《中共中央关于制定....目标的建议》宣告：” '十三五'规划目标任务即将完成....社会主义中国以更加雄伟的（末）身姿屹立于世界东方。”摘编自《人民日报》（2020 年7 月15 日、11 月4 日） “人对美好生活的向往，就是我们的奋斗目标。”这是恢弘壮丽的新征程，又是任重道远的新征程。）摘自《人民日报》（2020 年6 月30 日，7 月20 日） （1）中国抗疫精神是中国精神的生动诠释，“全国人民都在为“武汉热干面\" 加油\"，其中体现了什么样的中国精神? 解析： 在这场同严重疫情的殊死较量中，中国人民和中华民族以敢于斗争、敢于胜利的大无畏气概，铸就了生命至上、举国同心、舍生忘死、尊重科学、命运与共的伟大抗疫精神。 第一，生命至上，集中体现了中国人民深厚的仁爱传统和中国共产党人以人民为中心的价值追求。 第二，举国同心，集中体现了中国人民万众一心、同甘共苦的团结伟力。 第三，舍生忘死，集中体现了中国人民敢于压倒一切困难而不被任何困难所压倒的顽强意志。 第四，尊重科学，集中体现了中国人民求真务实、开拓创新的实践品格。 第五，命运与共，集中体现了中国人民和衷共济、爱好和平的道义担当。 伟大抗疫精神，同中华民族长期形成的特质禀赋和文化基因一脉相承，是爱国主义、集体主义、社会主义精神的传承和发展，是中国精神的生动诠释，丰富了民族精神和时代精神的内涵。我们要在全社会大力弘扬伟大抗疫精神，使之转化为全面建设社会主义现代化国家、实现中华民族伟大复兴的
